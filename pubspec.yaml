name: resqlite
description: >-
  High-performance, reactive SQLite for Dart and Flutter.
  Reads, writes, and reactive re-queries run on persistent worker isolates
  with zero main-isolate jank.
version: 0.7.0
repository: https://github.com/danReynolds/resqlite
topics:
  - sqlite
  - database
  - reactive
  - flutter

environment:
  sdk: ^3.10.4

workspace:
  - packages/resqlite_vector
  - packages/resqlite_js
  - packages/resqlite_extension_test

dependencies:
  ffi: ^2.1.4
  hooks: ^1.0.0
  code_assets: ^1.0.0
  native_toolchain_c: ^0.17.5
  path: ^1.9.0

dev_dependencies:
  test: ^1.26.3
  # The three peers below are pinned to exact versions on purpose.
  #
  # Every headline benchmark number is a *comparison*, so the peers are the
  # measurement's baseline, not an implementation detail. With ranges they
  # floated: two runs weeks apart could be measured against different builds
  # with nothing recording which, making a peer regression indistinguishable
  # from a resqlite win — and leaving an intermittent crash undiagnosable.
  # Exact pins turn a peer bump into a dated, reviewable commit.
  #
  # These are dev_dependencies, so consumers of resqlite are unaffected: they
  # resolve their own. Runtime dependencies above stay on ranges so CI keeps
  # catching incompatibility with newer releases.
  sqlite3: 3.5.0
  sqlite_async: 0.14.4
  # Drift is benchmarked as a peer (cross-library benchmark comparison).
  # `drift` is the runtime dep; `drift_dev` + `build_runner` regenerate
  # the `*_drift_db.g.dart` codegen files from the `@DriftDatabase`
  # annotations under benchmark/drift/. These are dev-only — users of
  # resqlite don't get them.
  drift: 2.34.3
  drift_dev: ^2.21.0
  build_runner: ^2.4.0
