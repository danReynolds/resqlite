<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>resqlite · architecture</title>
<style>
:root {
  --paper: #FBFBFA; --surface: #FFFFFF; --raised: #F3F3F1;
  --ink: #1A1A1E; --ink-2: #55555F; --ink-3: #8B8B96;
  --line: #E6E6E3; --line-2: #D6D6D2;
  --accent: #4F46E5; --accent-2: #7C3AED; --accent-soft: #4F46E514;
  --ok: #157F3D; --warn: #A15C07; --bad: #BE123C; --meas: #0369A1;
  --code-bg: #F4F4F7;
  /* aliases the diagram SVGs draw against */
  --ground: var(--paper); --panel: var(--surface); --stale: var(--warn);
  --hdr-h: 60px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0F0F13; --surface: #17171C; --raised: #1E1E25;
    --ink: #F2F2F5; --ink-2: #A0A0AC; --ink-3: #6E6E7A;
    --line: #26262E; --line-2: #34343E;
    --accent: #A5B4FC; --accent-2: #C4B5FD; --accent-soft: #A5B4FC1C;
    --ok: #4ADE80; --warn: #FBBF24; --bad: #FB7185; --meas: #7DD3FC;
    --code-bg: #1C1C24;
  }
}
:root[data-theme="dark"] {
  --paper: #0F0F13; --surface: #17171C; --raised: #1E1E25;
  --ink: #F2F2F5; --ink-2: #A0A0AC; --ink-3: #6E6E7A;
  --line: #26262E; --line-2: #34343E;
  --accent: #A5B4FC; --accent-2: #C4B5FD; --accent-soft: #A5B4FC1C;
  --ok: #4ADE80; --warn: #FBBF24; --bad: #FB7185; --meas: #7DD3FC;
  --code-bg: #1C1C24;
}
:root[data-theme="light"] {
  --paper: #FBFBFA; --surface: #FFFFFF; --raised: #F3F3F1;
  --ink: #1A1A1E; --ink-2: #55555F; --ink-3: #8B8B96;
  --line: #E6E6E3; --line-2: #D6D6D2;
  --accent: #4F46E5; --accent-2: #7C3AED; --accent-soft: #4F46E514;
  --ok: #157F3D; --warn: #A15C07; --bad: #BE123C; --meas: #0369A1;
  --code-bg: #F4F4F7;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 15px/1.6 ui-sans-serif, -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.mono, code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .875em; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: var(--accent); }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40; height: var(--hdr-h);
  display: flex; align-items: center; gap: 18px; padding: 0 22px;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 9px; text-decoration: none; color: inherit; }
.brand b { font-size: 16px; font-weight: 650; letter-spacing: -.015em; }
.brand span { font-size: 11px; color: var(--ink-3); font-family: ui-monospace, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; }
.spacer { margin-left: auto; }
.searchbox { position: relative; width: min(320px, 34vw); }
.searchbox input {
  width: 100%; padding: 7px 11px; border-radius: 8px; font-size: 13px;
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
}
.searchbox input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
.search-results {
  display: none; position: absolute; z-index: 60; top: 108%; left: 0; right: 0;
  background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px;
  box-shadow: 0 12px 34px rgba(0,0,0,.14); overflow: hidden; max-height: 60vh; overflow-y: auto;
}
.search-results.open { display: block; }
.search-hit { display: block; width: 100%; text-align: left; padding: 9px 12px; font-size: 12.5px; border-bottom: 1px solid var(--line); }
.search-hit:last-child { border-bottom: 0; }
.search-hit:hover, .search-hit:focus-visible { background: var(--accent-soft); outline: none; }
.search-hit .mono { color: var(--accent); }
.asof-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); }
.asof-row input[type=date] {
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
  border-radius: 7px; padding: 5px 8px; font: inherit; font-size: 12.5px;
}
.today-btn { color: var(--accent); font-size: 12px; }
.today-btn:hover { text-decoration: underline; }

/* ---------- shell ---------- */
.shell {
  display: grid; grid-template-columns: 250px minmax(0, 1fr) 348px;
  gap: 0; max-width: 1560px; margin: 0 auto; align-items: start;
}
.sidebar {
  position: sticky; top: var(--hdr-h); height: calc(100vh - var(--hdr-h));
  overflow-y: auto; padding: 26px 16px 40px 22px; border-right: 1px solid var(--line);
}
.nav-group { margin-bottom: 22px; }
.nav-title {
  font-family: ui-monospace, Menlo, monospace; font-size: 10px; letter-spacing: .15em;
  text-transform: uppercase; color: var(--ink-3); margin: 0 0 8px 10px; font-weight: 500;
}
.nav-link {
  display: flex; align-items: baseline; gap: 9px; width: 100%; text-align: left;
  padding: 6px 10px; border-radius: 7px; font-size: 13.5px; color: var(--ink-2);
  text-decoration: none; line-height: 1.4;
}
.nav-link:hover { background: var(--raised); color: var(--ink); }
.nav-link.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-link .n { font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; color: var(--ink-3); }
.nav-link.active .n { color: var(--accent); }
.nav-link .zone { margin-left: auto; font-size: 10px; color: var(--ink-3); font-family: ui-monospace, Menlo, monospace; }

/* Section links live under the active page in the left rail, which frees the
   whole right column for evidence. */
.nav-secs { margin: 2px 0 6px 0; }
.nav-secs a {
  display: block; padding: 4px 10px 4px 30px; font-size: 12.5px; color: var(--ink-3);
  text-decoration: none; border-left: 2px solid var(--line); margin-left: 12px; line-height: 1.35;
}
.nav-secs a:hover { color: var(--ink); }
.nav-secs a.active { color: var(--accent); border-left-color: var(--accent); font-weight: 600; }

main { padding: 34px 46px 90px; min-width: 0; }

/* ---------- references panel ---------- */
.refs {
  position: sticky; top: var(--hdr-h); height: calc(100vh - var(--hdr-h));
  display: flex; flex-direction: column;
  border-left: 1px solid var(--line); background: var(--paper);
}
.refs-hd { padding: 22px 20px 12px; border-bottom: 1px solid var(--line); }
.refs-hd .t { font-family: ui-monospace, Menlo, monospace; font-size: 10px; letter-spacing: .15em; text-transform: uppercase; color: var(--ink-3); }
.refs-hd .s { font-size: 12px; color: var(--ink-2); margin-top: 4px; }
.refs-body { flex: 1; overflow-y: auto; padding: 14px 16px 40px; scroll-behavior: smooth; }
.refs-empty { font-size: 12.5px; color: var(--ink-3); font-style: italic; padding: 8px 4px; }

.ref {
  border: 1px solid var(--line); border-radius: 11px; background: var(--surface);
  padding: 13px 14px; margin-bottom: 10px; scroll-margin-top: 12px;
  transition: border-color .15s, box-shadow .15s, opacity .15s;
}
.ref.dim { opacity: .58; }
.ref.focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); opacity: 1; }
@keyframes refflash { 0% { box-shadow: 0 0 0 0 var(--accent); } 100% { box-shadow: 0 0 0 3px var(--accent-soft); } }
.ref.flash { animation: refflash .5s ease-out; }
.ref-top { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
.ref-id { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; font-weight: 600; color: var(--accent); }
.ref-state {
  margin-left: auto; font-family: ui-monospace, Menlo, monospace; font-size: 9.5px;
  letter-spacing: .08em; text-transform: uppercase; padding: 1px 7px; border-radius: 20px;
  border: 1px solid currentColor; color: var(--ok);
}
.ref-state.s-superseded, .ref-state.s-refined { color: var(--warn); }
.ref-state.s-refuted { color: var(--bad); }
.ref-text { font-size: 13px; line-height: 1.55; color: var(--ink); margin: 0 0 10px; }
.ref.dim .ref-text { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.ref-src { border-top: 1px solid var(--line); padding-top: 9px; }
.ref-exp { font-size: 12.5px; font-weight: 600; line-height: 1.4; margin-bottom: 3px; }
.ref-facts { display: flex; flex-wrap: wrap; gap: 3px 10px; font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: var(--ink-3); }
.ref-facts .k { color: var(--accent); }
.ref-facts .cls { color: var(--meas); }
.ref-more { margin-top: 9px; }
.ref-more summary { cursor: pointer; font-size: 11.5px; color: var(--ink-2); font-family: ui-monospace, Menlo, monospace; list-style: none; }
.ref-more summary::-webkit-details-marker { display: none; }
.ref-more summary::before { content: '▸ '; color: var(--ink-3); }
.ref-more[open] summary::before { content: '▾ '; }
.ref-more summary:hover { color: var(--accent); }
.ref-more .body { font-size: 12px; line-height: 1.6; color: var(--ink-2); padding: 8px 2px 2px; max-height: 260px; overflow-y: auto; }
.ref-prior { border-left: 2px solid var(--line); padding: 2px 0 2px 11px; margin: 8px 0; }
.ref-prior .w { font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: var(--warn); }
.ref-prior .w.origin { color: var(--ink-3); }
.ref-prior p { margin: 3px 0 0; font-size: 12px; color: var(--ink-2); line-height: 1.5; }
.ref-links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.ref-links a {
  font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; text-decoration: none;
  border: 1px solid var(--line-2); border-radius: 7px; padding: 3px 9px; color: var(--ink-2);
}
.ref-links a:hover { border-color: var(--accent); color: var(--accent); }

/* ---------- prose ---------- */
.page-kicker { font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
h1.page-title { font-size: 34px; line-height: 1.12; margin: 8px 0 10px; font-weight: 660; letter-spacing: -.028em; text-wrap: balance; }
.page-meta { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; color: var(--ink-3); margin-bottom: 26px; }
.prose { max-width: 74ch; }
.prose h2 {
  font-size: 19px; font-weight: 640; letter-spacing: -.015em; margin: 40px 0 12px;
  scroll-margin-top: calc(var(--hdr-h) + 18px);
}
.prose p { margin: 0 0 15px; font-size: 15.5px; line-height: 1.72; color: var(--ink); }
.prose .lede { font-size: 17.5px; line-height: 1.62; color: var(--ink); }
.prose code { background: var(--code-bg); padding: 1.5px 5px; border-radius: 4px; }
.prose strong { font-weight: 640; }
.anchor { opacity: 0; margin-left: 9px; font-size: .72em; font-weight: 400; color: var(--ink-3); text-decoration: none; }
h2:hover .anchor, .anchor:focus-visible { opacity: 1; }
.anchor:hover { color: var(--accent); }
pre.code {
  background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px;
  padding: 15px 17px; overflow-x: auto; margin: 0 0 18px; font-size: 12.9px; line-height: 1.62;
}
pre.code code { background: none; padding: 0; }
.tok-c { color: var(--ink-3); font-style: italic; }
.tok-s { color: var(--ok); }
.tok-k { color: var(--accent-2); }

/* ---------- home ---------- */
.hero { max-width: 76ch; margin-bottom: 34px; }
.hero h1 { font-size: 46px; line-height: 1.04; margin: 0 0 12px; font-weight: 680; letter-spacing: -.04em; }
.hero .tagline { font-size: 19px; color: var(--ink-2); margin: 0 0 26px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(258px, 1fr)); gap: 14px; margin: 6px 0 10px; }
.card {
  display: block; width: 100%; text-align: left; padding: 16px 17px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  text-decoration: none; color: inherit; transition: border-color .12s, transform .12s;
}
.card:hover { border-color: var(--accent); transform: translateY(-1px); }
.card .c-kicker { font-family: ui-monospace, Menlo, monospace; font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3); }
.card .c-name { font-weight: 640; font-size: 15px; margin: 5px 0 6px; letter-spacing: -.012em; }
.card .c-sum { font-size: 13px; color: var(--ink-2); line-height: 1.55; }
.card .c-meta { font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; color: var(--ink-3); margin-top: 10px; }
.constraints { display: grid; gap: 14px; margin: 4px 0 18px; }
.constraint { border-left: 3px solid var(--accent); padding: 2px 0 4px 16px; }
.stats { display: flex; flex-wrap: wrap; gap: 30px; margin: 20px 0 22px; }
.stat .v { font-size: 30px; font-weight: 660; letter-spacing: -.03em; line-height: 1.1; }
.stat .v.rej { color: var(--warn); }
.stat .l { font-size: 12px; color: var(--ink-2); margin-top: 2px; }

/* ---------- relations ---------- */
.rel-band { margin: 34px 0 6px; padding-top: 22px; border-top: 1px solid var(--line); }
.rel-band h2 { font-size: 13px; font-family: ui-monospace, Menlo, monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; margin: 0 0 12px; }
.rel-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 20px; }
.rel-col > div { font-size: 11px; font-family: ui-monospace, Menlo, monospace; color: var(--ink-3); margin-bottom: 7px; letter-spacing: .06em; }
.rel-link { display: block; padding: 7px 11px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 7px; font-size: 13px; text-decoration: none; color: var(--ink); background: var(--surface); }
.rel-link:hover { border-color: var(--accent); color: var(--accent); }
.rel-none { font-size: 12.5px; color: var(--ink-3); font-style: italic; }
.pager { display: flex; justify-content: space-between; gap: 18px; margin-top: 34px; padding-top: 22px; border-top: 1px solid var(--line); }
.pager a { display: block; max-width: 47%; text-decoration: none; color: var(--accent); font-size: 14px; font-weight: 560; }
.pager a:hover { text-decoration: underline; }
.pager .nx { text-align: right; margin-left: auto; }
.pager .lbl { display: block; font-family: ui-monospace, Menlo, monospace; font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3); font-weight: 400; margin-bottom: 2px; }

/* ---------- diagrams ---------- */
.diagram-card { margin: 22px 0 26px; padding: 20px 20px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.diagram-card.wide { max-width: none; }
.diagram-card figcaption { margin-top: 10px; text-align: center; font-size: 11.5px; color: var(--ink-3); font-family: ui-monospace, Menlo, monospace; }
.dg-zone { font: 600 10px ui-monospace, Menlo, monospace; fill: var(--ink-3); letter-spacing: .12em; }
.dg-flow { font: 600 13px ui-sans-serif, system-ui, sans-serif; fill: var(--ink); }
.dg-cost { font: 500 10.5px ui-monospace, Menlo, monospace; fill: var(--ink-2); }
.dg-wall { stroke: var(--warn); stroke-width: 1.5; stroke-dasharray: 6 5; opacity: .75; }
.dg-box { fill: var(--raised); stroke: var(--line-2); rx: 9; }

/* ---------- evidence ---------- */
.ev-inline {
  font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; color: var(--accent);
  border: 1px solid var(--line-2); border-radius: 5px; padding: 0 4px; margin: 0 2px;
  vertical-align: 1.5px; background: var(--surface);
}
.ev-inline:hover { border-color: var(--accent); background: var(--accent-soft); }
.ev-inline.ev-stale { color: var(--warn); text-decoration: line-through; }
.ev-inline.cited { border-color: var(--accent); background: var(--accent-soft); }
.ev-drawer { display: none; margin: 2px 0 18px; }
.ev-drawer.open { display: block; }
.ev-drawer .belief { border: 1px solid var(--line-2); border-radius: 10px; padding: 13px 16px; background: var(--surface); }
.belief { padding: 15px 2px; border-bottom: 1px solid var(--line); }
.belief-head { font-size: 14.5px; font-weight: 600; margin: 0 0 3px; text-wrap: balance; }
.belief-rest { font-size: 13.5px; color: var(--ink-2); margin: 2px 0 7px; max-width: 70ch; }
.prov { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 14px; font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; color: var(--ink-3); }
.prov .src { color: var(--accent); }
.chip { border: 1px solid var(--line-2); border-radius: 20px; padding: 0 8px; font-size: 10px; }
.ch-later { color: var(--warn); border-color: var(--warn); }
.hist-btn { color: var(--accent); font-size: 11.5px; font-family: ui-monospace, Menlo, monospace; }
.hist-btn:hover { text-decoration: underline; }
.thread { display: none; margin: 10px 0 2px 8px; border-left: 2px solid var(--line); padding-left: 16px; }
.thread.open { display: block; }
.rev { margin: 11px 0; }
.rev-when { font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; color: var(--warn); }
.rev-when.origin { color: var(--ink-3); }
.rev p { margin: 3px 0 2px; font-size: 13px; color: var(--ink-2); max-width: 66ch; }
.rev .rel { color: var(--meas); }
.roster { margin-top: 30px; }
.roster summary { cursor: pointer; font-size: 12.5px; color: var(--ink-2); font-family: ui-monospace, Menlo, monospace; padding: 8px 0; }
.roster summary:hover { color: var(--accent); }

/* ---------- changelog ---------- */
.log-day { margin-top: 24px; }
.log-day h3 { font-size: 12px; font-family: ui-monospace, Menlo, monospace; color: var(--ink-3); font-weight: 500; margin: 0 0 4px; border-bottom: 1px solid var(--line); padding-bottom: 5px; }
.event { display: grid; grid-template-columns: 88px 1fr; gap: 12px; padding: 9px 0; }
.ev-kind { font-family: ui-monospace, Menlo, monospace; font-size: 10px; letter-spacing: .07em; padding-top: 3px; }
.ev-learned { color: var(--ok); } .ev-revised { color: var(--warn); } .ev-refuted { color: var(--bad); }
.event .ev-body { font-size: 13.5px; max-width: 68ch; }
.event .ev-sub { font-size: 11.5px; color: var(--ink-3); }
.event .ev-old { font-style: italic; }
.time-note { display: none; margin-bottom: 20px; padding: 11px 15px; border-radius: 10px; background: var(--accent-soft); border: 1px solid var(--line-2); font-size: 13px; }
.time-note.on { display: block; }
.hint { color: var(--ink-3); font-size: 13px; }
mark { background: var(--accent-soft); color: inherit; border-radius: 3px; padding: 0 2px; }
.coverage { color: var(--ink-3); font-size: 12.5px; margin: 26px 0 0; }

@media (max-width: 1240px) {
  .shell { grid-template-columns: 236px minmax(0, 1fr); }
  .refs { display: none; }
  main { padding: 30px 32px 80px; }
}
@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .sidebar { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 16px 20px; }
  main { padding: 24px 20px 70px; }
  .hero h1 { font-size: 34px; }
  .searchbox { width: 46vw; }
}
</style>

<div class="topbar">
  <a class="brand" href="#/"><b>resqlite</b> <span>architecture</span></a>
  <div class="spacer"></div>
  <div class="searchbox">
    <input id="search" type="search" placeholder="Search beliefs…" aria-label="Search beliefs and experiments">
    <div class="search-results" id="search-results" role="listbox"></div>
  </div>
  <div class="asof-row">
    <label for="asof">as of</label>
    <input type="date" id="asof">
    <button class="today-btn" id="today-btn">today</button>
  </div>
</div>

<div class="shell">
  <nav class="sidebar" id="sidebar" aria-label="Documentation"></nav>
  <main id="view"></main>
  <aside class="refs" id="refs" aria-label="References">
    <div class="refs-hd">
      <div class="t">References</div>
      <div class="s" id="refs-sub">Evidence behind what you're reading</div>
    </div>
    <div class="refs-body" id="refs-body"></div>
  </aside>
</div>

<script>
const KG = __KG__;
const PAGES = __PAGES__;
const HOME = __HOME__;
const STATS = __STATS__;

// ---------- prep ----------
const expById = {}; for (const e of KG.experiments) expById[e.id] = e;
const claims = KG.claims.map(c => ({ ...c }));
const byId = {}; for (const c of claims) byId[c.id] = c;
const parseDate = s => { if (!s) return null; const p = s.split('-').map(Number); return Date.UTC(p[0], p[1] - 1, p[2] || 15); };
for (const c of claims) { c.birth = parseDate((expById[c.source] || {}).date); c.death = null; c.killers = []; }
for (const c of claims) for (const e of (c.edges || []))
  if ((e.type === 'supersedes' || e.type === 'refutes') && byId[e.target]) {
    const t = byId[e.target];
    t.death = t.death ? Math.min(t.death, c.birth) : c.birth;
    t.killers.push(c.id);
  }
const fmt = t => t == null ? '' : new Date(t).toISOString().slice(0, 10);
const fmtNice = t => new Date(t).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
const TODAY = Math.max.apply(null, claims.map(c => c.birth || 0)) + 86400000;
let asOf = TODAY;

const liveAt = (c, t) => c.birth != null && c.birth <= t && (c.death == null || c.death > t);
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
// Pages are markdown, so render the inline subset the prose actually uses.
// Applied *after* escaping — the source is trusted repo content, but escaping
// first keeps the pipeline safe if that ever stops being true.
const md = s => esc(s)
  .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
  .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
  .replace(/`([^`]+)`/g, '<code>$1</code>');
const firstSentence = s => {
  const m = s.match(/^.*?[.!?](?=\s|$)/);
  return m ? m[0] : s;
};

// Each page's claim pool: everything tagged with one of its research
// directions, plus any claims the page names explicitly.
for (const p of PAGES) {
  p.pool = claims.filter(c =>
    (c.directions || []).some(d => (p.dirs || []).includes(d)) ||
    (p.claims || []).includes(c.id));
}
const pageById = {}; for (const p of PAGES) pageById[p.id] = p;
const ARCH = PAGES.filter(p => p.section === 'architecture');

__DIAGRAMS__

// ---------- shared rendering ----------
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');

// Routes are `#/<page>` and `#/<page>/<section>`. The landing page owns the
// reserved id `overview` so its sections are addressable too, while bare `#/`
// still resolves to it.
const HOME_ID = 'overview';
const pageRoute = id => '#/' + (id === HOME_ID ? '' : id);
const secRoute = (pageId, secId) => `#/${pageId}/${secId}`;
const anchorLink = (pageId, secId) =>
  `<a class="anchor" href="${secRoute(pageId, secId)}" aria-label="Link to this section">#</a>`;

function chipify(text, ctx) {
  return text.replace(/\[\[(\d+\.\d+)\]\]/g, (_, id) => {
    const stale = byId[id] && byId[id].state !== 'live';
    return `<button class="ev-inline ${stale ? 'ev-stale' : ''}" data-evd="${ctx}" data-claim="${id}">${id}</button>`;
  });
}

// Just enough Dart highlighting to make the landing sample readable.
//
// One pass over a single alternation, deliberately: successive .replace() calls
// would re-scan the markup they just emitted, and `class` is both a Dart
// keyword and the attribute this writes — the second pass would wrap the
// attribute name and shred the tag. Comments and strings lead the alternation
// so a `//` inside a literal is not mistaken for a comment.
function highlight(src) {
  const re = /(\/\/[^\n]*)|('[^'\n]*')|\b(final|await|async|const|var|void|return|new|class)\b/g;
  let out = '', last = 0, m;
  while ((m = re.exec(src)) !== null) {
    out += esc(src.slice(last, m.index));
    out += `<span class="${m[1] ? 'tok-c' : m[2] ? 'tok-s' : 'tok-k'}">${esc(m[0])}</span>`;
    last = m.index + m[0].length;
  }
  return out + esc(src.slice(last));
}

/// Renders one parsed section's body. `ctx` namespaces the evidence drawers so
/// two paragraphs citing the same claim get independent toggles.
function bodyHtml(sec, ctxBase) {
  let h = '';
  sec.ps.forEach((p, pi) => {
    if (typeof p !== 'string') {
      h += `<pre class="code"><code>${highlight(p.code)}</code></pre>`;
      return;
    }
    const ctx = `${ctxBase}-${pi}`;
    h += `<p class="${sec.lede ? 'lede' : ''}">${chipify(md(p), ctx)}</p>
      <div class="ev-drawer" id="evd-${ctx}"></div>`;
  });
  return h;
}

function sectionsHtml(sections, pageId, slots) {
  let h = '';
  sections.forEach((sec, si) => {
    if (sec.h) {
      const id = slug(sec.h);
      h += `<h2 id="${id}">${esc(sec.h)}${anchorLink(pageId, id)}</h2>`;
    }
    h += bodyHtml(sec, `${pageId}-${si}`);
    if (slots && sec.h && slots[sec.h]) h += slots[sec.h]();
  });
  return h;
}

function poolAt(p) { return p.pool.filter(c => liveAt(c, asOf)).sort((a, b) => b.birth - a.birth); }
function lastChange(p) {
  return Math.max.apply(null, p.pool.map(c => Math.max(c.birth || 0, c.death || 0)).concat([0]));
}

// ---------- home ----------
function cardsHtml() {
  return `<div class="cards">${ARCH.map((p, i) => {
    const live = poolAt(p).length, last = lastChange(p);
    return `<a class="card" href="${pageRoute(p.id)}">
      <div class="c-kicker">${String(i + 1).padStart(2, '0')} · ${esc(p.kicker)}</div>
      <div class="c-name">${esc(p.name)}</div>
      <div class="c-sum">${md(p.summary)}</div>
      <div class="c-meta">${live} beliefs${last ? ` · updated ${fmtNice(last)}` : ''}</div>
    </a>`;
  }).join('')}</div>`;
}

function statsHtml() {
  const live = claims.filter(c => liveAt(c, TODAY)).length;
  const stat = (v, l, cls) => `<div class="stat"><div class="v ${cls || ''}">${v}</div><div class="l">${l}</div></div>`;
  return `<div class="stats">
    ${stat(STATS.total, 'experiments run and indexed')}
    ${stat(STATS.rejected, 'rejected — and kept anyway', 'rej')}
    ${stat(live, 'beliefs currently standing')}
  </div>
  <p><a href="#/meta">How measurement works →</a> &nbsp;·&nbsp; <a href="#/changelog">What changed recently →</a></p>`;
}

function renderHome() {
  const slots = {
    'The shape of the system': () => DIAGRAMS.overview,
    'Explore the architecture': cardsHtml,
    'How we know any of this': statsHtml,
  };
  const [lede, ...rest] = HOME.sections;
  view.innerHTML = `<div class="hero">
      <h1>${esc(HOME.title)}</h1>
      <p class="tagline">${esc(HOME.tagline)}</p>
    </div>
    <div class="prose">${bodyHtml(lede, `${HOME_ID}-0`)}${sectionsHtml(rest, HOME_ID, slots)}</div>`;
  afterRender();
}

// ---------- an architecture page ----------
function renderPage(id) {
  const p = pageById[id];
  if (!p) return renderHome();
  const i = ARCH.indexOf(p);
  const prev = ARCH[i - 1], next = ARCH[i + 1];
  const pool = poolAt(p), last = lastChange(p);
  const [lede, ...rest] = p.sections;
  const fedBy = ARCH.filter(o => (o.feeds || []).includes(p.id));
  const feeds = (p.feeds || []).map(f => pageById[f]).filter(Boolean);

  const relCol = (label, list, empty) => `<div class="rel-col"><div>${label}</div>${
    list.length ? list.map(o => `<a class="rel-link" href="${pageRoute(o.id)}">${esc(o.name)}</a>`).join('')
                : `<p class="rel-none">${empty}</p>`}</div>`;

  view.innerHTML = `<div class="page-kicker">${String(i + 1).padStart(2, '0')} · ${esc(p.kicker)}</div>
    <h1 class="page-title">${esc(p.name)}</h1>
    <div class="page-meta">${pool.length} beliefs${last ? ` · last changed ${fmtNice(last)}` : ''}</div>
    <div class="prose">
      ${bodyHtml(lede, `${p.id}-0`)}
      ${DIAGRAMS[p.diagram || p.id] || ''}
      ${sectionsHtml(rest, p.id)}
    </div>
    <div class="rel-band"><h2>How this connects</h2><div class="rel-cols">
      ${relCol('RECEIVES WORK FROM', fedBy, 'Entry point — work starts here.')}
      ${relCol('HANDS OFF TO', feeds, 'Terminal — the buck stops here.')}
    </div></div>
    ${pool.length ? `<details class="roster"><summary>All ${pool.length} current beliefs, with provenance</summary>
      ${pool.map(beliefCard).join('')}</details>` : ''}
    <div class="pager">
      ${prev ? `<a href="${pageRoute(prev.id)}"><span class="lbl">← previous</span>${esc(prev.name)}</a>` : '<span></span>'}
      ${next ? `<a class="nx" href="${pageRoute(next.id)}"><span class="lbl">next →</span>${esc(next.name)}</a>` : ''}
    </div>`;
  afterRender();
}

// ---------- belief cards ----------
function ancestorsOf(c, seen) {
  seen = seen || new Set();
  const out = [];
  for (const e of (c.edges || [])) {
    const t = byId[e.target];
    if (!t || seen.has(t.id)) continue;
    seen.add(t.id);
    out.push({ rel: e.type, claim: t });
    for (const deeper of ancestorsOf(t, seen)) out.push(deeper);
  }
  return out;
}
function beliefCard(c) {
  const head = firstSentence(c.text);
  const rest = c.text.slice(head.length).trim();
  const anc = ancestorsOf(c);
  const src = expById[c.source] || {};
  const laterDead = asOf < TODAY && c.death != null;
  return `<article class="belief" id="b-${c.id}">
    <p class="belief-head">${esc(head)}</p>
    ${rest ? `<p class="belief-rest">${esc(rest)}</p>` : ''}
    <div class="prov">
      <span class="src">exp ${c.source}</span>
      <span>${src.date || ''}</span>
      ${c.conditions ? `<span>${esc(c.conditions)}</span>` : ''}
      ${laterDead ? `<span class="chip ch-later">later superseded by ${c.killers.join(', ')}</span>` : ''}
      ${anc.length ? `<button class="hist-btn" data-hist="${c.id}">history · ${anc.length} prior ▸</button>` : ''}
    </div>
    ${anc.length ? `<div class="thread" id="th-${c.id}">${threadHtml(anc)}</div>` : ''}
  </article>`;
}
function threadHtml(anc) {
  return anc.map(a => {
    const cl = a.claim;
    const span = cl.death
      ? `believed ${fmtNice(cl.birth)} → ${fmtNice(cl.death)}`
      : `since ${fmtNice(cl.birth)} · still live`;
    const relTxt = a.rel === 'supersedes' ? 'replaced by the above'
      : a.rel === 'refutes' ? 'refuted by the above'
      : a.rel === 'refines' ? 'refined by the above' : 'validated by the above';
    return `<div class="rev">
      <span class="rev-when ${cl.death ? '' : 'origin'}">${span} · <span class="rel">${relTxt}</span> · exp ${cl.source}</span>
      <p>${esc(cl.text)}</p>
    </div>`;
  }).join('');
}

// ---------- changelog ----------
function renderLog() {
  const events = [];
  for (const c of claims) {
    if (c.birth == null || c.birth > asOf) continue;
    const sup = (c.edges || []).filter(e => e.type === 'supersedes' && byId[e.target]);
    const ref = (c.edges || []).filter(e => e.type === 'refutes' && byId[e.target]);
    const kind = ref.length ? 'refuted' : sup.length ? 'revised' : 'learned';
    const oldEdge = sup[0] || ref[0];
    events.push({ t: c.birth, kind, c, old: oldEdge ? byId[oldEdge.target] : null });
  }
  events.sort((a, b) => b.t - a.t || b.c.id.localeCompare(a.c.id));
  let h = `<div class="page-kicker">reference</div>
    <h1 class="page-title">Changelog</h1>
    <div class="page-meta">${events.length} recorded changes of belief</div>`;
  let day = '';
  for (const ev of events) {
    const d = fmtNice(ev.t);
    if (d !== day) { if (day) h += '</div>'; h += `<div class="log-day"><h3>${d}</h3>`; day = d; }
    h += `<div class="event">
      <span class="ev-kind ev-${ev.kind}">${ev.kind.toUpperCase()}</span>
      <div><div class="ev-body">${esc(firstSentence(ev.c.text))}
        <span class="ev-sub">· exp ${ev.c.source} · ${esc((PAGES.find(m => m.pool.includes(ev.c)) || {}).name || '')}</span></div>
        ${ev.old ? `<div class="ev-sub ev-old">was: ${esc(firstSentence(ev.old.text))}</div>` : ''}
      </div></div>`;
  }
  if (day) h += '</div>';
  view.innerHTML = h + (events.length ? '' : '<p class="hint">Nothing recorded before this date.</p>');
  afterRender();
}

// ---------- shell: nav, references, routing ----------
const view = document.getElementById('view');
const sidebarEl = document.getElementById('sidebar');
const refsBody = document.getElementById('refs-body');
const refsSub = document.getElementById('refs-sub');
let route = '/';

function renderNav() {

  const secs = [...view.querySelectorAll('.prose h2[id]')];
  const secList = secs.length < 2 ? '' : `<div class="nav-secs">${
    secs.map(h => `<a href="${secRoute(here, h.id)}" data-sec="${h.id}">${esc(h.firstChild.textContent)}</a>`).join('')}</div>`;
  const link = (id, label, extra) => {
    const active = id === here;
    return `<a class="nav-link ${active ? 'active' : ''}" href="${pageRoute(id)}">${label}${extra || ''}</a>` +
      (active ? secList : '');

    <div class="nav-group">
      <div class="nav-title">Start</div>

    </div>

      <div class="nav-title">Architecture</div>

        `<span class="n">${String(i + 1).padStart(2, '0')}</span>${esc(p.name)}`,
        `<span class="zone">${esc(p.zone)}</span>`)).join('')}
    </div>
    <div class="nav-group">
      <div class="nav-title">Reference</div>

// ---------- references panel ----------
//
// Each paragraph knows which claims it cites, so the panel can show the union
// for whatever is on screen: evidence follows reading position instead of
// waiting to be asked for. Clicking a chip pins one card until the next scroll.

let refIndex = [];     // [{ el: <p>, ids: [claimId] }] in document order
let shownKey = '';     // ids currently rendered, so scrolling does not re-render
let pinned = null;     // chip-clicked claim, cleared on the next scroll

function buildRefIndex() {
  refIndex = [];
  for (const p of view.querySelectorAll('.prose p')) {
    const ids = [...p.querySelectorAll('.ev-inline')].map(b => b.dataset.claim);
    if (ids.length) refIndex.push({ el: p, ids: [...new Set(ids)] });
  }
}

function refCard(id, focused) {
  const c = byId[id];
  if (!c) return '';
  const src = expById[c.source] || {};
  const anc = ancestorsOf(c);
  const state = c.state || 'live';
  const links = [];
  if (src.writeupUrl) links.push(`<a href="${src.writeupUrl}" target="_blank" rel="noopener">Writeup ↗</a>`);
  if (src.signalUrl) links.push(`<a href="${src.signalUrl}" target="_blank" rel="noopener">Signal entry ↗</a>`);
  if (src.link) links.push(`<a href="${esc(src.link)}" target="_blank" rel="noopener">Change ↗</a>`);
  return `<article class="ref ${focused ? 'focus' : 'dim'}" data-id="${id}">
    <div class="ref-top">
      <span class="ref-id">${id}</span>
      <span class="ref-state s-${state}">${state}</span>
    </div>
    <p class="ref-text">${esc(c.text)}</p>
    <div class="ref-src">
      <div class="ref-exp">${esc(src.title || 'Experiment ' + c.source)}</div>
      <div class="ref-facts">
        <span class="k">exp ${c.source}</span>
        ${src.date ? `<span>${src.date}</span>` : ''}
        ${src.class ? `<span class="cls">${esc(src.class)}</span>` : ''}
        ${src.status ? `<span>${esc(src.status)}</span>` : ''}
      </div>
      ${c.conditions ? `<div class="ref-facts" style="margin-top:4px"><span>${esc(c.conditions)}</span></div>` : ''}
    </div>
    ${focused && src.impact ? `<details class="ref-more"><summary>Method and context</summary>
      <div class="body">${md(src.impact)}</div></details>` : ''}
    ${focused && anc.length ? `<details class="ref-more"><summary>${anc.length} earlier belief${anc.length > 1 ? 's' : ''} behind this</summary>
      <div class="body">${anc.map(a => {
        const cl = a.claim;
        const when = cl.death ? `held ${fmtNice(cl.birth)} → ${fmtNice(cl.death)}` : `since ${fmtNice(cl.birth)} · still live`;
        const rel = a.rel === 'supersedes' ? 'replaced' : a.rel === 'refutes' ? 'refuted'
          : a.rel === 'refines' ? 'refined' : 'validated';
        return `<div class="ref-prior"><span class="w ${cl.death ? '' : 'origin'}">${rel} · ${when} · exp ${cl.source}</span>
          <p>${esc(cl.text)}</p></div>`;
      }).join('')}</div></details>` : ''}
    ${focused && links.length ? `<div class="ref-links">${links.join('')}</div>` : ''}
  </article>`;
}

function updateRefs(force) {
  if (!refsBody) return;
  if (!refIndex.length) {
    if (shownKey !== 'none') {
      shownKey = 'none';
      refsSub.textContent = 'Evidence behind what you\'re reading';
      refsBody.innerHTML = `<p class="refs-empty">No cited claims on this page.</p>`;
    }
    return;
  }
  const top = headerHeight();
  const line = top + 140;
  const visible = refIndex.filter(r => {
    const b = r.el.getBoundingClientRect();
    return b.bottom > top + 8 && b.top < innerHeight - 8;
  });
  const inView = visible.length ? visible : [refIndex[0]];

  // Focus follows the paragraph nearest the reading line, unless a chip pinned one.
  let focus = pinned;
  if (!focus) {
    let best = Infinity;
    for (const r of inView) {
      const d = Math.abs(r.el.getBoundingClientRect().top - line);
      if (d < best) { best = d; focus = r.ids[0]; }
    }
  }
  const ids = [...new Set(inView.flatMap(r => r.ids))];
  if (pinned && !ids.includes(pinned)) ids.unshift(pinned);

  const key = ids.join(',') + '|' + focus;
  if (key === shownKey && !force) return;
  shownKey = key;

  refsSub.textContent = ids.length === 1
    ? '1 claim supports this passage'
    : `${ids.length} claims support this passage`;
  refsBody.innerHTML = ids.map(id => refCard(id, id === focus)).join('');
  view.querySelectorAll('.ev-inline').forEach(b =>
    b.classList.toggle('cited', b.dataset.claim === focus));
}

/// Highlights the heading you are currently reading under. Runs off scroll
/// rather than IntersectionObserver so the "last heading above the fold" rule
/// stays explicit — with several headings on screen, that is the one you want.
function spy() {
  const heads = [...view.querySelectorAll('.prose h2[id]')];
  if (heads.length) {
    const line = headerHeight() + 60;
    let cur = heads[0].id;
    for (const h of heads) {
      if (h.getBoundingClientRect().top > line) break;
      cur = h.id;
    }
    sidebarEl.querySelectorAll('.nav-secs a').forEach(a =>
      a.classList.toggle('active', a.dataset.sec === cur));
  }
  updateRefs();
}
function headerHeight() {
  return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hdr-h')) || 60;
}

function afterRender() {
  wire();
  renderNav();
  buildRefIndex();
  pinned = null;
  shownKey = '';
  updateRefs(true);
  spy();
}

/// Clicking a citation pins it in the references panel — the panel is the
/// destination, so the chip does not need to duplicate the evidence inline.
/// Below the panel's breakpoint there is nowhere to send the reader, so the
/// original in-place drawer stays as the fallback.
function wire() {
  view.querySelectorAll('.ev-inline').forEach(b =>
    b.addEventListener('click', () => {
      const c = byId[b.dataset.claim];
      if (!c) return;
      const panelVisible = refsBody && refsBody.offsetParent !== null;
      if (!panelVisible) {
        const drawer = document.getElementById('evd-' + b.dataset.evd);
        if (!drawer) return;
        if (drawer.dataset.showing === c.id && drawer.classList.contains('open')) {
          drawer.classList.remove('open'); return;
        }
        drawer.dataset.showing = c.id;
        drawer.innerHTML = beliefCard(c);
        drawer.classList.add('open');
        wireHist(drawer);
        return;
      }
      pinned = c.id;
      updateRefs(true);
      const card = refsBody.querySelector(`.ref[data-id="${c.id}"]`);
      if (card) {
        card.scrollIntoView({ block: 'nearest' });
        card.classList.add('flash');
        setTimeout(() => card.classList.remove('flash'), 500);
      }
    }));
  wireHist(view);
}
function wireHist(root) {
  root.querySelectorAll('.hist-btn').forEach(b =>
    b.addEventListener('click', () => {
      const th = document.getElementById('th-' + b.dataset.hist);
      if (!th) return;
      const open = th.classList.toggle('open');
      const n = (b.textContent.match(/\d+/) || ['0'])[0];
      b.textContent = open ? `history · ${n} prior ▾` : `history · ${n} prior ▸`;
    }));
}

// `#/`, `#/<page>`, `#/<page>/<section>`. A bare `#section` is a plain in-page
// anchor and must not be read as a route.
function currentRoute() {
  const h = location.hash;
  return h.startsWith('#/') ? h.slice(2).split('/').filter(Boolean) : null;
}
function navigate(keepScroll) {
  const parts = currentRoute() || [];
  const pageId = parts[0] === HOME_ID ? '' : (parts[0] || '');
  const secId = parts[1] || '';
  const changed = pageId !== route.slice(1);
  route = '/' + pageId;
  if (!pageId) renderHome();
  else if (pageId === 'changelog') renderLog();
  else renderPage(pageId);
  if (secId) {
    const el = document.getElementById(secId);
    if (el) { el.scrollIntoView({ block: 'start' }); return; }
  }
  // Instant, not 'auto': `auto` defers to the page's smooth scroll-behavior,
  // which turns every page change into a long animated ride to the top.
  if (changed && !keepScroll) scrollTo({ top: 0, behavior: 'instant' });
}
addEventListener('hashchange', () => {
  if (currentRoute()) navigate();
  else spy();
});
let ticking = false;
addEventListener('scroll', () => {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    ticking = false;
    // Scrolling hands focus back to reading position — a pinned citation is a
    // momentary answer to a click, not a mode the reader has to dismiss.
    pinned = null;
    spy();
  });
}, { passive: true });

// ---------- time machine ----------
const asofInput = document.getElementById('asof');
const births = claims.map(c => c.birth).filter(Boolean);
asofInput.max = fmt(TODAY);
asofInput.min = fmt(Math.min.apply(null, births));
asofInput.value = fmt(TODAY);
function applyTime() {
  const atToday = asOf >= TODAY;
  let note = document.querySelector('.time-note');
  if (!note) {
    note = document.createElement('div');
    note.className = 'time-note';
    document.querySelector('.shell').before(note);
  }
  note.classList.toggle('on', !atToday);
  if (!atToday) {
    const nowLive = claims.filter(c => liveAt(c, TODAY)).length;
    const thenLive = claims.filter(c => liveAt(c, asOf)).length;
    note.innerHTML = `Showing what was believed on <b>${fmtNice(asOf)}</b> —
      ${thenLive} beliefs then, ${nowLive} today. Anything since revised carries an amber chip.`;
  }
  // Hold the reader's place: moving the date should change what the page says,
  // not where you are in it. Measured against <main>, which survives the
  // re-render, because showing or hiding the banner above it shifts the whole
  // document by the banner's height — restoring a raw scrollY would land the
  // reader that far off.
  const docTop = () => view.getBoundingClientRect().top + scrollY;
  const offset = scrollY - docTop();
  navigate(true);
  scrollTo({ top: docTop() + offset, behavior: 'instant' });
}
asofInput.addEventListener('change', () => {
  const t = parseDate(asofInput.value);
  if (t) { asOf = t + 86399000; applyTime(); }
});
document.getElementById('today-btn').addEventListener('click', () => {
  asOf = TODAY; asofInput.value = fmt(TODAY); applyTime();
});

// ---------- search ----------
const searchInput = document.getElementById('search');
const searchResults = document.getElementById('search-results');
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  searchResults.innerHTML = '';
  if (q.length < 2) { searchResults.classList.remove('open'); return; }
  const hits = [];
  for (const c of claims) {
    if (c.id.includes(q) || c.text.toLowerCase().includes(q))
      hits.push({ id: c.id, label: firstSentence(c.text), state: c.state });
    if (hits.length > 9) break;
  }
  for (const hit of hits) {
    const b = document.createElement('button');
    b.className = 'search-hit'; b.setAttribute('role', 'option');
    b.innerHTML = `<span class="mono">${hit.id} · ${hit.state}</span> · ${esc(hit.label.slice(0, 88))}`;
    b.addEventListener('click', () => {
      searchResults.classList.remove('open'); searchInput.value = '';
      asOf = TODAY; asofInput.value = fmt(TODAY);
      // Jump to the page that owns the claim, then reveal it in the roster.
      // replaceState rather than assigning location.hash: assigning would fire
      // hashchange after this handler and re-render the page, discarding the
      // highlight applied below.
      const owner = PAGES.find(p => p.pool.some(c => c.id === hit.id))
        || PAGES.find(p => p.pool.some(c => (byId[hit.id] || {}).killers?.includes(c.id)));
      history.replaceState(null, '', owner ? pageRoute(owner.id) : '#/changelog');
      navigate();
      const target = document.getElementById('b-' + hit.id);
      const el = target || document.getElementById('b-' + ((byId[hit.id] || {}).killers || [])[0]);
      if (!el) return;
      const det = el.closest('details'); if (det) det.open = true;
      el.scrollIntoView({ block: 'center' });
      if (target) {
        const head = target.querySelector('.belief-head');
        head.innerHTML = `<mark>${esc(head.textContent)}</mark>`;
      } else {
        const btn = el.querySelector('.hist-btn'); if (btn) btn.click();
      }
    });
    searchResults.appendChild(b);
  }
  searchResults.classList.toggle('open', hits.length > 0);
});
document.addEventListener('click', ev => {
  if (!ev.target.closest('.searchbox')) searchResults.classList.remove('open');
});

// ---------- boot ----------
navigate();
if (!currentRoute() && location.hash) {
  const landing = document.getElementById(decodeURIComponent(location.hash.slice(1)));
  if (landing) landing.scrollIntoView({ block: 'start' });
}
</script>
