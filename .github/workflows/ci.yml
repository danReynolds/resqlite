name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  guard-raw-profile-json:
    # Block raw per-sample profile JSONs (~15 MB each) from landing on main.
    # The maintained profile path is tracelite graph data and workload-summary
    # artifacts; raw legacy profile JSONs are local scratch only.
    name: Guard against raw profile JSONs
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - name: Check PR diff for benchmark/profile/results/*.json
        run: |
          base="origin/${{ github.base_ref }}"
          added=$(git diff --name-only --diff-filter=A "$base...HEAD" \
            -- 'benchmark/profile/results/*.json' || true)
          if [ -n "$added" ]; then
            echo "::error::Raw profile JSONs must not be committed. Use tracelite workload summaries or graph data instead."
            echo "Offending files:"
            printf '  %s\n' $added
            exit 1
          fi

  guard-generated-docs:
    # history.json, devices.json, signals.json, and README.md are generated
    # aggregates owned by the "Update Docs Data" bot on main. Experiment
    # branches must NOT commit them, so a merge (or a post-merge bot commit)
    # never re-conflicts open PRs on them — the routine churn this whole
    # convention exists to remove. Per-experiment sources live in
    # experiments/index/NNN.json (README row) and
    # experiments/signals/entries/NNN.json (signal entry). See
    # experiments/RUNNER_INSTRUCTIONS.md ("Generated files are bot-owned").
    name: Guard against committing generated docs
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - name: Check PR diff for bot-owned generated files
        run: |
          base="origin/${{ github.base_ref }}"
          generated="docs/experiments/history.json docs/experiments/knowledge-graph.json docs/benchmarks/devices.json experiments/signals.json experiments/README.md"
          changed=$(git diff --name-only "$base...HEAD" -- $generated || true)
          if [ -n "$changed" ]; then
            echo "::error::Generated aggregates are bot-owned; do not commit them on a branch. Edit the per-experiment sources instead: experiments/index/NNN.json (README row), experiments/signals/entries/NNN.json (signal entry), or experiments/signals/base.json (direction synthesis)."
            echo "Revert them so the PR carries no change to these files:"
            printf '  %s\n' $changed
            echo "Run: git checkout origin/${{ github.base_ref }} -- $generated"
            exit 1
          fi

  test:
    name: Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies
        run: dart pub get
      - name: Generate drift codegen
        # Drift databases under benchmark/drift/ use @DriftDatabase
        # annotations that produce part-of `*.g.dart` files via
        # build_runner. Gitignored, so CI must generate before analyze.
        # (`run_release.dart` auto-regens on stale-ness for contributors
        #  running benchmarks locally, but analyze/test don't trigger that.)
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Run tests
        run: dart test --timeout 60s
      - name: Verify trace_sqlite native hook mode
        run: dart run tool/trace_sqlite_smoke.dart

  encoder-diff-x86:
    # The `test` job runs on macos-latest (AArch64), so it exercises the NEON
    # base64 kernel. This job runs the encoder differential/fuzz test on x86_64
    # Linux, where json_write_base64 compiles to the scalar 12-bit-LUT path — so
    # both compile-time base64 paths are validated against the dart:convert
    # oracle across the CI matrix, not just whichever arch happens to run first.
    name: Encoder differential (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies
        run: dart pub get
      - name: Run encoder differential fuzz test
        run: dart test test/native_encoder_diff_test.dart --timeout 60s

  benchmark-generated-data:
    name: Benchmark generated data freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies
        run: dart pub get
      - name: Verify generated benchmark docs are current
        run: dart run benchmark/check_generated_data.dart
      - name: Verify experiment research map is valid
        run: dart run benchmark/check_experiment_signals.dart
      - name: Verify knowledge links and claim citations
        run: dart run benchmark/check_knowledge_links.dart
      - name: Verify experiments reach a terminal disposition
        run: dart run benchmark/check_experiment_dispositions.dart

  tracelite-smoke:
    name: Tracelite smoke
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies
        run: dart pub get
      - name: Checkout pinned tracelite
        run: |
          git clone https://github.com/danReynolds/tracelite /tmp/tracelite
          git -C /tmp/tracelite checkout 11159638962f5176678f02551a78180f5b9d3bba
      - name: Run tracelite CI preset
        env:
          RESQLITE_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RESQLITE_SOURCE_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          dart run benchmark/run_tracelite.dart \
            --preset=ci \
            --tracelite-root=/tmp/tracelite \
            --resqlite-root="$PWD" \
            --label="ci-${{ github.sha }}" \
            --out-dir=build/tracelite-benchmarks/ci-${{ github.sha }}
      - name: Upload tracelite smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracelite-smoke
          path: build/tracelite-benchmarks/ci-${{ github.sha }}
          retention-days: 14

  benchmark:
    name: Benchmarks (main)
    runs-on: macos-latest
    needs: test
    # Trend-tracking artifact upload. Only runs on pushes to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies
        run: dart pub get

      - name: Generate drift codegen
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run benchmark suite
        continue-on-error: true
        run: dart run benchmark/run_release.dart "ci-${{ github.sha }}" --repeat=3 --hardware-summary --no-auto-compare

      - name: Run head-to-head
        continue-on-error: true
        run: dart run benchmark/head_to_head_worker.dart --out=/tmp/h2h.json --repeat=3

      - name: Print head-to-head results
        continue-on-error: true
        run: |
          python3 -c "
          import json
          with open('/tmp/h2h.json') as f:
              d = json.load(f)['cases']
          metrics = [
              ('repeated_point_query', 'qps', 'Point query'),
              ('large_result_read', 'mean_ms', 'Large read 5k'),
              ('stream_invalidation_latency', 'mean_ms', 'Stream invalidation'),
              ('single_row_crud', 'ops_per_sec', 'Single CRUD'),
              ('batch_write_transaction', 'rows_per_sec', 'Batch write'),
          ]
          for case_id, metric, label in metrics:
              v = d.get(case_id, {}).get(metric)
              if v:
                  if metric in ('qps', 'ops_per_sec', 'rows_per_sec'):
                      print(f'{label}: {int(v):,}')
                  else:
                      print(f'{label}: {v:.3f}ms')
          "

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark/results/*.md
            benchmark/results/*.json
            /tmp/h2h.json
          retention-days: 90
