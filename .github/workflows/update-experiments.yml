name: Update Docs Data

on:
  push:
    branches: [main]
    paths:
      - 'experiments/*.md'
      - 'experiments/signals/**'
      - 'experiments/index/**'
      - 'experiments/README.template.md'
      - 'benchmark/generate_signals.dart'
      - 'benchmark/generate_readme.dart'
      - 'benchmark/generate_knowledge_graph.dart'
      - 'benchmark/generate_knowledge_page.dart'
      - 'doc/arch/chapters/**'
      - 'benchmark/results/*.md'
      - 'benchmark/results/*.json'
      - 'benchmark/HARDWARE_RESULTS.md'
      - 'benchmark/shared/parse_results.dart'
      - 'benchmark/shared/release_artifact.dart'
      - 'benchmark/shared/workload_registry.dart'
      - 'benchmark/generate_history.dart'
      - 'benchmark/generate_devices.dart'
      - 'benchmark/generate_blog.dart'
      - 'benchmark/generate_releases.dart'
      - 'benchmark/version_benchmarks.json'
      - 'CHANGELOG.md'
      - 'doc/**/*.md'

permissions:
  contents: write

jobs:
  regenerate:
    name: Regenerate docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Generate history JSON
        run: dart run benchmark/generate_history.dart

      - name: Generate signals JSON
        run: dart run benchmark/generate_signals.dart

      - name: Generate experiments README
        run: dart run benchmark/generate_readme.dart

      - name: Generate knowledge graph JSON
        run: dart run benchmark/generate_knowledge_graph.dart

      - name: Generate knowledge page
        run: dart run benchmark/generate_knowledge_page.dart

      - name: Generate devices JSON
        run: dart run benchmark/generate_devices.dart

      - name: Generate blog pages
        run: dart run benchmark/generate_blog.dart

      - name: Generate releases JSON
        run: dart run benchmark/generate_releases.dart

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet docs/ experiments/signals.json experiments/README.md && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ experiments/signals.json experiments/README.md
          git commit -m "Auto-update docs (experiments + signals + README + devices + blog + releases)"
          git push
