 boundary.","conditions":"M1 Pro · AOT · maxRss, one process per lane, 21 samples · 2026-08","edges":[{"type":"supersedes","target":"260.4"},{"type":"dependsOn","target":"261.1"}],"state":"live","restsOn":["261.1"]},{"id":"261.3","source":"261","directions":["measurement-system","result-transfer-shape"],"text":"Peak read-path memory was flat within ~1 MB from v0.3.0 (2026-05-03) to exp 259 (2026-08-03) across eight checkpoints and roughly forty merged experiments, including the whole transfer-shape arc, while wall time on the same runs fell 25-40%. The only movement in the window is exps 259 and 260, both downward. No memory regression has accumulated.","conditions":"M1 Pro · AOT · harness source held constant, rebuilt per checkpoint · maxRss, one process per lane · 2026-08","edges":[{"type":"dependsOn","target":"261.1"}],"state":"live","restsOn":["261.1"]},{"id":"261.4","source":"261","directions":["measurement-system","result-transfer-shape"],"text":"`select()` holds far more than its payload: `mixed6-10k` reads a table containing roughly 1.5 MB of data and peaks at 95 MB, and 89.5 MB of the pre-exp-260 figure is resident before the measured reads begin. The ~60x ratio has never been decomposed, and exps 008/032's lazy and facade result shapes were assessed against wall time rather than against this.","conditions":"M1 Pro · AOT · maxRss and post-warmup resident, one process per lane · 2026-08","state":"superseded","by":["263.1"]},{"id":"262.1","source":"262","directions":["measurement-system"],"text":"Release-suite crash resilience must persist per scenario, not per repeat. A SIGKILL during scenario 10 of 16 preserves 9 scenarios and 153 resqlite metrics with `repeatCount: 0` and `partial: true`; the same kill produced no artifact before. Against the crash that actually occurs — the sqlite_async peer dying at scenario 15 — this preserves fourteen scenarios including every read, write and streaming lane.","conditions":"M1 Pro · deliberate SIGKILL, --repeat=1 · 2026-08","state":"live"},{"id":"262.2","source":"262","directions":["measurement-system"],"text":"The release suite can now fail on a memory regression. `compareMemory` returns wins/regressions/neutral plus the regressed benchmark names alongside the existing table, and `--fail-on-memory-regression` exits non-zero. Thresholds are unchanged (per-benchmark bootstrap MDE, 0.5 MB floor) — only the verdict is newly actionable. Opt-in rather than default: a local run reports without failing.","conditions":"unit-tested behaviour, 10 cases · 2026-08","edges":[{"type":"dependsOn","target":"261.1"}],"state":"live","restsOn":["261.1"]},{"id":"263.1","source":"263","directions":["result-transfer-shape","measurement-system"],"text":"The Dart representation of a `select()` row costs 256 B/row for the canonical product row's five non-key columns — obtained by differencing the 6-column marginal (396 B/row) against the 1-column `id` marginal (140 B/row), since both projections make the same btree leaves resident and the shared term is storage-side rather than representational. That is 1.9x their 134.9 B of cell content, and 0.86x a first-principles accounting of what they must occupy (~296 B). Measured as a single live result, one process per lane, seeding held constant at 20,000 rows.","conditions":"M1 Pro · AOT CLI bundle · maxRss, one process per lane, single read held live · payload averaged over the full seeded range · 2026-08","edges":[{"type":"supersedes","target":"261.4"},{"type":"dependsOn","target":"261.1"}],"state":"live","restsOn":["261.1"]},{"id":"263.2","source":"263","directions":["result-transfer-shape","measurement-system"],"text":"resqlite's resident floor before any row is read is 20.5 MB, of which 14.0 MB is a bare AOT Dart process; seeding 20,000 rows adds ~12 MB more, and a live 10,000-row result adds 3.6 MB. The result is the smallest term, so a payload-to-peak ratio taken on a read-and-discard workload is a statement about the floor.","conditions":"M1 Pro · AOT · maxRss, one process per lane · 2026-08","state":"live"},{"id":"263.3","source":"263","directions":["result-transfer-shape","measurement-system"],"text":"`selectBytes` costs 676 B/row against `select`'s 396 B/row on the same rows. It avoids Dart object allocation, not bytes: JSON repeats every column name per row and quotes and escapes every value. Reach for it to reduce allocation churn, not footprint.","conditions":"M1 Pro · AOT · maxRss, one process per lane, single read held live · 2026-08","state":"live"},{"id":"263.4","source":"263","directions":["result-transfer-shape","measurement-system"],"text":"A per-row cost of ~140 B/row is shared by every projection of the same table and is not part of the result representation: the 1-column `id` lane pays it as fully as the 6-column `select` lane, because a btree leaf holds the whole row regardless of what is projected. Its mechanism is bounded but not established — it scales with rows read, is indifferent to column count, and resqlite opens connections with mmap_size = 256 MB and cache_size = -8192, so mmap'd file pages becoming resident, WAL pages, and a cold reader page cache are all live candidates. Any future per-row memory figure must difference two projections or it charges this to the wrong layer.","conditions":"M1 Pro · AOT · maxRss, one process per lane · mechanism not discriminated · 2026-08","state":"live"},{"id":"264.1","source":"264","directions":["result-transfer-shape"],"text":"Sizing `decodeQuery`'s *initial* result allocation from a main-isolate high-water mark of the rows a SQL has ever returned, clamped into 1..256 rows so it can only shrink below the fixed default, is worth a reproduced -13.5% on a 1-row 6-column point read and -27.1% on a 1-row 21-column one. Four alternating-order lane-isolated AOT passes, 61 samples each, on a host at 52-61% CPU idle with controls inside +/-1.7% (`int20-10k` +0.3%, `mixed6-10k` -0.4%). The win scales with projection width because what a one-row result wastes is `colCount * 255` slots. Every lane whose result outgrows the initial buffer is neutral by construction, not by measurement: it clamps to the same 256 rows both arms allocate.","conditions":"M1 Pro · AOT CLI bundle · lane-isolated, 4 alternating-order passes, 61 samples/lane · host 52-61% idle · 2026-08","edges":[{"type":"refines","target":"067.1"},{"type":"dependsOn","target":"260.3"}],"state":"live","restsOn":["260.3"]},{"id":"264.2","source":"264","directions":["result-transfer-shape"],"text":"A result-buffer size hint whose failure mode is under-prediction must be a high-water mark, not a sliding window. Taking the larger of a SQL's last two row counts — the mirror of exp 260's smaller-of-two — cost +40% in all four order-flipped passes on a statement returning 3,300 rows behind bursts of eight 20-row executions, because the two observations preceding each large execution are both small, so the penalty repeats on every large read instead of once. Under a high-water mark the same lane is neutral (-1.3% mean) and the one-time cost of a statement's first jump from small to large is +1.6% (927.5 -> 942.5 us median over 50 fresh processes per arm), consistent with an arithmetic account of four extra growths, ~15,200 extra slot copies and ~13,800 extra slots zero-filled.","conditions":"M1 Pro · AOT · `undershoot-mid` lane, 3,300 rows behind 8x20-row poison · first-jump figure from --warmup=0 --samples=1, 50 processes/arm · 2026-08","state":"live"},{"id":"264.3","source":"264","directions":["result-transfer-shape"],"text":"Exp 067's mechanism claim is per-slot true and decision-irrelevant. `List<Object?>.filled(n, null, growable: true)` followed by a write of `k` slots and a truncation to `k` costs 423 ns at n=1536/k=6 against 21.5 ns at n=12/k=6, and 1223 ns at n=5376/k=21 against 46.5 ns at n=42/k=21 — so the large allocation is roughly six times cheaper per slot and twenty times more expensive in total. Any Dart allocation claim of the form 'the VM's fast path makes the larger one cheaper' must be quoted per call, not per slot.","conditions":"M1 Pro · standalone AOT reproduction of the allocation shape, no FFI or SQLite · 20,000 calls/round, 200 rounds · 2026-08","edges":[{"type":"refines","target":"067.1"}],"state":"live"},{"id":"264.4","source":"264","directions":["result-transfer-shape"],"text":"The release suite runs, and exp 262's per-scenario persistence now demonstrably preserves a killed run. The suite completes 14 of 16 scenarios — every read, write, streaming and app-shaped lane — and aborts inside the sqlite_async peer at `[15/16] Memory`, the pre-existing #282 crash, additionally wedging the parent rather than exiting. The killed run still wrote an artifact with 169 metrics, correctly self-marked `partial: true`, `scenariosCompleted: 14`, `repeatCount: 0`; exps 260 and 261 were killed inside repeat 1 before that mechanism existed and produced nothing. The artifact is single-sample and unpaired, so it is a no-regression sanity check (point query 160,798 qps, 1,000-row `select()` 0.349 ms, batch insert 1,000 rows 0.389 ms, invalidation 0.058 ms — all at or better than README's published figures) and not evidence for any candidate.","conditions":"M1 Pro · macOS 26.2 · Dart 3.12.2 · --repeat=5, killed in repeat 1 at scenario 15 · single-sample, no baseline · 2026-08","edges":[{"type":"validates","target":"262.1"}],"state":"live"},{"id":"264.5","source":"264","directions":["result-transfer-shape"],"text":"Exp 264's own change to `ReaderPool._record` put exp 260's growth hint at risk, and the fix is capacity/priority rather than ordering. Removing exp 260's `rowCount <= initialResultRows` insert guard let every point read take one of the 32 `_rowHints` slots, so a statement that has proven large is evicted by point-read churn and loses its hint. Measured on the new `hint-thrash-overflows` lane (5,000 x 5 read behind 40 distinct one-off statements per sample): pre-264 597-631 us against exp-264 826-919 us, a systematic +40-46% in which the slower arm's fastest sample beat the faster arm's slowest. Least-recently-used promotion does NOT fix it (no improvement measured, and it costs the main isolate a map remove-and-reinsert per read); raising `_rowHintMax` to 128 does (620 us), and so does preferring an eviction victim whose `highWater <= initialResultRows` (565 us). The latter shipped, and a four-pass re-measurement on a quiet host confirms both halves: the lane runs -29.5% against the unfixed arm in all four passes and is level with pre-264 (-0.2%), so exp 260's reach is restored rather than merely improved, while the fix is inert on the hot path (both point lanes sign-flip, both controls +/-0.1%) exactly as its structure predicts -- `_evictionVictim` is unreachable until the memory overflows its 32 entries. Unfixed, the same lane is +41.6% against pre-264. Specifically: it restores exp 260's exclusive tenure without a magic capacity, costs nothing per read because the O(32) scan runs only on an overflowing miss, and is gated deterministically in `test/reader_pool_test.dart` rather than through the noisy lane.","conditions":"M1 Pro · AOT · `hint-thrash-overflows`, 4 alternating-order passes, 61 samples · host 52-61% idle · 2026-08","edges":[{"type":"dependsOn","target":"260.1"}],"state":"live","restsOn":["260.1"]},{"id":"264.6","source":"264","directions":["result-transfer-shape"],"text":"Every wall-time figure in exp 264 was collected on a host at 0.0% CPU idle. `top` reported 57% user / 43% sys / 0% idle, with an unrelated Virtualization.framework VM at 190% CPU, FSEvents at 57%, and other Dart processes at 100% and 44%; load average read 33/39/50 on ten cores. Six `run_release.dart` processes from earlier sessions were also resident, wedged 1-4 days at 0.0% CPU — the #282 peer crash does not merely kill a run, it leaves the parent blocked forever, and they accumulate. The order-flipped design cancels a stationary component and the controls held to +/-2%, and the mechanism is independently corroborated by a standalone allocation probe with no isolates or SQLite (423 ns vs 21.5 ns per call) whose magnitudes match the lane deltas; the *direction and mechanism* are therefore sound. The precise percentages were not, and were re-measured once the host freed up: the narrow point read moved from -7.4% to -13.5% and the wide one from -27.4% to -27.1%, with controls tightening from +/-4% to +/-1.7%. So the saturation cost about six points of accuracy on the smaller effect and none on the larger. The general hazard stands: a per-read microsecond measurement on a saturated host is dominated by reader-isolate scheduling latency. A confirmation pass attempted late in the run read +50.6% on `int20-10k`, a lane the candidate cannot reach, which is how the saturation was discovered. The same host had 352-440 MB free on a 460 GB volume. That is worth recording beside the crash narrative exps 260-262 built on: a disk this full is an independent explanation for a SQLite-backed suite dying at the memory-heavy scenario 15 and for the parent never exiting, and it has never been ruled out. Not asserted here — untested — but it should be checked before the next runner attributes that crash to the peer.","conditions":"M1 Pro · macOS 26.2 · host at 0.0% idle and ~400 MB free disk throughout · 2026-08","state":"live"},{"id":"265.1","source":"265","directions":["result-transfer-shape"],"text":"The `select()` isolate round trip is 6.3 us of an 8.4 us canonical 6-column point read. Measured by running the query on the calling isolate instead — same `resqlite_stmt_acquire_on`, same `decodeQuery`, no SendPort and no `Isolate.exit` — which is worth a reproduced -74.8% there, -71.0% on a 21-column point read and -35.7% on a 20-row page. Two collections of four alternating-order lane-isolated AOT passes (41 then 51 samples/lane), `ab_drift_check` REPRODUCED on every primary pair in the second collection; both control lanes return more rows than the cap admits, run byte-identical code in both arms, and read +0.1% and +3.2%. Unlike claim 264.1 the effect is flat in projection width, because what it removes is per-request rather than per-slot. The routing candidate that produced this number is REJECTED (claim 265.6); the number is not, and it is the denominator any future candidate in this direction should be compared against. Collected against 4b963ad, before exp 266's stickiness landed; exp 266's term decays to -1.6% by a statement's eight-thousandth execution and every lane here runs well past that, so the pricing should hold on current main but was not re-measured there.","conditions":"M1 Pro · macOS 26.2 · Dart 3.12.2 · AOT CLI bundle · lane-isolated, 4 alternating-order passes x 2 collections · host at 0-39% CPU idle · pre-266 baseline · 2026-08","edges":[{"type":"refines","target":"258.2"},{"type":"dependsOn","target":"264.1"}],"state":"live","restsOn":["264.1"]},{"id":"265.6","source":"265","directions":["result-transfer-shape"],"text":"Routing a `select()` to the calling isolate on the strength of a per-SQL row-count high-water mark is REJECTED, because row count cannot bound main-isolate work along three independent axes. (1) Bytes: one row can be arbitrarily large, `SELECT * FROM photos WHERE id = ?` keeps a permanent high-water mark of 1, and with no hop to serialise for, exp 236's 256 KB blob wrap is suppressed — so a 5 MB image copies straight onto the calling isolate, unchecked. Cost varies per execution of the same statement, so no per-SQL history repairs it. (2) Query cost: `count(*)` over a large table and an unindexed `ORDER BY ... LIMIT 10` return few rows after unbounded work, which a result-shape signal cannot see because the work precedes the first row. (3) Scheduling: an inline `select()` returns a `List` rather than a `Future`, so a chain of them drains in microtasks with no event-loop turn — N reads are one uninterruptible block, not N interleavable slices, evidenced by exp 265's own `point1` lane at 200 reads / 427 us. The first draft of the writeup claimed a `~16 us per admitted read` bound; that was the bound for the measured shapes (small integers, short TEXT, indexed lookups, hot cache) stated as though general. Prototype preserved at `archive/exp-265`.","conditions":"M1 Pro · AOT · analysis against the exp 265 prototype; failure modes identified by inspection, not measured — the discriminating lanes do not exist yet · 2026-08","edges":[{"type":"refines","target":"239.1"}],"state":"live"},{"id":"265.2","source":"265","directions":["result-transfer-shape"],"text":"A read that never enters the dispatch queue is ~19x faster than one that does when the pool is busy. One point read issued while four outstanding 1,000-row reads occupy all four workers measures 533-1169 us across four passes against 37-52 us inline (-94.9% mean, REPRODUCED in both pairs). The hop's cost to a caller is its latency plus the queue depth in front of it, and every prior measurement of transfer cost in this direction held the request population constant and therefore measured only the first term. Independent of exp 265's rejection: it is a property of the queue, not of the routing policy.","conditions":"M1 Pro · AOT · `point-under-load` lane, 4 background 1,000-row reads, 10 timed point reads/sample · 2026-08","state":"live"},{"id":"265.3","source":"265","directions":["result-transfer-shape"],"text":"Serialising concurrent point reads on one isolate beats spreading them across the four-worker pool. Eight distinct point reads issued together via `Future.wait` measure -70.3% inline (REPRODUCED, both pairs, 10 groups per sample). The pool's parallelism cannot recover a per-request overhead larger than the request itself, which bounds where the pool is worth having: above the size at which decode dominates dispatch, and not below it.","conditions":"M1 Pro · AOT · `concurrent8` lane, 8 distinct 1-row statements x 10 groups/sample · 2026-08","state":"live"},{"id":"265.4","source":"265","directions":["result-transfer-shape"],"text":"An abort-and-fall-back cap costs +24.7% on the one execution that trips it, once per statement, and is the one part of exp 265's design that survives its rejection — because it enforces rather than predicts. A statement armed by two one-row executions and then returning 400 rows starts decoding inline, throws past row 64, resets and re-runs on a worker: 129 us against 163 us, REPRODUCED in both pairs. It cannot recur, because the high-water mark rises with the large result. The reset is not optional: a statement abandoned mid-iteration holds its connection's read transaction open, and every later read on that connection is then served from the pre-abort snapshot. Any future routing design should reuse this shape and add byte and VM-step caps beside it, rather than improving the predictor in front of it.","conditions":"M1 Pro · AOT · `cap-abort` lane, fresh SQL string per sample · 2026-08","edges":[{"type":"dependsOn","target":"264.2"}],"state":"live","restsOn":["264.2"]},{"id":"265.5","source":"265","directions":["result-transfer-shape"],"text":"A reader connection reserved for the calling isolate costs +0.1 to +1.7 MB of peak RSS, with two of nine lanes reading slightly down — at or below what exp 261's guard resolves (claim 261.2). Expected, since a connection's page cache is demand-filled and the inline connection reads pages the workers have already made resident. Recorded because it prices the connection for any future design that needs one: it cannot be shared with an idle worker, since the reply that frees a worker slot is sent before the worker's `finally` releases its connection, so `isAvailable` on the main isolate does not imply idle in C, and the connections are `SQLITE_OPEN_NOMUTEX`.","conditions":"M1 Pro · AOT · maxRss, one process per lane, 9 lanes · 2026-08","edges":[{"type":"dependsOn","target":"261.2"}],"state":"live","restsOn":["261.2"]},{"id":"266.1","source":"266","directions":["result-transfer-shape","stream-rerun-dispatch"],"text":"Reader-pool dispatch stickiness — starting `ReaderPool._dispatch`'s scan at the slot that served the previous read rather than the next one — is worth a reproduced -32.2% on a statement's first four executions, -21.8% on its first eight and -13.2% on its first thirty-two, decaying to -1.6% by the eight-thousandth. In absolute terms four sequential point reads of a fresh statement fall from 58 us to 39 us, and the saving is dominated by a term paid once per statement rather than by a per-read rate: ~19 us across the first four executions, ~22 us across the first eight, ~30 us across the first thirty-two. The mechanism accounts for the magnitude — round-robin makes all four reader connections prepare the statement, build its schema and warm its pages, so the candidate avoids three cycles of roughly 6-9 us each, and the percentage falls because an increasing execution count is what it is divided by. Twenty-four alternating-order lane-isolated AOT passes in two collections of twelve, 121 samples per lane per arm; all 24 passes were faster on `first4-newsql` and `first8-newsql`, 22 of 24 were faster on `first32-newsql`, and the shipped-code collection classified all 12 `first4`/`first8` pass-pairs plus four of six `first32` pairs as REPRODUCED. The other two `first32` pairs reversed sign across the order flip and were marked drift-suspected by `ab_drift_check.dart`.","conditions":"M1 Pro · macOS 26.2 · Dart 3.12.2 · AOT CLI bundle · 4-worker pool · lane-isolated, 24 alternating-order passes, 121 samples/lane · host 71% idle · 2026-08","edges":[{"type":"dependsOn","target":"251.1"}],"state":"live","restsOn":["251.1"]},{"id":"266.2","source":"266","directions":["result-transfer-shape","stream-rerun-dispatch"],"text":"Stickiness costs concurrency nothing, because a busy preferred slot falls through to the next exactly as a round-robin scan did. Over 24 passes, four concurrent reads read +1.3%, eight against a four-worker pool (so dispatch parks on `_dispatchWaiters`) +0.2%, and a 60,000-slot result that crosses `sacrificeSlotThreshold` and ends its worker on every sample -0.4% — each sign-flipping between the two collections (`conc4` is -1.4% in one and +1.5% in the other), which is what marks them neutral rather than small. The property is pinned deterministically rather than through the noisy lanes: `test/reader_pool_test.dart` asserts that four reads issued without awaiting leave `availableWorkerCount` at zero, which fails if stickiness ever queues them on one worker.","conditions":"M1 Pro · AOT · `conc4` / `conc8` / `mixed6-10k` lanes, 24 alternating-order passes · 2026-08","state":"live"},{"id":"266.3","source":"266","directions":["result-transfer-shape","stream-rerun-dispatch"],"text":"A fixed per-(statement, worker) cost is structurally invisible to resqlite's benchmark suite, and this is a property of the suite rather than of any one lane. Every release scenario and every focused harness lane executes one statement from tens to thousands of times per sample, because that is what it takes to resolve a per-read effect at microsecond scale; a cost paid once per statement per worker is divided by that repeat count before it is ever reported. The discriminating instrument is a lane that mints a fresh SQL string per sample (a trailing comment leaves the plan identical) and times its first N executions. Three such lanes at N = 4, 8 and 32 bracket where the fixed term stops mattering, and the monotonic decay across them is stronger evidence for a warm-up mechanism than any single lane's magnitude.","conditions":"M1 Pro · AOT · `first{4,8,32}-newsql` lanes in `benchmark/experiments/reader_dispatch_stickiness.dart` · 2026-08","state":"live"},{"id":"266.4","source":"266","directions":["result-transfer-shape","stream-rerun-dispatch"],"text":"Two candidate per-read costs on the reader hop are refuted by direct probe and should not be attempted again without a new mechanism. First, the per-TEXT-cell `Pointer.asTypedList` view allocation in `decodeQuery`: decoding 40,000 24-byte cells through one fresh external view each costs 432 us against 378 us through a persistent window with offsets, so the view is ~1.35 ns/cell, about 1.5% of the 10k x (4 INT + 4 TEXT) read exp 251 measured at 3,587 us — and routing the bytes through a native scratch buffer to earn it would add a copy larger than the saving. Second, the per-query `RowSchema` copy across the isolate hop: an isolate ping-pong carrying a worker-cached schema (names list plus eagerly built HashMap index) against one carrying no schema at all differs by under 1% of a round trip at 6 and 21 columns and at 1, 20 and 1,000 rows — under 40 ns, indistinguishable from noise. Neither is worth an experiment.","conditions":"M1 Pro · standalone AOT probes, no SQLite · 2026-08","state":"live"},{"id":"266.5","source":"266","directions":["result-transfer-shape","stream-rerun-dispatch"],"text":"A dispatch-policy change can break a reclaim path that is driven by traffic, and `selectBytes` is the case in this codebase. Exp 183's `json_buf` reclaim shrinks a reader connection's serialization buffer when a later, *smaller* read arrives on that same connection; a concurrent burst of large byte reads grows all four readers' buffers, and only the round-robin rotation brings the settling small reads back round to reclaim them. Making every read sticky left the three workers a burst had grown unvisited, and `Diagnostics.readerJsonBufHighWaterBytes` settled at 6.2 MB against the 512 KB the exp 185 release guard allows — a real retention regression that the wall-time harness could not see and the guard caught on its first run. `selectBytes` therefore keeps the pre-266 rotation while `select` sticks. The boundary is structural rather than expedient: the bytes path retains a per-connection buffer whose reclaim is traffic-driven, and the rows path retains nothing per connection. Pinned by a `selectBytes keeps rotating` unit test and by the `bytes-first8-newsql` harness lane, which reads -1.2% (7 of 12 passes faster) as an unchanged path should.","conditions":"M1 Pro · `benchmark/suites/sqlite_diagnostics.dart` `JSON buffer reclaim` guard · 2026-08","edges":[{"type":"dependsOn","target":"183.1"}],"state":"live","restsOn":["183.1"]},{"id":"266.6","source":"266","directions":["result-transfer-shape","stream-rerun-dispatch"],"text":"Sticky reader dispatch does not regress stream fan-out: the stream-rerun-dispatch Tracelite preset (high-cardinality-fanout, keyed-pk-subscriptions, many-streams-writer-throughput) measured -10.7%/-20.5%/-7.5% elapsed against origin/main, none slower, with warmup guardrails all pointing down 36-53% (too noisy to classify individually). The keyed-PK -20.5% at p~1e-5 hints stream reruns themselves benefit from landing on a warm worker, but no stream win is claimed from a guard run.","conditions":"Tracelite A/B, stream-rerun-dispatch direction preset, arm64 macOS; harness verdict 'inconclusive' only because the preset gates on a 43.5% improvement expectation","edges":[],"state":"live"},{"id":"267.1","source":"267","directions":["result-transfer-shape"],"text":"Raising the three SQL-keyed read-path caps (`STMT_CACHE_MAX`, `_schemaCacheMax`, `ReaderPool.rowSizeMemoryMax`) from 32 to 128, together with in-place LRU-slot reclaim in `stmt_cache_insert`, is worth a reproduced -55.5% at 40 rotating distinct statements, -55.1% at 64 and -53.3% at 128, on a lane issuing 256 point reads per sample. Per read that is 14.0 us -> 6.1 us. The win is flat across 40-128 statements, which is the cliff signature; every lane inside the old cap (`rotate8`, `rotate24`, `rotate32`, `point1`) is neutral in two independent order-flipped collections, and peak RSS rises 0.8-1.2 MB.","conditions":"M1 Pro · macOS 26.2 · Dart 3.12.2 · AOT CLI bundle · 4-worker pool · lane-isolated, 4 alternating-order passes, 51 samples/lane, two independent ab_drift_check pairs · host 62-72% idle · 2026-08","edges":[{"type":"dependsOn","target":"266.1"}],"state":"live","restsOn":["266.1"]},{"id":"267.2","source":"267","directions":["result-transfer-shape"],"text":"The statement cache's eviction compaction cost `(STMT_CACHE_MAX - 1) * ~1.6 KB` of `memmove` per prepare and dominated the capacity question. Raising the cap alone measured a reproduced +42.1% on `churn-unique` (256 never-repeated statements per sample); removing the compaction took the same lane to a reproduced -11.9%, an improvement over the 32-entry baseline. The compaction preserved no ordering that `stmt_cache_lookup_entry`'s promote-by-swap had not already given up.","conditions":"M1 Pro · AOT · `churn-unique` lane in `benchmark/experiments/stmt_cache_pressure.dart`, 4 alternating-order passes per candidate version · 2026-08","state":"live"},{"id":"267.3","source":"267","directions":["result-transfer-shape"],"text":"A bounded SQL-keyed cache returning the wrong entry is silent, not fatal: the caller receives a well-formed result belonging to a different statement. `test/stmt_cache_pressure_test.dart` gates this by pushing 400 distinct statements through every cache and checking each statement's identity from its result — the row it selects, the columns it projects, its parameter arity, and a stream's dependency capture after churn. Four of the five tests were verified to fail against a deliberately mismatched entry (a new `sqlite3_stmt` installed under the evicted entry's old SQL text).","conditions":"JIT `dart test`, 400 distinct statements against 128-entry caps · 2026-08","state":"live"},{"id":"268.1","source":"268","directions":["result-transfer-shape","measurement-system"],"text":"Making `stmt_cache_init` count-only reduces median max RSS by 589,824 bytes at two readers (18,923,520 -> 18,333,696, -3.12%) and 1,056,768 bytes at four readers (21,012,480 -> 19,955,712, -5.03%). RSS growth from immediately before native open falls 540,672 and 974,848 bytes. The candidate is lower in all 48 paired observations across 12 alternating-order fresh-process passes; going from two to four readers adds 231-237 KB of mean savings per reader, 84-87% of the 273,408-byte optimized-code prediction and directionally consistent under process max-RSS granularity.","conditions":"M1 Pro · macOS 26.2 · Dart 3.12.2 · native-asset-aware AOT CLI · fresh process per lane and arm · 12 alternating-order passes · host roughly 51-62% idle · 2026-08","edges":[{"type":"refines","target":"267.1"}],"state":"live"},{"id":"268.2","source":"268","directions":["result-transfer-shape","measurement-system"],"text":"The actual `resqlite_cached_stmt` layout is 2,136 bytes and one 128-entry cache is 273,408 bytes (`0x42c00`). Baseline arm64 AOT code calls `_bzero` with that exact size once per successfully opened reader; candidate code omits the call. Both binaries already omit the writer-side clear immediately after `calloc`. This explains why the memory saving scales with readers rather than writer plus readers and corrects exp 267's approximate 1.6 KB entry-size account.","conditions":"Disassembly of baseline and candidate native dylibs built by `dart build cli` from origin/main 96e6730 · arm64 macOS · 2026-08","state":"live"},{"id":"268.3","source":"268","directions":["result-transfer-shape","measurement-system"],"text":"Count-only cache initialization does not regress native open, fill, lookup or eviction. Six alternating-order AOT passes improve median-of-pass native open medians by 2.42% at two readers and 2.73% at four; the only three candidate-slower comparisons are +1.15%, +0.46% and +1.57%. Four AOT pressure passes are neutral for first-slot/hot-hit `point1` (-0.48%), exact-fill `rotate128` (-0.61%) and always-evict `churn-unique` (-0.51%), with sign reversals and all individual deltas within +/-3.04%. Twenty-three focused tests pass, including 400-statement reader/writer eviction and dependency reliability/fault fallback.","conditions":"M1 Pro · AOT wall lanes: 6 alternating-order passes, 61 samples, 16 opens/sample · AOT pressure lanes: 4 alternating-order passes, 41 samples, 256 reads/sample · serial focused tests · 2026-08","edges":[{"type":"validates","target":"267.3"}],"state":"live"},{"id":"269.1","source":"269","directions":["result-transfer-shape"],"text":"Removing worker dispatch has a large, reproducible effect on hot small reads. The exact final candidate measured point reads at -60.0% to -64.9%, page20 at -38.2%, page64 at -24.0%, a point read queued behind four busy readers at -89.5%, and eight concurrent point reads at -69.8% over two order-flipped pairs. This confirms the latency mechanism; it does not establish that arbitrary `select()` work is safe on the caller.","conditions":"M1 Pro · macOS 26.2 · Dart 3.12.2 · AOT CLI bundle · collection 3 only for the exact sentinel-based candidate · 2026-08","edges":[{"type":"validates","target":"265.1"},{"type":"validates","target":"265.2"},{"type":"validates","target":"265.3"}],"state":"live"},{"id":"269.2","source":"269","directions":["result-transfer-shape"],"text":"Rows, result payload bytes, VDBE-opcode count and a stopwatch checked before a synchronous call do not bound caller-isolate wall time. After two one-byte arming reads, `SELECT length(randomblob(?))` with a 16 MiB argument returned one INTEGER in 25,975-27,790 us without crossing any proposed cap. A 1 ms timer fired before return on worker-first main in all three samples and failed to fire before return on the inline candidate in all three. The expensive built-in function call occurs inside one VM opcode, so a progress handler cannot preempt it.","conditions":"Same-host Dart JIT A/B · parent 96e6730 vs candidate dd252db · three 16 MiB samples per arm · timer result is the caller-responsiveness discriminator · 2026-08-12","edges":[{"type":"refines","target":"265.6"}],"state":"live"},{"id":"269.3","source":"269","directions":["result-transfer-shape"],"text":"A SQLite progress handler is a cancellation opportunity, not wall-time preemption. SQLite invokes it at selected VM loop boundaries; one function, collation, virtual-table, VFS/page-fault or busy-handler interval may run before another check. In the rejected prototype, parameter packing and cold statement preparation also occurred before handler installation, reader connections retained a 5-second busy timeout, and native TEXT classification scanned a complete cell before Dart applied the output-byte cap.","conditions":"Code audit of candidate dd252db and bundled sqlite3mc 2.3.5 / SQLite 3.53.2 · supported arbitrary-SQL and extension surface · 2026-08-12","edges":[],"state":"live"},{"id":"269.4","source":"269","directions":["result-transfer-shape"],"text":"The 1 ms per-turn budget measures and improves yielding across a chain of cheap reads, not the duration of one read. In the focused final-candidate lane, worst timer lateness was 1,253-1,313 us inline against 2,373-2,382 us through dispatch; making the budget unreachable produced a separate 33,344 us observation. The opaque-work probe shows why this cannot be promoted to a per-read wall bound.","conditions":"M1 Pro · AOT · final-candidate collection 3 for the focused lane; auxiliary unreachable-budget value recorded without raw samples · 2026-08","edges":[],"state":"live"},{"id":"269.5","source":"269","directions":["result-transfer-shape"],"text":"Release-suite auto-comparison can silently choose a stale or non-release artifact. Exp 269's first sweep compared against a two-experiment-old anchor and reported four apparent regressions on unreachable paths; an explicit same-host baseline from the actual parent cleared them, yielding 1 win, 0 regressions and 168 neutral metrics. Always name the parent receipt explicitly and test diff reachability before interpreting an aggregate flag.","conditions":"M1 Pro · `run_release.dart --repeat=5 --skip-memory --fail-on-regression` · actual-parent baseline 96e6730 · 2026-08","edges":[],"state":"live"},{"id":"270.1","source":"270","directions":["result-transfer-shape","stream-rerun-dispatch"],"text":"A `select()` result served from a main-isolate cache costs 0.48 us against 4.65 us for the same read dispatched to a reader worker. Focused AOT A/B over two order-flipped collections: repeated one-row read -90.0%/-90.1%, the same at 21 columns -92.1%/-91.9%, eight cycled parameter sets -90.2%/-89.6%, a repeated 20-row page -95.1%/-95.7%, all REPRODUCED. Peak RSS is flat or lower (31.0 -> 25.9 MB on the page lane).","conditions":"M1 Pro (10 cores) · macOS 26.2 · Dart 3.12.2 · AOT CLI bundle · both arms built from one worktree and one native library, differing only in the kReadCacheEnabled constant · 8 alternating pairs per lane per collection, 51 samples per pass · 2026-08-12","edges":[{"type":"validates","target":"269.1"}],"state":"live"},{"id":"270.2","source":"270","directions":["result-transfer-shape","stream-rerun-dispatch"],"text":"resqlite's write invalidation is scoped to writes made through one `Database`, so a result cache behind `select()` returns superseded rows whenever another connection to the same file commits. Demonstrated directly: after a second `Database` on the same path commits, the cached arm reports the pre-write value while a fresh connection reports the post-write one. This is not fixable inside the cache; the preupdate hook only fires on the connection that wrote.","conditions":"`benchmark/experiments/select_cache_foreign_writer.dart`, both arms, same host · applies to any design that remembers a read result rather than re-executing it · 2026-08-12","edges":[],"state":"live"},{"id":"270.3","source":"270","directions":["result-transfer-shape","stream-rerun-dispatch"],"text":"`PRAGMA data_version` — SQLite's cross-connection change counter — costs 2 us at p50 and 5 us at max when idle, and 1 us at p50 with a 10 us max while a foreign connection commits continuously, stepping a cached statement on a main-isolate-owned reader connection under AOT. A cache hit validated by it would therefore cost about 2 us against a 4.65 us dispatch: roughly 2x rather than 10x. The median is affordable; the tail is unmeasured against cross-process contention, checkpoints and busy waits, and reading it requires the main-isolate SQLite connection exp 269 rejected.","conditions":"M1 Pro · AOT · 3,000 samples per phase · contention supplied by a same-process second `Database`, not a foreign process · 1 us stopwatch resolution, so p50 values are at the floor · 2026-08-12","edges":[{"type":"dependsOn","target":"269.3"}],"state":"live","restsOn":["269.3"]},{"id":"270.4","source":"270","directions":["result-transfer-shape","stream-rerun-dispatch"],"text":"An invalidation scheme's cost belongs on the reader, not the writer. A table-to-queries index with column-level intersection measured +16-19% on a lane alternating one write and one read, because the write walks it whether or not the cache ever helps. Per-table version counters stamped at dispatch and checked at lookup took the same lane to +0.7%/+1.8% (neutral), giving up column-level elision to do it.","conditions":"Same focused harness and host as claim 270.1 · `read-write-alternate` lane, 20 write/read pairs per sample · the +16-19% figure is from a single collection of the superseded implementation, not an order-flipped pair · 2026-08-12","edges":[],"state":"live"},{"id":"270.5","source":"270","directions":["result-transfer-shape","stream-rerun-dispatch"],"text":"Read repetition is workload-shaped, not constant. Chat Sim (A5) would serve 17.7% of its 9,006 `select()` calls from a (sql, parameters) cache and Feed Paging (A6) 84.3% of its 140. At 4.2 us saved per hit that is ~0.74 us and ~3.5 us per `select()` respectively. The release suite cannot supply this number at all: its read scenarios repeat one statement with nothing writing, so they measure the cache rather than the database.","conditions":"`benchmark/experiments/select_read_cache_incidence.dart` over the repo's two workload simulations · synthetic workloads, not production traces · hit-rate counts only, no timing · 2026-08-12","edges":[],"state":"live"},{"id":"270.6","source":"270","directions":["result-transfer-shape","stream-rerun-dispatch"],"text":"The release suite's read scenarios cannot evaluate a statement-keyed cache, and the explicit parent comparison shows it directly: 7 wins, 0 wall-time regressions, 162 neutral, where the wins are `Select -> Maps` 100 rows -86%, `Scaling` 100 rows -87% and keyset pagination -100% — all of them the suite repeating one statement with nothing writing. The only red row is `sqlite_async`'s overlapping-column re-emit count, which varied 3,466-4,503 across the five repeats of that same run while resqlite reported 0 disjoint / 10 overlapping in all five.","conditions":"M1 Pro · `run_release.dart --repeat=5 --fail-on-regression --fail-on-memory-regression` · explicit same-host baseline from parent 1237587 · quiet host; an earlier sweep of the same commit flagged 14 lanes at +12% to +40% while a separate multi-Database probe ran concurrently · 2026-08-12","edges":[{"type":"validates","target":"269.5"}],"state":"live"},{"id":"271.1","source":"271","directions":["stream-rerun-dispatch"],"text":"A single-producer C11-atomic writer completion mailbox can be observed from the main Dart isolate before the canonical reply-port event without running SQLite on main. At the 24 us default, a 5,000-write diagnostic attempted 3,818 polls and caught 2,669 completions (69.9%) with 17.8 us mean polling time.","conditions":"M1 Pro class arm64 macOS host, Dart 3.12.2 JIT diagnostic, no active streams, scalar no-op point update, one mailbox per Writer, 2026-08-14","edges":[],"state":"live"},{"id":"271.2","source":"271","directions":["stream-rerun-dispatch"],"text":"Bounded active polling does not improve sequential writer wall on the current runtime. Native-asset-aware AOT B-A-A-B measured no-op writes at +84.1% and +62.7%; point updates at +15.0% and -18.8%; small inserts at +7.3% and -10.9%. No target win reproduced in both orders against the required 15% gate.","conditions":"origin/main 5555dfa versus archive/exp-271 cbc6a7f, 7 samples per lane per pass, 1,200 no-op / 1,000 point / 600 insert operations per sample, run order B1-A1-A2-B2, arm64 macOS, Dart 3.12.2 AOT CLI bundles, 2026-08-14","edges":[],"state":"live"},{"id":"271.3","source":"271","directions":["stream-rerun-dispatch"],"text":"Speculative success polling structurally penalizes errors because they never publish the completion slot. Constraint-error latency regressed from 11.823 to 36.073 us (+205.1%) in the first order and from 8.542 to 40.010 us (+368.4%) in the second; SQLite code 19, SQL, parameters, and recovery all remained correct.","conditions":"Same AOT B-A-A-B as claim 271.2, 96 errors per sample, 7 samples per pass, 672 verified errors per run, 24 us attempt budget, 2026-08-14","edges":[],"state":"live"},{"id":"271.4","source":"271","directions":["stream-rerun-dispatch"],"text":"Increasing the completion poll from 24 to 32 us does not rescue the mechanism. One full AOT arm measured 21.702 us no-op, 37.214 us point update, 34.617 us insert, and 44.833 us constraint error, worse than both baseline pass medians on every decision lane.","conditions":"Exact archive/exp-271 candidate with only RESQLITE_WRITE_COMPLETION_POLL_US default changed 24 to 32, full 7-sample harness, arm64 macOS, Dart 3.12.2 AOT, 2026-08-14","edges":[],"state":"live"},{"id":"271.5","source":"271","directions":["stream-rerun-dispatch"],"text":"The per-turn cap kept candidate heartbeat callbacks live but did not prevent throughput loss. At the VM's effective 16 ms period, A1/A2 delivered 278/279 and 279/279 deadlines with p99/max gaps of 21.094/33.609 ms and 19.803/25.729 ms, while continuous sequential throughput fell 53,204 to 18,314 writes/s (-65.6%) and 45,892 to 28,757 writes/s (-37.3%). The originally emitted missed-frame count used the requested rather than effective period and is not evidence.","conditions":"Three 1.5-second timer runs per harness pass, requested 16,667 us and effective 16,000 us period on Dart 3.12.2, same AOT B-A-A-B as claim 271.2; B2 delivered 270/279 with a separate 95.692 ms host-noise gap, 2026-08-14","edges":[],"state":"live"},{"id":"272.1","source":"272","directions":["result-transfer-shape"],"text":"Three captured downstream Dune flow traces spanning five test lifecycles produced 911 `cachedSqlUtf8` accesses across 25 current-process reader/writer isolate lifetimes. There were 595 first-touch misses and 316 repeated accesses; all 316 repeats had exact one-based LRU rank 1-32, with zero at 33-128 or above 128 and a maximum rank of 19. Replaying at capacity 128 therefore rescued zero misses and zero SQL bytes, while the 32-entry replay matched the real hit bit on all 911 events.","conditions":"Apple M1 Pro, macOS 26.2, Dart 3.12.2, Resqlite 2e182044, Dune 75fd6467, JIT integration tests for admin onboarding, message round-trip, and canvas sync/lifecycle, synchronous trace of current-process worker isolates, 2026-08-15","edges":[],"state":"live"},{"id":"272.2","source":"272","directions":["result-transfer-shape"],"text":"Lifetime SQL diversity does not establish pressure on an LRU cache. The message-round-trip writer recorded 77 unique SQL identities in 146 calls, and two canvas writers recorded 79 unique identities in 116 and 104 calls, yet none of their repeated accesses had one-based reuse rank above 32.","conditions":"Same traces as claim 272.1; identity is exact SQL UTF-8 bytes and one-based reuse rank is computed separately per isolate","state":"live"},{"id":"272.3","source":"272","directions":["result-transfer-shape"],"text":"The current source has a real capacity mismatch: each isolate's SQL UTF-8 native-pointer LRU is capped at 32 while the native prepared-statement cache, worker schema cache, and pool row-size memory are capped at 128. Raising the pointer cache to 128 can avoid allocation only for reused SQL with one-based per-isolate rank 33-128; no such access occurred in the exp 272 traces.","conditions":"Resqlite origin/main 2e182044; lib/src/native/request_cache.dart, native/resqlite.c, lib/src/query_decoder.dart, lib/src/reader/reader_pool.dart; 2026-08-15","state":"live"},{"id":"273.1","source":"273","directions":["sqlite-version-and-build-config"],"text":"Apple clang 21 continuous instrumentation can generate a usable Resqlite PGO profile from a Dart-loaded dylib. Three representative AOT inputs merged into a 522,568-byte indexed profile covering 2,406 functions, 31,934 blocks, and 2,556,436,455 counter events; strict `-fprofile-use` then built without stale-profile, unprofiled-function, or backend warnings.","conditions":"Apple clang/llvm-profdata 21.0.0, Xcode 26.6, arm64 macOS 26.2, Dart 3.12.2, source 02592093e6b6; counter-only continuous mode with atomic updates, value profiling disabled, and stable static-function profile keys; 2026-08-16","edges":[],"state":"live"},{"id":"273.2","source":"273","directions":["sqlite-version-and-build-config"],"text":"Representative counter-only PGO produced same-direction broad native-path wins in both comparisons of a B-C-C-B AOT release run: executeBatch at 100/1,000/10,000 rows improved -14.6%/-12.5%, -16.7%/-16.8%, and -19.2%/-19.3%; the 10,000 x 20 wide batch improved -12.4%/-9.2%, parameterized reads -10.6%/-10.4%, and selectBytes at 1,000/10,000 rows -9.2%/-9.3% and -8.6%/-7.9%.","conditions":"Separate baseline and PGO AOT native-asset bundles from source 02592093e6b6, baseline-candidate-candidate-baseline order, one full Resqlite-only release pass per arm, same Apple M1 Pro host; 2026-08-16","edges":[],"state":"live"},{"id":"273.3","source":"273","directions":["sqlite-version-and-build-config"],"text":"The PGO candidate failed the preregistered homogeneous stream-emission kill rule: p50 regression of at least 3% and at least 0.02 ms in at least three of five adjacent 300-trial AOT pairs. Pair p50 deltas were -9.63%, +4.38% (+0.0465 ms), -15.61%, +43.37% (+0.3285 ms), and +11.69% (+0.1315 ms), so pairs 2/4/5 satisfied both thresholds. The pooled delta was +1.53% with a confidence interval spanning zero; the evidence is a declared replicated-gate failure amid phase variance, not proof of a stable slowdown.","conditions":"`benchmark/experiments/stream_rerun_latency.dart --trials=300 --raw`, five adjacent baseline/candidate process pairs, `homogeneous-100small` single-write emission p50, arm64 macOS; predeclared kill rule requires both >=3% and >=0.02 ms candidate regression in >=3/5 pairs; 2026-08-16","edges":[],"state":"live"},{"id":"275.1","source":"275","directions":["stream-rerun-dispatch","result-transfer-shape"],"text":"Reader-pool admission ordering has effectively zero incidence on the repo's representative workloads. One full `benchmark/run_release.dart --repeat=1` pass — chat sim, feed paging, concurrent reads 4x/8x, streaming fan-out, keyed-PK subscriptions, diagnostics and memory scenarios — recorded 335,221 reader dispatches, of which 325,909 (97.2%) were cheap by a 64-row per-SQL high-water classifier. Only 312 cheap dispatches (0.096% of cheap) parked for a worker at all, and 0 parked while any costly request was already waiting. The probe build held the last-free-worker reservation ON, which parks costly requests more often than main does, so 0 is an upper bound.","conditions":"Apple M1 Pro (10 cores, reader pool = 4), macOS 26.2 / Darwin 25.2.0, Dart 3.12.x JIT, resqlite branch exp-275 at a05e3dc over origin/main f44c2c4, temporary unguarded counters in ReaderPool._dispatch read at each Database.close(), 2026-08-19","edges":[{"type":"refines","target":"265.2"}],"state":"live"},{"id":"275.2","source":"275","directions":["stream-rerun-dispatch","result-transfer-shape"],"text":"Holding the reader pool's last free worker back for cheap reads takes a point read issued into a saturated pool from 256-374 us to 52-65 us (-75.0%, -75.2%, -75.6%, -86.1%; REPRODUCED in both order-flipped pairs of both collections), against ~20 us for the same read on an idle pool. It collects most of claim 265.2's inline win without running SQLite on the calling isolate, without a freshness contract, and without starvation: the costly-read latency guard stayed neutral. It is REJECTED because the same policy costs a reproduced +46.6% to +63.1% on four concurrent 1,000-row reads whenever cheap reads are recent, and because claim 275.1 measures zero incidence for the shape it improves.","conditions":"Three native-asset-aware AOT CLI bundles (`dart build cli`) from one harness source built at origin/main f44c2c4 and branch exp-275 a05e3dc; benchmark/experiments/reader_admission_priority.dart, lane-isolated processes, 41 samples after 10 warmup, two collections each with an order-flipped pair; Apple M1 Pro, macOS 26.2, reader pool = 4, 2026-08-19","edges":[{"type":"dependsOn","target":"265.2"}],"state":"live","restsOn":["265.2"]},{"id":"275.3","source":"275","directions":["stream-rerun-dispatch","result-transfer-shape"],"text":"Waking a parked cheap read ahead of parked costly ones, with no capacity withheld, improves eight point reads queued behind eight 1,000-row reads by -37.0% to -42.4% (REPRODUCED in both order-flipped pairs of both collections) and makes the costly read FASTER rather than slower (-3.4% to -8.8%, reproduced), because serving the short jobs first empties the queue sooner. Every non-parking control is neutral, so the per-dispatch classification is below the harness floor. It is REJECTED on claim 275.1: the population it reorders occurred zero times in 335,221 dispatches.","conditions":"Same three AOT bundles and protocol as claim 275.2; candA arm (`reserveLastWorker = false`), lanes `mixed-queue` and `costly-latency`, 2026-08-19","edges":[{"type":"dependsOn","target":"275.1"}],"state":"live","restsOn":["275.1"]},{"id":"275.4","source":"275","directions":["stream-rerun-dispatch","result-transfer-shape"],"text":"A saturate-the-pool-then-read lane must time the first read alone. Sticky dispatch (exp 266) sends a sequential run of point reads back to whichever worker frees first, so in exp 265's `point-under-load` shape only read 1 waits (300-956 us) and reads 2-10 cost ~20 us in every arm. Summing ten, as exp 265 did, dilutes the signal ninefold: the exp 275 reservation measured -13% under the summed lane and -75% under the first-read-only lane, on identical binaries.","conditions":"Direct per-read probe and lane-isolated AOT A/B, Apple M1 Pro, reader pool = 4, 1,000-row background reads, 2026-08-19","edges":[{"type":"refines","target":"265.2"}],"state":"live"},{"id":"275.5","source":"275","directions":["stream-rerun-dispatch","result-transfer-shape"],"text":"A last-free-worker reservation needs no per-request denial cap to stay live, and adding one silently defeats it. Refusing a costly request only when the free slot is the pool's last means at least one other worker is busy, so a worker-free event is always still pending, and the request is admitted as soon as two slots are free. A first prototype that also capped refusals at two per request had the reserved slot taken by the woken costly waiter after two wakes, which cut its own primary lane from -75% to -13%.","conditions":"ReaderPool._dispatch prototype at archive/exp-275, reader pool = 4, JIT and AOT, 2026-08-19","edges":[],"state":"live"},{"id":"278.1","source":"278","directions":["result-transfer-shape","stream-rerun-dispatch","measurement-system"],"text":"Dart's async plumbing is a nanosecond-scale cost, not a microsecond-scale one, and resqlite's read prologue is priced accordingly. Measured with no SQLite, no isolates and no resqlite code — a sync completer resolved from a separate microtask, reached through four amounts of plumbing, five AOT runs of 21 samples x 200,000 calls: awaiting an already-resolved future before the real one costs 70.7 ns, and each `async` function that only forwards a future costs 34.6 ns. The prologue `Database.select` -> `ReaderPool.select` -> `ReaderPool._dispatch` -> `_WorkerSlot.request` therefore carried 142.7 ns over a direct await, of which a candidate that makes `Database.select`, `Database.selectBytes` and `_dispatch`'s first scan non-async removes ~108 ns. Divided by what it wraps that is 2.0% of a 5.4 us point read, 1.1% of a 20-row page, 0.05% of a 1,000-row read and 0.004% of a sacrificed 10,000-row one — a ceiling below the 5% decision gate on every shape resqlite measures, so no implementation of the idea can clear it. Exp 171 estimated the same resolved-future hop at 1-2 us per call and derived 6-12% of headroom from that estimate; the figure is 14-28x too large and the headroom never existed.","conditions":"M1 Pro · macOS 26.2 · Dart 3.12.x · AOT (`dart compile exe`) · `benchmark/experiments/async_prologue_price.dart`, 5 runs x 21 samples x 200,000 calls · differences only; absolute ns/call includes completer allocation and loop · 2026-08","edges":[{"type":"supersedes","target":"171.1"}],"state":"live"},{"id":"278.2","source":"278","directions":["result-transfer-shape","stream-rerun-dispatch","measurement-system"],"text":"The end-to-end lanes agree with that ceiling by being flat, and the control lane is what proves the collection could not have seen 2% anyway. Twelve alternating-order lane-isolated AOT passes over `reader_dispatch_stickiness.dart` (121 samples per lane per arm, two collections of six): no primary-lane pass pair reproduced a win — fourteen of eighteen primary scenarios classify neutral under `ab_drift_check.dart`, two drift-suspected, and the two classified REPRODUCED point the wrong way. Pooled over twelve passes every one of the twelve lanes lands between -3.5% and +1.2%, including `mixed6-10k` at -2.9%, a lane on which the candidate's arithmetic ceiling is 0.004%. That control is the ruler: about 3% of apparent movement in this collection is apparatus, and `point1`'s pooled -3.0% is the same number as the lane that cannot have changed. The declared shape prediction is also unmet — a fixed per-call saving must shrink as the read grows, and `mixed6-20` (+0.4%) is not ordered against `point1` (-3.0%) at all. `first32-newsql` is the one lane with a persistent median (-9.9%, nine of twelve passes negative) and the mechanism rather than the statistics rules it out: it times 32 executions at ~6.6 us each, so the prologue is worth the same ~2% there as on `point1`, which read -2.1%.","conditions":"M1 Pro · macOS 26.2 · Dart 3.12.x · two `dart build cli` AOT bundles from one harness source · 12 alternating-order lane-isolated passes, 121 samples/lane/arm · collection 1 at 76.7% CPU idle / load 4.77, collection 2 at load 8.64 with per-lane CVs to 100-290% · 2026-08","edges":[{"type":"dependsOn","target":"278.1"}],"state":"live","restsOn":["278.1"]},{"id":"278.3","source":"278","directions":["result-transfer-shape","stream-rerun-dispatch","measurement-system"],"text":"Removing the read path's async frames is behaviour-safe, which is worth recording separately from its being worthless. `Database.select` and `Database.selectBytes` can return the reader pool's future directly, and `ReaderPool._dispatch` can return the worker's future on a successful first scan, provided every rejection path — unresolved runtime, closed database, `selectBytes` inside a transaction, closed pool — stays on an `async` sibling or an explicit `Future.error`, because those failures are delivered today as failed futures and a synchronous throw would be a silent API change. Under that split all 503 tests pass, `test/reader_pool_test.dart`'s four-un-awaited-reads assertion holds, and the `conc4` / `conc8` parking guards, the `mixed6-10k` sacrifice guard and the `bytes-first8-newsql` guard all read neutral with sign flips. Peak RSS is unmoved. The exact prototype is at `archive/exp-278`, so a future runner whose denominator has changed can cherry-pick rather than rewrite.","conditions":"M1 Pro · Dart 3.12.x · full `dart test` (503 tests) plus the harness guard lanes · prototype at `archive/exp-278` · 2026-08","state":"live"},{"id":"279.1","source":"279","directions":["result-transfer-shape","stream-rerun-dispatch"],"text":"Running a read on a native POSIX thread instead of a Dart reader isolate is slower, not faster, and the primitive is not the reason. An awaited Dart isolate round trip costs 1.46 us; handing the same job to a worker thread and getting an answer back through `Dart_PostCObject_DL` costs 4.28 us parked on a condvar and 3.18 us with the worker spinning on the queue (a burned core, included so the result cannot be blamed on the wake primitive). End to end against a real database the same shape holds: `db.selectBytes()` on one row is 5.48 us against 6.43 us for the native worker (+17.3%), at 1,000 rows 246.5 against 249.3 (+1.1%), and at 5,000 rows 1239 against 1233 (-0.5%, inside the floor). Native dispatch is never faster at any size. The vehicle question is therefore closed: keeping SQLite off the calling isolate does not cost extra because a Dart isolate was chosen.","conditions":"M1 Pro · macOS 26.2 · Dart 3.12.2 · AOT (`dart build cli`) · 6 order-flipped lane-isolated passes for the mechanism lanes, 4 for the end-to-end pair, 11 samples x 2,000 round trips (60-2,000 end to end) · one native worker thread · prototype at `archive/exp-279` · 2026-08","state":"live"},{"id":"279.2","source":"279","directions":["result-transfer-shape","stream-rerun-dispatch"],"text":"The 2-3 us by which native dispatch loses is the cross-thread wake, not the native port. A post issued from the calling thread itself, so the main isolate never sleeps between issuing and receiving, costs 0.67 us — `Dart_PostCObject_DL` delivery plus one event-loop turn. Everything above that in the native lanes is the OS scheduling round trip, and the Dart VM performs the equivalent handoff in both directions for 1.46 us. This is the number that makes the rejection conditional rather than permanent: a runtime or SDK where a foreign thread can wake a sleeping isolate cheaply would change the arithmetic, and nothing else in the mechanism would have to change.","conditions":"M1 Pro · macOS 26.2 · Dart 3.12.2 · AOT · 6 order-flipped lane-isolated passes, 11 samples x 2,000 round trips · 2026-08","edges":[{"type":"dependsOn","target":"279.1"}],"state":"live","restsOn":["279.1"]},{"id":"279.3","source":"279","directions":["result-transfer-shape","stream-rerun-dispatch"],"text":"A point read's cross-isolate transport is 3.22 us — about half of claim 265.1's 6.3 us hop. Measured with no SQLite and no resqlite code, one persistent echo isolate, changing only what crosses the boundary: an int each way is 1.46 us, a `SelectRequest`-shaped object outbound adds 0.50 us, a point read's reply shape inbound (one row of six cells, six column names, the `(result, sacrificed, error)` envelope, pre-built on the worker) adds 1.74 us, and both together in one trip are 3.22 us — less than the 3.70 us the parts sum to, because some of what each shape costs is per-trip rather than per-payload, which is why the combined lane exists. The remaining ~3.1 us of the hop is resqlite's own per-request work on the two sides of the messages — pool bookkeeping and the row-size memory lookup, request construction, the worker's `setBusy` bracket and request dispatch, the completion handler chain, blob materialization — none of which a transport change touches. Any future candidate in this direction should be aimed at that half; the messages have at most 3.22 us in them.","conditions":"M1 Pro · macOS 26.2 · Dart 3.12.2 · AOT · 6 order-flipped lane-isolated passes, 11 samples x 2,000 round trips · `benchmark/experiments/isolate_transport_price.dart` · reply shape uses plain lists rather than `Row` facades, so it is a floor for the reply leg · 2026-08","edges":[{"type":"refines","target":"265.1"}],"state":"live"},{"id":"279.4","source":"279","directions":["result-transfer-shape","stream-rerun-dispatch"],"text":"What `SendPort.send` charges for a bulk payload is its backing, not its size. Byte-for-byte identical 256 KB costs 9.01 us to send as a view over malloc'd memory and 43.06 us as an ordinary heap `Uint8List` — 4.8x, reproduced in every pass of two collections with the two lanes differing in nothing else. This is the measurement behind exp 174's choice to send a `Uint8List` view over the reader's persistent `json_buf` rather than materialize the result first, and it generalises past `selectBytes`: any path that assembles bytes on the Dart heap before sending them pays roughly five times the transfer. It is the bulk-payload counterpart to claim 245.1's copy-per-slot rule for result structure.","conditions":"M1 Pro · macOS 26.2 · Dart 3.12.2 · AOT · 256 KB payload, 4 order-flipped passes on the full harness plus 6 on the retained one, 11 samples x 2,000 round trips · 2026-08","edges":[{"type":"validates","target":"174.1"}],"state":"live"},{"id":"279.5","source":"279","directions":["result-transfer-shape","stream-rerun-dispatch"],"text":"Copying is a wash between the two transports, so external typed data buys only what it saves by not copying at all — and that variant is not implementable. A malloc plus a 256 KB `memcpy` on the native side costs 6.28 us (`nport-bytes` 11.91 minus `nport-bytes-nocopy` 5.63); the VM's copy of the same view costs 7.55 us (`iso-bytes` 9.01 minus `iso-echo` 1.46). The realistic native variant therefore loses by 2.90 us, which is its dispatch penalty and nothing else. Posting the buffer itself with no copy is 3.38 us faster than the shipped path, but making that real means handing `json_buf` to the main isolate and giving the connection a fresh one, forfeiting the buffer reuse exp 174 measured as decisive (a `NativeFinalizer` zero-copy transfer was 14-24% slower at every size) and the shrink-and-reclaim policy exp 183 built on it. The prize is 1.4% of a 1,000-row `selectBytes` against a fixed dispatch tax on every small read.","conditions":"M1 Pro · macOS 26.2 · Dart 3.12.2 · AOT · 256 KB payload, 6 order-flipped lane-isolated passes · subtractions across lanes measured in the same collection · 2026-08","edges":[{"type":"dependsOn","target":"279.1"},{"type":"validates","target":"174.1"}],"state":"live","restsOn":["279.1"]}]};
const PAGES = [{"id":"boundary","section":"architecture","zone":"boundary","kicker":"isolate boundary","name":"Cross-isolate transfer","summary":"Dart isolates share no mutable state. That is the language's data-race-free guarantee, and it is also resqlite's central design constraint: every query result must travel from a worker isolate to main, and every write parameter from main to the writer.","dirs":["result-transfer-shape"],"feeds":["readers","writer"],"diagram":"boundary","sections":[{"lede":true,"ps":["Dart isolates share no mutable state. That is the language's data-race-free guarantee, and it is also resqlite's central design constraint: every query result must travel from a worker isolate to main, and every write parameter from main to the writer. Nothing crosses for free — but the costs differ by orders of magnitude depending on *what* is crossing, and the entire read and write path is shaped around knowing which is which.","The rule that governs everything below: **bytes for mutable payloads, slots for structure.**"]},{"h":"What actually costs what","ps":["Since Dart 2.15, isolates spawned together live in one isolate group sharing a managed heap. A `SendPort.send` inside that group is not a serialize-and-rebuild round trip; it is a single object-graph traversal on the sending isolate that copies some things and shares others.","Immutable values — strings, numbers, canonical objects — are shared by pointer. They are never copied, at any size. A 400 KB string adds roughly nothing to a send [[245.1]]. Mutable objects are deep-copied: the flat values array underneath a result is copied slot by slot, and a `Uint8List` is copied byte for byte.","So a result's transfer cost tracks the size of its *mutable structure*, not the size of its data. Two results of identical byte weight can differ tenfold in transfer cost depending on whether those bytes live in shared strings or in copied slots. This is the single most counterintuitive fact about the boundary, and getting it wrong produced a real routing bug that shipped for months."]},{"h":"Four routes across","ps":["**Share.** Strings and numbers ride along free in either direction. Nothing to decide.","**Copy the structure.** The default. `send()` walks the result graph, copies the mutable flat values list and its wrapper, and shares every immutable leaf inside it. Cost scales with slot count — rows times columns.","**Move the bytes.** A `Uint8List` of 256 KB or more is wrapped in a `TransferableTypedData` before it crosses. This does not remove the one mandatory copy — the bytes have to leave SQLite's memory regardless — it changes *where that copy lands*: into malloc'd external memory the garbage collector never traces, rather than onto the shared heap. The send then becomes a constant-time ownership move and the receiver materializes a zero-copy view [[234.1]] [[236.1]]. Wrapping is identity-keyed, so a caller passing the same buffer into five parameter positions ships one buffer, not five [[243.1]].","**Hand over the heap.** For results whose *structure* is enormous, the worker calls `Isolate.exit` and dies: the entire result graph transfers without a copy, and the pool respawns a replacement in the background. This is not free either — the VM still walks the graph to validate sendability, which costs a fixed ~47 µs premium plus a per-slot walk. But that walk is cheaper per slot than a copy, so past roughly 48k slots the exit wins on intrinsic transfer alone [[245.2]]."]},{"h":"Why the trigger counts slots, not bytes","ps":["For most of resqlite's life the sacrifice decision keyed on estimated bytes: results over 256 KB handed off the heap, discounting any cells already wrapped for transfer [[was:236.2]]. For all-integer results that heuristic is accurate — eight bytes per cell means bytes and slots are proportional — and it went unchallenged because the common case looked right.","It was wrong for exactly the case where it mattered most. A result of four rows holding a 100 KB text column is 400 KB by weight and four slots by structure. Those strings were going to be *shared* on send, costing nothing. The byte trigger read the result as expensive, killed the reader isolate, and paid a respawn to avoid a copy that was never going to happen — on every such read.","Re-routing the trigger onto mutable slot count fixed the misroute and deleted the byte accounting entirely: that shape stopped sacrificing and got 31% faster, while every numeric and structural shape kept byte-for-byte identical routing [[246.1]]. The threshold sits at 32k slots ([[code:sacrificeSlotThreshold=32768]]) — deliberately below the ~48k intrinsic crossover [[245.2]], because at the real pool the send's copy also blocks the worker from accepting its next request, which pulls the practical crossover earlier [[244.1]]."]},{"h":"Why sacrifice survives at all","ps":["Killing a worker to return a result looks profligate, and it was repeatedly suspected of starving the pool. Measured at production pool size with a barrier burst, the opposite holds: the lane with sacrifice *disabled* queued longest, because a send's per-slot copy occupies a worker longer than an exit plus an overlapped respawn does [[244.1]]. Starting the replacement earlier changes nothing measurable — the respawn is not on the parked caller's critical path."]},{"h":"What we tried and rejected","ps":["The boundary's rules are narrow on purpose, and the rejections define their edges as sharply as the wins do.","Wrapping blobs in the *batch* path regressed. The wrap's benefit comes from many independent round-trips each parking a fresh allocation on the heap while the writer is mid-step; one batch round-trip has no such pattern to relieve [[237.1]].","Wrapping `selectBytes`' result bought nothing ([[bench:Select → JSON Bytes / Large payload (~650KB) / resqlite selectBytes() ~ 0.24 +-20%]]). Its bytes are already a view over a native buffer — there is no GC-heap destination to escape, so the wrap relocated one copy and added machinery [[242.1]].","And the question underneath all of these — is sacrifice worth keeping? — resisted answering for a long time because the obvious experiment is invalid. Alternating send and sacrifice inside one live pool measures a treatment that mutates the pool it runs in: each sacrifice clears caches and respawns workers, changing the conditions for the next sample. The answer only came from splitting the question into independent estimands and measuring each in isolation [[241.1]]. That methodological lesson generalized well beyond this subsystem."]}]},{"id":"api","section":"architecture","zone":"main","kicker":"main isolate","name":"Public API & streams","summary":"resqlite's public surface is deliberately small — `select`, `selectBytes`, `execute`, `executeBatch`, `transaction`, `stream` — and every call is exactly one message to a worker isolate. The design principle behind the whole library is visible in that sentence: the main isolate is a Flutter app's render thread with a 16 ms frame budget, so the API's job is to hand work away and get out of the way.","dirs":["stream-rerun-dispatch","long-text-stream-hashing"],"feeds":["boundary"],"diagram":"api","sections":[{"lede":true,"ps":["resqlite's public surface is deliberately small — `select`, `selectBytes`, `execute`, `executeBatch`, `transaction`, `stream` — and every call is exactly one message to a worker isolate. The design principle behind the whole library is visible in that sentence: the main isolate is a Flutter app's render thread with a 16 ms frame budget, so the API's job is to hand work away and get out of the way.","Two read shapes exist because two different consumers exist. `select` returns Dart maps for code that inspects rows. `selectBytes` returns JSON bytes encoded entirely in C, for code that forwards a response or writes a file and never needs Dart objects at all — at 5,000 rows it costs slightly more wall time than `select` but **zero** main-isolate time."]},{"h":"The result shape is a transfer decision","ps":["`select` does not return a list of maps. It returns a `ResultSet` over a single flat `List<Object?>` laid out row-major, with lightweight `Row` views created lazily on indexing. Callers get ordinary map ergonomics; the boundary gets a graph with almost no structural objects in it.","That choice was made for transfer, not ergonomics. `Isolate.exit` validates the object graph it hands over, and a 20,000-row result built from per-row maps reaches hundreds of thousands of internal objects — measured at roughly 38% of total query time. The flat list collapses that to the values array, one schema, and a wrapper. The same property later became the basis of the sacrifice trigger itself: slot count is both what `send` copies and what the exit walk visits, and the trigger routes on it directly ([[code:sacrificeSlotThreshold=32768]])."]},{"h":"Streams: hashing, dispatch, and elision","ps":["`stream()` turns a query into a live data source. It emits immediately, then re-emits when a write touches data the query can observe. That first emission is a guarantee rather than a timing accident: a stream resolves to a value or an error, never to silence ([[test:test/stream_test.dart#always emits its initial result@z31i]]). When a write lands while the initial query is still in flight, the rows already known to be superseded are withheld and the corrected re-query becomes the subscriber's first frame [[255.1]]. Three SQLite hooks make that possible without parsing SQL: authorizer callbacks on readers record which tables and columns a query actually read; authorizer callbacks on prepared writes record what a statement may modify; and the preupdate hook on the writer records what actually changed. Joins, views, CTEs, triggers, and cascades all work because SQLite is the one reporting.","Re-runs go through `selectIfChanged`, which compares a hash of the fresh result against the last emission and skips the decode entirely when nothing changed. That hash is computed in C inside the step loop — a −39% win over hashing in Dart, with no regression anywhere else [[075.1]]. The fold has resisted every attempt to improve it since: a wider 16-byte body is below noise at 4 KB cells, at 32 KB, and even on a single-stream 64 KB payload with pool parallelism removed to expose it [[110.1]] [[173.1]] [[181.1]]. That question is closed.","Dispatch had one real pathology and it was not where it appeared to be. A large parked-dispatcher signal looked like reader-pool starvation; it was over-dispatch upstream in the stream engine's flush queue, fixed by snapshotting worker availability once per flush and decrementing per pop [[120.1]]. After that, every measured stream workload reports zero parking.","What remains on the main isolate is worth naming precisely, because it is the next target if streams ever need more: the reader-reply port handler accounts for roughly 28% of burst wall on the heaviest overlap workload, while subscriber fan-out — the intuitive suspect — is under 1% [[136.1]]. On the writer side, SQLite-facing calls are a minority of burst wall; the residual request/response handling dominates [[147.1]].","Column-level dependency intersection is what makes wide-table streams viable: writing to a column no stream watches skips the re-query dispatch entirely, which shows up as a 3× throughput spread between disjoint and overlapping writes on a 50-stream benchmark."]},{"h":"Held in reserve","ps":["Two mechanisms work and are deliberately unshipped.","Row-level dirty precision eliminated the keyed-primary-key miss path in prototype — intersection entries dropped from 10,000 to 3 and writer-burst wall halved — but it adds per-row state to the invalidation path for a benefit only that access shape sees [[134.1]].","Off-writer checkpointing showed a 53–64% improvement in first-crossing latency once its trigger policy was fixed; the storm that killed an earlier attempt turned out to be a re-arming bug rather than anything inherent to moving the work [[250.1]].","Both are recorded with their mechanisms intact, waiting for a workload that justifies the complexity rather than for someone to rediscover them."]}]},{"id":"readers","section":"architecture","zone":"workers","kicker":"worker isolates","name":"Reader pool","summary":"Reads run on a pool of two to four persistent worker isolates, each bound to its own read-only SQLite connection against the shared WAL. The whole arrangement exists to keep a 1,000-row read at [[bench:Select → Maps / 1000 rows / resqlite select() ~ 0.","dirs":[],"feeds":["native"],"diagram":"readers","claims":["120.1","239.1","244.1","246.1","236.1","183.1","174.1"],"sections":[{"lede":true,"ps":["Reads run on a pool of two to four persistent worker isolates, each bound to its own read-only SQLite connection against the shared WAL. The whole arrangement exists to keep a 1,000-row read at [[bench:Select → Maps / 1000 rows / resqlite select() ~ 0.319 +-20%]] ms of wall time while charging the main isolate only [[bench:Select → Maps / 1000 rows / resqlite select() [main] ~ 0.051 +-30%]] ms of it — the number that actually competes with a frame. The pool exists to avoid a cost that is invisible until you look for it: spawning an isolate per query costs about 0.08 ms, which on small reads is most of the query. Keeping workers alive amortizes that to zero, and keeping the *C* state alive — connections, prepared-statement caches — means even a worker's death does not throw away the expensive parts.","Pool size is measured, not guessed: throughput plateaus at four workers, and going wider actively regresses stream-heavy workloads because each completed re-query queues another microtask ahead of pending writes."]},{"h":"Dispatch, parking, and the lifecycle","ps":["Dispatch is round-robin with busy tracking. A worker is available when it is alive, has published its command port, and has no query in flight. When every worker is busy the caller parks on a FIFO waite
