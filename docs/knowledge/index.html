o · 2026-05 · backfilled 2026-07","state":"live"},{"id":"125.1","source":"125","directions":["parameter-encoding-and-binding"],"text":"A guarded ASCII fast path removes per-string UTF-8 allocation in wide batch parameter packing without changing the public API or weakening Unicode fallback.","conditions":"M1 Pro · 2026-05 · backfilled 2026-07","state":"live"},{"id":"126.1","source":"126","directions":["parameter-encoding-and-binding"],"text":"Direct UTF-8 payload writing removes the same per-string allocation for non-ASCII batches (focused Unicode 10k x20 -13.5%, emoji -27.8%), with Dart-compatible surrogate handling private to the encoder.","conditions":"M1 Pro · 2026-05 · backfilled 2026-07","state":"live"},{"id":"134.1","source":"134","directions":["stream-rerun-dispatch"],"text":"Row-level dirty precision can remove the keyed-PK miss-path cost (intersection_entries 10000 -> 3; writer-burst wall 25.54 -> 12.45 ms) — rejected as shipped complexity, preserved as potential.","conditions":"M1 Pro · prototype · 2026-05 · backfilled 2026-07","state":"live"},{"id":"136.1","source":"136","directions":["stream-rerun-dispatch","measurement-system"],"text":"On A11c overlap the reader-worker port handler is the largest remaining reachable main-isolate slice (28.57% of burst+drain wall); subscriber-fanout emit is <1% and is not the optimization target.","conditions":"M1 Pro · profile · 2026-05 · backfilled 2026-07","state":"live"},{"id":"143.1","source":"143","directions":["measurement-system"],"text":"Pinned Tracelite profile runs produce decision-useful structured evidence: point queries are median dispatch-bound, merge rounds are work-bound, and allocation/RSS costs hide behind wall time alone.","conditions":"M1 Pro · profile · 2026-06 · backfilled 2026-07","state":"live"},{"id":"144.1","source":"144","directions":["sqlite-version-and-build-config"],"text":"The 3.53.0 default-FP-rounding hazard does not reach resqlite output (REAL values never go through sqlite3_column_text); the vendoring bump waits on a .2 point release per exp 090's policy.","conditions":"2026-06 · backfilled 2026-07","state":"live"},{"id":"147.1","source":"147","directions":["stream-rerun-dispatch","measurement-system"],"text":"SQLite-facing write calls are a minority of writer-side burst wall on active stream workloads (A11c 9.4%, keyed-PK 18.1%); residual writer/request wall is the largest bucket after subtracting SQLite and invalidation.","conditions":"M1 Pro · profile · 2026-06 · backfilled 2026-07","state":"live"},{"id":"169.1","source":"169","directions":["measurement-system"],"text":"The Tracelite workload-summary explanation layer emits the interpretation exp 143 had to recover manually, and validates stable insight IDs so a thin artifact fails loudly instead of looking complete.","conditions":"tooling · 2026-06 · backfilled 2026-07","state":"live"},{"id":"172.1","source":"172","directions":["long-text-stream-hashing","measurement-system"],"text":"The 8-byte FNV fold scales acceptably to mixed 32KB TEXT+BLOB long payloads (3.446 ms median beside 2.356 ms for 4KB TEXT), and the streaming suite now covers that shape.","conditions":"M1 Pro · 2026-06 · backfilled 2026-07","state":"live"},{"id":"173.1","source":"173","directions":["long-text-stream-hashing"],"text":"At 32KB cells on a pool-of-4 fleet the byte-stream fold is no longer the dominant wall component; unrolling beyond the 8-byte FNV body is below noise. Hash-loop unrolling on this shape is closed.","conditions":"M1 Pro · pool-4 · 2026-06 · backfilled 2026-07","state":"live"},{"id":"174.1","source":"174","directions":["result-transfer-shape"],"text":"selectBytes sends a Uint8List view over the reader's native json_buf and never sacrifices; the single send copy is the floor for this path.","conditions":"M1 Pro · AOT · 2026-03","state":"live"},{"id":"177.1","source":"177","directions":["measurement-system"],"text":"Phase-ordered A/B gates confound code deltas with time-correlated drift; cvPct + classifyDriftFlag encode the CV-asymmetry and order-flip sign-reversal signatures so every A/B no longer re-derives them by hand.","conditions":"methodology · 2026-06 · backfilled 2026-07","state":"live"},{"id":"178.1","source":"178","directions":["measurement-system"],"text":"A chartable experiment with no linked benchmark run and no Benchmark Run opt-out silently drops off the chart; the linker now errors, closing the gap that left ~18 experiments unmapped.","conditions":"tooling · 2026-06 · backfilled 2026-07","state":"live"},{"id":"181.1","source":"181","directions":["long-text-stream-hashing"],"text":"Removing reader-pool parallelism (one-reader runtime, 64x64KB payloads) still shows no 16-byte FNV win over the 8-byte fold; the single-stream candidate from exp 173 is consumed.","conditions":"M1 Pro · single reader · 2026-06 · backfilled 2026-07","state":"live"},{"id":"183.1","source":"183","directions":["result-transfer-shape"],"text":"selectBytes' bounded RSS high-water becomes pathological under concurrent large bursts (8 x 8MB pins 32MB for the connection's life); the 1MB-cap + 256KB last-len reclaim makes the policy safe, and readerJsonBufHighWaterBytes makes it observable.","conditions":"M1 Pro · 2026-06 · backfilled 2026-07","state":"live"},{"id":"186.1","source":"186","directions":["parameter-encoding-and-binding"],"text":"The single-row direct-ASCII allocateParams rewrite is materially beneficial once bound text crosses mid-tens-of-KB (-15% at 16KB to -32% at larger sizes); encoder isolation separates the mechanism question from workload materiality.","conditions":"M1 Pro · 2026-06 · backfilled 2026-07","state":"live"},{"id":"187.1","source":"187","directions":["parameter-encoding-and-binding"],"text":"Direct UTF-8 packing for single-row non-ASCII params removes one temp allocation plus one copy per string; CJK rows improve ~31-39% from 16KB through 1MB.","conditions":"M1 Pro · 2026-06 · backfilled 2026-07","state":"live"},{"id":"189.1","source":"189","directions":["transaction-control-paths"],"text":"Savepoint naming compression moves best-case control rows but the representative nested-write fanout does not reproduce across the order flip — rejected on the load-bearing row.","conditions":"M1 Pro · 2026-06 · backfilled 2026-07","state":"live"},{"id":"212.1","source":"212","directions":["transaction-control-paths"],"text":"Lazy nested-savepoint materialization only helps empty nested bodies; fusing SAVEPOINT + first execute regresses the meaningful nested-write shape in both pass orders.","conditions":"M1 Pro · 2026-07 · backfilled 2026-07","state":"live"},{"id":"213.1","source":"213","directions":["transaction-control-paths"],"text":"The per-execute round-trip floor inside db.transaction() is mechanically removable for Future.wait bursts, but the pattern has no idiomatic case in the public API — bulk atomic writes belong on executeBatch. Rejected on pattern, not numbers.","conditions":"M1 Pro · 2026-07 · backfilled 2026-07","state":"live"},{"id":"229.1","source":"229","directions":["result-transfer-shape"],"text":"native/resqlite.c is no longer ISA-agnostic-scalar-only: a NEON vqtbl4q_u8 base64 kernel (~2x on 4KB payloads) ships behind an __aarch64__ gate with the scalar 12-bit-LUT encoder as fallback. Keep SIMD kernels noinline so the small-input scalar path's code gen is untouched.","conditions":"M1 Pro · AOT · 2026-07 · backfilled 2026-07","state":"live"},{"id":"234.1","source":"234","directions":["parameter-encoding-and-binding"],"text":"A mutable Uint8List param is the one write value SendPort.send truly copies; wrapping params >= 256 KB in TransferableTypedData lands that one copy in external memory instead of on the GC heap (~15-20% on 256-512 KB single-row inserts).","conditions":"M1 Pro · AOT · 2026-07","state":"live"},{"id":"236.1","source":"236","directions":["result-transfer-shape"],"text":"Blob result cells >= 256 KB decode straight into TransferableTypedData (native->external, one copy) and cross by ownership move; main-isolate receive boundaries materialize them back to Uint8List views. Blob-heavy reads 3-6x faster; tx.select ~6-7x.","conditions":"M1 Pro · AOT · 2026-07","state":"live"},{"id":"236.2","source":"236","directions":["result-transfer-shape"],"text":"The sacrifice decision weighs estimatedBytes - transferableBytes so TTD-wrapped cells do not force a sacrifice.","conditions":"byte-trigger era · M1 Pro · 2026-07","state":"superseded","by":["246.1"]},{"id":"237.1","source":"237","directions":["parameter-encoding-and-binding"],"text":"Exp 234's blob-transfer win does not extend to executeBatch: wrapping per-set blobs is a reproduced regression. The mechanism is many independent write round-trips parking fresh blobs on the young heap — one batch round-trip does not have it.","conditions":"M1 Pro · AOT · 2026-07 · backfilled 2026-07","state":"live"},{"id":"239.1","source":"239","directions":["stream-rerun-dispatch"],"text":"Batching only already-parked plain selects in pool-sharded envelopes (capped at four) improves 20 point reads ~-26/-33% without a new public API; sharding avoids exp 209's one-worker large-read collapse. Rejected as shipped complexity, preserved as potential.","conditions":"M1 Pro · 2026-07 · backfilled 2026-07","state":"live"},{"id":"241.1","source":"241","directions":["result-transfer-shape"],"text":"Sacrifice is a state-changing treatment (kills a worker, respawns, clears caches): it cannot be A/B'd in place inside one live pool. Send-vs-exit decomposes into distinct estimands — intrinsic transfer, pool capacity, decode — that must be measured separately.","conditions":"methodology · 2026-07","state":"live"},{"id":"242.1","source":"242","directions":["result-transfer-shape"],"text":"A TransferableTypedData wrap helps iff the payload's default SendPort destination is the GC heap; a native-backed view gains nothing — the wrap relocates the one copy and adds machinery.","conditions":"M1 Pro · AOT · 2026-07","edges":[{"type":"validates","target":"174.1"}],"state":"live"},{"id":"243.1","source":"243","directions":["parameter-encoding-and-binding"],"text":"Blob-param wrapping is identity-keyed (one wrapper per unique buffer, referenced at every position, materialized once per envelope), so caller aliasing survives the hop instead of exploding into N external copies (~27x at N=32 under per-occurrence wrapping).","conditions":"M1 Pro · AOT · 2026-07","edges":[{"type":"refines","target":"234.1"}],"state":"live"},{"id":"244.1","source":"244","directions":["result-transfer-shape"],"text":"Sacrifice opens no pool-capacity hole at the production pool size: the no-sacrifice lane had the highest parked queue-wait (~+19%), because send's copy blocks the worker longer than Isolate.exit plus an overlapped respawn. Eager respawn measured inert.","conditions":"M1 Pro · pool-4 · barrier burst · 2026-07","edges":[{"type":"refines","target":"241.1"}],"state":"live"},{"id":"245.1","source":"245","directions":["result-transfer-shape"],"text":"SendPort.send's cost tracks the mutable flat-list slot count, not payload bytes: strings and numbers are shared by reference (a 400 KB string adds ~0 us), while the values array is copied per slot.","conditions":"M1 Pro · AOT · process-isolated barrier · 2026-07","edges":[{"type":"refines","target":"241.1"}],"state":"live"},{"id":"245.2","source":"245","directions":["result-transfer-shape"],"text":"Isolate.exit is zero-copy with a ~47 us fixed premium; its sendability walk also scales with slots, just more gently than send's copy. Intrinsic crossover ~48k slots.","conditions":"M1 Pro · AOT · process-isolated barrier · 2026-07","state":"live"},{"id":"246.1","source":"246","directions":["result-transfer-shape"],"text":"The sacrifice trigger routes on mutable slot count (values.length > 32k, the all-integer equivalent of 256 KB); the byte accounting is deleted. Bytes for mutable payloads, slots for structure. Big-TEXT misroute fixed: 131->91 us, 1.00->0.00 sacrifices/select.","conditions":"M1 Pro · AOT · 2026-07","edges":[{"type":"supersedes","target":"236.2"},{"type":"refines","target":"245.1"}],"state":"live"},{"id":"250.1","source":"250","directions":["stream-rerun-dispatch"],"text":"Exp 233's checkpoint storm was a trigger-policy failure, not inherent to off-writer PASSIVE work: observed-reset/high-water re-arming fixes the storm and first threshold-crossing p50 improves ~53-64%. Rejected for now, mechanism preserved.","conditions":"M1 Pro · 2026-07 · backfilled 2026-07","state":"live"},{"id":"255.1","source":"255","directions":["stream-rerun-dispatch"],"text":"A stream always resolves to an emission or an error, never silence. When a write dirties an entry mid-initial-query the comparison baseline is poisoned so the catch-up re-query is guaranteed to emit, and that emission is the stream's first. Suppressing the initial emission while leaving the baseline set to the rows it replaced is what stranded streams permanently silent.","conditions":"M1 Pro · deterministic regression test (40k-row seed) · 2026-07","edges":[{"type":"refines","target":"256.1"}],"state":"live"},{"id":"255.2","source":"255","directions":["stream-rerun-dispatch"],"text":"An intermittent test failure reproducing at ~1-in-3 is a bug, not a flake. This one was dismissed three times in one session, partly because the test's own comment asserted the shape could not flake — a false confidence marker actively redirects investigation, and reading the actual failure text ('emitted x Stream closed') would have identified the mechanism immediately.","conditions":"methodology · 2026-07","state":"live"},{"id":"255.3","source":"255","directions":["stream-rerun-dispatch"],"text":"Clearing a stream's comparison baseline must clear the row count, not the hash: selectIfChanged requires both to match, and an empty result legitimately hashes to 0, so a hash sentinel of 0 is reachable rather than impossible and would leave empty-result streams silent. The row count is nullable end to end, with null meaning 'no baseline' — which also retired a pre-existing magic -1 in the request type.","conditions":"review finding · guarded by the empty-result regression test · 2026-07","state":"live"},{"id":"256.1","source":"256","directions":["stream-rerun-dispatch"],"text":"A stream never emits rows it already knows a write superseded: when the initial query is dirtied mid-flight the comparison baseline is poisoned and only the corrected result is emitted. This costs ~0.4-1.4 ms of time-to-correct-value and removes the stale frame that emit-then-correct rendered on every raced stream; unraced streams are unaffected.","conditions":"M1 Pro · 1k/20k/60k seed race windows · 12 samples/shape · 2026-07","state":"live"},{"id":"257.1","source":"257","directions":["stream-rerun-dispatch"],"text":"A one-call native interpreter that preserves independent autocommits does not clear the writer-burst bar: homogeneous inserts improved 17.7% then only 3.6% across the order flip, while integer-only no-op updates regressed 17.7% and 13.9%.","conditions":"M1 Pro · Dart 3.12.2 · 256-call bursts · 5120 autocommits/round · 2026-07","state":"live"},{"id":"258.1","source":"258","directions":["result-transfer-shape"],"text":"Storing numeric result columns as typed arrays (Int64List/Float64List) instead of boxing into a flat List<Object?> makes worker-side result build 60-90% faster (largest on REAL: doubles always box, ~10x on 10k x 20 REAL). This win is worker wall, off the main isolate.","conditions":"M-series · AOT · worker->main SendPort A/B · two order-flipped passes · 2026-07","state":"live"},{"id":"258.2","source":"258","directions":["result-transfer-shape"],"text":"A columnar container's transfer win (73-91% cheaper hop vs the boxed flat list) does not move production's main-isolate metric: results large enough for transfer to matter (>32768 structural slots) already zero-copy via Isolate.exit, and sub-threshold results save only tens of microseconds, below the select() round-trip floor. The broad columnar rewrite is therefore rejected.","conditions":"M-series · AOT · worker->main SendPort A/B · 2026-07","edges":[{"type":"refines","target":"245.1"}],"state":"live"},{"id":"258.3","source":"258","directions":["result-transfer-shape"],"text":"The one real primary-metric signal from columnar storage is main-isolate integer consume ~2x faster (Int64List sequential access, no covariant-load barrier, vs pointer-chasing a List<Object?> of Smis), reproduced -48 to -52% on every integer lane in both orders. REAL consume is only neutral (box-on-access nearly cancels the locality gain) and columnar never regresses consume, refuting exp 081's box-on-access fear for the columnar (not binary-slab) shape.","conditions":"M-series · AOT · main-isolate full-scan as Object? · 2026-07","state":"live"}]};
const PAGES = [{"id":"boundary","section":"architecture","zone":"boundary","kicker":"isolate boundary","name":"Cross-isolate transfer","summary":"Dart isolates share no mutable state. That is the language's data-race-free guarantee, and it is also resqlite's central design constraint: every query result must travel from a worker isolate to main, and every write parameter from main to the writer.","dirs":["result-transfer-shape"],"feeds":["readers","writer"],"diagram":"boundary","sections":[{"lede":true,"ps":["Dart isolates share no mutable state. That is the language's data-race-free guarantee, and it is also resqlite's central design constraint: every query result must travel from a worker isolate to main, and every write parameter from main to the writer. Nothing crosses for free — but the costs differ by orders of magnitude depending on *what* is crossing, and the entire read and write path is shaped around knowing which is which.","The rule that governs everything below: **bytes for mutable payloads, slots for structure.**"]},{"h":"What actually costs what","ps":["Since Dart 2.15, isolates spawned together live in one isolate group sharing a managed heap. A `SendPort.send` inside that group is not a serialize-and-rebuild round trip; it is a single object-graph traversal on the sending isolate that copies some things and shares others.","Immutable values — strings, numbers, canonical objects — are shared by pointer. They are never copied, at any size. A 400 KB string adds roughly nothing to a send [[245.1]]. Mutable objects are deep-copied: the flat values array underneath a result is copied slot by slot, and a `Uint8List` is copied byte for byte.","So a result's transfer cost tracks the size of its *mutable structure*, not the size of its data. Two results of identical byte weight can differ tenfold in transfer cost depending on whether those bytes live in shared strings or in copied slots. This is the single most counterintuitive fact about the boundary, and getting it wrong produced a real routing bug that shipped for months."]},{"h":"Four routes across","ps":["**Share.** Strings and numbers ride along free in either direction. Nothing to decide.","**Copy the structure.** The default. `send()` walks the result graph, copies the mutable flat values list and its wrapper, and shares every immutable leaf inside it. Cost scales with slot count — rows times columns.","**Move the bytes.** A `Uint8List` of 256 KB or more is wrapped in a `TransferableTypedData` before it crosses. This does not remove the one mandatory copy — the bytes have to leave SQLite's memory regardless — it changes *where that copy lands*: into malloc'd external memory the garbage collector never traces, rather than onto the shared heap. The send then becomes a constant-time ownership move and the receiver materializes a zero-copy view [[234.1]] [[236.1]]. Wrapping is identity-keyed, so a caller passing the same buffer into five parameter positions ships one buffer, not five [[243.1]].","**Hand over the heap.** For results whose *structure* is enormous, the worker calls `Isolate.exit` and dies: the entire result graph transfers without a copy, and the pool respawns a replacement in the background. This is not free either — the VM still walks the graph to validate sendability, which costs a fixed ~47 µs premium plus a per-slot walk. But that walk is cheaper per slot than a copy, so past roughly 48k slots the exit wins on intrinsic transfer alone [[245.2]]."]},{"h":"Why the trigger counts slots, not bytes","ps":["For most of resqlite's life the sacrifice decision keyed on estimated bytes: results over 256 KB handed off the heap. For all-integer results that heuristic is accurate — eight bytes per cell means bytes and slots are proportional — and it went unchallenged because the common case looked right.","It was wrong for exactly the case where it mattered most. A result of four rows holding a 100 KB text column is 400 KB by weight and four slots by structure. Those strings were going to be *shared* on send, costing nothing. The byte trigger read the result as expensive, killed the reader isolate, and paid a respawn to avoid a copy that was never going to happen — on every such read.","Re-routing the trigger onto mutable slot count fixed the misroute and deleted the byte accounting entirely: that shape stopped sacrificing and got 31% faster, while every numeric and structural shape kept byte-for-byte identical routing [[246.1]]. The threshold sits at 32k slots — deliberately below the ~48k intrinsic crossover, because at the real pool the send's copy also blocks the worker from accepting its next request, which pulls the practical crossover earlier [[236.2]]."]},{"h":"Why sacrifice survives at all","ps":["Killing a worker to return a result looks profligate, and it was repeatedly suspected of starving the pool. Measured at production pool size with a barrier burst, the opposite holds: the lane with sacrifice *disabled* queued longest, because a send's per-slot copy occupies a worker longer than an exit plus an overlapped respawn does [[244.1]]. Starting the replacement earlier changes nothing measurable — the respawn is not on the parked caller's critical path."]},{"h":"What we tried and rejected","ps":["The boundary's rules are narrow on purpose, and the rejections define their edges as sharply as the wins do.","Wrapping blobs in the *batch* path regressed. The wrap's benefit comes from many independent round-trips each parking a fresh allocation on the heap while the writer is mid-step; one batch round-trip has no such pattern to relieve [[237.1]].","Wrapping `selectBytes`' result bought nothing. Its bytes are already a view over a native buffer — there is no GC-heap destination to escape, so the wrap relocated one copy and added machinery [[242.1]].","And the question underneath all of these — is sacrifice worth keeping? — resisted answering for a long time because the obvious experiment is invalid. Alternating send and sacrifice inside one live pool measures a treatment that mutates the pool it runs in: each sacrifice clears caches and respawns workers, changing the conditions for the next sample. The answer only came from splitting the question into independent estimands and measuring each in isolation [[241.1]]. That methodological lesson generalized well beyond this subsystem."]}]},{"id":"api","section":"architecture","zone":"main","kicker":"main isolate","name":"Public API & streams","summary":"resqlite's public surface is deliberately small — `select`, `selectBytes`, `execute`, `executeBatch`, `transaction`, `stream` — and every call is exactly one message to a worker isolate. The design principle behind the whole library is visible in that sentence: the main isolate is a Flutter app's render thread with a 16 ms frame budget, so the API's job is to hand work away and get out of the way.","dirs":["stream-rerun-dispatch","long-text-stream-hashing"],"feeds":["boundary"],"diagram":"api","sections":[{"lede":true,"ps":["resqlite's public surface is deliberately small — `select`, `selectBytes`, `execute`, `executeBatch`, `transaction`, `stream` — and every call is exactly one message to a worker isolate. The design principle behind the whole library is visible in that sentence: the main isolate is a Flutter app's render thread with a 16 ms frame budget, so the API's job is to hand work away and get out of the way.","Two read shapes exist because two different consumers exist. `select` returns Dart maps for code that inspects rows. `selectBytes` returns JSON bytes encoded entirely in C, for code that forwards a response or writes a file and never needs Dart objects at all — at 5,000 rows it costs slightly more wall time than `select` but **zero** main-isolate time."]},{"h":"The result shape is a transfer decision","ps":["`select` does not return a list of maps. It returns a `ResultSet` over a single flat `List<Object?>` laid out row-major, with lightweight `Row` views created lazily on indexing. Callers get ordinary map ergonomics; the boundary gets a graph with almost no structural objects in it.","That choice was made for transfer, not ergonomics. `Isolate.exit` validates the object graph it hands over, and a 20,000-row result built from per-row maps reaches hundreds of thousands of internal objects — measured at roughly 38% of total query time. The flat list collapses that to the values array, one schema, and a wrapper. The same property later became the basis of the sacrifice trigger itself: slot count is both what `send` copies and what the exit walk visits."]},{"h":"Streams: hashing, dispatch, and elision","ps":["`stream()` turns a query into a live data source. It emits immediately, then re-emits when a write touches data the query can observe. Three SQLite hooks make that possible without parsing SQL: authorizer callbacks on readers record which tables and columns a query actually read; authorizer callbacks on prepared writes record what a statement may modify; and the preupdate hook on the writer records what actually changed. Joins, views, CTEs, triggers, and cascades all work because SQLite is the one reporting.","Re-runs go through `selectIfChanged`, which compares a hash of the fresh result against the last emission and skips the decode entirely when nothing changed. That hash is computed in C inside the step loop — a −39% win over hashing in Dart, with no regression anywhere else [[075.1]]. The fold has resisted every attempt to improve it since: a wider 16-byte body is below noise at 4 KB cells, at 32 KB, and even on a single-stream 64 KB payload with pool parallelism removed to expose it [[110.1]] [[173.1]] [[181.1]]. That question is closed.","Dispatch had one real pathology and it was not where it appeared to be. A large parked-dispatcher signal looked like reader-pool starvation; it was over-dispatch upstream in the stream engine's flush queue, fixed by snapshotting worker availability once per flush and decrementing per pop [[120.1]]. After that, every measured stream workload reports zero parking.","What remains on the main isolate is worth naming precisely, because it is the next target if streams ever need more: the reader-reply port handler accounts for roughly 28% of burst wall on the heaviest overlap workload, while subscriber fan-out — the intuitive suspect — is under 1% [[136.1]]. On the writer side, SQLite-facing calls are a minority of burst wall; the residual request/response handling dominates [[147.1]].","Column-level dependency intersection is what makes wide-table streams viable: writing to a column no stream watches skips the re-query dispatch entirely, which shows up as a 3× throughput spread between disjoint and overlapping writes on a 50-stream benchmark."]},{"h":"Held in reserve","ps":["Two mechanisms work and are deliberately unshipped.","Row-level dirty precision eliminated the keyed-primary-key miss path in prototype — intersection entries dropped from 10,000 to 3 and writer-burst wall halved — but it adds per-row state to the invalidation path for a benefit only that access shape sees [[134.1]].","Off-writer checkpointing showed a 53–64% improvement in first-crossing latency once its trigger policy was fixed; the storm that killed an earlier attempt turned out to be a re-arming bug rather than anything inherent to moving the work [[250.1]].","Both are recorded with their mechanisms intact, waiting for a workload that justifies the complexity rather than for someone to rediscover them."]}]},{"id":"readers","section":"architecture","zone":"workers","kicker":"worker isolates","name":"Reader pool","summary":"Reads run on a pool of two to four persistent worker isolates, each bound to its own read-only SQLite connection against the shared WAL. The pool exists to avoid a cost that is invisible until you look for it: spawning an isolate per query costs about 0.","dirs":[],"feeds":["native"],"diagram":"readers","claims":["120.1","239.1","244.1","246.1","236.1","183.1","174.1"],"sections":[{"lede":true,"ps":["Reads run on a pool of two to four persistent worker isolates, each bound to its own read-only SQLite connection against the shared WAL. The pool exists to avoid a cost that is invisible until you look for it: spawning an isolate per query costs about 0.08 ms, which on small reads is most of the query. Keeping workers alive amortizes that to zero, and keeping the *C* state alive — connections, prepared-statement caches — means even a worker's death does not throw away the expensive parts.","Pool size is measured, not guessed: throughput plateaus at four workers, and going wider actively regresses stream-heavy workloads because each completed re-query queues another microtask ahead of pending writes."]},{"h":"Dispatch, parking, and the lifecycle","ps":["Dispatch is round-robin with busy tracking. A worker is available when it is alive, has published its command port, and has no query in flight. When every worker is busy the caller parks on a FIFO waiter, and each worker-free event wakes exactly one — not a shared future every parked dispatcher observes, which is how a wake storm starts.","The interesting part of the lifecycle is what happens when a result is large enough to sacrifice. The worker calls `Isolate.exit` with the result, and its slot goes unavailable until a replacement isolate spawns, opens its connection, and publishes a new port. Both the payload and the exit notification arrive on the same port, so FIFO ordering guarantees the result is processed before the death is — which is what makes the whole scheme race-free rather than merely usually-correct."]},{"h":"Why the respawn is affordable","ps":["The obvious worry is that sacrifice starves the pool: kill a quarter of your read capacity on every large result and queueing should get worse. It does not, and the measurement that settles it is a barrier burst — eight identical large reads released simultaneously against four workers, so four run and four park, with the pool torn down and rebuilt between bursts to keep each measurement independent.","The lane with sacrifice *disabled* had the highest parked queue-wait, roughly 19% worse [[244.1]]. The reason is mechanical: without sacrifice, the worker performs a full per-slot copy of the result before it can accept the next request, and that copy occupies the slot longer than an exit plus a respawn that overlaps with three other workers still serving. An eager-respawn variant — starting the replacement before completing the caller — measured inert, because the respawn was never on the parked caller's critical path.","Admission itself is clean. The historical parking signal that looked like pool pressure was over-dispatch upstream in the stream engine [[120.1]], and after that fix every measured workload reports zero parking."]},{"h":"Memory, and the buffer that outlives the query","ps":["`selectBytes` writes its JSON into a per-reader native buffer that persists across queries — which is what makes the result a view rather than a copy [[174.1]]. That buffer only ever grew, so a single 8 MB read left 8 MB pinned per reader for the life of the connection, and a concurrent burst could pin 32 MB across the pool permanently.","The fix is a reclaim policy with an observable signal: buffers above a 1 MB cap shrink after a query whose result was small, and `Diagnostics.readerJsonBufHighWaterBytes` exposes the aggregate so any downstream user or benchmark can see it [[183.1]]. Tuning should raise the trigger before touching the guard — the guard is what prevents thrash under alternating large and small reads.","Large blob *cells* take the boundary's wrap route rather than the copy route, which is what stopped blob-heavy reads from sacrificing a reader on every call [[236.1]], and the sacrifice trigger itself now keys on slot count so text-heavy results stop misrouting into needless respawns [[246.1]]."]},{"h":"The opportunity we are not taking","ps":["Batching parked point-reads into pool-sharded envelopes measured 26–33% on bursts of twenty small reads, and sharding across the pool avoided the one-worker collapse that killed an earlier version of the idea [[239.1]]. It is not shipped. The gain is real but the mechanism adds a second dispatch path with its own capping and fairness rules, and the public API offers no way to ask for it — the honest position is that it waits for a workload that demands it rather than being adopted because it is available."]}]},{"id":"writer","section":"architecture","zone":"workers","kicker":"worker isolate","name":"Writer · binding & batching","summary":"SQLite permits one writer at a time. Rather than fight that with locking schemes, resqlite embraces it: every write in the process routes through a single persistent writer isolate that owns the write connection, processes messages sequentially, and holds transaction state across them.","dirs":["parameter-encoding-and-binding"],"feeds":["tx","native"],"diagram":"writer","sections":[{"lede":true,"ps":["SQLite permits one writer at a time. Rather than fight that with locking schemes, resqlite embraces it: every write in the process routes through a single persistent writer isolate that owns the write connection, processes messages sequentially, and holds transaction state across them. Serialization is not a bottleneck imposed on the design — it is the design, and the optimization work happens *inside* the serial path rather than trying to escape it.","Three public shapes reach it. `execute` sends one statement. `executeBatch` sends one statement with many parameter sets and runs the entire matrix inside C. `transaction` opens an interactive session where the callback runs on main and each statement round-trips."]},{"h":"Binding without allocating","ps":["Parameter encoding is where most of the writer's measured wins live, and they share one shape: remove an intermediate Dart allocation by writing UTF-8 payloads straight into the native arena.","The batch path went first. A guarded ASCII fast path removed a per-string allocation across wide batches [[125.1]], and the follow-up extended the same treatment to non-ASCII by writing UTF-8 directly with private surrogate-pair handling — worth 13.5% on Unicode and 27.8% on emoji at 10k×20 [[126.1]]. Embedded NULs survive correctly because byte lengths are preserved through the bind rather than inferred.","The single-row path followed once a workload existed to show it mattered. Below tens of kilobytes the difference is noise; from 16 KB upward it is 15–32% for ASCII [[186.1]] and 31–39% for CJK [[187.1]]. That gap between \"the encoder is faster\" and \"the workload notices\" is worth naming — an earlier version of this change was rejected precisely because only a micro-benchmark could see it, and it was reopened when the right workload was built."]},{"h":"Blobs, aliasing, and coalescing","ps":["Large blob parameters take the boundary's wrap route: one copy into external memory, then an ownership move instead of a graph copy [[234.1]].","Wrapping is identity-keyed, and that detail is load-bearing rather than an optimization. The graph copier preserves object identity — pass the same buffer to two positions and it is copied once and aliased twice. Naive per-occurrence wrapping broke that property, duplicating one buffer into N external copies and making the wrapped path *worse* than the copy it replaced. Keying wrappers by buffer identity across the whole message envelope restores it, so a blob reused across the writes of a coalesced group crosses exactly once [[243.1]].","Concurrent standalone writes coalesce into a single envelope per round trip. That is why the identity table has to span the envelope rather than a single statement — the reuse case it exists for is precisely a caller looping `execute` with the same buffer.","Batch blobs deliberately do **not** wrap. Measured on a blob-heavy `executeBatch`, wrapping regressed: the win depends on many independent round-trips each parking a fresh allocation while the writer is mid-step, and a batch has one round trip [[237.1]]. The absence of wrapping there is a decision with evidence behind it, not an oversight."]},{"h":"Dirty tracking rides along","ps":["The writer connection installs SQLite's preupdate hook, so every insert, update, and delete records its table into a deduplicated set that returns *with the write response*. There is no separate notification channel and no polling — stream invalidation is a field on a reply the caller was already waiting for. Inside a transaction the set accumulates and returns at commit; a rollback discards it without waking anything."]}]},{"id":"tx","section":"architecture","zone":"workers","kicker":"writer subsystem","name":"Transactions","summary":"A transaction holds the writer for the duration of its body. Nesting maps onto SQLite savepoints.","dirs":["transaction-control-paths"],"feeds":["native"],"diagram":"tx","sections":[{"lede":true,"ps":["A transaction holds the writer for the duration of its body. Nesting maps onto SQLite savepoints. The callback runs on the **main** isolate, not the worker — deliberately, because shipping a closure to another isolate would require every captured object to be sendable, a constraint that is trivially violated by accident and produces confusing failures at runtime rather than helpful ones at compile time. So `tx.execute` and `tx.select` are ordinary async calls that each round-trip to the writer, and the callback stays ordinary Dart code.","Reads inside a transaction run on the *writer's* connection rather than the reader pool, because uncommitted writes are visible only to the connection that made them."]},{"h":"The floor that shapes everything","ps":["This subsystem's measured truth is humbling, and it has closed more experiments than any other area: **the per-statement isolate round trip dominates transaction control**, and almost every clever optimization dissolves against it.","Caching control statements was a genuine win — top-level transaction control had real prepare/finalize work to remove [[101.1]]. After that, the record is a sequence of well-reasoned ideas that measured below the floor:","Savepoint string allocation is below the decision threshold even at 50 savepoints per iteration, a deliberately worst-case shallow fan-out [[111.1]]. Compressing savepoint names to reuse cached SQL moved best-case control rows 6–17%, but the representative nested-write fanout — the row that actually matches production shape — failed to reproduce across the order flip [[189.1]]. Lazy savepoint materialization helped only empty transaction bodies, and fusing `SAVEPOINT` with the first execute regressed the meaningful shape in both pass orders [[212.1]].","The most instructive rejection is the last one. Buffering `Future.wait([tx.execute × N])` into a single envelope against the open transaction *worked* — it removed the round-trip floor for that shape and measured a real improvement. It was rejected anyway, on the grounds that the pattern has no idiomatic home in the API: same-SQL bulk atomic writes belong on `executeBatch`, which already runs the whole matrix in C, and different-SQL bursts are covered by standalone coalescing [[213.1]]. Optimizing a pattern the library does not want to encourage would have made that pattern faster and more attractive at once."]},{"h":"What that implies","ps":["If transaction control ever needs to get materially faster, the target is the round-trip floor itself — not the statements around it. That means something structural: a protocol that lets a bounded, statically-known sequence cross once, without inviting callers into an anti-pattern. Nothing currently justifies it; the record above exists so the next attempt starts from the floor rather than rediscovering it."]}]},{"id":"native","section":"architecture","zone":"native","kicker":"native layer","name":"SQLite · encoders · WAL","summary":"Underneath every isolate sits `native/resqlite.c` and a vendored SQLite — specifically sqlite3mc, which adds encryption — compiled through Dart's native assets build hooks.","dirs":["sqlite-version-and-build-config"],"feeds":[],"diagram":"native","claims":["229.1","250.1","110.1","183.1","016.1","044.1"],"sections":[{"lede":true,"ps":["Underneath every isolate sits `native/resqlite.c` and a vendored SQLite — specifically sqlite3mc, which adds encryption — compiled through Dart's native assets build hooks. The division of labour is the library's first principle: **C owns the state, Dart owns the orchestration.** Connections, prepared-statement caches, mutexes, and hooks live in C structs that outlive any particular Dart isolate, which is exactly why a sacrificed reader is cheap to replace."]},{"h":"What C owns","ps":["The connection pool holds one write connection and N read connections, each with its own statement cache. Connections open with `NOMUTEX`: rather than SQLite locking around every individual API call, resqlite takes one lock around a whole query. On a large result that replaces tens of thousands of lock/unlock pairs with one acquire and one release.","Row decoding is batched across the FFI boundary. `resqlite_step_row` advances the statement and fills a pre-allocated cell buffer with every column's type and value in one call, so Dart reads a typed buffer instead of making an FFI call per column. Integers and doubles come back as direct native reads; text still becomes Dart strings, which is unavoidable for a map-shaped API — and is precisely the cost `selectBytes` exists to skip by encoding JSON in C and never building Dart objects at all.","Two hooks make reactivity work without SQL parsing: the authorizer on readers records what a query read, and the preupdate hook on the writer records what a write changed. SQLite reports the truth about joins, views, CTEs, triggers, and cascades so resqlite does not have to infer it."]},{"h":"Compile-time positions","ps":["Build configuration is settled and deliberately conservative. The tuned flag set with `prepare_v3` is accepted — individually unmeasurable savings that stack [[016.1]] — as is `SQLITE_ENABLE_BATCH_ATOMIC_WRITE`, a zero-risk flag that activates through VFS capability detection on Android F2FS and does nothing elsewhere [[044.1]].","Version policy is evidence-driven rather than temperamental: track sqlite3mc point releases and never adopt a fresh `.0` [[090.1]]. When 3.53.0 shipped a default floating-point rounding change, the audit found it cannot reach resqlite's output at all, because REAL values never pass through `sqlite3_column_text` — so the proposed mitigation shim was unnecessary [[144.1]]. That is the pattern: check whether the hazard reaches *this* code path before paying for a defense."]},{"h":"Where machine code earned its place","ps":["The JSON encoders are the one area where resqlite spends real instruction-level effort, because `selectBytes` makes them the whole cost of a read.","Base64 encoding for blobs went through scalar unrolling, then a 12-bit pair lookup table, then a NEON `vqtbl4q_u8` kernel gated on `__aarch64__` with the scalar LUT retained as fallback — roughly 2× on payload-throughput lanes [[229.1]]. One implementation detail is preserved as a rule: the SIMD kernel stays `noinline`, because inlining it degraded code generation on the small-input scalar path that most cells actually take.","Integer encoding is the counter-example, and the reason is structural rather than algorithmic. A byte-identical NEON i64-to-decimal kernel never beat the scalar two-digit itoa, because it pays an out-of-line call plus vector setup for a single integer with no cross-cell batching to amortize it — unlike base64, which amortizes across a whole blob. Per-cell integer SIMD is closed until some future architecture batches many integer cells into one call.","Hashing for stream re-queries also lives here: computing the result hash in C during the step loop was a −39% win, and the 8-byte FNV fold has survived every attempt to widen it [[110.1]]."]},{"h":"WAL and checkpointing","ps":["Checkpointing remains inline on the writer. Moving `PASSIVE` work off the writer is genuinely attractive — first threshold-crossing latency improves 53–64% — and an early attempt failed loudly with a checkpoint storm. The diagnosis matters more than the verdict: the storm was a re-arming policy bug, not an inherent property of moving the work, and observed-reset/high-water scheduling fixes it [[250.1]]. The mechanism is documented and parked rather than discarded.","Native memory is observable rather than opaque: the per-reader JSON buffer reclaims above a cap and reports its high-water mark through diagnostics [[183.1]]."]}]},{"id":"meta","section":"architecture","zone":"native","kicker":"meta","name":"Measurement & method","summary":"Every number in this documentation came through a measurement discipline that had to be learned by getting it wrong first. This chapter is about how resqlite knows what it knows — and it is part of the architecture, because a performance library whose measurements cannot be trusted is a library whose design decisions cannot be trusted either.","dirs":["measurement-system"],"feeds":[],"diagram":"meta","sections":[{"lede":true,"ps":["Every number in this documentation came through a measurement discipline that had to be learned by getting it wrong first. This chapter is about how resqlite knows what it knows — and it is part of the architecture, because a performance library whose measurements cannot be trusted is a library whose design decisions cannot be trusted either."]},{"h":"The gates","ps":["Every A/B runs as order-flipped pairs, and drift detection is built into the statistics rather than applied by judgment. Two signatures kept recurring in writeups until they were encoded: CV asymmetry, where the flagged phase's coefficient of variation is several times its clean phase's, and sign reversal across the flip. Both now classify automatically [[177.1]]. Before that, every A/B re-derived the same reasoning by hand, and the failure mode was silent — an experiment that measured drift and reported a win.","Profile runs emit structured, validated evidence with stable insight IDs, so a half-empty artifact exits non-zero instead of looking complete [[143.1]] [[169.1]]. Every chartable experiment must link a benchmark run or explicitly declare why it has none; a silently unmapped result is a CI error, which closed a gap where roughly eighteen accepted experiments had quietly dropped off the charts [[178.1]]."]},{"h":"The lesson that generalized","ps":["The deepest methodological result came from a question that resisted measurement for months: is sacrificing a reader worth it?","The obvious experiment — alternate send and sacrifice inside one live pool — is invalid, and understanding *why* is the transferable part. Sacrifice is a state-changing treatment: each firing kills a worker, triggers a respawn, and clears statement caches. Measurement *i* therefore changes the conditions of measurement *i+1*, and the accumulated respawn state biases toward the sacrifice lane. No amount of re-running fixes it, because the instrument is confounded rather than noisy.","The answer came from splitting the question into estimands and measuring each in isolation: intrinsic transfer via a prepared-result barrier with one fresh process per observation, and pool capacity via a barrier burst with the pool rebuilt between samples [[241.1]]. That decomposition is now the standard approach for anything that mutates its own environment.","A second habit came out of the same arc: when a candidate has a mechanically unreachable configuration, add it as an explicit control lane. Lanes running identical code on both sides read the harness's noise floor directly, which settles verdicts without collecting more primary-lane samples."]},{"h":"Proportion, before optimization","ps":["The most useful thing measurement has produced recently is not a win but a ratio. Intrinsic transfer of a 200k-slot result costs roughly 391 µs against an end-to-end select of about 6,100 µs — so the entire cross-isolate transfer question, four experiments deep, governs 6–12% of a large read.","The other ~90% — SQLite stepping plus building the Dart object graph — has never been decomposed. That measurement is the current frontier, and it is deliberately sequenced before any further transport work, because it decides whether the next optimization belongs in native code or in Dart at all."]},{"h":"Why this is documented at all","ps":["Knowledge decays. This project's failure mode is not forgetting results — they are written down — but citing them after they stop being true. That is what the claims layer beneath this documentation exists to prevent: every assertion above carries a citation into an addressable, dated claim, and when future work supersedes one, the citation turns amber and CI reports which passage needs repair. The facts are machine-owned; the story is human-owned; the seam between them is linted."]}]}];
const HOME = {"title":"resqlite","tagline":"High-performance, reactive SQLite for Dart and Flutter.","sections":[{"lede":true,"ps":["resqlite is a SQLite library built around a single constraint: **the main isolate must never block.** Every read, every write, and every reactive re-query runs on a persistent worker isolate. The main isolate receives finished results and nothing else.","You write plain SQL. There is no ORM, no query builder, and no code generation."]},{"h":"What using it looks like","ps":[{"code":"final db = await Database.open('app.db');\n\n// Reads and writes stay off the UI thread.\nfinal users = await db.select('SELECT * FROM users WHERE active = ?', [1]);\nawait db.execute('INSERT INTO users(name) VALUES (?)', ['Ada']);\n\n// Reactive queries. Dependencies are detected from the SQL itself —\n// JOINs, subqueries, views and CTEs all work, with no table lists to maintain.\ndb.stream('SELECT * FROM users WHERE active = ?', [1]).listen((users) {\n  setState(() => this.users = users);\n});","lang":"dart"},"That is close to the entire public surface: `select`, `selectBytes`, `execute`, `executeBatch`, `stream`, and `transaction`. Everything in the pages that follow exists to make those six calls cheap."]},{"h":"The shape of the system","ps":["Work moves through three zones. Your code calls `Database` on the main isolate; that call is routed to a worker; the worker talks to SQLite through C; the result travels back across the isolate boundary.","The interesting part is the boundary itself. Dart isolates share no mutable state, so *nothing crosses for free* — and the cost of crossing differs by orders of magnitude depending on what is being moved. Most of this library's design is a consequence of that one fact."]},{"h":"The two constraints","ps":["Almost every decision documented here follows from two forces. If you internalise them, you can usually predict what the code does in places these pages never mention.","**Main-isolate time is the scarce resource.** Wall-clock time matters, but a frame budget is 16ms and anything the main isolate does inside that window competes with rendering. A design that is slower overall but moves work off the main isolate is usually the better trade — which is why results are decoded on workers, and why the API is asynchronous even where a synchronous version would be faster end-to-end.","**Isolates share no mutable state.** Dart's data-race-free guarantee means every result must be *transferred*, not shared. Sending a message shares immutable objects like strings and numbers by reference, but copies mutable ones slot by slot. So the price of a query result tracks the number of cells in it, not the number of bytes — a fact that took several experiments to establish and that quietly determines the shape of the read path, the write path, and the stream engine alike."]},{"h":"Explore the architecture","ps":[]},{"h":"How we know any of this","ps":["The claims on these pages are not opinions. Each one is attached to a numbered experiment with a recorded date, hardware, and method, and the citation chips throughout the prose expand to show that provenance in place.","The system is deliberately biased toward recording failure. Most performance ideas do not survive measurement, and an idea that was tried and rejected is more valuable to write down than one that worked — it is the thing that stops the same week being spent twice. Rejected experiments are kept, numbered, and cited exactly like accepted ones.","Beliefs are also allowed to die. When a later experiment supersedes or refutes an earlier one, the relationship is recorded as an edge rather than an edit, so the page can show what was believed at any past date and what changed it."]}]};

// ---------- shared rendering ----------
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');

// Routes are `#/<page>` and `#/<page>/<section>`. The landing page owns the
// reserved id `overview` so its sections are addressable too, while bare `#/`
// still resolves to it.
const HOME_ID = 'overview';
const pageRoute = id => '#/' + (id === HOME_ID ? '' : id);
const secRoute = (pageId, secId) => `#/${pageId}/${secId}`;
const anchorLink = (pageId, secId) =>
  `<a class="anchor" href="${secRoute(pageId, secId)}" aria-label="Link to this section">#</a>`;

function chipify(text, ctx) {
  return text.replace(/\[\[(\d+\.\d+)\]\]/g, (_, id) => {
    const stale = byId[id] && byId[id].state !== 'live';
    return `<button class="ev-inline ${stale ? 'ev-stale' : ''}" data-evd="${ctx}" data-claim="${id}">${id}</button>`;
  });
}

// Just enough Dart highlighting to make the landing sample readable.
//
// One pass over a single alternation, deliberately: successive .replace() calls
// would re-scan the markup they just emitted, and `class` is both a Dart
// keyword and the attribute this writes — the second pass would wrap the
// attribute name and shred the tag. Comments and strings lead the alternation
// so a `//` inside a literal is not mistaken for a comment.
function highlight(src) {
  const re = /(\/\/[^\n]*)|('[^'\n]*')|\b(final|await|async|const|var|void|return|new|class)\b/g;
  let out = '', last = 0, m;
  while ((m = re.exec(src)) !== null) {
    out += esc(src.slice(last, m.index));
    out += `<span class="${m[1] ? 'tok-c' : m[2] ? 'tok-s' : 'tok-k'}">${esc(m[0])}</span>`;
    last = m.index + m[0].length;
  }
  return out + esc(src.slice(last));
}

/// Renders one parsed section's body. `ctx` namespaces the evidence drawers so
/// two paragraphs citing the same claim get independent toggles.
function bodyHtml(sec, ctxBase) {
  let h = '';
  sec.ps.forEach((p, pi) => {
    if (typeof p !== 'string') {
      h += `<pre class="code"><code>${highlight(p.code)}</code></pre>`;
      return;
    }
    const ctx = `${ctxBase}-${pi}`;
    h += `<p class="${sec.lede ? 'lede' : ''}">${chipify(md(p), ctx)}</p>
      <div class="ev-drawer" id="evd-${ctx}"></div>`;
  });
  return h;
}

function sectionsHtml(sections, pageId, slots) {
  let h = '';
  sections.forEach((sec, si) => {
    if (sec.h) {
      const id = slug(sec.h);
      h += `<h2 id="${id}">${esc(sec.h)}${anchorLink(pageId, id)}</h2>`;
    }
    h += bodyHtml(sec, `${pageId}-${si}`);
    if (slots && sec.h && slots[sec.h]) h += slots[sec.h]();
  });
  return h;
}

function poolAt(p) { return p.pool.filter(c => liveAt(c, asOf)).sort((a, b) => b.birth - a.birth); }
function lastChange(p) {
  return Math.max.apply(null, p.pool.map(c => Math.max(c.birth || 0, c.death || 0)).concat([0]));
}

// ---------- home ----------
function cardsHtml() {
  return `<div class="cards">${ARCH.map((p, i) => {
    const live = poolAt(p).length, last = lastChange(p);
    return `<a class="card" href="${pageRoute(p.id)}">
      <div class="c-kicker">${String(i + 1).padStart(2, '0')} · ${esc(p.kicker)}</div>
      <div class="c-name">${esc(p.name)}</div>
      <div class="c-sum">${md(p.summary)}</div>
      <div class="c-meta">${live} beliefs${last ? ` · updated ${fmtNice(last)}` : ''}</div>
    </a>`;
  }).join('')}</div>`;
}

function statsHtml() {
  const live = claims.filter(c => liveAt(c, TODAY)).length;
  const stat = (v, l, cls) => `<div class="stat"><div class="v ${cls || ''}">${v}</div><div class="l">${l}</div></div>`;
  return `<div class="stats">
    ${stat(STATS.total, 'experiments run and indexed')}
    ${stat(STATS.rejected, 'rejected — and kept anyway', 'rej')}
    ${stat(live, 'beliefs currently standing')}
  </div>
  <p><a href="#/meta">How measurement works →</a> &nbsp;·&nbsp; <a href="#/changelog">What changed recently →</a></p>`;
}

function renderHome() {
  const slots = {
    'The shape of the system': () => DIAGRAMS.overview,
    'Explore the architecture': cardsHtml,
    'How we know any of this': statsHtml,
  };
  const [lede, ...rest] = HOME.sections;
  view.innerHTML = `<div class="hero">
      <h1>${esc(HOME.title)}</h1>
      <p class="tagline">${esc(HOME.tagline)}</p>
    </div>
    <div class="prose">${bodyHtml(lede, `${HOME_ID}-0`)}${sectionsHtml(rest, HOME_ID, slots)}</div>`;
  afterRender();
}

// ---------- an architecture page ----------
function renderPage(id) {
  const p = pageById[id];
  if (!p) return renderHome();
  const i = ARCH.indexOf(p);
  const prev = ARCH[i - 1], next = ARCH[i + 1];
  const pool = poolAt(p), last = lastChange(p);
  const [lede, ...rest] = p.sections;
  const fedBy = ARCH.filter(o => (o.feeds || []).includes(p.id));
  const feeds = (p.feeds || []).map(f => pageById[f]).filter(Boolean);

  const relCol = (label, list, empty) => `<div class="rel-col"><div>${label}</div>${
    list.length ? list.map(o => `<a class="rel-link" href="${pageRoute(o.id)}">${esc(o.name)}</a>`).join('')
                : `<p class="rel-none">${empty}</p>`}</div>`;

  view.innerHTML = `<div class="page-kicker">${String(i + 1).padStart(2, '0')} · ${esc(p.kicker)}</div>
    <h1 class="page-title">${esc(p.name)}</h1>
    <div class="page-meta">${pool.length} beliefs${last ? ` · last changed ${fmtNice(last)}` : ''}</div>
    <div class="prose">
      ${bodyHtml(lede, `${p.id}-0`)}
      ${DIAGRAMS[p.diagram || p.id] || ''}
      ${sectionsHtml(rest, p.id)}
    </div>
    <div class="rel-band"><h2>How this connects</h2><div class="rel-cols">
      ${relCol('RECEIVES WORK FROM', fedBy, 'Entry point — work starts here.')}
      ${relCol('HANDS OFF TO', feeds, 'Terminal — the buck stops here.')}
    </div></div>
    ${pool.length ? `<details class="roster"><summary>All ${pool.length} current beliefs, with provenance</summary>
      ${pool.map(beliefCard).join('')}</details>` : ''}
    <div class="pager">
      ${prev ? `<a href="${pageRoute(prev.id)}"><span class="lbl">← previous</span>${esc(prev.name)}</a>` : '<span></span>'}
      ${next ? `<a class="nx" href="${pageRoute(next.id)}"><span class="lbl">next →</span>${esc(next.name)}</a>` : ''}
    </div>`;
  afterRender();
}

// ---------- belief cards ----------
function ancestorsOf(c, seen) {
  seen = seen || new Set();
  const out = [];
  for (const e of (c.edges || [])) {
    const t = byId[e.target];
    if (!t || seen.has(t.id)) continue;
    seen.add(t.id);
    out.push({ rel: e.type, claim: t });
    for (const deeper of ancestorsOf(t, seen)) out.push(deeper);
  }
  return out;
}
function beliefCard(c) {
  const head = firstSentence(c.text);
  const rest = c.text.slice(head.length).trim();
  const anc = ancestorsOf(c);
  const src = expById[c.source] || {};
  const laterDead = asOf < TODAY && c.death != null;
  return `<article class="belief" id="b-${c.id}">
    <p class="belief-head">${esc(head)}</p>
    ${rest ? `<p class="belief-rest">${esc(rest)}</p>` : ''}
    <div class="prov">
      <span class="src">exp ${c.source}</span>
      <span>${src.date || ''}</span>
      ${c.conditions ? `<span>${esc(c.conditions)}</span>` : ''}
      ${laterDead ? `<span class="chip ch-later">later superseded by ${c.killers.join(', ')}</span>` : ''}
      ${anc.length ? `<button class="hist-btn" data-hist="${c.id}">history · ${anc.length} prior ▸</button>` : ''}
    </div>
    ${anc.length ? `<div class="thread" id="th-${c.id}">${threadHtml(anc)}</div>` : ''}
  </article>`;
}
function threadHtml(anc) {
  return anc.map(a => {
    const cl = a.claim;
    const span = cl.death
      ? `believed ${fmtNice(cl.birth)} → ${fmtNice(cl.death)}`
      : `since ${fmtNice(cl.birth)} · still live`;
    const relTxt = a.rel === 'supersedes' ? 'replaced by the above'
      : a.rel === 'refutes' ? 'refuted by the above'
      : a.rel === 'refines' ? 'refined by the above' : 'validated by the above';
    return `<div class="rev">
      <span class="rev-when ${cl.death ? '' : 'origin'}">${span} · <span class="rel">${relTxt}</span> · exp ${cl.source}</span>
      <p>${esc(cl.text)}</p>
    </div>`;
  }).join('');
}

// ---------- changelog ----------
function renderLog() {
  const events = [];
  for (const c of claims) {
    if (c.birth == null || c.birth > asOf) continue;
    const sup = (c.edges || []).filter(e => e.type === 'supersedes' && byId[e.target]);
    const ref = (c.edges || []).filter(e => e.type === 'refutes' && byId[e.target]);
    const kind = ref.length ? 'refuted' : sup.length ? 'revised' : 'learned';
    const oldEdge = sup[0] || ref[0];
    events.push({ t: c.birth, kind, c, old: oldEdge ? byId[oldEdge.target] : null });
  }
  events.sort((a, b) => b.t - a.t || b.c.id.localeCompare(a.c.id));
  let h = `<div class="page-kicker">reference</div>
    <h1 class="page-title">Changelog</h1>
    <div class="page-meta">${events.length} recorded changes of belief</div>`;
  let day = '';
  for (const ev of events) {
    const d = fmtNice(ev.t);
    if (d !== day) { if (day) h += '</div>'; h += `<div class="log-day"><h3>${d}</h3>`; day = d; }
    h += `<div class="event">
      <span class="ev-kind ev-${ev.kind}">${ev.kind.toUpperCase()}</span>
      <div><div class="ev-body">${esc(firstSentence(ev.c.text))}
        <span class="ev-sub">· exp ${ev.c.source} · ${esc((PAGES.find(m => m.pool.includes(ev.c)) || {}).name || '')}</span></div>
        ${ev.old ? `<div class="ev-sub ev-old">was: ${esc(firstSentence(ev.old.text))}</div>` : ''}
      </div></div>`;
  }
  if (day) h += '</div>';
  view.innerHTML = h + (events.length ? '' : '<p class="hint">Nothing recorded before this date.</p>');
  afterRender();
}

// ---------- shell: nav, references, routing ----------
const view = document.getElementById('view');
const sidebarEl = document.getElementById('sidebar');
const refsBody = document.getElementById('refs-body');
const refsSub = document.getElementById('refs-sub');
let route = '/';

function renderNav() {
  const here = route.slice(1) || HOME_ID;
  const secs = [...view.querySelectorAll('.prose h2[id]')];
  const secList = secs.length < 2 ? '' : `<div class="nav-secs">${
    secs.map(h => `<a href="${secRoute(here, h.id)}" data-sec="${h.id}">${esc(h.firstChild.textContent)}</a>`).join('')}</div>`;
  const link = (id, label, extra) => {
    const active = id === here;
    return `<a class="nav-link ${active ? 'active' : ''}" href="${pageRoute(id)}">${label}${extra || ''}</a>` +
      (active ? secList : '');
  };
  sidebarEl.innerHTML = `
    <div class="nav-group">
      <div class="nav-title">Start</div>
      ${link(HOME_ID, 'Overview')}
    </div>
    <div class="nav-group">
      <div class="nav-title">Architecture</div>
      ${ARCH.map((p, i) => link(p.id,
        `<span class="n">${String(i + 1).padStart(2, '0')}</span>${esc(p.name)}`,
        `<span class="zone">${esc(p.zone)}</span>`)).join('')}
    </div>
    <div class="nav-group">
      <div class="nav-title">Reference</div>
      ${link('changelog', 'Changelog')}
    </div>`;
}

// ---------- references panel ----------
//
// Each paragraph knows which claims it cites, so the panel can show the union
// for whatever is on screen: evidence follows reading position instead of
// waiting to be asked for. Clicking a chip pins one card until the next scroll.

let refIndex = [];     // [{ el: <p>, ids: [claimId] }] in document order
let shownKey = '';     // ids currently rendered, so scrolling does not re-render
let pinned = null;     // chip-clicked claim, cleared on the next scroll

function buildRefIndex() {
  refIndex = [];
  for (const p of view.querySelectorAll('.prose p')) {
    const ids = [...p.querySelectorAll('.ev-inline')].map(b => b.dataset.claim);
    if (ids.length) refIndex.push({ el: p, ids: [...new Set(ids)] });
  }
}

function refCard(id, focused) {
  const c = byId[id];
  if (!c) return '';
  const src = expById[c.source] || {};
  const anc = ancestorsOf(c);
  const state = c.state || 'live';
  const links = [];
  if (src.writeupUrl) links.push(`<a href="${src.writeupUrl}" target="_blank" rel="noopener">Writeup ↗</a>`);
  if (src.signalUrl) links.push(`<a href="${src.signalUrl}" target="_blank" rel="noopener">Signal entry ↗</a>`);
  if (src.link) links.push(`<a href="${esc(src.link)}" target="_blank" rel="noopener">Change ↗</a>`);
  return `<article class="ref ${focused ? 'focus' : 'dim'}" data-id="${id}">
    <div class="ref-top">
      <span class="ref-id">${id}</span>
      <span class="ref-state s-${state}">${state}</span>
    </div>
    <p class="ref-text">${esc(c.text)}</p>
    <div class="ref-src">
      <div class="ref-exp">${esc(src.title || 'Experiment ' + c.source)}</div>
      <div class="ref-facts">
        <span class="k">exp ${c.source}</span>
        ${src.date ? `<span>${src.date}</span>` : ''}
        ${src.class ? `<span class="cls">${esc(src.class)}</span>` : ''}
        ${src.status ? `<span>${esc(src.status)}</span>` : ''}
      </div>
      ${c.conditions ? `<div class="ref-facts" style="margin-top:4px"><span>${esc(c.conditions)}</span></div>` : ''}
    </div>
    ${focused && src.impact ? `<details class="ref-more"><summary>Method and context</summary>
      <div class="body">${md(src.impact)}</div></details>` : ''}
    ${focused && anc.length ? `<details class="ref-more"><summary>${anc.length} earlier belief${anc.length > 1 ? 's' : ''} behind this</summary>
      <div class="body">${anc.map(a => {
        const cl = a.claim;
        const when = cl.death ? `held ${fmtNice(cl.birth)} → ${fmtNice(cl.death)}` : `since ${fmtNice(cl.birth)} · still live`;
        const rel = a.rel === 'supersedes' ? 'replaced' : a.rel === 'refutes' ? 'refuted'
          : a.rel === 'refines' ? 'refined' : 'validated';
        return `<div class="ref-prior"><span class="w ${cl.death ? '' : 'origin'}">${rel} · ${when} · exp ${cl.source}</span>
          <p>${esc(cl.text)}</p></div>`;
      }).join('')}</div></details>` : ''}
    ${focused && links.length ? `<div class="ref-links">${links.join('')}</div>` : ''}
  </article>`;
}

function updateRefs(force) {
  if (!refsBody) return;
  if (!refIndex.length) {
    if (shownKey !== 'none') {
      shownKey = 'none';
      refsSub.textContent = 'Evidence behind what you\'re reading';
      refsBody.innerHTML = `<p class="refs-empty">No cited claims on this page.</p>`;
    }
    return;
  }
  const top = headerHeight();
  const line = top + 140;
  const visible = refIndex.filter(r => {
    const b = r.el.getBoundingClientRect();
    return b.bottom > top + 8 && b.top < innerHeight - 8;
  });
  const inView = visible.length ? visible : [refIndex[0]];

  // Focus follows the paragraph nearest the reading line, unless a chip pinned one.
  let focus = pinned;
  if (!focus) {
    let best = Infinity;
    for (const r of inView) {
      const d = Math.abs(r.el.getBoundingClientRect().top - line);
      if (d < best) { best = d; focus = r.ids[0]; }
    }
  }
  const ids = [...new Set(inView.flatMap(r => r.ids))];
  if (pinned && !ids.includes(pinned)) ids.unshift(pinned);

  const key = ids.join(',') + '|' + focus;
  if (key === shownKey && !force) return;
  shownKey = key;

  refsSub.textContent = ids.length === 1
    ? '1 claim supports this passage'
    : `${ids.length} claims support this passage`;
  refsBody.innerHTML = ids.map(id => refCard(id, id === focus)).join('');
  view.querySelectorAll('.ev-inline').forEach(b =>
    b.classList.toggle('cited', b.dataset.claim === focus));
}

/// Highlights the heading you are currently reading under. Runs off scroll
/// rather than IntersectionObserver so the "last heading above the fold" rule
/// stays explicit — with several headings on screen, that is the one you want.
function spy() {
  const heads = [...view.querySelectorAll('.prose h2[id]')];
  if (heads.length) {
    const line = headerHeight() + 60;
    let cur = heads[0].id;
    for (const h of heads) {
      if (h.getBoundingClientRect().top > line) break;
      cur = h.id;
    }
    sidebarEl.querySelectorAll('.nav-secs a').forEach(a =>
      a.classList.toggle('active', a.dataset.sec === cur));
  }
  updateRefs();
}
function headerHeight() {
  return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hdr-h')) || 60;
}

function afterRender() {
  wire();
  renderNav();
  buildRefIndex();
  pinned = null;
  shownKey = '';
  updateRefs(true);
  spy();
}

/// Clicking a citation pins it in the references panel — the panel is the
/// destination, so the chip does not need to duplicate the evidence inline.
/// Below the panel's breakpoint there is nowhere to send the reader, so the
/// original in-place drawer stays as the fallback.
function wire() {
  view.querySelectorAll('.ev-inline').forEach(b =>
    b.addEventListener('click', () => {
      const c = byId[b.dataset.claim];
      if (!c) return;
      const panelVisible = refsBody && refsBody.offsetParent !== null;
      if (!panelVisible) {
        const drawer = document.getElementById('evd-' + b.dataset.evd);
        if (!drawer) return;
        if (drawer.dataset.showing === c.id && drawer.classList.contains('open')) {
          drawer.classList.remove('open'); return;
        }
        drawer.dataset.showing = c.id;
        drawer.innerHTML = beliefCard(c);
        drawer.classList.add('open');
        wireHist(drawer);
        return;
      }
      pinned = c.id;
      updateRefs(true);
      const card = refsBody.querySelector(`.ref[data-id="${c.id}"]`);
      if (card) {
        card.scrollIntoView({ block: 'nearest' });
        card.classList.add('flash');
        setTimeout(() => card.classList.remove('flash'), 500);
      }
    }));
  wireHist(view);
}
function wireHist(root) {
  root.querySelectorAll('.hist-btn').forEach(b =>
    b.addEventListener('click', () => {
      const th = document.getElementById('th-' + b.dataset.hist);
      if (!th) return;
      const open = th.classList.toggle('open');
      const n = (b.textContent.match(/\d+/) || ['0'])[0];
      b.textContent = open ? `history · ${n} prior ▾` : `history · ${n} prior ▸`;
    }));
}

// `#/`, `#/<page>`, `#/<page>/<section>`. A bare `#section` is a plain in-page
// anchor and must not be read as a route.
function currentRoute() {
  const h = location.hash;
  return h.startsWith('#/') ? h.slice(2).split('/').filter(Boolean) : null;
}
function navigate(keepScroll) {
  const parts = currentRoute() || [];
  const pageId = parts[0] === HOME_ID ? '' : (parts[0] || '');
  const secId = parts[1] || '';
  const changed = pageId !== route.slice(1);
  route = '/' + pageId;
  if (!pageId) renderHome();
  else if (pageId === 'changelog') renderLog();
  else renderPage(pageId);
  if (secId) {
    const el = document.getElementById(secId);
    if (el) { el.scrollIntoView({ block: 'start' }); return; }
  }
  // Instant, not 'auto': `auto` defers to the page's smooth scroll-behavior,
  // which turns every page change into a long animated ride to the top.
  if (changed && !keepScroll) scrollTo({ top: 0, behavior: 'instant' });
}
addEventListener('hashchange', () => {
  if (currentRoute()) navigate();
  else spy();
});
let ticking = false;
addEventListener('scroll', () => {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    ticking = false;
    // Scrolling hands focus back to reading position — a pinned citation is a
    // momentary answer to a click, not a mode the reader has to dismiss.
    pinned = null;
    spy();
  });
}, { passive: true });

// ---------- time machine ----------
const asofInput = document.getElementById('asof');
const births = claims.map(c => c.birth).filter(Boolean);
asofInput.max = fmt(TODAY);
asofInput.min = fmt(Math.min.apply(null, births));
asofInput.value = fmt(TODAY);
function applyTime() {
  const atToday = asOf >= TODAY;
  let note = document.querySelector('.time-note');
  if (!note) {
    note = document.createElement('div');
    note.className = 'time-note';
    document.querySelector('.shell').before(note);
  }
  note.classList.toggle('on', !atToday);
  if (!atToday) {
    const nowLive = claims.filter(c => liveAt(c, TODAY)).length;
    const thenLive = claims.filter(c => liveAt(c, asOf)).length;
    note.innerHTML = `Showing what was believed on <b>${fmtNice(asOf)}</b> —
      ${thenLive} beliefs then, ${nowLive} today. Anything since revised carries an amber chip.`;
  }
  // Hold the reader's place: moving the date should change what the page says,
  // not where you are in it. Measured against <main>, which survives the
  // re-render, because showing or hiding the banner above it shifts the whole
  // document by the banner's height — restoring a raw scrollY would land the
  // reader that far off.
  const docTop = () => view.getBoundingClientRect().top + scrollY;
  const offset = scrollY - docTop();
  navigate(true);
  scrollTo({ top: docTop() + offset, behavior: 'instant' });
}
asofInput.addEventListener('change', () => {
  const t = parseDate(asofInput.value);
  if (t) { asOf = t + 86399000; applyTime(); }
});
document.getElementById('today-btn').addEventListener('click', () => {
  asOf = TODAY; asofInput.value = fmt(TODAY); applyTime();
});

// ---------- search ----------
const searchInput = document.getElementById('search');
const searchResults = document.getElementById('search-results');
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  searchResults.innerHTML = '';
  if (q.length < 2) { searchResults.classList.remove('open'); return; }
  const hits = [];
  for (const c of claims) {
    if (c.id.includes(q) || c.text.toLowerCase().includes(q))
      hits.push({ id: c.id, label: firstSentence(c.text), state: c.state });
    if (hits.length > 9) break;
  }
  for (const hit of hits) {
    const b = document.createElement('button');
    b.className = 'search-hit'; b.setAttribute('role', 'option');
    b.innerHTML = `<span class="mono">${hit.id} · ${hit.state}</span> · ${esc(hit.label.slice(0, 88))}`;
    b.addEventListener('click', () => {
      searchResults.classList.remove('open'); searchInput.value = '';
      asOf = TODAY; asofInput.value = fmt(TODAY);
      // Jump to the page that owns the claim, then reveal it in the roster.
      // replaceState rather than assigning location.hash: assigning would fire
      // hashchange after this handler and re-render the page, discarding the
      // highlight applied below.
      const owner = PAGES.find(p => p.pool.some(c => c.id === hit.id))
        || PAGES.find(p => p.pool.some(c => (byId[hit.id] || {}).killers?.includes(c.id)));
      history.replaceState(null, '', owner ? pageRoute(owner.id) : '#/changelog');
      navigate();
      const target = document.getElementById('b-' + hit.id);
      const el = target || document.getElementById('b-' + ((byId[hit.id] || {}).killers || [])[0]);
      if (!el) return;
      const det = el.closest('details'); if (det) det.open = true;
      el.scrollIntoView({ block: 'center' });
      if (target) {
        const head = target.querySelector('.belief-head');
        head.innerHTML = `<mark>${esc(head.textContent)}</mark>`;
      } else {
        const btn = el.querySelector('.hist-btn'); if (btn) btn.click();
      }
    });
    searchResults.appendChild(b);
  }
  searchResults.classList.toggle('open', hits.length > 0);
});
document.addEventListener('click', ev => {
  if (!ev.target.closest('.searchbox')) searchResults.classList.remove('open');
});

// ---------- boot ----------
navigate();
if (!currentRoute() && location.hash) {
  const landing = document.getElementById(decodeURIComponent(location.hash.slice(1)));
  if (landing) landing.scrollIntoView({ block: 'start' });
}
</script>
