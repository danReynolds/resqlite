<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>resqlite · architecture</title>
<style>
:root {
  --paper: #FBFBFA; --surface: #FFFFFF; --raised: #F3F3F1;
  --ink: #1A1A1E; --ink-2: #55555F; --ink-3: #8B8B96;
  --line: #E6E6E3; --line-2: #D6D6D2;
  --accent: #4F46E5; --accent-2: #7C3AED; --accent-soft: #4F46E514;
  --ok: #157F3D; --warn: #A15C07; --bad: #BE123C; --meas: #0369A1;
  --code-bg: #F4F4F7;
  /* aliases the diagram SVGs draw against */
  --ground: var(--paper); --panel: var(--surface); --stale: var(--warn);
  --hdr-h: 60px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0F0F13; --surface: #17171C; --raised: #1E1E25;
    --ink: #F2F2F5; --ink-2: #A0A0AC; --ink-3: #6E6E7A;
    --line: #26262E; --line-2: #34343E;
    --accent: #A5B4FC; --accent-2: #C4B5FD; --accent-soft: #A5B4FC1C;
    --ok: #4ADE80; --warn: #FBBF24; --bad: #FB7185; --meas: #7DD3FC;
    --code-bg: #1C1C24;
  }
}
:root[data-theme="dark"] {
  --paper: #0F0F13; --surface: #17171C; --raised: #1E1E25;
  --ink: #F2F2F5; --ink-2: #A0A0AC; --ink-3: #6E6E7A;
  --line: #26262E; --line-2: #34343E;
  --accent: #A5B4FC; --accent-2: #C4B5FD; --accent-soft: #A5B4FC1C;
  --ok: #4ADE80; --warn: #FBBF24; --bad: #FB7185; --meas: #7DD3FC;
  --code-bg: #1C1C24;
}
:root[data-theme="light"] {
  --paper: #FBFBFA; --surface: #FFFFFF; --raised: #F3F3F1;
  --ink: #1A1A1E; --ink-2: #55555F; --ink-3: #8B8B96;
  --line: #E6E6E3; --line-2: #D6D6D2;
  --accent: #4F46E5; --accent-2: #7C3AED; --accent-soft: #4F46E514;
  --ok: #157F3D; --warn: #A15C07; --bad: #BE123C; --meas: #0369A1;
  --code-bg: #F4F4F7;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 15px/1.6 ui-sans-serif, -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.mono, code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .875em; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: var(--accent); }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40; height: var(--hdr-h);
  display: flex; align-items: center; gap: 18px; padding: 0 22px;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 9px; text-decoration: none; color: inherit; }
.brand b { font-size: 16px; font-weight: 650; letter-spacing: -.015em; }
.brand span { font-size: 11px; color: var(--ink-3); font-family: ui-monospace, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; }
.spacer { margin-left: auto; }
.searchbox { position: relative; width: min(320px, 34vw); }
.searchbox input {
  width: 100%; padding: 7px 11px; border-radius: 8px; font-size: 13px;
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
}
.searchbox input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
.search-results {
  display: none; position: absolute; z-index: 60; top: 108%; left: 0; right: 0;
  background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px;
  box-shadow: 0 12px 34px rgba(0,0,0,.14); overflow: hidden; max-height: 60vh; overflow-y: auto;
}
.search-results.open { display: block; }
.search-hit { display: block; width: 100%; text-align: left; padding: 9px 12px; font-size: 12.5px; border-bottom: 1px solid var(--line); }
.search-hit:last-child { border-bottom: 0; }
.search-hit:hover, .search-hit:focus-visible { background: var(--accent-soft); outline: none; }
.search-hit .mono { color: var(--accent); }
.asof-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); }
.asof-row input[type=date] {
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
  border-radius: 7px; padding: 5px 8px; font: inherit; font-size: 12.5px;
}
.today-btn { color: var(--accent); font-size: 12px; }
.today-btn:hover { text-decoration: underline; }

/* ---------- shell ---------- */
.shell {
  display: grid; grid-template-columns: 250px minmax(0, 1fr) 348px;
  gap: 0; max-width: 1560px; margin: 0 auto; align-items: start;
}
.sidebar {
  position: sticky; top: var(--hdr-h); height: calc(100vh - var(--hdr-h));
  overflow-y: auto; padding: 26px 16px 40px 22px; border-right: 1px solid var(--line);
}
.nav-group { margin-bottom: 22px; }
.nav-title {
  font-family: ui-monospace, Menlo, monospace; font-size: 10px; letter-spacing: .15em;
  text-transform: uppercase; color: var(--ink-3); margin: 0 0 8px 10px; font-weight: 500;
}
.nav-link {
  display: flex; align-items: baseline; gap: 9px; width: 100%; text-align: left;
  padding: 6px 10px; border-radius: 7px; font-size: 13.5px; color: var(--ink-2);
  text-decoration: none; line-height: 1.4;
}
.nav-link:hover { background: var(--raised); color: var(--ink); }
.nav-link.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-link .n { font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; color: var(--ink-3); }
.nav-link.active .n { color: var(--accent); }
.nav-link .zone { margin-left: auto; font-size: 10px; color: var(--ink-3); font-family: ui-monospace, Menlo, monospace; }

/* Section links live under the active page in the left rail, which frees the
   whole right column for evidence. */
.nav-secs { margin: 2px 0 6px 0; }
.nav-secs a {
  display: block; padding: 4px 10px 4px 30px; font-size: 12.5px; color: var(--ink-3);
  text-decoration: none; border-left: 2px solid var(--line); margin-left: 12px; line-height: 1.35;
}
.nav-secs a:hover { color: var(--ink); }
.nav-secs a.active { color: var(--accent); border-left-color: var(--accent); font-weight: 600; }

main { padding: 34px 46px 90px; min-width: 0; }

/* ---------- references panel ---------- */
.refs {
  position: sticky; top: var(--hdr-h); height: calc(100vh - var(--hdr-h));
  display: flex; flex-direction: column;
  border-left: 1px solid var(--line); background: var(--paper);
}
.refs-hd { padding: 22px 20px 12px; border-bottom: 1px solid var(--line); }
.refs-hd .t { font-family: ui-monospace, Menlo, monospace; font-size: 10px; letter-spacing: .15em; text-transform: uppercase; color: var(--ink-3); }
.refs-hd .s { font-size: 12px; color: var(--ink-2); margin-top: 4px; }
.refs-body { flex: 1; overflow-y: auto; padding: 14px 16px 40px; scroll-behavior: smooth; }
.refs-empty { font-size: 12.5px; color: var(--ink-3); font-style: italic; padding: 8px 4px; }

.ref {
  border: 1px solid var(--line); border-radius: 11px; background: var(--surface);
  padding: 13px 14px; margin-bottom: 10px; scroll-margin-top: 12px;
  transition: border-color .15s, box-shadow .15s, opacity .15s;
}
.ref.dim { opacity: .58; }
.ref.focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); opacity: 1; }
@keyframes refflash { 0% { box-shadow: 0 0 0 0 var(--accent); } 100% { box-shadow: 0 0 0 3px var(--accent-soft); } }
.ref.flash { animation: refflash .5s ease-out; }
.ref-top { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
.ref-id { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; font-weight: 600; color: var(--accent); }
.ref-state {
  margin-left: auto; font-family: ui-monospace, Menlo, monospace; font-size: 9.5px;
  letter-spacing: .08em; text-transform: uppercase; padding: 1px 7px; border-radius: 20px;
  border: 1px solid currentColor; color: var(--ok);
}
.ref-state.s-superseded, .ref-state.s-refined { color: var(--warn); }
.ref-state.s-refuted { color: var(--bad); }
.ref-text { font-size: 13px; line-height: 1.55; color: var(--ink); margin: 0 0 10px; }
.ref.dim .ref-text { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.ref-src { border-top: 1px solid var(--line); padding-top: 9px; }
.ref-exp { font-size: 12.5px; font-weight: 600; line-height: 1.4; margin-bottom: 3px; }
.ref-facts { display: flex; flex-wrap: wrap; gap: 3px 10px; font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: var(--ink-3); }
.ref-facts .k { color: var(--accent); }
.ref-facts .cls { color: var(--meas); }
.ref-more { margin-top: 9px; }
.ref-more summary { cursor: pointer; font-size: 11.5px; color: var(--ink-2); font-family: ui-monospace, Menlo, monospace; list-style: none; }
.ref-more summary::-webkit-details-marker { display: none; }
.ref-more summary::before { content: '▸ '; color: var(--ink-3); }
.ref-more[open] summary::before { content: '▾ '; }
.ref-more summary:hover { color: var(--accent); }
.ref-more .body { font-size: 12px; line-height: 1.6; color: var(--ink-2); padding: 8px 2px 2px; max-height: 260px; overflow-y: auto; }
.ref-prior { border-left: 2px solid var(--line); padding: 2px 0 2px 11px; margin: 8px 0; }
.ref-prior .w { font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: var(--warn); }
.ref-prior .w.origin { color: var(--ink-3); }
.ref-prior p { margin: 3px 0 0; font-size: 12px; color: var(--ink-2); line-height: 1.5; }
.ref-links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.ref-links a {
  font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; text-decoration: none;
  border: 1px solid var(--line-2); border-radius: 7px; padding: 3px 9px; color: var(--ink-2);
}
.ref-links a:hover { border-color: var(--accent); color: var(--accent); }

/* ---------- prose ---------- */
.page-kicker { font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
h1.page-title { font-size: 34px; line-height: 1.12; margin: 8px 0 10px; font-weight: 660; letter-spacing: -.028em; text-wrap: balance; }
.page-meta { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; color: var(--ink-3); margin-bottom: 26px; }
.prose { max-width: 74ch; }
.prose h2 {
  font-size: 19px; font-weight: 640; letter-spacing: -.015em; margin: 40px 0 12px;
  scroll-margin-top: calc(var(--hdr-h) + 18px);
}
.prose p { margin: 0 0 15px; font-size: 15.5px; line-height: 1.72; color: var(--ink); }
.prose .lede { font-size: 17.5px; line-height: 1.62; color: var(--ink); }
.prose code { background: var(--code-bg); padding: 1.5px 5px; border-radius: 4px; }
.prose strong { font-weight: 640; }
.anchor { opacity: 0; margin-left: 9px; font-size: .72em; font-weight: 400; color: var(--ink-3); text-decoration: none; }
h2:hover .anchor, .anchor:focus-visible { opacity: 1; }
.anchor:hover { color: var(--accent); }
pre.code {
  background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px;
  padding: 15px 17px; overflow-x: auto; margin: 0 0 18px; font-size: 12.9px; line-height: 1.62;
}
pre.code code { background: none; padding: 0; }
.tok-c { color: var(--ink-3); font-style: italic; }
.tok-s { color: var(--ok); }
.tok-k { color: var(--accent-2); }

/* ---------- home ---------- */
.hero { max-width: 76ch; margin-bottom: 34px; }
.hero h1 { font-size: 46px; line-height: 1.04; margin: 0 0 12px; font-weight: 680; letter-spacing: -.04em; }
.hero .tagline { font-size: 19px; color: var(--ink-2); margin: 0 0 26px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(258px, 1fr)); gap: 14px; margin: 6px 0 10px; }
.card {
  display: block; width: 100%; text-align: left; padding: 16px 17px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  text-decoration: none; color: inherit; transition: border-color .12s, transform .12s;
}
.card:hover { border-color: var(--accent); transform: translateY(-1px); }
.card .c-kicker { font-family: ui-monospace, Menlo, monospace; font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3); }
.card .c-name { font-weight: 640; font-size: 15px; margin: 5px 0 6px; letter-spacing: -.012em; }
.card .c-sum { font-size: 13px; color: var(--ink-2); line-height: 1.55; }
.card .c-meta { font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; color: var(--ink-3); margin-top: 10px; }
.constraints { display: grid; gap: 14px; margin: 4px 0 18px; }
.constraint { border-left: 3px solid var(--accent); padding: 2px 0 4px 16px; }
.stats { display: flex; flex-wrap: wrap; gap: 30px; margin: 20px 0 22px; }
.stat .v { font-size: 30px; font-weight: 660; letter-spacing: -.03em; line-height: 1.1; }
.stat .v.rej { color: var(--warn); }
.stat .l { font-size: 12px; color: var(--ink-2); margin-top: 2px; }

/* ---------- relations ---------- */
.rel-band { margin: 34px 0 6px; padding-top: 22px; border-top: 1px solid var(--line); }
.rel-band h2 { font-size: 13px; font-family: ui-monospace, Menlo, monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; margin: 0 0 12px; }
.rel-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 20px; }
.rel-col > div { font-size: 11px; font-family: ui-monospace, Menlo, monospace; color: var(--ink-3); margin-bottom: 7px; letter-spacing: .06em; }
.rel-link { display: block; padding: 7px 11px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 7px; font-size: 13px; text-decoration: none; color: var(--ink); background: var(--surface); }
.rel-link:hover { border-color: var(--accent); color: var(--accent); }
.rel-none { font-size: 12.5px; color: var(--ink-3); font-style: italic; }
.pager { display: flex; justify-content: space-between; gap: 18px; margin-top: 34px; padding-top: 22px; border-top: 1px solid var(--line); }
.pager a { display: block; max-width: 47%; text-decoration: none; color: var(--accent); font-size: 14px; font-weight: 560; }
.pager a:hover { text-decoration: underline; }
.pager .nx { text-align: right; margin-left: auto; }
.pager .lbl { display: block; font-family: ui-monospace, Menlo, monospace; font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3); font-weight: 400; margin-bottom: 2px; }

/* ---------- diagrams ---------- */
.diagram-card { margin: 22px 0 26px; padding: 20px 20px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.diagram-card.wide { max-width: none; }
.diagram-card figcaption { margin-top: 10px; text-align: center; font-size: 11.5px; color: var(--ink-3); font-family: ui-monospace, Menlo, monospace; }
.dg-zone { font: 600 10px ui-monospace, Menlo, monospace; fill: var(--ink-3); letter-spacing: .12em; }
.dg-flow { font: 600 13px ui-sans-serif, system-ui, sans-serif; fill: var(--ink); }
.dg-cost { font: 500 10.5px ui-monospace, Menlo, monospace; fill: var(--ink-2); }
.dg-wall { stroke: var(--warn); stroke-width: 1.5; stroke-dasharray: 6 5; opacity: .75; }
.dg-box { fill: var(--raised); stroke: var(--line-2); rx: 9; }

/* ---------- evidence ---------- */
.ev-inline {
  font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; color: var(--accent);
  border: 1px solid var(--line-2); border-radius: 5px; padding: 0 4px; margin: 0 2px;
  vertical-align: 1.5px; background: var(--surface);
}
.ev-inline:hover { border-color: var(--accent); background: var(--accent-soft); }
.ev-inline.ev-stale { color: var(--warn); text-decoration: line-through; }
.ev-inline.cited { border-color: var(--accent); background: var(--accent-soft); }
.ev-drawer { display: none; margin: 2px 0 18px; }
.ev-drawer.open { display: block; }
.ev-drawer .belief { border: 1px solid var(--line-2); border-radius: 10px; padding: 13px 16px; background: var(--surface); }
.belief { padding: 15px 2px; border-bottom: 1px solid var(--line); }
.belief-head { font-size: 14.5px; font-weight: 600; margin: 0 0 3px; text-wrap: balance; }
.belief-rest { font-size: 13.5px; color: var(--ink-2); margin: 2px 0 7px; max-width: 70ch; }
.prov { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 14px; font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; color: var(--ink-3); }
.prov .src { color: var(--accent); }
.chip { border: 1px solid var(--line-2); border-radius: 20px; padding: 0 8px; font-size: 10px; }
.ch-later { color: var(--warn); border-color: var(--warn); }
.hist-btn { color: var(--accent); font-size: 11.5px; font-family: ui-monospace, Menlo, monospace; }
.hist-btn:hover { text-decoration: underline; }
.thread { display: none; margin: 10px 0 2px 8px; border-left: 2px solid var(--line); padding-left: 16px; }
.thread.open { display: block; }
.rev { margin: 11px 0; }
.rev-when { font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; color: var(--warn); }
.rev-when.origin { color: var(--ink-3); }
.rev p { margin: 3px 0 2px; font-size: 13px; color: var(--ink-2); max-width: 66ch; }
.rev .rel { color: var(--meas); }
.roster { margin-top: 30px; }
.roster summary { cursor: pointer; font-size: 12.5px; color: var(--ink-2); font-family: ui-monospace, Menlo, monospace; padding: 8px 0; }
.roster summary:hover { color: var(--accent); }

/* ---------- changelog ---------- */
.log-day { margin-top: 24px; }
.log-day h3 { font-size: 12px; font-family: ui-monospace, Menlo, monospace; color: var(--ink-3); font-weight: 500; margin: 0 0 4px; border-bottom: 1px solid var(--line); padding-bottom: 5px; }
.event { display: grid; grid-template-columns: 88px 1fr; gap: 12px; padding: 9px 0; }
.ev-kind { font-family: ui-monospace, Menlo, monospace; font-size: 10px; letter-spacing: .07em; padding-top: 3px; }
.ev-learned { color: var(--ok); } .ev-revised { color: var(--warn); } .ev-refuted { color: var(--bad); }
.event .ev-body { font-size: 13.5px; max-width: 68ch; }
.event .ev-sub { font-size: 11.5px; color: var(--ink-3); }
.event .ev-old { font-style: italic; }
.time-note { display: none; margin-bottom: 20px; padding: 11px 15px; border-radius: 10px; background: var(--accent-soft); border: 1px solid var(--line-2); font-size: 13px; }
.time-note.on { display: block; }
.hint { color: var(--ink-3); font-size: 13px; }
mark { background: var(--accent-soft); color: inherit; border-radius: 3px; padding: 0 2px; }
.coverage { color: var(--ink-3); font-size: 12.5px; margin: 26px 0 0; }

@media (max-width: 1240px) {
  .shell { grid-template-columns: 236px minmax(0, 1fr); }
  .refs { display: none; }
  main { padding: 30px 32px 80px; }
}
@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .sidebar { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 16px 20px; }
  main { padding: 24px 20px 70px; }
  .hero h1 { font-size: 34px; }
  .searchbox { width: 46vw; }
}
</style>

<div class="topbar">
  <a class="brand" href="#/"><b>resqlite</b> <span>architecture</span></a>
  <div class="spacer"></div>
  <div class="searchbox">
    <input id="search" type="search" placeholder="Search beliefs…" aria-label="Search beliefs and experiments">
    <div class="search-results" id="search-results" role="listbox"></div>
  </div>
  <div class="asof-row">
    <label for="asof">as of</label>
    <input type="date" id="asof">
    <button class="today-btn" id="today-btn">today</button>
  </div>
</div>

<div class="shell">
  <nav class="sidebar" id="sidebar" aria-label="Documentation"></nav>
  <main id="view"></main>
  <aside class="refs" id="refs" aria-label="References">
    <div class="refs-hd">
      <div class="t">References</div>
      <div class="s" id="refs-sub">Evidence behind what you're reading</div>
    </div>
    <div class="refs-body" id="refs-body"></div>
  </aside>
</div>

ession on stream invalidation: xxhash mergeRound is ~2× more ops than FNV's xor+mul, and our inputs are pre-hashed 64-bit values rather than byte streams (where xxhash wins)","link":"","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/072-xxhash-for-fnv.md"},{"id":"073","title":"Single-slot schema-cache fast-path","file":"073-schema-cache-fast-path.md","date":"2026-04-16","status":"rejected","impact":"Within noise: Dart's cached `String.hashCode` already makes map lookups fast enough that a one-slot bypass is below the measurement floor for the current suite","link":"","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/073-schema-cache-fast-path.md"},{"id":"074","title":"Bulk `step_many` batched FFI for read path","file":"074-bulk-step-many.md","date":"2026-04-16","status":"rejected","impact":"Same wall as exp 018: memcpy-in-C cost exceeds FFI-crossing savings. Text-heavy workloads regressed +38 %. Dart already reads directly from SQLite's text buffer; adding a C-side copy before Dart decode is strictly worse","link":"","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/074-bulk-step-many.md"},{"id":"075","title":"Native-buffered hash for `selectIfChanged`","file":"075-native-hash-selectifchanged.md","date":"2026-04-16","status":"accepted","directions":["long-text-stream-hashing"],"outcomeClass":"accepted","impact":"**−39 % on unchanged-fanout benchmark**. Worker-side C hash (`resqlite_query_hash`) short-circuits stream re-queries before any Dart decode when the result is unchanged","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/075.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/075-native-hash-selectifchanged.md"},{"id":"076","title":"Pre-bound statement cache","file":"076-prebound-stmt-cache-analysis.md","date":"2026-04-16","status":"rejected","impact":"Rejected in pre-implementation analysis: bind is resqlite/blob/main/experiments/093-alias-cache-entry-read-tables.md"},{"id":"094","title":"Dirty/read table string reuse","file":"094-dirty-read-string-reuse.md","date":"2026-04-23","status":"rejected","impact":"Focused dispatch was effectively flat and the full suite produced no wins; native branch/lifetime complexity is not justified","link":"","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/094-dirty-read-string-reuse.md"},{"id":"095","title":"Persistent writer result buffer","file":"095-writer-result-buffer.md","date":"2026-04-23","status":"rejected","impact":"The removable 16-byte calloc/free pair did not produce reliable write-path wins","link":"","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/095-writer-result-buffer.md"},{"id":"096","title":"Direct batch parameter encoding","file":"096-direct-batch-param-encoding.md","date":"2026-04-23","status":"rejected","impact":"Large batch medians only trended down; no accepted-level harness win and too much duplicate parameter-encoding code","link":"","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/096-direct-batch-param-encoding.md"},{"id":"097","title":"One-pass initial stream decode and hash","file":"097-one-pass-initial-stream-hash.md","date":"2026-04-23","status":"accepted","impact":"14-16% faster setup-heavy streaming benchmarks by avoiding the initial stream query replay","link":"","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/097-one-pass-initial-stream-hash.md"},{"id":"099","title":"8-byte-chunked FNV for byte-stream cells","file":"099-fnv-8byte-bytestream.md","date":"2026-04-25","status":"rejected","directions":["long-text-stream-hashing","measurement-system"],"outcomeClass":"benchmark_gap","impact":"Structurally sound (folds 8 bytes per multiply on the long-text hash path) but benchmark-invisible — current streaming workloads carry only short cells (≤ 3–8 bytes) that bypass the new main loop. Sa r first-row `NULL` text columns; focused nullable ASCII 10k x8 improves 13.552 → 11.152 ms and 10k x20 improves 25.738 → 21.723 ms while existing ASCII/Unicode wide guardrails stay neutral","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/150.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/150-nullable-batch-packing.md"},{"id":"151","title":"Synchronous writer response resolution","file":"151-sync-writer-response.md","date":"2026-06-09","status":"rejected","directions":["stream-rerun-dispatch"],"outcomeClass":"rejected_below_current_signal","impact":"Switching writer response futures to `Completer<T>.sync()` was a concrete request-resolution attempt against exp 147's residual writer/request bucket, but the formal Tracelite stream-dispatch A/B did not clear the primary gate. High-cardinality fanout changed +2.92%, keyed-PK subscriptions changed +18.5% with too-noisy evidence, and many-streams writer throughput changed +14.0%. No runtime code kept.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/151.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/151-sync-writer-response.md"},{"id":"158","title":"Row schema hash index","file":"158-row-schema-hash-index.md","date":"2026-06-09","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted","impact":"Adds a schema-name identity fast path for schemas up to 32 columns plus private `HashMap` fallback for `RowSchema` lookup; focused `select_maps` main-isolate consumption improved 0.169 → 0.081 ms at 1K rows and 1.998 → 0.967 ms at 10K rows while point-query throughput stayed neutral/noisy","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/158.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/158-row-schema-hash-index.md"},{"id":"159","title":"Writer request pipelining + persistent reply port","file":"159-writer-pipelining.md","date":"2026-06-09","status":"accepted","directions":["stream-rerun-dispatch"],"outcomeClass":"accepted","impact":"**−36% to −45%** on concurrent standalone writes (new focused burst benchmark) by holding the write lock only across the send and letting the worker's port FIFO pipeline requests; persistent reply port + cached SendPort + sync completers remove a port allocate/register/close cycle and two scheduling hops from every write round-trip. Stream-dispatch Tracelite guardrails neutral on the clean order-flipped pass; exp 147 `residual_us` drops on all four audit workloads","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/159.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/159-writer-pipelining.md"},{"id":"161","title":"Concurrent standalone writes release coverage","file":"161-concurrent-writes-release-coverage.md","date":"2026-06-11","status":"accepted","directions":["stream-rerun-dispatch","measurement-system"],"outcomeClass":"accepted_measurement","impact":"Promotes the exp 159 send-gated writer-lock pipelining shape into release write suite coverage with a paired Single Inserts (100 sequential) / Concurrent Single Inserts (100 concurrent) row pair; resqlite concurrent median drops from ~2.9 ms to ~1.1 ms on the new lane (−58% to −61%) while sequential, batch, wide batch, and transaction rows stay untouched. Makes future writer-scheduling experiments evaluable on a public release lane without relying on the focused `writer_pipelining.dart` script","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/161.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/161-concurrent-writes-release-coverage.md"},{"id":"164","title":"EQP rowid dirty elision","file":"164-eqp-rowid-dirty-elision.md","date":"2026-06-14","status":"rejected","directions":["stream-rerun-dispatch","measurement-system"],"outcomeClass":"rejected_no_stable_signal","impact":"Replaced exp 134's custom SQL recognizer with SQLite `EXPLAIN QUERY PLAN` plus native dirty-row harvesting and a private plan cache, but the focused Tracelite initial-drain lane stayed neutral/inconclusive (`stream-initial-drain-rowid` -2.33%) and broader stream guardrails did not produce a stable keyed-PK win. No runtime code kept; implementation preserved at `archive/exp-164`.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/164.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/164-eqp-rowid-dirty-elision.md"},{"id":"167","title":"ResultSet.forEach consumer recheck","file":"167-resultset-foreach-consumer.md","date":"2026-06-12","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected_no_stable_signal","impact":"Re-tested closed exp 141 after exp 158 on a real SQLite-backed consumer lane. The one-method `ResultSet.forEach` override had no stable current win: Pair A `forEach lookup` improved 30.525 -> 28.383 ms, but the longer confirmation reversed to 28.563 -> 30.942 ms, and `forEach length` also reversed. No runtime code kept; the focused benchmark remains for future result-shape rechecks.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/167.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/167-resultset-foreach-consumer.md"},{"id":"169","title":"Tracelite workload-summary insight guard","file":"169-tracelite-workload-insights.md","date":"2026-06-14","status":"accepted","directions":["measurement-system"],"outcomeClass":"accepted_measurement","impact":"Adds a Resqlite-side validation step to `benchmark/profile/run_tracelite_profile.dart` so canonical profile runs fail if `tracelite explain` regresses to coverage-only output. The validated profile emitted dispa aited −2.3% / +2.5%, transaction-guardrail −7.5% / +6.1%, concurrent-burst +4–5% both passes). The theoretical ~1–2 µs/call saving sits at or below the focused-harness floor. No runtime code kept; exp 159's \"the residual is the round-trip floor itself; further reduction needs group commit or a different transport\" framing stands.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/171.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/171-resolved-runtime-cache.md"},{"id":"172","title":"Long-payload stream hash coverage","file":"172-long-payload-stream-hash.md","date":"2026-06-15","status":"accepted","directions":["long-text-stream-hashing","measurement-system"],"outcomeClass":"accepted_measurement","impact":"Adds a default streaming-suite row for mixed 32KB TEXT + 32KB BLOB unchanged fanout plus long-BLOB hash correctness coverage. The mixed row lands at 3.446 ms median beside the existing 4KB TEXT row at 2.356 ms, closing the long-payload measurement blocker without justifying an immediate new hash-loop variant","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/172.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/172-long-payload-stream-hash.md"},{"id":"173","title":"32 KB long-text streaming benchmark + 16-byte FNV fold","file":"173-long-text-32kb-hash.md","date":"2026-06-15","status":"rejected","directions":["long-text-stream-hashing"],"outcomeClass":"rejected_no_signal","impact":"Filled the open `long-text-stream-hashing` candidate by building the missing ≥32 KB cell workload, then tested an unrolled 16-byte FNV body inside `fnv_combine_bytes` against it. Two order-flipped passes showed the candidate consistently +4.5 % and +12.1 % vs the exp 110 8-byte body — slight regressions inside a 2.6 → 6.0 ms per-pass spread, no real signal. Premise refuted: at 32 KB on a pool-of-4 reader fleet the byte-stream fold is at most ~50 % of wall, so loop-overhead removal is below noise. C body reverted to exp 110's path; new `streaming.dart` 32 KB section, `workload_registry.dart` curated metric, and focused `benchmark/experiments/long_text_32kb_hash.dart` harness retained as the durable contribution.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/173.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/173-long-text-32kb-hash.md"},{"id":"174","title":"selectBytes native-view transfer","file":"174-selectbytes-view-transfer.md","date":"2026-06-15","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted","impact":"`selectBytes` sends a `Uint8List` view over the reader connection's persistent `json_buf` and never takes the sacrifice (Isolate.exit + reader respawn) path. Sacrifice is a real win for the rows path (zero-copy object transfer) but counterproductive for bytes — native JSON must be `fromList`-copied before `Isolate.exit` can transfer it, so it saved zero copies and only added a respawn, while the non-sacrifice path copied twice. **−44% (~1.8×)** on large (>256KB) byte reads by eliminating the per-query respawn, **−4%** on small, at a bounded ~+15MB RSS high-water. Net code removal, no public API change","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/174.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/174-selectbytes-view-transfer.md"},{"id":"175","title":"Large selectBytes release coverage","file":"175-large-selectbytes-coverage.md","date":"2026-06-16","status":"accepted","directions":["result-transfer-shape","measurement-system"],"outcomeClass":"accepted_measurement","impact":"Adds a named `Large payload (~650KB)` `resqlite selectBytes()` row to the release JSON-bytes suite and curates it as `selectBytes() large bytes`, giving exp 174's native-view transfer path a rele utf8-bind-encoder.md"},{"id":"188","title":"Pre-178 benchmark-run declarations backfill","file":"188-prerun-declarations-backfill.md","date":"2026-06-19","status":"accepted","directions":["measurement-system"],"outcomeClass":"accepted","impact":"Extends [exp 178](178-missing-run-declaration-guard.md) by walking `_benchmarkRunDeclarationCutoff` from `178` back to `1`, so every chartable (accepted/in-review) experiment is now under the missing-run-without-declaration guard. Backfills `**Benchmark Run:**` opt-out headers on the 16 silently-unmapped chartable experiments (003, 004, 007, 008, 009, 037, 038, 083, 116, 118, 119, 125, 126, 136, 161, 172) plus exp 174 (whose existing header was descriptive but did not start with an opt-out keyword). `docs/experiments/history.json` is unchanged for every pre-existing row — only the new exp 188 entry is added. A new unit test (`exp 188 walked the cutoff to 1`) anchors the cutoff change inside the same `findUndeclaredMissingRunExperiments` suite exp 178 shipped. No runtime code.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/188.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/188-prerun-declarations-backfill.md"},{"id":"189","title":"Savepoint name compression","file":"189-savepoint-name-compression.md","date":"2026-06-20","status":"rejected","directions":["transaction-control-paths"],"outcomeClass":"rejected_below_signal","impact":"Replaced depth-specific nested transaction SQL with cached same-name savepoint strings (`SAVEPOINT s`, `RELEASE s`, `ROLLBACK TO s`) and measured it with a new focused `savepoint_name_compression.dart` harness. Best-case control rows trended faster (empty fanout ~-6% both passes; rollback fanout -17% / -13%; deep chain -7% / -8%), but the representative nested-write fanout did not reproduce: -1.3% in the baseline-first pass, then +21.6% slower in the candidate-first pass. Same-name savepoint semantics are not worth carrying for a noisy/non-reproducing write-fanout result. Runtime change reverted; focused harness retained. Future transaction-control work needs to collapse savepoint round trips, not rename/cache per-boundary SQL strings.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/189.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/189-savepoint-name-compression.md"},{"id":"190","title":"selectBytes column-name token pre-encoding","file":"190-selectbytes-col-name-preencode.md","date":"2026-06-20","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted","impact":"Native-side encoder amortization for `Database.selectBytes()`. `write_json_to_buf` in `native/resqlite.c` now pre-builds each column's `\"col\":` / `,\"col\":` token once at first-row time into a per-query scratch buffer, then emits each column on subsequent rows with a single `buf_write` instead of comma + `json_write_string` (SWAR scan + escape walk) + colon — collapsing four `buf_write*` calls per column per row into one on the common ASCII identifier case. Focused `select_bytes_wide_cols.dart` measures **−4% to −11%** across two order-flipped passes on 10k-row × 8 / 20-col shapes, with the 1-row and 100-row regression guards staying inside the sub-µs noise floor; `large_bytes_transfer.dart` (exp 174's focused guard) also moves **−8.7% / −8.2%** on large/small lanes. No public API change; behavior preserved by reusing `json_write_string` for the token build so escape semantics are identical.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/190.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/190-selectbytes-col-name-preencode.md"},{"id":"191","title":"Embedded-NUL public API audit","file":"191-embedded-nul-public-api-audit.md","date":"2026-06-21","status":"accepted","directions":["parameter-encoding-and-binding"],"outcomeClass":"accepted_correctness_guard","impact":"Correctness guard for the remaining public text surfaces in `parameter-encoding-and-binding`: `selectBytes()` now has an assertion that SQLite `char(0)` TEXT decodes through native JSON bytes without truncation, and `stream()` now verifies both initial and changed emissions preserve embedded-NUL UTF-8 bytes. No runtime code or benchmark run; this consumes the signal-map's broader embedded-NUL audit candidate while leaving performance candidates unchanged.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/191.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/191-embedded-nul-public-api-audit.md"},{"id":"192","title":"Two-digit table itoa for selectBytes integer columns","file":"192-two-digit-itoa.md","date":"2026-06-21","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted","impact":"Replaces the single-digit `fast_i64_to_str` body ([exp 023](023-fast-itoa.md)) with a two-digit `[00..99]` lookup table — one `% 100` / `/ 100` and one 2-byte `memcpy` per pair of output digits, halving the division count vs the old loop. Focused `select_bytes_int_heavy.dart` A/B (order-flipped pair): **10k × 8 small ints −11 %, 10k × 20 small ints −8 to −10 %, 10k × 20 big ints (~18 digits) −24 to −26 %**, with mixed-cell and small-payload regression guards inside ±1 %. Adds a 200-byte `kTwoDigits` `const` table; `LLONG_MIN` handling and the `val == 0` short circuit preserved bit-for-bit; new end-to-end int-extremes test covers 0, ±9, ±99, ±10000, ±1234567890, LLONG_MIN, LLONG_MAX through `selectBytes()`","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/192.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/192-two-digit-itoa.md"},{"id":"193","title":"Row.values list-view iterator","file":"193-row-values-list-view.md","date":"2026-06-22","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected_regression","impact":"Tried replacing `Row.values`' custom `_RowValueIterator` with a fixed-length `ListBase` slice view after a JIT `row_map_facade` sample suggested values iteration was slower than `LinkedHashMap.values`. The JIT signal did not reproduce cleanly, and the decisive AOT check reversed it: baseline `_RowValueIterator` values iteration stayed at 2.663 / 2.675 / 2.687 ms, while the list-view candidate regressed to 6.828 / 6.847 / 7.101 ms (~2.6x slower). Controls stayed neutral. No runtime code kept; future `Row.values` changes should compile the focused harness to AOT before trusting JIT microbenchmarks.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/193.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/193-row-values-list-view.md"},{"id":"194","title":"Integer-valued REAL selectBytes fast path","file":"194-real-integer-fastpath.md","date":"2026-06-23","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted","impact":"Adds a conservative `SQLITE_FLOAT` JSON helper that routes finite, exactly integral REAL values inside the exact double integer range (`abs(v) <= 2^53`) through the existing `fast_i64_to_str` path while preserving `snprintf(\"%.17g\")` for fractional values, huge values, non-finite values, and negative zero. Focused `select_bytes_real_int_fastpath.dart` A/B (order-flipped pair): **10k x 8 integral REAL -79%, 10k x 20 integral REAL -81%, 1k x 2 integral REAL -72%**, with the fractional-REAL fallback guard flat at +0.5% and the mixed lane moving in proportion to its integral-REAL columns. No public API change; new selectBytes test covers integral REAL, fractional REAL, and huge fallback values.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/194.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/194-real-integer-fastpath.md"},{"id":"195","title":"Stmt-cache pre-encoded JSON column-name tokens","file":"195-stmt-cache-name-tokens.md","date":"2026-06-23","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted","impact":"Extends [exp 190](190-selectbytes-col-name-preencode.md)'s per-query token amortization across re-executions of the same prepared SQL by caching the encoded `\"name\":` / `,\"name\":` tokens on the `resqlite_cached_stmt` entry. Eliminates the per-query `buf_init(64)` + `free` pair and the first-row pre-encode walk from `write_json_to_buf`; the per-row loop is bit-identical to exp 190 and JSON output is byte-identical. Focused `select_bytes_repeated_calls.dart` 1-row × 20-col improves **−9.2 % / −7.2 %** and 10-row × 20-col improves **−5.1 % / −2.7 %** across two order-flipped passes, while 100/1000-row guards show sign reversal (drift-suspected — per-query setup is < 0.2 % of wall at those sizes). Exp 190's `wide_cols.dart` shapes trend candidate-faster on every 10k-row lane across both passes. No public API change, ~hundreds of bytes per cached statement","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/195.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/195-stmt-cache-name-tokens.md"},{"id":"196","title":"selectBytes inter-row framing batch","file":"196-selectbytes-row-framing.md","date":"2026-06-23","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected_below_signal","impact":"Batching the per-row `}` + `,` + `{` into one `buf_write` is below the noise floor — structural delimiters are a tiny share of encoder wall versus the per-cell value formatters and `json_write_string`. No runtime code kept.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/196.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/196-selectbytes-row-framing.md"},{"id":"197","title":"True group commit moonshot","file":"197-true-group-commit-moonshot.md","date":"2026-06-23","status":"rejected","directions":["stream-rerun-dispatch"],"outcomeClass":"rejected_preserved_potential","impact":"Moonshot: Wrapping a coalesced standalone write burst in one SQLite transaction makes the focused concurrent-burst lane roughly 8x faster (-88.1% / -87.3%) while sequential writes and explicit transaction guardrails stay neutral. Rejected as a hidden default because it changes independent-autocommit visibility, durability, and failure semantics; prototype preserved at `archive/exp-197`.","link":"","class":"moonshot","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/197.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/197-true-group-commit-moonshot.md"},{"id":"198","title":"Direct-to-buffer integer/float JSON formatting","file":"198-direct-buf-int-float-json.md","date":"2026-06-24","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted","impact":"Removes one short `memcpy` and one `buf_write` indirection per INTEGER or FLOAT cell inside `write_json_to_buf` by reserving max-cell capacity once and pointing `fast_i64_to_str` / `fast_double_to_json_num` straight at `b->data + b->len`. Bit-identical JSON; same digit formatters and snprintf fallback. Focused `select_bytes_int_heavy.dart` A/B (order-flipped pair): **10k × 8 small ints −7.2 % / −7.4 %, 10k × 20 big ints (~18 digits) −8.7 % / −9.4 %, 1k × 2 ints −9.5 % / −7.8 %**, with the mixed-row guard inside ±2 %. Focused `select_bytes_real_int_fastpath.dart` A/B inherits the win on integer-valued REAL: **10k × 8 integral reals −8.6 % / −8.8 %, 10k × 20 integral reals −7.5 % / −7.6 %**, fractional-REAL guard within ±1.5 %. Existing int-extremes (`LLONG_MIN`/`LLONG_MAX`) and real-integer-valued selectBytes tests pass unchanged; no public API change.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/198.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/198-direct-buf-int-float-json.md"},{"id":"199","title":"Row-level capacity reservation in write_json_to_buf","file":"199-row-level-buf-ensure.md","date":"2026-06-25","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted","impact":"Closes the per-cell `buf_ensure` stack [exp 195](195-stmt-cache-name-tokens.md) and [exp 198](198-direct-buf-int-float-json.md) left in place: a single row-level `buf_ensure` covers the row prelude, every cached column-name token, the per-cell fixed-size upper bound, and the trailing `}`, and the inner loop writes NULL / INTEGER / FLOAT cells directly into `b->data + b->len` without a per-cell ensure. TEXT / BLOB cells stay on their existing helpers and re-ensure remaining headroom afterwards. Bit-identical JSON. Focused `select_bytes_int_heavy.dart` A/B (order-flipped pair): **10k × 8 small ints −1.6 % / −4.0 %, 10k × 20 small ints −6.8 % / −2.8 %, 10k × 20 big ints −1.7 % / −3.0 %, 1k × 2 ints −3.8 % / −1.9 %**, with the mixed-row guard flat at −0.6 % / −0.6 %. `select_bytes_real_int_fastpath.dart` lanes stay inside ±1 % (integer-real lanes inherit no extra saving over exp 198's direct-write, fractional REAL is dominated by snprintf). `select_bytes_wide_cols.dart` int-only lanes reproduce −2.4 % / −3.8 %. No public API change.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/199.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/199-row-level-buf-ensure.md"},{"id":"200","title":"Stable-Type selectBytes moonshot","file":"200-stable-type-selectbytes-moonshot.md","date":"2026-06-26","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected_semantic_mismatch","impact":"Moonshot: Caching each column's first-row SQLite storage class and skipping `sqlite3_column_type()` on later rows exposed a plausible fixed-shape ceiling in `select_bytes_wide_cols.dart` (candidate faster on the wide integer and mixed lanes), but the integer-heavy harness did not reproduce a clean win and the semantic failure is decisive: an untyped column with row 1 INTEGER and row 2 TEXT serialized as `[{\"v\":1},{\"v\":0}]` instead of `[{\"v\":1},{\"v\":\"abc\"}]`. Rejected as a hidden default; prototype preserved at `archive/exp-200`.","link":"","class":"moonshot","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/200.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/200-stable-type-selectbytes-moonshot.md"},{"id":"201","title":"Base64 quote reservation for selectBytes BLOBs","file":"201-base64-quote-reservation.md","date":"2026-06-27","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected_below_signal_bar","impact":"Tried collapsing `json_write_base64` from quote write + payload ensure + quote write into one `buf_ensure(encoded_len + 2)` with direct quote writes. Rejected: the tiny-BLOB lanes that should expose per-cell framing overhead were flat or sign-flipped (10k x 8 tiny +0.3% / -0.1%, 10k x 20 tiny -2.0% / +0.8%), while the medium/large trend was not enough to explain or keep the runtime change. Prototype preserved at `archive/exp-201`; focused `select_bytes_blob_base64.dart` harness retained for future BLOB encoder work.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/201.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/201-base64-quote-reservation.md"},{"id":"202","title":"TEXT string reservation for selectBytes","file":"202-text-json-string-reserve.md","date":"2026-06-28","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected_below_signal_bar","impact":"Tried reserving `len + 2` once inside `json_write_string` so no-escape TEXT cells could write quote + payload + quote directly. Rejected: the safe ASCII lanes stayed in the +/-2% band and the narrow guard changed sign (10k x 8 short ASCII +0.7% / -0.8%, 10k x 20 short ASCII -0.8% / +0.0%, 1k x 2 short ASCII -0.9% / +1.7%). Prototype preserved at `archive/exp-202`; focused `select_bytes_text_string_reserve.dart` harness retained for future TEXT encoder work.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/202.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/202-text-json-string-reserve.md"},{"id":"203","title":"Per-cell sqlite3_column_value reuse in write_json_to_buf","file":"203-cell-value-cache.md","date":"2026-06-28","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted","impact":"Hoists `sqlite3_column_value(stmt, i)` once per cell inside `write_json_to_buf` and dispatches through `sqlite3_value_type` / `sqlite3_value_int64` / `sqlite3_value_double` / `sqlite3_value_text` / `sqlite3_value_bytes` / `sqlite3_value_blob` instead of repeating `sqlite3_column_*`. The SQLite amalgamation defines `sqlite3_column_*` as `sqlite3_value_* ∘ columnMem`, so each per-cell access currently runs a fresh `columnMem` lookup (mutex enter/leave + result-row range check, no-op on SQLITE_OPEN_NOMUTEX connections but still function calls) plus `columnMallocFailure` (`sqlite3ApiExit`). Hoisting collapses 2-3 `columnMem` calls per cell into 1; output is bit-identical. Safe because resqlite opens every connection with `SQLITE_OPEN_NOMUTEX` and dedicates each connection to one isolate worker, so the SQLite `unprotected sqlite3_value` multithread warning does not apply. Two order-flipped focused passes reproduce same-direction wins: `select_bytes_int_heavy.dart` **−0.9 % to −4.7 %** on integer lanes, `select_bytes_real_int_fastpath.dart` **−3.1 % to −6.1 %** on integral-REAL lanes (fractional-REAL guard inside ±1 %, confirming the saving is FFI-lookup-shaped and not noise — `snprintf(\"%.17g\")` dominates that lane), `select_bytes_wide_cols.dart` **−1.3 % to −6.1 %** on int / mixed wide lanes, `large_bytes_transfer.dart` **−2.0 % to −3.8 %** on the large/small TEXT lanes. ~10 net additional lines of C; no public API change.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/203.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/203-cell-value-cache.md"},{"id":"204","title":"UTF-8 over-reserve bind sizing","file":"204-utf8-overreserve-bind.md","date":"2026-06-29","status":"rejected","directions":["parameter-encoding-and-binding"],"outcomeClass":"rejected_preserved_potential","impact":"Tried skipping the exact `_utf8Length` prepass for non-ASCII single-row binds by reserving `ascii_prefix + 3 * remaining_utf16_code_units` and letting `_writeUtf8` record the actual byte count. Rejected: CJK 64 KB through 1 MB binds improved in both orderings (-6% to -12%), and the micro showed the Unicode sizing pass is real work (-20%), but the policy can over-allocate badly for mixed Unicode/ASCII or two-byte text. Prototype preserved at `archive/exp-204`; no runtime change kept.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/204.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/204-utf8-overreserve-bind.md"},{"id":"205","title":"per-cell `sqlite3_column_value` reuse in `resqlite_step_row`","file":"205-step-row-value-cache.md","date":"2026-06-29","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted","impact":"Mirrors exp 203's per-cell `sqlite3_column_value` cache pattern into `resqlite_step_row` (rows path), `resqlite_step_row_hash` (initial-stream hash decoder), and `resqlite_query_hash` (unchanged-fanout stream hash loop). Focused `select_rows_step_row_ffi.dart` shows the rows-path `Database.select` decode runs roughly 1-6% faster on 10k-row x 8/20 INTEGER and short-TEXT shapes plus the standard mixed schema, with the sign preserved across two order-flipped passes. Same correctness story as exp 203: `SQLITE_OPEN_NOMUTEX` + single-isolate worker makes the unprotected `sqlite3_value*` safe.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/205.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/205-step-row-value-cache.md"},{"id":"206","title":"selectBytes column-count cache","file":"206-selectbytes-col-count-cache.md","date":"2026-06-30","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected_below_signal_bar","impact":"Tried reusing exp 195's cached `json_name_tokens_col_count` so hot repeated `selectBytes()` calls skip one `sqlite3_column_count(stmt)` per execution. Rejected: the first two focused repeated-call pairs looked candidate-faster, but the warmed pair flipped the load-bearing 1-row and 10-row lanes candidate-slower while larger guards were flat. Prototype preserved at `archive/exp-206`; no runtime change kept.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/206.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/206-selectbytes-col-count-cache.md"},{"id":"207","title":"stmt_cache hot-SQL fast-path bypass","file":"207-stmt-cache-hot-sql-fastpath.md","date":"2026-06-30","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected_below_signal_bar","impact":"Tried short-circuiting `stmt_cache_lookup_entry`'s linear scan with a `last_lookup` pointer set to the most recently matched (or just-inserted) entry, so a hot loop on one SQL skips re-scanning every other cached entry on every call. Rejected: three order-flipped pairs on the new `stmt_cache_hot_sql.dart` harness show no candidate-faster median on any cache-pressure lane, and a reproduced +6% to +30% slowdown on the very lanes the fast-path was meant to help. The `sql_len` short-circuit already makes the existing scan very cheap; the added branch + cache-line shift in `resqlite_stmt_cache` outweighs whatever the fast-path saves. Prototype preserved at `archive/exp-207`; the new focused harness is the lasting deliverable.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/207.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/207-stmt-cache-hot-sql-fastpath.md"},{"id":"210","title":"reused BLOB batch workload and object-identity prototype","file":"210-reused-blob-batch-workload.md","date":"2026-07-02","status":"rejected","directions":["parameter-encoding-and-binding","measurement-system"],"outcomeClass":"rejected_preserved_measurement","impact":"Added focused and Tracelite workload coverage for reused large-BLOB `executeBatch` matrices, then tested a private object-identity reuse prototype that copies each repeated 1 KB+ `Uint8List` once in the native parameter arena. Rejected: marshal-only lanes improved -29% to -46%, but the traced `blob_merge_rounds` workload regressed (`executeBatch` p50 909 us -> 1177 us, writer SQLite time +23.3%), so the identity-map overhead does not survive end-to-end writer/SQLite cost. Runtime prototype preserved at `archive/exp-210`; workload coverage is kept as the durable gate.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/210.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/210-reused-blob-batch-workload.md"},{"id":"211","title":"Persistent `queryBytes` out-parameter slots (revisits exp 108)","file":"211-persistent-query-bytes-slots.md","date":"2026-07-02","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted","impact":"Replaces the three per-call `calloc<Pointer<Uint8>>()` / `calloc<Int>()` / `calloc<Int>()` boxes in `queryBytes()` with three per-isolate scratch pointers, so every `selectBytes()` round-trip saves three `calloc` + three `calloc.free` calls. On `select_bytes_repeated_calls.dart` (exp 195), tiny-rowset lanes (1 row × 8/20 int, 1 row × 8 mixed) reproduce candidate-faster at −3.4 % to −6.6 % across two order-flipped passes; the load-bearing 1 row × 20 int lane holds −3.4 % to −4.6 % through a warmed third pair. 100 / 1000-row guard lanes stay inside 1.3 %. Exp 174 large-bytes guard on `large_bytes_transfer.dart` neutral within ±2 µs. Retries exp 108's rejected shape now that exp 195's µs-precision harness resolves the sub-microsecond per-call setup work the release suite could not.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/211.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/211-persistent-query-bytes-slots.md"},{"id":"212","title":"Lazy nested-savepoint materialization moonshot","file":"212-lazy-nested-savepoint-moonshot.md","date":"2026-07-03","status":"rejected","directions":["transaction-control-paths"],"outcomeClass":"rejected","impact":"Moonshot: tested whether nested transactions could defer SAVEPOINT creation and fuse SAVEPOINT + first write into one writer-isolate request, avoiding public API growth while challenging the eager-savepoint assumption. Rejected: empty nested bodies improved sharply (-77.9% / -74.5%), but the representative one-write nested fanout regressed in both orderings (+74.8% / +34.9%), rollback was neutral-to-slower, and the depth-5 chain slowed (+6.3% / +7.2%). Runtime prototype is preserved at `archive/exp-212`; final branch keeps only the evidence.","link":"","class":"moonshot","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/212.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/212-lazy-nested-savepoint-moonshot.md"},{"id":"213","title":"Transaction body write coalescing moonshot","file":"213-tx-body-write-coalescing.md","date":"2026-07-03","status":"rejected","directions":["transaction-control-paths"],"outcomeClass":"rejected_pattern_not_encouraged","impact":"Moonshot: attacks the assumption that every awaited `tx.execute()` inside `db.transaction()` requires its own writer round-trip. Buffered concurrent (Future.wait-inside-tx) execute calls per Transaction and flushed them as a single `MultiExecuteRequest`; the writer's existing handler already tolerates `txDepth > 0` so each statement inherited the outer transaction and per-statement outcomes distributed back to individual futures. A fast path plus a `hasPendingWrites` guard on `drainForClose` held the common sequential-await pattern at pre-213 microtask cost. Focused `tx_body_write_coalescing.dart` measured **tx-burst-future-wait -26% / -31%** across order-flipped passes (ab_drift_check verdict: REPRODUCED); sequential-await, single-write, and interleaved-select lanes all below the 3% effect floor (verdict: neutral). Rejected: the pattern (`Future.wait([tx.execute × N])` specifically inside a transaction) is not one resqlite steers users toward — same-SQL bulk writes have `executeBatch`, different-SQL non-atomic bursts have exp 180's standalone coalescing, and different-SQL atomic bursts are rare. Accepting four load-bearing guards + persistent per-Transaction buffer state on the writer-path hot path for a workload we are not promoting was not worth the maintenance cost. Runtime prototype preserved at `archive/exp-213`; focused harness retained as durable gate for future transaction-body write experiments.","link":"","class":"moonshot","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/213.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/213-tx-body-write-coalescing.md"},{"id":"214","title":"Write result direct-read prototype","file":"214-write-result-direct-read.md","date":"2026-07-04","status":"rejected","directions":["stream-rerun-dispatch","measurement-system"],"outcomeClass":"rejected_preserved_measurement","impact":"Tested a narrow writer-path cleanup that decoded `resqlite_write_result` fields directly from the native pointer instead of creating a typed-list plus `ByteData` view per `executeWrite()` call. Rejected: the focused `write_result_direct_read.dart` harness did not reproduce a stable win across order-flipped passes (pair 1 mixed/small, pair 2 broadly candidate-slower, pair 3 mixed/neutral). Runtime prototype preserved at `archive/exp-214`; the focused harness is retained for future writer-result floor checks.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/214.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/214-write-result-direct-read.md"},{"id":"215","title":"Persistent `executeWrite` result-buffer slot (revisits exp 095)","file":"215-persistent-write-result-slot.md","date":"2026-07-04","status":"rejected","directions":["parameter-encoding-and-binding","measurement-system"],"outcomeClass":"rejected_below_signal","impact":"Consumed exp 211's named revisit condition for exp 095: retested the persistent per-isolate 16-byte writer-result scratch buffer under exp 214's new µs writer harness (`write_result_direct_read.dart`), the mirror of exp 211's reader-side accept. Rejected: candidate `us/call` is stable across four pairs, but the primary order-flipped pair (P1/P2) does not reproduce same-sign candidate-faster on the lowest-baseline lane (P1 noop +1.5 % candidate-slower vs P2 noop -0.9 % faster). Together with exp 214's decode rejection, this closes both Dart-side writer-result micro-optimizations on the µs writer harness. Runtime prototype preserved at `archive/exp-215`.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/215.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/215-persistent-write-result-slot.md"},{"id":"216","title":"Base64 loop unroll for selectBytes BLOBs","file":"216-base64-loop-unroll.md","date":"2026-07-05","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted","impact":"Unrolls the native `json_write_base64` payload loop so each trip encodes four 3-byte groups instead of one. This consumes exp 201's specific BLOB follow-up by targeting the base64 loop rather than quote/framing. Focused `select_bytes_blob_base64.dart` A/B keeps the 4KB BLOB lane candidate-faster across all three passes (-13.6%, -12.9%, -11.9%), keeps 128B BLOBs same-direction faster (-1.1%, -9.3%, -4.7%), and leaves 3B tiny-cell lanes as neutral/noisy guards. Output bytes, padding, JSON framing, and public API are unchanged.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/216.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/216-base64-loop-unroll.md"},{"id":"218","title":"8x base64 loop unroll for selectBytes BLOBs","file":"218-base64-8x-unroll.md","date":"2026-07-06","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected","impact":"Tested widening exp 216's native `json_write_base64` payload-loop unroll from four 3-byte groups per trip to eight. Rejected: the focused `select_bytes_blob_base64.dart` A/B kept the 128B medium-BLOB lane candidate-faster across four passes, but the load-bearing 4KB throughput gate was mixed (-10.0%, +2.0%, -13.6%, +0.8%) and guard lanes lost direction in the final pair. Runtime prototype preserved at `archive/exp-218`; exp 216's 4x scalar unroll remains the portable baseline.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/218.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/218-base64-8x-unroll.md"},{"id":"219","title":"Direct JSON control-character escapes","file":"219-json-control-escape.md","date":"2026-07-07","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted","impact":"Replaces `json_write_string`'s `snprintf(\"\\\\u%04x\")` fallback for unnamed control bytes with direct `\\\\u00XX` emission from a small hex table. Focused `select_bytes_text_string_reserve.dart` A/B adds a control-character TEXT lane and reproduces the target win across the order flip: 35927 -> 6371 us/query (-82.3%) and 35824 -> 6370 us/query (-82.2%). Safe ASCII, named escaped text, mixed rows, and narrow rows stay as guards; JSON bytes and public API are unchanged.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/219.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/219-json-control-escape.md"},{"id":"220","title":"Reject `fast_i64_to_str` 0..9999 direct-write fast path","file":"220-fast-i64-small-direct.md","date":"2026-07-08","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected_below_signal","impact":"Tested a `0..9999` direct-write branch at the top of `fast_i64_to_str` in `native/resqlite.c` that skips the `tmp[]` scratch, sign-normalization branch, and trailing memcpy for the common row-id / small-key / small-count shape. Focused `select_bytes_int_heavy.dart` A/B reproduces the target win on the new small-non-neg lanes (`10k x 20`: -11.6% / -10.4%; `10k x 8`: -10.9% / -9.7%), but the exp-192 mixed-magnitude `small ints` lanes reproduce a small regression (`10k x 20`: +3.4% / +2.9%; `10k x 8`: +2.8% / +2.6%) from the added per-cell compare-and-branch on cells that fall through. Rejected: recent encoder wins (exp 190 / 192 / 194 / 195 / 216) shipped with sub-1% guards, and a reproduced +3% regression on realistic signed-int workloads is not a clear trade without production evidence that `0..9999` INTEGER columns dominate. Runtime prototype preserved at `archive/exp-220`; extended harness is the durable contribution.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/220.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/220-fast-i64-small-direct.md"},{"id":"222","title":"Reject `malloc` for large one-shot parameter arenas","file":"222-param-arena-malloc.md","date":"2026-07-11","status":"rejected","directions":["parameter-encoding-and-binding"],"outcomeClass":"rejected_below_signal","impact":"Tested whether parameter arenas above the 64 KiB reuse cap should use `malloc` instead of `calloc`, since the packer overwrites every field and payload byte C reads before FFI. The existing large single-row bind harness did not reproduce a win: ASCII 256 KiB was candidate-slower in both orderings (+5.9% / +0.2%), while the other 64 KiB-1 MiB ASCII/CJK rows flipped direction and the 1 MiB rows stayed within about 2.5%. Rejected: zero-fill is not a stable, material part of end-to-end bind wall on this machine. Runtime prototype preserved at `archive/exp-222` and reverted from the final branch.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/222.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/222-param-arena-malloc.md"},{"id":"223","title":"Reject row-0 peel + `[{` fuse in `write_json_to_buf`","file":"223-write-json-row-peel.md","date":"2026-07-11","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected_below_signal","impact":"Tested whether peeling row 0 out of `write_json_to_buf`'s row loop (fusing the leading `[` with row 0's `{` into one 2-byte prelude, short-circuiting empty results, and dropping the per-iteration `if (row_index > 0)` branch) would move any measurable selectBytes lane. Two order-flipped passes of `select_bytes_repeated_calls.dart` reproduced small candidate-faster deltas on 10/100 rows (about -1% to -2%) but stayed inside the harness ~3% effect floor; the 1000-row lane collapsed from -1.5% to -0.2% (drift-suspected) and the 1-row × 8-int lane trended candidate-slower on both passes (+0.4%, +4.6%). One pass of `select_bytes_wide_cols.dart` showed the load-bearing 10k × 8 int lane at +5.7% on pair 1, a run-to-run drift signature rather than a real regression. Rejected: the per-row branch is well-predicted and the bracket fuse is byte-count noise, so the reproduced 1-2% wins do not offset the ~60-line encoder-body macro that shares row-0 and row-N cell encoding. Runtime prototype preserved at `archive/exp-223`.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/223.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/223-write-json-row-peel.md"},{"id":"224","title":"Dynamic numeric-row batching moonshot","file":"224-numeric-row-batching-moonshot.md","date":"2026-07-12","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected_below_signal","impact":"Moonshot: challenged the assumption that every `select()` row must cross leaf FFI before SQLite can step again. A dynamic no-copy prototype batched up to 64 contiguous INTEGER/FLOAT/NULL rows into a bounded row-major cell buffer, but returned immediately after any TEXT/BLOB row so SQLite-owned pointers stayed valid. Two order-flipped passes of `select_rows_step_row_ffi.dart` found no numeric win: 10k x 8 INTEGER was +1.9% / +0.5% slower and 10k x 20 INTEGER flipped +4.6% / -0.5%. The 20-column TEXT guard path reproduced a +6.5% / +5.3% regression despite copying no payload bytes. Rejected: leaf crossings are already too cheap for the combined batch-shaped decoder to pay back. Prototype preserved at `archive/exp-224`.","link":"","class":"moonshot","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/224.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/224-numeric-row-batching-moonshot.md"},{"id":"225","title":"12-bit LUT for `json_write_base64`","file":"225-base64-lut12.md","date":"2026-07-12","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted","impact":"Widens `json_write_base64`'s inner-loop lookup from 6 bits (four per triplet) to 12 bits (two per triplet), halving per-triplet loads/stores. Three order-flipped focused passes of `select_bytes_blob_base64.dart` reproduce -26 to -31% on the 4 KB blob lane and -17 to -31% on the 128 B lane; the 3 B tiny-cell guards stay flat (~-0.5 to -0.9%). ~1.3-1.5x faster BLOB base64 encoding for medium and large payloads at the cost of 8 KiB `.bss`.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/225.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/225-base64-lut12.md"},{"id":"226","title":"Reject one-pass numeric batch packing","file":"226-one-pass-numeric-batch.md","date":"2026-07-13","status":"rejected","directions":["parameter-encoding-and-binding"],"outcomeClass":"rejected_below_signal","impact":"Tested removing the remaining payload-sizing scan for fixed-width NULL/INTEGER/FLOAT batch matrices. One-pass packing reproduced marshal-only wins at 10k x 8 (-28.0% / -27.6%) and 10k x 20 (-25.4% / -25.8%), but end-to-end executeBatch stayed below the 5% gate (x20: -3.4% / -1.4%). A final-row TEXT fallback also reproduced a +7.0% / +4.9% regression because the 4.8 MB speculative arena was discarded before the generic retry. Rejected; prototype preserved at archive/exp-226, numeric/adversarial harness modes retained.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/226.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/226-one-pass-numeric-batch.md"},{"id":"227","title":"Inline 16-byte over-copy for JSON column-name tokens","file":"227-json-token-overcopy.md","date":"2026-07-13","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted","impact":"Rewrites the per-column-name token write in `write_json_to_buf` from a runtime-length `memcpy(dst, src, token_lens[i])` — which lowers to a libc `memcpy` call on every column of every row — to a compile-time-constant `memcpy(dst, src, 16)` when the token fits in 16 bytes, which clang / gcc lower to a single 128-bit load-store pair on ARM64 NEON and x86 SSE. `ensure_json_name_tokens` gains 16 bytes of zero-filled trailing padding so the over-read is always in-bounds; the row-start `col_count * cell_max` reservation covers the destination over-write, and only `token_lens[i]` bytes are counted as valid output, so the trailing over-written bytes are overwritten by the immediately following cell payload. Two order-flipped focused passes on `select_bytes_wide_cols.dart` reproduce same-sign candidate-faster on every 10k-row shape (**−3.0 % / −3.3 %** on the primary 10k rows x 20 int cols target; **−5.4 % / −2.1 %** on 10k rows x 20 mixed cols; **−2.2 % / −2.0 %** on 10k rows x 8 int cols); `select_bytes_repeated_calls.dart` reproduces **−2.5 % / −3.2 %** on the 1000 rows x 8 int guard. Long-name tokens (>16 bytes) stay on the runtime-length fallback. JSON bytes are unchanged. ~20 net additional lines of C; no public API change.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/227.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/227-json-token-overcopy.md"},{"id":"228","title":"Restore canonical hashes after stream growth","file":"228-canonical-stream-hash.md","date":"2026-07-14","status":"accepted","directions":["stream-rerun-dispatch"],"outcomeClass":"accepted_correctness_and_performance","impact":"Fixes a stream-baseline correctness bug introduced by exp 077: when a result grew, `resqlite_query_hash` stopped folding cells after the old row count and cached that prefix-only digest as the new baseline, so the next unchanged invalidation decoded and publicly re-emitted all rows once. Exp 228 removes the partial-hash shortcut and its dead private FFI argument, adds direct worker and public-stream regressions, and makes every cached hash canonical. Three order-flipped focused passes move redundant grow-then-no-op decodes from 9/9 to 0/9 and improve the combined cycle by 19-36%; the noisy pure-growth leg stays around parity. No public API change; net runtime simplification.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/228.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/228-canonical-stream-hash.md"},{"id":"229","title":"SIMD (NEON) `json_write_base64` kernel — first SIMD kernel in the codebase","file":"229-simd-base64-neon.md","date":"2026-07-14","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted","impact":"Moonshot: introduces ISA-specific SIMD (`vld3q_u8` + `vqtbl4q_u8` + `vst4q_u8`) to `json_write_base64`, gated on `__aarch64__ && __ARM_NEON`, with the exp 225 scalar 12-bit-LUT encoder retained as fallback for non-ARM64 targets and for the < 48-byte tail. Four order-flipped paired passes of `select_bytes_blob_base64.dart` reproduce ~-45% median on the 4 KB payload-throughput lane (roughly 2x faster BLOB base64 encoding) and ~-18% on the 128 B lane; tiny-cell (3 B) and mixed guards stay inside the harness noise floor. Categorical implication: SIMD kernels are viable in resqlite when out-of-lined so the small-input path is unaffected, unlocking follow-ups in SSSE3 x86_64, SIMD JSON escape scan, and SIMD FNV hash.","link":"","class":"moonshot","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/229.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/229-simd-base64-neon.md"},{"id":"230","title":"Reject AArch64 NEON JSON safe-prefix scan + copy","file":"230-neon-json-scan-copy.md","date":"2026-07-15","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected_below_signal_bar","impact":"Moonshot: fused AArch64/NEON JSON escape classification and safe-prefix copying for long TEXT. The mechanism reproduced 33.6-34.1% wins at 1 KiB and 25.2-25.5% on CJK, but the load-bearing 256 B lane moved -17.7% then only -12.6%, missing the predeclared 15% gate in the order flip. Rejected; runtime preserved at archive/exp-230 and reverted, while long safe/early-/late-escape harness lanes plus an exact dart:convert boundary oracle remain.","link":"","class":"moonshot","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/230.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/230-neon-json-scan-copy.md"},{"id":"231","title":"Reject AArch64 NEON integer→decimal kernel","file":"231-neon-i64-decimal.md","date":"2026-07-15","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected_below_signal_bar","impact":"Moonshot: an out-of-lined AArch64/NEON i64→decimal kernel that breaks the scalar two-digit loop's serial /100 chain by formatting three independent 8-digit groups in parallel (byte-identical, gated ≥ 1e8). Across 11 focused A/B passes in three methodologies the ~18-digit BIGINT selectBytes lane never leaned candidate-faster (+1.2/+6.0/+9.8% baseline-first, +11.3% min-of-N, ~flat only in the one quiet pair) while identical-code controls drifted ±10-120%. Rejected: exp 229's out-of-line ISA-kernel win amortises SIMD setup over a whole BLOB per call, but the integer formatter converts one scalar value per call with nothing to amortise. Runtime reverted to archive/exp-231; the new i64 differential test (first direct coverage of the integer formatter) is kept.","link":"","class":"moonshot","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/231.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/231-neon-i64-decimal.md"},{"id":"232","title":"Reject exac
