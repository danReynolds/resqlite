r, and each worker-free event wakes exactly one — not a shared future every parked dispatcher observes, which is how a wake storm starts.","The interesting part of the lifecycle is what happens when a result is large enough to sacrifice. The worker calls `Isolate.exit` with the result, and its slot goes unavailable until a replacement isolate spawns, opens its connection, and publishes a new port. Both the payload and the exit notification arrive on the same port, so FIFO ordering guarantees the result is processed before the death is — which is what makes the whole scheme race-free rather than merely usually-correct."]},{"h":"Why the respawn is affordable","ps":["The obvious worry is that sacrifice starves the pool: kill a quarter of your read capacity on every large result and queueing should get worse. It does not, and the measurement that settles it is a barrier burst — eight identical large reads released simultaneously against four workers, so four run and four park, with the pool torn down and rebuilt between bursts to keep each measurement independent.","The lane with sacrifice *disabled* had the highest parked queue-wait, roughly 19% worse [[244.1]]. The reason is mechanical: without sacrifice, the worker performs a full per-slot copy of the result before it can accept the next request, and that copy occupies the slot longer than an exit plus a respawn that overlaps with three other workers still serving. An eager-respawn variant — starting the replacement before completing the caller — measured inert, because the respawn was never on the parked caller's critical path.","Admission itself is clean. The historical parking signal that looked like pool pressure was over-dispatch upstream in the stream engine [[120.1]], and after that fix every measured workload reports zero parking."]},{"h":"Memory, and the buffer that outlives the query","ps":["`selectBytes` writes its JSON into a per-reader native buffer that persists across queries — which is what makes the result a view rather than a copy [[174.1]]. That buffer only ever grew, so a single 8 MB read left 8 MB pinned per reader for the life of the connection, and a concurrent burst could pin 32 MB across the pool permanently.","The fix is a reclaim policy with an observable signal: buffers above a 1 MB cap shrink after a query whose result was small, and `Diagnostics.readerJsonBufHighWaterBytes` exposes the aggregate so any downstream user or benchmark can see it [[183.1]]. Tuning should raise the trigger before touching the guard — the guard is what prevents thrash under alternating large and small reads.","Large blob *cells* take the boundary's wrap route rather than the copy route, which is what stopped blob-heavy reads from sacrificing a reader on every call [[236.1]], and the sacrifice trigger itself now keys on slot count so text-heavy results stop misrouting into needless respawns [[246.1]]."]},{"h":"The opportunity we are not taking","ps":["Batching parked point-reads into pool-sharded envelopes measured 26–33% on bursts of twenty small reads, and sharding across the pool avoided the one-worker collapse that killed an earlier version of the idea [[239.1]]. It is not shipped. The gain is real but the mechanism adds a second dispatch path with its own capping and fairness rules, and the public API offers no way to ask for it — the honest position is that it waits for a workload that demands it rather than being adopted because it is available."]}]},{"id":"writer","section":"architecture","zone":"workers","kicker":"worker isolate","name":"Writer · binding & batching","summary":"SQLite permits one writer at a time. Rather than fight that with locking schemes, resqlite embraces it: every write in the process routes through a single persistent writer isolate that owns the write connection, processes messages sequentially, and holds transaction state across them.","dirs":["parameter-encoding-and-binding"],"feeds":["tx","native"],"diagram":"writer","sections":[{"lede":true,"ps":["SQLite permits one writer at a time. Rather than fight that with locking schemes, resqlite embraces it: every write in the process routes through a single persistent writer isolate that owns the write connection, processes messages sequentially, and holds transaction state across them. Serialization is not a bottleneck imposed on the design — it is the design, and the optimization work happens *inside* the serial path rather than trying to escape it.","Three public shapes reach it. `execute` sends one statement. `executeBatch` sends one statement with many parameter sets and runs the entire matrix inside C. `transaction` opens an interactive session where the callback runs on main and each statement round-trips."]},{"h":"Binding without allocating","ps":["Parameter encoding is where most of the writer's measured wins live, and they share one shape: remove an intermediate Dart allocation by writing UTF-8 payloads straight into the native arena.","The batch path went first. A guarded ASCII fast path removed a per-string allocation across wide batches [[125.1]], and the follow-up extended the same treatment to non-ASCII by writing UTF-8 directly with private surrogate-pair handling — worth 13.5% on Unicode and 27.8% on emoji at 10k×20 [[126.1]]. Embedded NULs survive correctly because byte lengths are preserved through the bind rather than inferred.","The single-row path followed once a workload existed to show it mattered. Below tens of kilobytes the difference is noise; from 16 KB upward it is 15–32% for ASCII [[186.1]] and 31–39% for CJK [[187.1]]. That gap between \"the encoder is faster\" and \"the workload notices\" is worth naming — an earlier version of this change was rejected precisely because only a micro-benchmark could see it, and it was reopened when the right workload was built."]},{"h":"Blobs, aliasing, and coalescing","ps":["Large blob parameters take the boundary's wrap route: one copy into external memory, then an ownership move instead of a graph copy [[234.1]].","Wrapping is identity-keyed, and that detail is load-bearing rather than an optimization. The graph copier preserves object identity — pass the same buffer to two positions and it is copied once and aliased twice. Naive per-occurrence wrapping broke that property, duplicating one buffer into N external copies and making the wrapped path *worse* than the copy it replaced. Keying wrappers by buffer identity across the whole message envelope restores it, so a blob reused across the writes of a coalesced group crosses exactly once [[243.1]] ([[test:test/blob_alias_table_test.dart#blob reused across writes shares one wrapper across the group@12nn]]).","Concurrent standalone writes coalesce into a single envelope per round trip. That is why the identity table has to span the envelope rather than a single statement — the reuse case it exists for is precisely a caller looping `execute` with the same buffer.","Batch blobs deliberately do **not** wrap. Measured on a blob-heavy `executeBatch`, wrapping regressed: the win depends on many independent round-trips each parking a fresh allocation while the writer is mid-step, and a batch has one round trip [[237.1]]. The absence of wrapping there is a decision with evidence behind it, not an oversight."]},{"h":"Dirty tracking rides along","ps":["The writer connection installs SQLite's preupdate hook, so every insert, update, and delete records its table into a deduplicated set that returns *with the write response*. There is no separate notification channel and no polling — stream invalidation is a field on a reply the caller was already waiting for. Inside a transaction the set accumulates and returns at commit; a rollback discards it without waking anything ([[test:test/transaction_test.dart#stream does not fire after rolled-back transaction@15oy]])."]}]},{"id":"tx","section":"architecture","zone":"workers","kicker":"writer subsystem","name":"Transactions","summary":"A transaction holds the writer for the duration of its body. Nesting maps onto SQLite savepoints ([[test:test/transaction_test.","dirs":["transaction-control-paths"],"feeds":["native"],"diagram":"tx","sections":[{"lede":true,"ps":["A transaction holds the writer for the duration of its body. Nesting maps onto SQLite savepoints ([[test:test/transaction_test.dart#db.transaction() inside a transaction nests via savepoint@1lvw]]). The callback runs on the **main** isolate, not the worker — deliberately, because shipping a closure to another isolate would require every captured object to be sendable, a constraint that is trivially violated by accident and produces confusing failures at runtime rather than helpful ones at compile time. So `tx.execute` and `tx.select` are ordinary async calls that each round-trip to the writer, and the callback stays ordinary Dart code.","Reads inside a transaction run on the *writer's* connection rather than the reader pool, because uncommitted writes are visible only to the connection that made them ([[test:test/transaction_test.dart#db.select() inside a transaction sees uncommitted writes@1nrc]])."]},{"h":"The floor that shapes everything","ps":["This subsystem's measured truth is humbling, and it has closed more experiments than any other area: **the per-statement isolate round trip dominates transaction control**, and almost every clever optimization dissolves against it.","Caching control statements was a genuine win — top-level transaction control had real prepare/finalize work to remove [[101.1]]. After that, the record is a sequence of well-reasoned ideas that measured below the floor:","Savepoint string allocation is below the decision threshold even at 50 savepoints per iteration, a deliberately worst-case shallow fan-out [[111.1]]. Compressing savepoint names to reuse cached SQL moved best-case control rows 6–17%, but the representative nested-write fanout — the row that actually matches production shape — failed to reproduce across the order flip [[189.1]]. Lazy savepoint materialization helped only empty transaction bodies, and fusing `SAVEPOINT` with the first execute regressed the meaningful shape in both pass orders [[212.1]].","The most instructive rejection is the last one. Buffering `Future.wait([tx.execute × N])` into a single envelope against the open transaction *worked* — it removed the round-trip floor for that shape and measured a real improvement. It was rejected anyway, on the grounds that the pattern has no idiomatic home in the API: same-SQL bulk atomic writes belong on `executeBatch`, which already runs the whole matrix in C, and different-SQL bursts are covered by standalone coalescing [[213.1]]. Optimizing a pattern the library does not want to encourage would have made that pattern faster and more attractive at once."]},{"h":"What that implies","ps":["If transaction control ever needs to get materially faster, the target is the round-trip floor itself — not the statements around it. That means something structural: a protocol that lets a bounded, statically-known sequence cross once, without inviting callers into an anti-pattern. Nothing currently justifies it; the record above exists so the next attempt starts from the floor rather than rediscovering it."]}]},{"id":"native","section":"architecture","zone":"native","kicker":"native layer","name":"SQLite · encoders · WAL","summary":"Underneath every isolate sits `native/resqlite.c` and a vendored SQLite — specifically sqlite3mc, which adds encryption — compiled through Dart's native assets build hooks.","dirs":["sqlite-version-and-build-config"],"feeds":[],"diagram":"native","claims":["229.1","250.1","110.1","183.1","016.1","044.1"],"sections":[{"lede":true,"ps":["Underneath every isolate sits `native/resqlite.c` and a vendored SQLite — specifically sqlite3mc, which adds encryption — compiled through Dart's native assets build hooks. The division of labour is the library's first principle: **C owns the state, Dart owns the orchestration.** Connections, prepared-statement caches, mutexes, and hooks live in C structs that outlive any particular Dart isolate, which is exactly why a sacrificed reader is cheap to replace."]},{"h":"What C owns","ps":["The connection pool holds one write connection and N read connections, each with its own statement cache. Connections open with `NOMUTEX`: rather than SQLite locking around every individual API call, resqlite takes one lock around a whole query. On a large result that replaces tens of thousands of lock/unlock pairs with one acquire and one release.","Row decoding is batched across the FFI boundary. `resqlite_step_row` advances the statement and fills a pre-allocated cell buffer with every column's type and value in one call, so Dart reads a typed buffer instead of making an FFI call per column. Integers and doubles come back as direct native reads; text still becomes Dart strings, which is unavoidable for a map-shaped API — and is precisely the cost `selectBytes` exists to skip by encoding JSON in C and never building Dart objects at all.","Two hooks make reactivity work without SQL parsing: the authorizer on readers records what a query read, and the preupdate hook on the writer records what a write changed. SQLite reports the truth about joins, views, CTEs, triggers, and cascades so resqlite does not have to infer it."]},{"h":"Compile-time positions","ps":["Build configuration is settled and deliberately conservative. The tuned flag set with `prepare_v3` is accepted — individually unmeasurable savings that stack [[016.1]] — as is `SQLITE_ENABLE_BATCH_ATOMIC_WRITE`, a zero-risk flag that activates through VFS capability detection on Android F2FS and does nothing elsewhere [[044.1]].","Version policy is evidence-driven rather than temperamental: track sqlite3mc point releases and never adopt a fresh `.0` [[090.1]]. When 3.53.0 shipped a default floating-point rounding change, the audit found it cannot reach resqlite's output at all, because REAL values never pass through `sqlite3_column_text` — so the proposed mitigation shim was unnecessary [[144.1]]. That is the pattern: check whether the hazard reaches *this* code path before paying for a defense."]},{"h":"Where machine code earned its place","ps":["The JSON encoders are the one area where resqlite spends real instruction-level effort, because `selectBytes` makes them the whole cost of a read.","Base64 encoding for blobs went through scalar unrolling, then a 12-bit pair lookup table, then a NEON `vqtbl4q_u8` kernel gated on `__aarch64__` with the scalar LUT retained as fallback — roughly 2× on payload-throughput lanes [[229.1]], which is what holds the large-payload read at [[bench:Select → JSON Bytes / Large payload (~650KB) / resqlite selectBytes() ~ 0.24 +-20%]] ms. One implementation detail is preserved as a rule: the SIMD kernel stays `noinline`, because inlining it degraded code generation on the small-input scalar path that most cells actually take.","Integer encoding is the counter-example, and the reason is structural rather than algorithmic. A byte-identical NEON i64-to-decimal kernel never beat the scalar two-digit itoa, because it pays an out-of-line call plus vector setup for a single integer with no cross-cell batching to amortize it — unlike base64, which amortizes across a whole blob. Per-cell integer SIMD is closed until some future architecture batches many integer cells into one call.","Hashing for stream re-queries also lives here: computing the result hash in C during the step loop was a −39% win, and the 8-byte FNV fold has survived every attempt to widen it [[110.1]]."]},{"h":"WAL and checkpointing","ps":["Checkpointing remains inline on the writer. Moving `PASSIVE` work off the writer is genuinely attractive — first threshold-crossing latency improves 53–64% — and an early attempt failed loudly with a checkpoint storm. The diagnosis matters more than the verdict: the storm was a re-arming policy bug, not an inherent property of moving the work, and observed-reset/high-water scheduling fixes it [[250.1]]. The mechanism is documented and parked rather than discarded.","Native memory is observable rather than opaque: the per-reader JSON buffer reclaims above a cap and reports its high-water mark through diagnostics [[183.1]] ([[test:test/diagnostics_test.dart#toString includes all counter fields@q7ik]])."]}]},{"id":"meta","section":"architecture","zone":"native","kicker":"meta","name":"Measurement & method","summary":"Every number in this documentation came through a measurement discipline that had to be learned by getting it wrong first. This chapter is about how resqlite knows what it knows — and it is part of the architecture, because a performance library whose measurements cannot be trusted is a library whose design decisions cannot be trusted either.","dirs":["measurement-system"],"feeds":[],"diagram":"meta","sections":[{"lede":true,"ps":["Every number in this documentation came through a measurement discipline that had to be learned by getting it wrong first. This chapter is about how resqlite knows what it knows — and it is part of the architecture, because a performance library whose measurements cannot be trusted is a library whose design decisions cannot be trusted either."]},{"h":"The gates","ps":["Every A/B runs as order-flipped pairs, and drift detection is built into the statistics rather than applied by judgment. Two signatures kept recurring in writeups until they were encoded: CV asymmetry, where the flagged phase's coefficient of variation is several times its clean phase's, and sign reversal across the flip. Both now classify automatically [[177.1]]. Before that, every A/B re-derived the same reasoning by hand, and the failure mode was silent — an experiment that measured drift and reported a win.","Profile runs emit structured, validated evidence with stable insight IDs, so a half-empty artifact exits non-zero instead of looking complete [[143.1]] [[169.1]]. Every chartable experiment must link a benchmark run or explicitly declare why it has none; a silently unmapped result is a CI error, which closed a gap where roughly eighteen accepted experiments had quietly dropped off the charts [[178.1]]."]},{"h":"The lesson that generalized","ps":["The deepest methodological result came from a question that resisted measurement for months: is sacrificing a reader worth it?","The obvious experiment — alternate send and sacrifice inside one live pool — is invalid, and understanding *why* is the transferable part. Sacrifice is a state-changing treatment: each firing kills a worker, triggers a respawn, and clears statement caches. Measurement *i* therefore changes the conditions of measurement *i+1*, and the accumulated respawn state biases toward the sacrifice lane. No amount of re-running fixes it, because the instrument is confounded rather than noisy.","The answer came from splitting the question into estimands and measuring each in isolation: intrinsic transfer via a prepared-result barrier with one fresh process per observation, and pool capacity via a barrier burst with the pool rebuilt between samples [[241.1]]. That decomposition is now the standard approach for anything that mutates its own environment.","A second habit came out of the same arc: when a candidate has a mechanically unreachable configuration, add it as an explicit control lane. Lanes running identical code on both sides read the harness's noise floor directly, which settles verdicts without collecting more primary-lane samples."]},{"h":"Proportion, before optimization","ps":["The most useful thing measurement has produced recently is not a win but a ratio. Intrinsic transfer of a 200k-slot result costs roughly 391 µs against an end-to-end select of about 6,100 µs — so the entire cross-isolate transfer question, four experiments deep, governs 6–12% of a large read.","The other ~90% — SQLite stepping plus building the Dart object graph — has never been decomposed. That measurement is the current frontier, and it is deliberately sequenced before any further transport work, because it decides whether the next optimization belongs in native code or in Dart at all."]},{"h":"Why this is documented at all","ps":["Knowledge decays. This project's failure mode is not forgetting results — they are written down — but citing them after they stop being true. That is what the claims layer beneath this documentation exists to prevent: every assertion above carries a citation into an addressable, dated claim, and when future work supersedes one, the citation turns amber and CI reports which passage needs repair. The facts are machine-owned; the story is human-owned; the seam between them is linted."]}]}];
const HOME = {"title":"resqlite","tagline":"High-performance, reactive SQLite for Dart and Flutter.","sections":[{"lede":true,"ps":["resqlite is a SQLite library built around a single constraint: **the main isolate must never block.** Every read, every write, and every reactive re-query runs on a persistent worker isolate. The main isolate receives finished results and nothing else.","You write plain SQL. There is no ORM, no query builder, and no code generation."]},{"h":"What using it looks like","ps":[{"code":"final db = await Database.open('app.db');\n\n// Reads and writes stay off the UI thread.\nfinal users = await db.select('SELECT * FROM users WHERE active = ?', [1]);\nawait db.execute('INSERT INTO users(name) VALUES (?)', ['Ada']);\n\n// Reactive queries. Dependencies are detected from the SQL itself —\n// JOINs, subqueries, views and CTEs all work, with no table lists to maintain.\nvar activeUsers = <Map<String, Object?>>[];\ndb.stream('SELECT * FROM users WHERE active = ?', [1]).listen((rows) {\n  // Rebuild your UI here — in Flutter, setState(() => this.users = rows).\n  activeUsers = rows;\n});","lang":"dart"},"That is close to the entire public surface: `select`, `selectBytes`, `execute`, `executeBatch`, `stream`, and `transaction`. Everything in the pages that follow exists to make those six calls cheap."]},{"h":"The shape of the system","ps":["Work moves through three zones. Your code calls `Database` on the main isolate; that call is routed to a worker; the worker talks to SQLite through C; the result travels back across the isolate boundary.","The interesting part is the boundary itself. Dart isolates share no mutable state, so *nothing crosses for free* — and the cost of crossing differs by orders of magnitude depending on what is being moved. Most of this library's design is a consequence of that one fact."]},{"h":"The two constraints","ps":["Almost every decision documented here follows from two forces. If you internalise them, you can usually predict what the code does in places these pages never mention.","**Main-isolate time is the scarce resource.** Wall-clock time matters, but a frame budget is 16ms and anything the main isolate does inside that window competes with rendering. A design that is slower overall but moves work off the main isolate is usually the better trade — which is why results are decoded on workers, and why the API is asynchronous even where a synchronous version would be faster end-to-end.","**Isolates share no mutable state.** Dart's data-race-free guarantee means every result must be *transferred*, not shared. Sending a message shares immutable objects like strings and numbers by reference, but copies mutable ones slot by slot. So the price of a query result tracks the number of cells in it, not the number of bytes — a fact that took several experiments to establish and that quietly determines the shape of the read path, the write path, and the stream engine alike."]},{"h":"Explore the architecture","ps":[]},{"h":"How we know any of this","ps":["The claims on these pages are not opinions. Each one is attached to a numbered experiment with a recorded date, hardware, and method, and the citation chips throughout the prose expand to show that provenance in place.","The system is deliberately biased toward recording failure. Most performance ideas do not survive measurement, and an idea that was tried and rejected is more valuable to write down than one that worked — it is the thing that stops the same week being spent twice. Rejected experiments are kept, numbered, and cited exactly like accepted ones.","Beliefs are also allowed to die. When a later experiment supersedes or refutes an earlier one, the relationship is recorded as an edge rather than an edit, so the page can show what was believed at any past date and what changed it."]}]};

// ---------- shared rendering ----------
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');

// Routes are `#/<page>` and `#/<page>/<section>`. The landing page owns the
// reserved id `overview` so its sections are addressable too, while bare `#/`
// still resolves to it.
const HOME_ID = 'overview';
const pageRoute = id => '#/' + (id === HOME_ID ? '' : id);
const secRoute = (pageId, secId) => `#/${pageId}/${secId}`;
const anchorLink = (pageId, secId) =>
  `<a class="anchor" href="${secRoute(pageId, secId)}" aria-label="Link to this section">#</a>`;

function chipify(text) {
  return text.replace(/\[\[(\d+\.\d+)\]\]/g, (_, id) => {
    // Struck-through means retracted. An unsupported claim was not retracted —
    // the finding it rested on was — so it gets its own mark rather than
    // borrowing one that would misstate it.
    const state = (byId[id] || {}).state;
    const cls = state === 'unsupported' ? 'ev-unsupported'
      : state && state !== 'live' ? 'ev-stale' : '';
    return `<button class="ev-inline ${cls}" data-claim="${id}">${id}</button>`;
  });
}

// Just enough Dart highlighting to make the landing sample readable.
//
// One pass over a single alternation, deliberately: successive .replace() calls
// would re-scan the markup they just emitted, and `class` is both a Dart
// keyword and the attribute this writes — the second pass would wrap the
// attribute name and shred the tag. Comments and strings lead the alternation
// so a `//` inside a literal is not mistaken for a comment.
function highlight(src) {
  const re = /(\/\/[^\n]*)|('[^'\n]*')|\b(final|await|async|const|var|void|return|new|class)\b/g;
  let out = '', last = 0, m;
  while ((m = re.exec(src)) !== null) {
    out += esc(src.slice(last, m.index));
    out += `<span class="${m[1] ? 'tok-c' : m[2] ? 'tok-s' : 'tok-k'}">${esc(m[0])}</span>`;
    last = m.index + m[0].length;
  }
  return out + esc(src.slice(last));
}

/// Renders one parsed section's body. `ctx` namespaces the evidence drawers so
/// two paragraphs citing the same claim get independent toggles.
function bodyHtml(sec, ctxBase) {
  let h = '';
  sec.ps.forEach((p, pi) => {
    if (typeof p !== 'string') {
      h += `<pre class="code"><code>${highlight(p.code)}</code></pre>`;
      return;
    }
    h += `<p class="${sec.lede ? 'lede' : ''}">${chipify(md(p))}</p>`;
  });
  return h;
}

function sectionsHtml(sections, pageId, slots) {
  let h = '';
  sections.forEach((sec, si) => {
    if (sec.h) {
      const id = slug(sec.h);
      h += `<h2 id="${id}">${esc(sec.h)}${anchorLink(pageId, id)}</h2>`;
    }
    h += bodyHtml(sec, `${pageId}-${si}`);
    if (slots && sec.h && slots[sec.h]) h += slots[sec.h]();
  });
  return h;
}

function poolAt(p) { return p.pool.filter(c => liveAt(c, asOf)).sort((a, b) => b.birth - a.birth); }
function lastChange(p) {
  return Math.max.apply(null, p.pool.map(c => Math.max(c.birth || 0, c.death || 0)).concat([0]));
}

// ---------- home ----------
function cardsHtml() {
  return `<div class="cards">${ARCH.map((p, i) => {
    const live = poolAt(p).length, last = lastChange(p);
    return `<a class="card" href="${pageRoute(p.id)}">
      <div class="c-kicker">${String(i + 1).padStart(2, '0')} · ${esc(p.kicker)}</div>
      <div class="c-name">${esc(p.name)}</div>
      <div class="c-sum">${md(p.summary)}</div>
      <div class="c-meta">${live} beliefs${last ? ` · updated ${fmtNice(last)}` : ''}</div>
    </a>`;
  }).join('')}</div>`;
}

function statsHtml() {
  const live = claims.filter(c => liveAt(c, TODAY)).length;
  const stat = (v, l, cls) => `<div class="stat"><div class="v ${cls || ''}">${v}</div><div class="l">${l}</div></div>`;
  return `<div class="stats">
    ${stat(STATS.total, 'experiments run and indexed')}
    ${stat(STATS.rejected, 'rejected — and kept anyway', 'rej')}
    ${stat(live, 'beliefs currently standing')}
  </div>
  <p><a href="#/meta">How measurement works →</a> &nbsp;·&nbsp; <a href="#/changelog">What changed recently →</a></p>`;
}

function renderHome() {
  const slots = {
    'The shape of the system': () => DIAGRAMS.overview,
    'Explore the architecture': cardsHtml,
    'How we know any of this': statsHtml,
  };
  const [lede, ...rest] = HOME.sections;
  view.innerHTML = `<div class="hero">
      <h1>${esc(HOME.title)}</h1>
      <p class="tagline">${esc(HOME.tagline)}</p>
    </div>
    <div class="prose">${bodyHtml(lede, `${HOME_ID}-0`)}${sectionsHtml(rest, HOME_ID, slots)}</div>`;
  afterRender();
}

// ---------- an architecture page ----------
function renderPage(id) {
  const p = pageById[id];
  if (!p) return renderHome();
  const i = ARCH.indexOf(p);
  const prev = ARCH[i - 1], next = ARCH[i + 1];
  const pool = poolAt(p), last = lastChange(p);
  const [lede, ...rest] = p.sections;
  const fedBy = ARCH.filter(o => (o.feeds || []).includes(p.id));
  const feeds = (p.feeds || []).map(f => pageById[f]).filter(Boolean);

  const relCol = (label, list, empty) => `<div class="rel-col"><div>${label}</div>${
    list.length ? list.map(o => `<a class="rel-link" href="${pageRoute(o.id)}">${esc(o.name)}</a>`).join('')
                : `<p class="rel-none">${empty}</p>`}</div>`;

  view.innerHTML = `<div class="page-kicker">${String(i + 1).padStart(2, '0')} · ${esc(p.kicker)}</div>
    <h1 class="page-title">${esc(p.name)}</h1>
    <div class="page-meta">${pool.length} beliefs${last ? ` · last changed ${fmtNice(last)}` : ''}</div>
    <div class="prose">
      ${bodyHtml(lede, `${p.id}-0`)}
      ${DIAGRAMS[p.diagram || p.id] || ''}
      ${sectionsHtml(rest, p.id)}
    </div>
    <div class="rel-band"><h2>How this connects</h2><div class="rel-cols">
      ${relCol('RECEIVES WORK FROM', fedBy, 'Entry point — work starts here.')}
      ${relCol('HANDS OFF TO', feeds, 'Terminal — the buck stops here.')}
    </div></div>
    ${pool.length ? `<details class="roster"><summary>All ${pool.length} current beliefs, with provenance</summary>
      ${pool.map(beliefCard).join('')}</details>` : ''}
    <div class="pager">
      ${prev ? `<a href="${pageRoute(prev.id)}"><span class="lbl">← previous</span>${esc(prev.name)}</a>` : '<span></span>'}
      ${next ? `<a class="nx" href="${pageRoute(next.id)}"><span class="lbl">next →</span>${esc(next.name)}</a>` : ''}
    </div>`;
  afterRender();
}

// ---------- belief cards ----------
function ancestorsOf(c, seen) {
  seen = seen || new Set();
  const out = [];
  for (const e of (c.edges || [])) {
    const t = byId[e.target];
    if (!t || seen.has(t.id)) continue;
    seen.add(t.id);
    out.push({ rel: e.type, claim: t });
    for (const deeper of ancestorsOf(t, seen)) out.push(deeper);
  }
  return out;
}
function beliefCard(c) {
  const head = firstSentence(c.text);
  const rest = c.text.slice(head.length).trim();
  const anc = ancestorsOf(c);
  const src = expById[c.source] || {};
  const laterDead = asOf < TODAY && c.death != null;
  return `<article class="belief" id="b-${c.id}">
    <p class="belief-head">${esc(head)}</p>
    ${rest ? `<p class="belief-rest">${esc(rest)}</p>` : ''}
    <div class="prov">
      <span class="src">exp ${c.source}</span>
      <span>${src.date || ''}</span>
      ${c.conditions ? `<span>${esc(c.conditions)}</span>` : ''}
      ${laterDead ? `<span class="chip ch-later">later superseded by ${c.killers.join(', ')}</span>` : ''}
      ${anc.length ? `<button class="hist-btn" data-hist="${c.id}">history · ${anc.length} prior ▸</button>` : ''}
    </div>
    ${anc.length ? `<div class="thread" id="th-${c.id}">${threadHtml(anc)}</div>` : ''}
  </article>`;
}
function threadHtml(anc) {
  return anc.map(a => {
    const cl = a.claim;
    const span = cl.death
      ? `believed ${fmtNice(cl.birth)} → ${fmtNice(cl.death)}`
      : `since ${fmtNice(cl.birth)} · still live`;
    const relTxt = a.rel === 'supersedes' ? 'replaced by the above'
      : a.rel === 'refutes' ? 'refuted by the above'
      : a.rel === 'refines' ? 'refined by the above'
      : a.rel === 'dependsOn' ? 'the finding the above rests on' : 'validated by the above';
    return `<div class="rev">
      <span class="rev-when ${cl.death ? '' : 'origin'}">${span} · <span class="rel">${relTxt}</span> · exp ${cl.source}</span>
      <p>${esc(cl.text)}</p>
    </div>`;
  }).join('');
}

// ---------- changelog ----------
function renderLog() {
  const events = [];
  for (const c of claims) {
    if (c.birth == null || c.birth > asOf) continue;
    const sup = (c.edges || []).filter(e => e.type === 'supersedes' && byId[e.target]);
    const ref = (c.edges || []).filter(e => e.type === 'refutes' && byId[e.target]);
    const kind = ref.length ? 'refuted' : sup.length ? 'revised' : 'learned';
    const oldEdge = sup[0] || ref[0];
    events.push({ t: c.birth, kind, c, old: oldEdge ? byId[oldEdge.target] : null });
  }
  events.sort((a, b) => b.t - a.t || b.c.id.localeCompare(a.c.id));
  let h = `<div class="page-kicker">reference</div>
    <h1 class="page-title">Changelog</h1>
    <div class="page-meta">${events.length} recorded changes of belief</div>`;
  let day = '';
  for (const ev of events) {
    const d = fmtNice(ev.t);
    if (d !== day) { if (day) h += '</div>'; h += `<div class="log-day"><h3>${d}</h3>`; day = d; }
    h += `<div class="event">
      <span class="ev-kind ev-${ev.kind}">${ev.kind.toUpperCase()}</span>
      <div><div class="ev-body">${esc(firstSentence(ev.c.text))}
        <span class="ev-sub">· exp ${ev.c.source} · ${esc((PAGES.find(m => m.pool.includes(ev.c)) || {}).name || '')}</span></div>
        ${ev.old ? `<div class="ev-sub ev-old">was: ${esc(firstSentence(ev.old.text))}</div>` : ''}
      </div></div>`;
  }
  if (day) h += '</div>';
  view.innerHTML = h + (events.length ? '' : '<p class="hint">Nothing recorded before this date.</p>');
  afterRender();
}

const drBody = document.getElementById('dr-body');
const drIdEl = document.getElementById('dr-id');
const drStateEl = document.getElementById('dr-state');
const drCloseEl = document.getElementById('dr-close');
let route = '/';

function renderNav() {
  const here = route.slice(1) || HOME_ID;
  const secs = [...view.querySelectorAll('.prose h2[id]')];
  const secList = secs.length < 2 ? '' : `<div class="nav-secs">${
    secs.map(h => `<a href="${secRoute(here, h.id)}" data-sec="${h.id}">${esc(h.firstChild.textContent)}</a>`).join('')}</div>`;
  const link = (id, label, extra) => {
    const active = id === here;
    return `<a class="nav-link ${active ? 'active' : ''}" href="${pageRoute(id)}">${label}${extra || ''}</a>` +
      (active ? secList : '');
  };
  sidebarEl.innerHTML = `
    <div class="nav-group">
      <div class="nav-title">Start</div>
      ${link(HOME_ID, 'Overview')}
    </div>
    <div class="nav-group">
      <div class="nav-title">Architecture</div>
      ${ARCH.map((p, i) => link(p.id,
        `<span class="n">${String(i + 1).padStart(2, '0')}</span>${esc(p.name)}`,
        `<span class="zone">${esc(p.zone)}</span>`)).join('')}
    </div>
    <div class="nav-group">
      <div class="nav-title">Reference</div>
      ${link('changelog', 'Changelog')}
    </div>`;
}

// ---------- evidence drawer ----------
//
// The long-form writeups already ship as `experiments/history.json` for the
// experiments dashboard. Fetching that on first open — rather than embedding
// 211 writeups — keeps this page small and means the drawer shows whatever the
// dashboard shows, with no second copy to drift.

let historyById = null;
let historyState = 'idle';
async function loadHistory() {
  if (historyState === 'done' || historyState === 'failed') return historyById;
  if (historyState === 'loading') return null;
  historyState = 'loading';
  try {
    const res = await fetch('../experiments/history.json', { cache: 'no-store' });
    const data = await res.json();
    historyById = {};
    for (const e of data.experiments || []) historyById[e.id] = e;
    historyState = 'done';
  } catch {
    historyState = 'failed';
  }
  return historyById;
}

/// Block-level markdown for the drawer.
///
/// Experiment writeups carry emphasis, links, inline code and result tables.
/// Escaping them wholesale turned the richest evidence on the page into a wall
/// of literal asterisks and pipes, so this renders the block subset they
/// actually use. Cross-references between writeups (`[exp 241](241-….md)`) are
/// rewritten to the experiments dashboard — inside the site, where the reader
/// already is, rather than out to a raw file.
function mdInline(s) {
  return esc(String(s))
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, text, href) => {
      const local = href.match(/^(\d{3})[a-z0-9-]*\.md/i);
      const url = local ? `../experiments/index.html?exp=${local[1]}` : href;
      if (/^\s*javascript:/i.test(url)) return text;
      const external = /^https?:/i.test(url);
      return `<a href="${url}"${external ? ' target="_blank" rel="noopener" class="ext"' : ''}>${text}</a>`;
    })
    // Lazy, and `[\s\S]` rather than `[^*]`: bold routinely wraps nested
    // emphasis ("**mildly *favorable* at pool-4**"), which an exclusion class
    // cannot cross — it left the markers as literal asterisks.
    .replace(/\*\*([\s\S]+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*<])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    // history.json truncates long fields, which can cut a bold span in half and
    // strand its opening marker. Nothing downstream can pair it, so drop it
    // rather than show the reader raw asterisks.
    .replace(/\*\*/g, '');
}
function mdTable(lines) {
  const cells = l => l.trim().replace(/^\||\|$/g, '').split('|').map(s => s.trim());
  const rows = lines.filter(l => !/^\s*\|?[\s:|-]+\|?\s*$/.test(l));
  if (!rows.length) return '';
  const head = cells(rows[0]);
  return `<div class="dr-tablewrap"><table class="dr-table">
    <thead><tr>${head.map(c => `<th>${mdInline(c)}</th>`).join('')}</tr></thead>
    <tbody>${rows.slice(1).map(r =>
      `<tr>${cells(r).map(c => `<td>${mdInline(c)}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div>`;
}
// `[-*+] ` requires the trailing space, so a line opening with `**bold**` is
// not mistaken for a bullet.
const RE_BULLET = /^\s*[-*+]\s+/;
const RE_ORDERED = /^\s*\d+[.)]\s+/;
const RE_QUOTE = /^\s*>\s?/;

/// Walks a block line by line rather than classifying it as a whole: writeups
/// mix a lead-in sentence with the list that follows it, and treating that as
/// one paragraph ran the items together into unreadable prose.
function mdLines(lines) {
  let html = '', para = [], list = null, listTag = 'ul', quote = [];
  const flushPara = () => {
    if (para.length) { html += `<p>${mdInline(para.join(' '))}</p>`; para = []; }
  };
  const flushList = () => {
    if (list) {
      html += `<${listTag} class="dr-list">${
        list.map(i => `<li>${mdInline(i)}</li>`).join('')}</${listTag}>`;
      list = null;
    }
  };
  const flushQuote = () => {
    if (quote.length) {
      html += `<blockquote class="dr-quote">${mdInline(quote.join(' '))}</blockquote>`;
      quote = [];
    }
  };

  for (const line of lines) {
    if (RE_QUOTE.test(line)) {
      flushPara(); flushList();
      quote.push(line.replace(RE_QUOTE, ''));
      continue;
    }
    const bullet = RE_BULLET.test(line), ordered = RE_ORDERED.test(line);
    if (bullet || ordered) {
      flushPara(); flushQuote();
      const tag = bullet ? 'ul' : 'ol';
      if (list && listTag !== tag) flushList();
      listTag = tag;
      list = list || [];
      list.push(line.replace(bullet ? RE_BULLET : RE_ORDERED, ''));
      continue;
    }
    // An indented line under a list item continues it rather than starting a
    // paragraph — writeups wrap long items across lines.
    if (list) { list[list.length - 1] += ' ' + line.trim(); continue; }
    flushQuote();
    para.push(line.trim());
  }
  flushPara(); flushList(); flushQuote();
  return html;
}

function mdBlocks(src) {
  return String(src).split(/\n{2,}/).map(raw => {
    const lines = raw.split('\n').filter(l => l.trim());
    if (!lines.length) return '';
    if (lines.every(l => l.trim().startsWith('|'))) return mdTable(lines);
    return mdLines(lines);
  }).join('');
}

function lineageHtml(anc) {
  return anc.map(a => {
    const cl = a.claim;
    const when = cl.death
      ? `held ${fmtNice(cl.birth)} → ${fmtNice(cl.death)}`
      : `since ${fmtNice(cl.birth)} · still live`;
    const rel = a.rel === 'supersedes' ? 'replaced' : a.rel === 'refutes' ? 'refuted'
      : a.rel === 'refines' ? 'refined' : a.rel === 'dependsOn' ? 'rests on' : 'validated';
    return `<div class="dr-prior">
      <span class="w ${cl.death ? '' : 'origin'}">${rel} · ${when} · exp ${cl.source}</span>
      <p>${esc(cl.text)}</p></div>`;
  }).join('');
}

function bullets(value) {
  const items = Array.isArray(value) ? value : [value];
  return `<ul class="dr-list">${items.map(t => `<li>${mdInline(t)}</li>`).join('')}</ul>`;
}

function drawerHtml(c, detail) {
  const src = expById[c.source] || {};
  const anc = ancestorsOf(c);
  const accepted = src.status === 'accepted';
  const expUrl = `../experiments/index.html?exp=${encodeURIComponent(c.source)}`;

  let h = `<div class="dr-sec"><p class="dr-claim">${esc(c.text)}</p>
    ${c.conditions ? `<div class="dr-sub">Measured under ${esc(c.conditions)}</div>` : ''}</div>

    <div class="dr-sec"><h4>The experiment behind it</h4>
      <div class="dr-card">
        <div class="dr-exp-title">${esc(src.title || 'Experiment ' + c.source)}</div>
        <div class="dr-facts">
          <span class="dr-tag k">exp ${c.source}</span>
          ${src.date ? `<span class="dr-tag">${src.date}</span>` : ''}
          ${src.class ? `<span class="dr-tag cls">${esc(src.class)}</span>` : ''}
          ${src.status ? `<span class="dr-tag ${accepted ? 'ok' : 'no'}">${esc(src.status)}</span>` : ''}
        </div>
      </div>
    </div>`;

  if (detail) {
    const part = (label, text) =>
      text && String(text).trim() ? `<h4>${label}</h4>${mdBlocks(text)}` : '';
    // `summary` is inconsistent across the corpus — a headline for some
    // experiments, the whole rationale for others — so it only appears when
    // there is no structured problem statement to show instead.
    let body = part('The problem', detail.problem) || part('In brief', detail.summary);
    body += part('Hypothesis', detail.hypothesis) + part('Approach', detail.approach) +
      part('Results', detail.results) +
      part(accepted ? 'Why it was accepted' : 'Why it was rejected', detail.reasoning);
    if (body) h += `<div class="dr-sec">${body}</div>`;
  } else if (historyState === 'loading') {
    h += `<div class="dr-sec"><p class="dr-loading">Loading the full experiment…</p></div>`;
  } else if (src.impact) {
    h += `<div class="dr-sec"><h4>Method and context</h4>${mdBlocks(src.impact)}</div>`;
  }

  if (src.changed || src.next) {
    h += `<div class="dr-sec"><h4>Signals</h4>
      ${src.changed ? `<h4>What it changed</h4>${bullets(src.changed)}` : ''}
      ${src.next ? `<h4>What it opened up</h4>${bullets(src.next)}` : ''}</div>`;
  }

  if (anc.length) {
    h += `<div class="dr-sec"><h4>What this belief replaced</h4>${lineageHtml(anc)}</div>`;
  }

  h += `<div class="dr-sec">
    <a class="dr-cta" href="${expUrl}">Open experiment ${c.source} in the dashboard →</a>
    ${(c.directions || []).length
      ? `<div class="dr-sub">Research direction · ${esc((c.directions || []).join(', ').replace(/-/g, ' '))}</div>`
      : ''}
  </div>`;
  return h;
}

let openClaim = null;
async function openDrawer(id) {
  const c = byId[id];
  if (!c) return;
  openClaim = id;
  const state = c.state || 'live';
  drIdEl.textContent = id;
  drStateEl.textContent = state;
  drStateEl.className = 'dr-state s-' + state;
  drBody.innerHTML = drawerHtml(c, (historyById || {})[c.source]);
  drBody.scrollTop = 0;
  drawerEl.classList.add('open');
  drawerEl.setAttribute('aria-hidden', 'false');
  scrimEl.classList.add('open');
  view.querySelectorAll('.ev-inline').forEach(b =>
    b.classList.toggle('cited', b.dataset.claim === id));
  drCloseEl.focus();

  if (historyState !== 'done' && historyState !== 'failed') {
    await loadHistory();
    // The reader may have moved on or closed the drawer while this was in
    // flight; only repaint if it is still the same claim on screen.
    if (openClaim === id && drawerEl.classList.contains('open')) {
      drBody.innerHTML = drawerHtml(c, (historyById || {})[c.source]);
    }
  }
}
function closeDrawer() {
  openClaim = null;
  drawerEl.classList.remove('open');
  drawerEl.setAttribute('aria-hidden', 'true');
  scrimEl.classList.remove('open');
  view.querySelectorAll('.ev-inline.cited').forEach(b => b.classList.remove('cited'));
}

/// Highlights the heading you are currently reading under. Runs off scroll
/// rather than IntersectionObserver so the "last heading above the fold" rule
/// stays explicit — with several headings on screen, that is the one you want.
function spy() {
  const heads = [...view.querySelectorAll('.prose h2[id]')];
  if (heads.length) {
    const line = headerHeight() + 60;
    let cur = heads[0].id;
    for (const h of heads) {
      if (h.getBoundingClientRect().top > line) break;
      cur = h.id;
    }
    sidebarEl.querySelectorAll('.nav-secs a').forEach(a =>
      a.classList.toggle('active', a.dataset.sec === cur));
  }
}
function headerHeight() {
  return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hdr-h')) || 60;
}

function afterRender() {
  wire();
  renderNav();
  closeDrawer();
  spy();
}

function wire() {
  view.querySelectorAll('.ev-inline').forEach(b =>
    b.addEventListener('click', () => {
      if (openClaim === b.dataset.claim) closeDrawer();
      else openDrawer(b.dataset.claim);
    }));
  wireHist(view);
}

drCloseEl.addEventListener('click', closeDrawer);
scrimEl.addEventListener('click', closeDrawer);
addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && openClaim) closeDrawer();
});
function wireHist(root) {
  root.querySelectorAll('.hist-btn').forEach(b =>
    b.addEventListener('click', () => {
      const th = document.getElementById('th-' + b.dataset.hist);
      if (!th) return;
      const open = th.classList.toggle('open');
      const n = (b.textContent.match(/\d+/) || ['0'])[0];
      b.textContent = open ? `history · ${n} prior ▾` : `history · ${n} prior ▸`;
    }));
}

// `#/`, `#/<page>`, `#/<page>/<section>`. A bare `#section` is a plain in-page
// anchor and must not be read as a route.
function currentRoute() {
  const h = location.hash;
  return h.startsWith('#/') ? h.slice(2).split('/').filter(Boolean) : null;
}
function navigate(keepScroll) {
  const parts = currentRoute() || [];
  const pageId = parts[0] === HOME_ID ? '' : (parts[0] || '');
  const secId = parts[1] || '';
  const changed = pageId !== route.slice(1);
  route = '/' + pageId;
  if (!pageId) renderHome();
  else if (pageId === 'changelog') renderLog();
  else renderPage(pageId);
  if (secId) {
    const el = document.getElementById(secId);
    if (el) { el.scrollIntoView({ block: 'start' }); return; }
  }
  // Instant, not 'auto': `auto` defers to the page's smooth scroll-behavior,
  // which turns every page change into a long animated ride to the top.
  if (changed && !keepScroll) scrollTo({ top: 0, behavior: 'instant' });
}
addEventListener('hashchange', () => {
  if (currentRoute()) navigate();
  else spy();
});
let ticking = false;
addEventListener('scroll', () => {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => { ticking = false; spy(); });
}, { passive: true });

// ---------- time machine ----------
const asofInput = document.getElementById('asof');
const births = claims.map(c => c.birth).filter(Boolean);
asofInput.max = fmt(TODAY);
asofInput.min = fmt(Math.min.apply(null, births));
asofInput.value = fmt(TODAY);
function applyTime() {
  const atToday = asOf >= TODAY;
  let note = document.querySelector('.time-note');
  if (!note) {
    note = document.createElement('div');
    note.className = 'time-note';
    document.querySelector('.shell').before(note);
  }
  note.classList.toggle('on', !atToday);
  if (!atToday) {
    const nowLive = claims.filter(c => liveAt(c, TODAY)).length;
    const thenLive = claims.filter(c => liveAt(c, asOf)).length;
    note.innerHTML = `Showing what was believed on <b>${fmtNice(asOf)}</b> —
      ${thenLive} beliefs then, ${nowLive} today. Anything since revised carries an amber chip.`;
  }
  // Hold the reader's place: moving the date should change what the page says,
  // not where you are in it. Measured against <main>, which survives the
  // re-render, because showing or hiding the banner above it shifts the whole
  // document by the banner's height — restoring a raw scrollY would land the
  // reader that far off.
  const docTop = () => view.getBoundingClientRect().top + scrollY;
  const offset = scrollY - docTop();
  navigate(true);
  scrollTo({ top: docTop() + offset, behavior: 'instant' });
}
asofInput.addEventListener('change', () => {
  const t = parseDate(asofInput.value);
  if (t) { asOf = t + 86399000; applyTime(); }
});
document.getElementById('today-btn').addEventListener('click', () => {
  asOf = TODAY; asofInput.value = fmt(TODAY); applyTime();
});

// ---------- search ----------
const searchInput = document.getElementById('search');
const searchResults = document.getElementById('search-results');
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  searchResults.innerHTML = '';
  if (q.length < 2) { searchResults.classList.remove('open'); return; }
  const hits = [];
  for (const c of claims) {
    if (c.id.includes(q) || c.text.toLowerCase().includes(q))
      hits.push({ id: c.id, label: firstSentence(c.text), state: c.state });
    if (hits.length > 9) break;
  }
  for (const hit of hits) {
    const b = document.createElement('button');
    b.className = 'search-hit'; b.setAttribute('role', 'option');
    b.innerHTML = `<span class="mono">${hit.id} · ${hit.state}</span> · ${esc(hit.label.slice(0, 88))}`;
    b.addEventListener('click', () => {
      searchResults.classList.remove('open'); searchInput.value = '';
      asOf = TODAY; asofInput.value = fmt(TODAY);
      // Jump to the page that owns the claim, then reveal it in the roster.
      // replaceState rather than assigning location.hash: assigning would fire
      // hashchange after this handler and re-render the page, discarding the
      // highlight applied below.
      const owner = PAGES.find(p => p.pool.some(c => c.id === hit.id))
        || PAGES.find(p => p.pool.some(c => (byId[hit.id] || {}).killers?.includes(c.id)));
      history.replaceState(null, '', owner ? pageRoute(owner.id) : '#/changelog');
      navigate();
      const target = document.getElementById('b-' + hit.id);
      const el = target || document.getElementById('b-' + ((byId[hit.id] || {}).killers || [])[0]);
      if (!el) return;
      const det = el.closest('details'); if (det) det.open = true;
      el.scrollIntoView({ block: 'center' });
      if (target) {
        const head = target.querySelector('.belief-head');
        head.innerHTML = `<mark>${esc(head.textContent)}</mark>`;
      } else {
        const btn = el.querySelector('.hist-btn'); if (btn) btn.click();
      }
    });
    searchResults.appendChild(b);
  }
  searchResults.classList.toggle('open', hits.length > 0);
});
document.addEventListener('click', ev => {
  if (!ev.target.closest('.searchbox')) searchResults.classList.remove('open');
});

// ---------- boot ----------
navigate();
if (!currentRoute() && location.hash) {
  const landing = document.getElementById(decodeURIComponent(location.hash.slice(1)));
  if (landing) landing.scrollIntoView({ block: 'start' });
}
</script>
