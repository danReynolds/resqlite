<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>resqlite · architecture</title>
<style>
:root {
  /* The site's design system, verbatim from docs/index.html. Kept under the
     same names so a change there is a find-and-replace here, not a re-derive.
     The site is dark-only, so this page is too. */
  --bg: #0b0d1f;
  --card: #141829;
  --border: #262b45;
  --text: #e6edf3;
  --muted: #8b949e;
  --accent: #58a6ff;
  --green: #3fb950;

  /* Derived tones this page needs and the site does not name. */
  --paper: var(--bg);
  --surface: var(--card);
  --raised: #1b2038;
  --ink: var(--text);
  --ink-2: #aeb8c4;
  --ink-3: var(--muted);
  --line: var(--border);
  --line-2: #343b5c;
  --accent-2: #a8b1ff;
  --accent-soft: #58a6ff1f;
  --ok: var(--green);
  --warn: #d29922;
  --bad: #f85149;
  --meas: #79c0ff;
  --code-bg: #10142a;
  /* aliases the diagram SVGs draw against */
  --ground: var(--bg); --panel: var(--card); --stale: var(--warn);
  --hdr-h: 60px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 15px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.mono, code { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: .875em; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: var(--accent); }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40; height: var(--hdr-h);
  display: flex; align-items: center; gap: 18px; padding: 0 22px;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 9px; text-decoration: none; color: inherit; }
.brand b { font-size: 16px; font-weight: 650; letter-spacing: -.015em; }
.brand span { font-size: 11px; color: var(--ink-3); font-family: 'SF Mono', 'Fira Code', monospace; letter-spacing: .08em; text-transform: uppercase; }
.sitenav { display: flex; gap: 16px; margin-left: 8px; padding-left: 18px; border-left: 1px solid var(--line); }
.sitenav a { font-size: 13px; color: var(--ink-2); text-decoration: none; }
.sitenav a:hover { color: var(--accent); }
.spacer { margin-left: auto; }
.searchbox { position: relative; width: min(320px, 34vw); }
.searchbox input {
  width: 100%; padding: 7px 11px; border-radius: 8px; font-size: 13px;
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
}
.searchbox input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
.search-results {
  display: none; position: absolute; z-index: 60; top: 108%; left: 0; right: 0;
  background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px;
  box-shadow: 0 12px 34px rgba(0,0,0,.5); overflow: hidden; max-height: 60vh; overflow-y: auto;
}
.search-results.open { display: block; }
.search-hit { display: block; width: 100%; text-align: left; padding: 9px 12px; font-size: 12.5px; border-bottom: 1px solid var(--line); }
.search-hit:last-child { border-bottom: 0; }
.search-hit:hover, .search-hit:focus-visible { background: var(--accent-soft); outline: none; }
.search-hit .mono { color: var(--accent); }
.asof-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); }
.asof-row input[type=date] {
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
  border-radius: 7px; padding: 5px 8px; font: inherit; font-size: 12.5px;
}
.today-btn { color: var(--accent); font-size: 12px; }
.today-btn:hover { text-decoration: underline; }

/* ---------- shell ---------- */
.shell {
  display: grid; grid-template-columns: 250px minmax(0, 1fr);
  gap: 0; max-width: 1180px; margin: 0 auto; align-items: start;
}
.sidebar {
  position: sticky; top: var(--hdr-h); height: calc(100vh - var(--hdr-h));
  overflow-y: auto; padding: 26px 16px 40px 22px; border-right: 1px solid var(--line);
}
.nav-group { margin-bottom: 22px; }
.nav-title {
  font-family: 'SF Mono', 'Fira Code', monospace; font-size: 10px; letter-spacing: .15em;
  text-transform: uppercase; color: var(--ink-3); margin: 0 0 8px 10px; font-weight: 500;
}
.nav-link {
  display: flex; align-items: baseline; gap: 9px; width: 100%; text-align: left;
  padding: 6px 10px; border-radius: 7px; font-size: 13.5px; color: var(--ink-2);
  text-decoration: none; line-height: 1.4;
}
.nav-link:hover { background: var(--raised); color: var(--ink); }
.nav-link.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-link .n { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 10.5px; color: var(--ink-3); }
.nav-link.active .n { color: var(--accent); }
.nav-link .zone { margin-left: auto; font-size: 10px; color: var(--ink-3); font-family: 'SF Mono', 'Fira Code', monospace; }

/* Section links live under the active page in the left rail, which frees the
   whole right column for evidence. */
.nav-secs { margin: 2px 0 6px 0; }
.nav-secs a {
  display: block; padding: 4px 10px 4px 30px; font-size: 12.5px; color: var(--ink-3);
  text-decoration: none; border-left: 2px solid var(--line); margin-left: 12px; line-height: 1.35;
}
.nav-secs a:hover { color: var(--ink); }
.nav-secs a.active { color: var(--accent); border-left-color: var(--accent); font-weight: 600; }

main { padding: 34px 46px 90px; min-width: 0; }

/* ---------- evidence drawer ----------
   Off-canvas until a citation is clicked: evidence is something the reader
   asks for, and a panel that is always open is furniture rather than an
   answer. */
/* Deliberately faint: the drawer is a companion to the prose, not a modal over
   it — the passage you were reading has to stay legible beside its evidence.
   The scrim exists to catch a click-away, not to dim the page. */
.scrim {
  position: fixed; inset: 0; z-index: 45; background: rgba(4, 6, 16, .45);
  opacity: 0; pointer-events: none; transition: opacity .26s ease;
}
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; z-index: 50; top: 0; right: 0; width: min(452px, 94vw); height: 100vh;
  display: flex; flex-direction: column; background: var(--surface);
  border-left: 1px solid var(--line); box-shadow: -26px 0 70px rgba(0, 0, 0, .55);
  transform: translateX(100%); transition: transform .3s cubic-bezier(.32, .72, 0, 1);
}
.drawer.open { transform: none; }
@media (prefers-reduced-motion: reduce) {
  .drawer, .scrim { transition: none; }
}
.dr-head {
  display: flex; align-items: center; gap: 10px; flex: none;
  padding: 16px 18px; border-bottom: 1px solid var(--line);
}
.dr-id { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 13px; font-weight: 650; color: var(--accent); }
.dr-state {
  font-family: 'SF Mono', 'Fira Code', monospace; font-size: 9.5px; letter-spacing: .08em;
  text-transform: uppercase; padding: 1.5px 8px; border-radius: 20px;
  border: 1px solid currentColor; color: var(--ok);
}
.dr-state.s-superseded, .dr-state.s-refined, .dr-state.s-unsupported { color: var(--warn); }
.dr-state.s-refuted { color: var(--bad); }
.dr-close { margin-left: auto; font-size: 20px; line-height: 1; color: var(--ink-3); padding: 2px 6px; border-radius: 6px; }
.dr-close:hover { color: var(--ink); background: var(--raised); }
.dr-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 18px 18px 44px; }

/* Sections rise as the drawer lands — a short stagger that reads as the panel
   filling in, not as decoration. */
@keyframes drRise { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: none; } }
.drawer.open .dr-sec { animation: drRise .34s cubic-bezier(.32,.72,0,1) backwards; }
.drawer.open .dr-sec:nth-child(1) { animation-delay: .04s; }
.drawer.open .dr-sec:nth-child(2) { animation-delay: .09s; }
.drawer.open .dr-sec:nth-child(3) { animation-delay: .14s; }
.drawer.open .dr-sec:nth-child(4) { animation-delay: .19s; }
.drawer.open .dr-sec:nth-child(5) { animation-delay: .24s; }
@media (prefers-reduced-motion: reduce) { .drawer.open .dr-sec { animation: none; } }

.dr-claim { font-size: 15px; line-height: 1.62; margin: 0 0 14px; color: var(--ink); }
.dr-sec { margin-bottom: 22px; }
.dr-sec > h4 {
  font-family: 'SF Mono', 'Fira Code', monospace; font-size: 9.5px; letter-spacing: .15em;
  text-transform: uppercase; color: var(--ink-3); font-weight: 500; margin: 0 0 8px;
}
.dr-sec p { font-size: 13.5px; line-height: 1.66; color: var(--ink-2); margin: 0 0 10px; }
.dr-card { border: 1px solid var(--line); border-radius: 11px; padding: 13px 14px; background: var(--paper); }
.dr-exp-title { font-size: 14px; font-weight: 640; line-height: 1.35; margin-bottom: 7px; letter-spacing: -.01em; }
.dr-facts { display: flex; flex-wrap: wrap; gap: 4px 8px; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 10px; color: var(--ink-3); }
.dr-tag { border: 1px solid var(--line-2); border-radius: 20px; padding: 1px 8px; }
.dr-tag.k { color: var(--accent); border-color: currentColor; }
.dr-tag.cls { color: var(--meas); border-color: currentColor; }
.dr-tag.ok { color: var(--ok); border-color: currentColor; }
.dr-tag.no { color: var(--bad); border-color: currentColor; }
.dr-sub { font-size: 11.5px; color: var(--ink-3); margin-top: 8px; font-family: 'SF Mono', 'Fira Code', monospace; line-height: 1.5; }
.dr-list { list-style: none; margin: 0; padding: 0; }
.dr-list li {
  position: relative; font-size: 13px; line-height: 1.6; color: var(--ink-2);
  padding: 0 0 0 15px; margin-bottom: 9px;
}
ul.dr-list li::before { content: ''; position: absolute; left: 0; top: 8px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); opacity: .55; }
ol.dr-list { list-style: decimal; padding-left: 19px; }
ol.dr-list li { padding-left: 3px; }
ol.dr-list li::marker { color: var(--accent); font-family: 'SF Mono', 'Fira Code', monospace; font-size: 11px; }
.dr-quote {
  margin: 0 0 12px; padding: 3px 0 3px 13px; border-left: 2px solid var(--line-2);
  color: var(--ink-3); font-style: italic; font-size: 13px; line-height: 1.62;
}
.dr-sec a.ext::after { content: ' ↗'; font-size: .82em; opacity: .7; }
.dr-prior { border-left: 2px solid var(--line); padding: 1px 0 1px 12px; margin-bottom: 12px; }
.dr-prior .w { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 10px; color: var(--warn); }
.dr-prior .w.origin { color: var(--ink-3); }
.dr-prior p { margin: 4px 0 0; font-size: 12.5px; }
.dr-cta {
  display: block; text-align: center; text-decoration: none; font-size: 13px; font-weight: 560;
  border: 1px solid var(--accent); color: var(--accent); border-radius: 9px; padding: 10px 12px;
  margin-top: 4px;
}
.dr-cta:hover { background: var(--accent-soft); }
.dr-cta.sub { border-color: var(--line-2); color: var(--ink-2); font-weight: 400; margin-top: 8px; }
.dr-cta.sub:hover { border-color: var(--accent); color: var(--accent); background: none; }
.dr-loading { font-size: 12.5px; color: var(--ink-3); font-style: italic; }
.dr-sec a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-soft); }
.dr-sec a:hover { border-bottom-color: currentColor; }
.dr-sec code { background: var(--code-bg); padding: 1px 4px; border-radius: 4px; font-size: .88em; }
.dr-sec strong { color: var(--ink); font-weight: 640; }
/* Result tables are wide by nature; they scroll inside the drawer rather than
   forcing the panel wider or wrapping into unreadable columns. */
.dr-tablewrap { overflow-x: auto; margin: 0 0 12px; }
.dr-table { border-collapse: collapse; font-size: 12px; min-width: 100%; }
.dr-table th, .dr-table td {
  border-bottom: 1px solid var(--line); padding: 5px 10px 5px 0;
  text-align: left; white-space: nowrap;
}
.dr-table th { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; }
.dr-table td { color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* ---------- prose ---------- */
.page-kicker { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
h1.page-title { font-size: 34px; line-height: 1.12; margin: 8px 0 10px; font-weight: 660; letter-spacing: -.028em; text-wrap: balance; }
.page-meta { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 11.5px; color: var(--ink-3); margin-bottom: 26px; }
.prose { max-width: 74ch; }
.prose h2 {
  font-size: 19px; font-weight: 640; letter-spacing: -.015em; margin: 40px 0 12px;
  scroll-margin-top: calc(var(--hdr-h) + 18px);
}
.prose p { margin: 0 0 15px; font-size: 15.5px; line-height: 1.72; color: var(--ink); }
.prose .lede { font-size: 17.5px; line-height: 1.62; color: var(--ink); }
.prose code { background: var(--code-bg); padding: 1.5px 5px; border-radius: 4px; }
.prose strong { font-weight: 640; }
.anchor { opacity: 0; margin-left: 9px; font-size: .72em; font-weight: 400; color: var(--ink-3); text-decoration: none; }
h2:hover .anchor, .anchor:focus-visible { opacity: 1; }
.anchor:hover { color: var(--accent); }
pre.code {
  background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px;
  padding: 15px 17px; overflow-x: auto; margin: 0 0 18px; font-size: 12.9px; line-height: 1.62;
}
pre.code code { background: none; padding: 0; }
.tok-c { color: var(--ink-3); font-style: italic; }
.tok-s { color: var(--ok); }
.tok-k { color: var(--accent-2); }

/* ---------- home ---------- */
.hero { max-width: 76ch; margin-bottom: 34px; }
.hero h1 { font-size: 46px; line-height: 1.04; margin: 0 0 12px; font-weight: 680; letter-spacing: -.04em; }
.hero .tagline { font-size: 19px; color: var(--ink-2); margin: 0 0 26px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(258px, 1fr)); gap: 14px; margin: 6px 0 10px; }
.card {
  display: block; width: 100%; text-align: left; padding: 16px 17px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  text-decoration: none; color: inherit; transition: border-color .12s, transform .12s;
}
.card:hover { border-color: var(--accent); transform: translateY(-1px); }
.card .c-kicker { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3); }
.card .c-name { font-weight: 640; font-size: 15px; margin: 5px 0 6px; letter-spacing: -.012em; }
.card .c-sum { font-size: 13px; color: var(--ink-2); line-height: 1.55; }
.card .c-meta { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 10.5px; color: var(--ink-3); margin-top: 10px; }
.constraints { display: grid; gap: 14px; margin: 4px 0 18px; }
.constraint { border-left: 3px solid var(--accent); padding: 2px 0 4px 16px; }
.stats { display: flex; flex-wrap: wrap; gap: 30px; margin: 20px 0 22px; }
.stat .v { font-size: 30px; font-weight: 660; letter-spacing: -.03em; line-height: 1.1; }
.stat .v.rej { color: var(--warn); }
.stat .l { font-size: 12px; color: var(--ink-2); margin-top: 2px; }

/* ---------- relations ---------- */
.rel-band { margin: 34px 0 6px; padding-top: 22px; border-top: 1px solid var(--line); }
.rel-band h2 { font-size: 13px; font-family: 'SF Mono', 'Fira Code', monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; margin: 0 0 12px; }
.rel-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 20px; }
.rel-col > div { font-size: 11px; font-family: 'SF Mono', 'Fira Code', monospace; color: var(--ink-3); margin-bottom: 7px; letter-spacing: .06em; }
.rel-link { display: block; padding: 7px 11px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 7px; font-size: 13px; text-decoration: none; color: var(--ink); background: var(--surface); }
.rel-link:hover { border-color: var(--accent); color: var(--accent); }
.rel-none { font-size: 12.5px; color: var(--ink-3); font-style: italic; }
.pager { display: flex; justify-content: space-between; gap: 18px; margin-top: 34px; padding-top: 22px; border-top: 1px solid var(--line); }
.pager a { display: block; max-width: 47%; text-decoration: none; color: var(--accent); font-size: 14px; font-weight: 560; }
.pager a:hover { text-decoration: underline; }
.pager .nx { text-align: right; margin-left: auto; }
.pager .lbl { display: block; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3); font-weight: 400; margin-bottom: 2px; }

/* ---------- diagrams ---------- */
.diagram-card { margin: 22px 0 26px; padding: 20px 20px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.diagram-card.wide { max-width: none; }
.diagram-card figcaption { margin-top: 10px; text-align: center; font-size: 11.5px; color: var(--ink-3); font-family: 'SF Mono', 'Fira Code', monospace; }
.dg-zone { font: 600 10px 'SF Mono', 'Fira Code', monospace; fill: var(--ink-3); letter-spacing: .12em; }
.dg-flow { font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: var(--ink); }
.dg-cost { font: 500 10.5px 'SF Mono', 'Fira Code', monospace; fill: var(--ink-2); }
.dg-wall { stroke: var(--warn); stroke-width: 1.5; stroke-dasharray: 6 5; opacity: .75; }
.dg-box { fill: var(--raised); stroke: var(--line-2); rx: 9; }

/* ---------- evidence ---------- */
.ev-inline {
  font-family: 'SF Mono', 'Fira Code', monospace; font-size: 10.5px; color: var(--accent);
  border: 1px solid var(--line-2); border-radius: 5px; padding: 0 4px; margin: 0 2px;
  vertical-align: 1.5px; background: var(--surface);
}
.ev-inline:hover { border-color: var(--accent); background: var(--accent-soft); }
.ev-inline.ev-stale { color: var(--warn); text-decoration: line-through; }
/* Lost its justification, not its truth — flagged, but not crossed out. */
.ev-inline.ev-unsupported { color: var(--warn); border-color: var(--warn); border-style: dashed; }
.ev-inline.cited { border-color: var(--accent); background: var(--accent-soft); }
.belief { padding: 15px 2px; border-bottom: 1px solid var(--line); }
.belief-head { font-size: 14.5px; font-weight: 600; margin: 0 0 3px; text-wrap: balance; }
.belief-rest { font-size: 13.5px; color: var(--ink-2); margin: 2px 0 7px; max-width: 70ch; }
.prov { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 14px; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 10.5px; color: var(--ink-3); }
.prov .src { color: var(--accent); }
.chip { border: 1px solid var(--line-2); border-radius: 20px; padding: 0 8px; font-size: 10px; }
.ch-later { color: var(--warn); border-color: var(--warn); }
.hist-btn { color: var(--accent); font-size: 11.5px; font-family: 'SF Mono', 'Fira Code', monospace; }
.hist-btn:hover { text-decoration: underline; }
.thread { display: none; margin: 10px 0 2px 8px; border-left: 2px solid var(--line); padding-left: 16px; }
.thread.open { display: block; }
.rev { margin: 11px 0; }
.rev-when { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 10.5px; color: var(--warn); }
.rev-when.origin { color: var(--ink-3); }
.rev p { margin: 3px 0 2px; font-size: 13px; color: var(--ink-2); max-width: 66ch; }
.rev .rel { color: var(--meas); }
.roster { margin-top: 30px; }
.roster summary { cursor: pointer; font-size: 12.5px; color: var(--ink-2); font-family: 'SF Mono', 'Fira Code', monospace; padding: 8px 0; }
.roster summary:hover { color: var(--accent); }

/* ---------- changelog ---------- */
.log-day { margin-top: 24px; }
.log-day h3 { font-size: 12px; font-family: 'SF Mono', 'Fira Code', monospace; color: var(--ink-3); font-weight: 500; margin: 0 0 4px; border-bottom: 1px solid var(--line); padding-bottom: 5px; }
.event { display: grid; grid-template-columns: 88px 1fr; gap: 12px; padding: 9px 0; }
.ev-kind { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 10px; letter-spacing: .07em; padding-top: 3px; }
.ev-learned { color: var(--ok); } .ev-revised { color: var(--warn); } .ev-refuted { color: var(--bad); }
.event .ev-body { font-size: 13.5px; max-width: 68ch; }
.event .ev-sub { font-size: 11.5px; color: var(--ink-3); }
.event .ev-old { font-style: italic; }
.time-note { display: none; margin-bottom: 20px; padding: 11px 15px; border-radius: 10px; background: var(--accent-soft); border: 1px solid var(--line-2); font-size: 13px; }
.time-note.on { display: block; }
.hint { color: var(--ink-3); font-size: 13px; }
mark { background: var(--accent-soft); color: inherit; border-radius: 3px; padding: 0 2px; }
.coverage { color: var(--ink-3); font-size: 12.5px; margin: 26px 0 0; }

@media (max-width: 1040px) {
  .shell { grid-template-columns: 236px minmax(0, 1fr); }

e-pair and replacement-character encoding can stay private to the guarded batch encoder while preserving embedded-NUL byte lengths through sqlite3_bind_text"],"next":["watch release-suite Wide Batch Insert and narrow Batch Insert together because the public suite is still ASCII-heavy","only pursue blob-heavy or broader embedded-NUL work with a workload that crosses the same large/wide guard"]},{"id":"134","title":"Keyed PK dirty rowid elision","file":"134-keyed-pk-dirty-elision.md","date":"2026-05-09","status":"rejected","directions":["stream-rerun-dispatch"],"outcomeClass":"rejected_preserved_potential","impact":"Profile proof was real (keyed-PK writer-burst wall 25.54 → 12.45 ms; probes 10,000 → 3), but the mergeable implementation depended on internal SQL text recognition for `WHERE id = ?`. Keep as future evidence for explicit row-level observer APIs or a stronger dependency model; implementation preserved at `archive/exp-134`.","changed":["Row-level dirty precision can remove the keyed-PK miss-path cost: verified simple `WHERE id = ?` INTEGER PRIMARY KEY streams skipped when dirty rowids did not overlap","The keyed-PK profile workload reached per-stream column intersection only for actual watched-row hits: `intersection_entries` dropped 10000 → 3 and writer-burst wall dropped 25.54 → 12.45 ms","The implementation is rejected because internal SQL text recognition is too fragile to grow into a production dependency model; preserve the result as evidence for a future explicit row observer API, trace metadata, or stronger dependency model"],"next":["do not retry this by broadening the SQL/schema recognizer; use `archive/exp-134` only as implementation evidence","revive row-level dependency precision only if a real workload shows keyed-PK miss writes dominate or the API/design can express watched row identity directly"]},{"id":"136","title":"Completion-side reader-handler counter","file":"136-completion-microtask-counter.md","date":"2026-05-14","status":"accepted","directions":["stream-rerun-dispatch","measurement-system"],"outcomeClass":"accepted_measurement","impact":"Measurement-only: profile-mode counters (`completion_handler_us`, `stream_emit_us`) expose the main-isolate reader worker port handler chain on A11c overlap as 28.57% of total wall (burst + drain) at ~18 µs per call across 4,228 calls/burst, with subscriber emit only 0.35% of the chain. Reader-reply batching is the natural bounded implementation candidate. Closes the `completion-side microtask scheduling cost counter` entry in `signals.json#stream-rerun-dispatch.blockedOnMeasurement`","changed":["On A11c overlap the reader-worker port handler accounts for 28.57% of total wall (burst + drain) at ~18 µs per call across 4,228 calls per burst — the largest remaining reachable main-isolate slice","Subscriber-fanout emit is < 1% of the completion chain on every measured workload; batching `controller.add` is not the optimization target","Most reader replies on A11c overlap short-circuit via `selectIfChanged` hash comparison (4,228 completions → 29 emits in the fresh pass); the per-call cost is handler bootstrap + Future resolution + hash check + `_flushQueue` admit, not real query result work","Most reader-completion wall fires AFTER the writer-burst stopwatch stops; the shared `audit_workloads.dart` now snapshots counters BOTH at burst-end and after the drain so future main-isolate audits can pick the right denominator. A11c drain switched from a fixed 50 ms wait to the same quiet-window pattern keyed-PK already uses"],"next":["evaluate reader-reply batching as the bounded implementation candidate that follows: must drop `completion_us / total_us` on A11c overlap AND stay neutral on A11c disjoint and keyed-PK (otherwise overall release-suite delta is workload-specific)","treat `stream_emit_us` as evidence-of-absence for subscriber-fanout optimization candidates until a workload with very many listeners per stream surfaces","future main-isolate counters should follow the exp 136 pattern (counter + post-drain snapshot in `audit_workloads.dart`) rather than redoing the harness wiring"]},{"id":"142","title":"Single-row text parameter direct encoding","file":"142-single-row-text-direct-encoding.md","date":"2026-06-08","status":"rejected","directions":["parameter-encoding-and-binding"],"outcomeClass":"rejected_no_signal"},{"id":"143","title":"Tracelite profile insight audit","file":"143-tracelite-profile-insights.md","date":"2026-06-08","status":"accepted","directions":["measurement-system"],"outcomeClass":"accepted_measurement","impact":"Measurement-only: pinned Tracelite profile runs show stable dispatch floors (reader 12 us, writer 16 us), point queries at the dispatch floor, merge rounds with 77 us of floor-subtracted work, and memory/allocation signal that wall time alone hides; current `tracelite explain` only reports coverage, so richer workload-summary insight rules are the next measurement-system improvement","changed":["Pinned Tracelite profile runs already produce decision-useful structured evidence: dispatch floors, floor-subtracted work, operation tails, memory deltas, allocation counters, source provenance, and validated graph data","The current canonical profile workload shows point queries are median dispatch-bound (0-1 us of floor-subtracted work), merge rounds are work-bound (77 us of floor-subtracted work), and point queries still carry allocation/RSS cost that wall time alone hides","`tracelite explain` is not yet doing enough interpretation for resqlite experimenters; it loaded the workload summary but did not identify dispatch-bound, work-bound, memory-heavy, or tail-noisy workloads"],"next":["add Tracelite workload-summary explain rules before adding another resqlite-local interpretation harness","keep raw trace regions local while committing aggregate markdown and graph data only when it feeds Pages","use repeated Tracelite profile runs before making p99 or max-tail claims"]},{"id":"144","title":"sqlite3mc 2.3.2 → 2.3.5 bump (SQLite 3.51.3 → 3.53.2)","file":"144-sqlite3mc-bump-2-3-5.md","date":"2026-06-08","status":"accepted","directions":["sqlite-version-and-build-config"],"outcomeClass":"accepted","impact":"Satisfies exp 090's revisit trigger (SQLite `.2`+ point release with sqlite3mc tracking it); tests stay green including embedded-NUL + Unicode bind regression suite; release-suite single-pass A/Bs swing between 19/18/124 and 30/2/129 — Concurrent Reads 8× is the only metric that flags consistently across reruns (+~20% on a sub-ms metric) and is the focus of the soak window; FP-rounding hazard skipped because resqlite never serialises REAL via `sqlite3_column_text`","changed":["Once SQLite ships a `.2` point release and sqlite3mc cuts a tracking release, exp 090's vendoring-bump audit moves from `defer` to `do` without any further policy debate — the 3.53.x line is the canonical case","The 3.53.0 default-FP-rounding hazard does not reach resqlite output because we never use `sqlite3_column_text` for REAL values; the proposed `SQLITE_DBCONFIG_FP_DIGITS=15` shim is unnecessary","Single-pass release-suite A/B on a vendoring bump is direction signal only; the first pass on this worktree showed 19/18/124 and the rerun 30/2/129, so a regression flag should be reconfirmed across two independent passes before being treated as real","The Concurrent Reads 8× wall-median metric is the only regression that persisted across both candidate passes (+~20%); 4× concurrency wins on the same baseline, so the slowdown is not a generic read-pool effect and is the canonical soak-window question for this bump"],"next":["promote exp 144 from In Review to Accepted once the soak window closes with no release-suite regression","if a multi-pass rerun of Concurrent Reads 8× under 3.53.x stays slower than 2.3.2-baseline, open a follow-up against the read-pool path or revert the bump","future bump audits should run two independent single-pass A/Bs before claiming a behavioral change in SQLite or release-suite signal"]},{"id":"145","title":"Inline stream flush dequeue","file":"145-stream-flush-inline-dequeue.md","date":"2026-06-08","status":"rejected","directions":["stream-rerun-dispatch"],"outcomeClass":"rejected_below_current_signal"},{"id":"146","title":"Lower batch packing threshold","file":"146-lower-batch-pack-threshold.md","date":"2026-06-08","status":"rejected","directions":["parameter-encoding-and-binding"],"outcomeClass":"rejected_no_signal"},{"id":"147","title":"Writer SQLite wall split","file":"147-writer-sqlite-wall-split.md","date":"2026-06-08","status":"accepted","directions":["stream-rerun-dispatch","measurement-system"],"outcomeClass":"accepted_measurement","impact":"Measurement-only: profile-mode writer responses now report SQLite-facing write time back into `ProfileCounters`; on A11c overlap, SQLite is 15.7 ms / 166.8 ms (9.4%), invalidation is 18.8%, and residual writer/request wall is 71.8%. Keyed-PK shows the same shape (18.1% SQLite, 18.7% invalidation, 63.3% residual). Clears the writer-wall-vs-SQLite-wall blocker; next stream work should reduce completion/reply scheduling or residual writer/request wall rather than SQLite-step tuning","changed":["SQLite-facing write calls are a minority of writer-side burst wall on active stream workloads: A11c overlap is 9.4% SQLite and keyed-PK is 18.1% SQLite","After subtracting SQLite-facing calls and stream invalidation, residual writer/request wall remains the largest bucket on A11c overlap and keyed-PK","Future stream-dispatch work should target completion-side scheduling, reply/request coordination, or dirty-set harvest rather than SQLite-step tuning, and should carry any narrow measurement inside the implementation branch"],"next":["reader-reply batching candidate should reduce exp 136 completion_us / total_us on A11c overlap","if residual writer/request detail is needed, gather only the split required by a concrete reduction candidate and remove temporary scaffolding before merge unless it lite workload-summary insight guard","file":"169-tracelite-workload-insights.md","date":"2026-06-14","status":"accepted","directions":["measurement-system"],"outcomeClass":"accepted_measurement","impact":"Adds a Resqlite-side validation step to `benchmark/profile/run_tracelite_profile.dart` so canonical profile runs fail if `tracelite explain` regresses to coverage-only output. The validated profile emitted dispatch floors, dispatch-bound point queries, work-bound merge rounds, tail spread, RSS, allocation, and WAL insight IDs; thin `workload_loaded` fixtures now fail locally","changed":["The Tracelite workload-summary explanation layer now emits the interpretation exp 143 had to recover manually: dispatch floors, dispatch-bound point queries, work-bound merge rounds, tail spread, RSS movement, allocation counters, and WAL side effects","`benchmark/profile/run_tracelite_profile.dart` now validates the stable workload insight IDs after `tracelite explain`; a thin `workload_loaded`-only artifact exits 65 instead of silently looking complete","`workload_dispatch_bound` is useful but intentionally not a hard guard because it is threshold-based and can disappear when point-query floor-subtracted work lands slightly above the near-zero band on a noisy machine"],"next":["use the profile wrapper's generated `insights.md` before opening raw workload-summary JSON for dispatch-vs-work and memory/allocation shape","keep raw profile regions and workload JSON local under `build/`; commit compact aggregates unless graph data is feeding Pages","if future profile workload shape changes remove a required stable insight ID, update the guard and signal map in the same experiment rather than weakening the contract silently"]},{"id":"170","title":"Synchronous uncontended writer mutex fast-path","file":"170-uncontended-mutex-fastpath.md","date":"2026-06-12","status":"rejected","directions":["stream-rerun-dispatch"],"outcomeClass":"rejected_below_current_signal"},{"id":"171","title":"Resolved runtime cache for `Database` hot paths","file":"171-resolved-runtime-cache.md","date":"2026-06-14","status":"rejected","directions":["stream-rerun-dispatch"],"outcomeClass":"rejected_below_current_signal"},{"id":"172","title":"Long-payload stream hash coverage","file":"172-long-payload-stream-hash.md","date":"2026-06-15","status":"accepted","directions":["long-text-stream-hashing","measurement-system"],"outcomeClass":"accepted_measurement","impact":"Adds a default streaming-suite row for mixed 32KB TEXT + 32KB BLOB unchanged fanout plus long-BLOB hash correctness coverage. The mixed row lands at 3.446 ms median beside the existing 4KB TEXT row at 2.356 ms, closing the long-payload measurement blocker without justifying an immediate new hash-loop variant","changed":["The streaming suite now covers mixed long payloads beyond exp 110's 4KB TEXT shape: 8 unchanged streams over 64 rows with 32KB TEXT plus 32KB BLOB cells","The current 8-byte FNV fold scales acceptably on the broader row in a focused run: 3.446 ms median for mixed long payloads beside 2.356 ms for the existing 4KB TEXT row","Long-BLOB hash correctness is covered directly: same-length no-op BLOB updates suppress emission, while changes after the first 8-byte chunk emit"],"next":["do not reopen byte-stream hash-loop implementation work without checking both long TEXT and mixed TEXT/BLOB unchanged-fanout rows","future hash variants need a concrete mechanism or production profile showing this path remains dominant; broader measurement alone is no longer the blocker","the direct streaming-suite entry point can be used for focused stream measurements before compiling the full release runner"]},{"id":"173","title":"32 KB long-text streaming benchmark + 16-byte FNV fold","file":"173-long-text-32kb-hash.md","date":"2026-06-15","status":"rejected","directions":["long-text-stream-hashing"],"outcomeClass":"rejected_no_signal","impact":"Filled the open `long-text-stream-hashing` candidate by building the missing ≥32 KB cell workload, then tested an unrolled 16-byte FNV body inside `fnv_combine_bytes` against it. Two order-flipped passes showed the candidate consistently +4.5 % and +12.1 % vs the exp 110 8-byte body — slight regressions inside a 2.6 → 6.0 ms per-pass spread, no real signal. Premise refuted: at 32 KB on a pool-of-4 reader fleet the byte-stream fold is at most ~50 % of wall, so loop-overhead removal is below noise. C body reverted to exp 110's path; new `streaming.dart` 32 KB section, `workload_registry.dart` curated metric, and focused `benchmark/experiments/long_text_32kb_hash.dart` harness retained as the durable contribution.","changed":["At 32 KB cells on a pool-of-4 reader fleet the byte-stream fold is no longer the dominant wall component: even an unrolled 16-byte FNV body is +4.5 % to +12.1 % vs the exp 110 8-byte body across two order-flipped passes, all inside a 2.6 → 6.0 ms per-pass spread","The named ≥ 32 KB cell candidate is closed: the workload now exists (release-suite `Long-Text 32KB Unchanged Fanout` and focused `benchmark/experiments/long_text_32kb_hash.dart`) and shows that hash-loop unrolling beyond exp 110's 8-byte fold is below noise on this shape","The long-text direction is settled, not just `watch`: further FNV-shape variants need either a workload that isolates the hash loop from reader-pool parallelism, or a mixed BLOB/TEXT long-payload shape that may shift the hash-vs-retrieval ratio"],"next":["do not retry FNV unrolling variants on the existing parallel-fanout long-text shapes without a workload that isolates the hash loop","if a mixed BLOB + long-TEXT unchanged-fanout workload becomes interesting, exp 173's focused harness is a reusable template","a single-stream long-payload microbenchmark (one stream, no reader-pool parallelism) would expose hash-loop overhead that the current shape hides"]},{"id":"174","title":"selectBytes native-view transfer","file":"174-selectbytes-view-transfer.md","date":"2026-06-15","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted","impact":"`selectBytes` sends a `Uint8List` view over the reader connection's persistent `json_buf` and never takes the sacrifice (Isolate.exit + reader respawn) path. Sacrifice is a real win for the rows path (zero-copy object transfer) but counterproductive for bytes — native JSON must be `fromList`-copied before `Isolate.exit` can transfer it, so it saved zero copies and only added a respawn, while the non-sacrifice path copied twice. **−44% (~1.8×)** on large (>256KB) byte reads by eliminating the per-query respawn, **−4%** on small, at a bounded ~+15MB RSS high-water. Net code removal, no public API change","changed":["The reader sacrifice path (Isolate.exit + reader respawn) is a win for the rows path (zero-copy transfer of already-built Dart objects) but counterproductive for selectBytes: native JSON must be Uint8List.fromList-copied before Isolate.exit can transfer it, so sacrifice saves zero copies on bytes and only adds a respawn; the non-sacrifice bytes path copied twice (fromList + SendPort)","Sending a Uint8List view over the reader connection's persistent json_buf is sound (SendPort snapshots the bytes at send time; the single-threaded handler keeps the buffer stable through the send) and is the single mandatory copy at every size, so selectBytes never needs to sacrifice","Large (>256KB) selectBytes is -44% (~1.8x) by eliminating the per-query reader respawn; small (<256KB) is -4% (two copies -> one); the cost is a bounded ~+15MB RSS high-water because readers are no longer respawned (json_buf reused, not reallocated)"],"next":["exp 175 promoted a large-byte (>256KB) selectBytes lane into the release suite and curated metric list; use `selectBytes() large bytes` as the guard for future bytes-transfer policy changes","if a memory-sensitive workload shows problematic json_buf retention, reopen with a high memory-reclaim sacrifice threshold for bytes (e.g. >8MB) or a C-side json_buf shrink, preserving the view-send win for the realistic large range","do not extend view-send to the rows path: there the payload is Dart objects and sacrifice's zero-copy object transfer is the real win (exp 008b/019)","do not pursue true zero-copy bytes transfer (fresh malloc per query + send address + NativeFinalizer): a size sweep 256KB->64MB (benchmark/experiments/transfer_mechanism_ab.dart) showed it 14-24% SLOWER at every size, no crossover. The decisive factor is buffer reuse, not the copy: the current path reuses a warm json_buf (no per-query allocation), while zero-copy must malloc a fresh buffer per query (mmap/munmap syscalls + cold-page faults that scale with size) and that exceeds the memcpy it saves. Reuse is incompatible with handing the buffer to main, and the buffer can't be safely recycled because callers can retain the returned Uint8List. The single copy is structurally the floor. Do not reopen without a fundamentally different mechanism (e.g. a recycled WARM native transfer-buffer pool with cross-isolate finalizer recycling — complex, GC-timing-dependent, unbounded under load)"]},{"id":"175","title":"Large selectBytes release coverage","file":"175-large-selectbytes-coverage.md","date":"2026-06-16","status":"accepted","directions":["result-transfer-shape","measurement-system"],"outcomeClass":"accepted_measurement"},{"id":"176","title":"Row.containsKey identity fast path","file":"176-row-containskey-identity-fastpath.md","date":"2026-06-16","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted"},{"id":"177","title":"Order-flipped A/B drift discriminator","file":"177-ab-drift-discriminator.md","date":"2026-06-16","status":"accepted","directions":["measurement-system"],"outcomeClass":"accepted","impact":"Methodology tooling: mechanizes the JOURNAL's most-reapplied lesson (phase-ordered A/B gates confound code deltas with time-correlated drift). Adds `cvPct` + `classifyDriftFlag` to `benchmark/shared/stats.dart` and a `benchmark/ab_drift_check.dart` CLI that reads two order-flipped passes of per-run values and classifies a regression flag as `reproduced` (same-direction effect, comparable CVs), `drift-suspected` (CV asymmetry on the flagged phase, or sign reversal across the flip), or `inconclusive`. Re-run against the recorded flags from exp 159 (CV asymmetry) and exp 167 (sign reversal), it reproduces the verdicts those runners reached by hand. No runtime change; 14/14 unit tests pass","changed":["The JOURNAL's most-reapplied lesson — phase-ordered A/B gates confound code deltas with time-correlated drift — was enforced only by runner discipline. Every recent A/B writeup (exp 159, 167, 171, 173) re-derived the same CV-asymmetry + order-flip reasoning by hand. Encoding it as cvPct + classifyDriftFlag in benchmark/shared/stats.dart plus a benchmark/ab_drift_check.dart CLI makes the call deterministic and citable","classifyDriftFlag reaches drift-suspected by two mechanisms: (1) CV asymmetry — the flagged phase's CV is >= 4x its clean phase's and above an 8% floor (the exp 159 signature, 0.20-0.46 vs 0.01-0.06), or (2) sign reversal across the order flip with both effects above a 3% floor (the exp 167 signature). Re-run against reconstructed exp 159 and exp 167 flags, the tool reproduces the verdicts those runners reached manually. reproduced requires both order-flipped passes to agree same-direction with comparable CVs","This is methodology tooling in the class of exp 161 / exp 169: it changes no runtime code and is not a measurement-that-unlocks-an-implementation, so the paired-run carry rule does not apply. A single pass can only reach drift-suspected (via CV asymmetry) or be deferred to the runner; the tool interprets the order-flipped pass, it does not replace running it"],"next":["wire decide_tracelite.dart / run_tracelite_experiment.dart to emit per-run sample arrays for flagged scenarios in the JSON shape ab_drift_check.dart reads, so the drift check is one command after a flagged pass rather than a hand-built fixture; blocked on the upstream tracelite decision JSON exposing per-run samples","if a future workload has a naturally higher noise floor, pass --cv-asymmetry-ratio / --clean-cv-pct / --effect-floor-pct rather than editing the defaults (which are derived from exp 144/159/167/171/173)"]},{"id":"178","title":"Missing-benchmark-run declaration guard","file":"178-missing-run-declaration-guard.md","date":"2026-06-16","status":"accepted","directions":["measurement-system"],"outcomeClass":"accepted","impact":"Measurement-only CI guardrail: `generate_history.dart` now fails the build when a chartable (accepted/in-review) experiment numbered `≥ 178` has no linked benchmark run *and* no `**Benchmark Run:**` opt-out declaration — converting the documented silent chart-invisibility failure (forgotten result file / date mismatch) into a loud error for new work. Reuses the existing `_skipsReleaseBenchmarkRunMapping` opt-out signal as the escape hatch; pre-178 experiments are grandfathered. No runtime code; `history.json` byte-for-byte unchanged","changed":["The experiment->chart linker in generate_history.dart guarded the wrong-file case (_assertAcceptedExperimentsLinkToCandidates, the exp-109 mixup) but silently tolerated the more common missing-file case: a chartable experiment with no linked benchmark run AND no **Benchmark Run:** opt-out declaration drops off the chart with no CI error, which is exactly what a forgotten result file or a Date/timestamp mismatch produces","A structural tally on main confirmed the gap is live: of 23 accepted/in-review experiments whose linker produced a null run, only ~5 declared the **Benchmark Run:** opt-out header; the rest (several recent — 116, 118, 119, 125, 126, 136, 161, 172) are silently unmapped, indistinguishable from a forgotten file","Adding _assertNewExperimentsLinkOrDeclareRun (over a pure, unit-testable findUndeclaredMissingRunExperiments detector) makes the declaration mandatory for accepted/in-review experiments numbered >= a cutoff (178) with a null run; the repo's existing _skipsReleaseBenchmarkRunMapping header (none/n/a/tracelite) is the escape hatch. Pre-cutoff experiments are grandfathered, history.json is byte-for-byte unchanged, and no runtime code (lib/native/hook) is touched"],"next":["to pull the ~17 pre-178 silently-unmapped chartable experiments under the guard, backfill their **Benchmark Run:** headers (or commit their missing result files) and lower _benchmarkRunDeclarationCutoff in the same change — completed by exp 188 (cutoff walked to 1; 16 chartable experiments backfilled + exp 174 declaration tightened to start with `none — `; history.json byte-for-byte unchanged)","if the experiments page ever charts rejected experiments that ship a result file, widen the guard's status scope (currently accepted/in-review only) rather than touching the cutoff"]},{"id":"179","title":"Single-row ASCII parameter packing","file":"179-single-row-ascii-param-packing.md","date":"2026-06-16","status":"rejected","directions":["parameter-encoding-and-binding"],"outcomeClass":"rejected_no_signal"},{"id":"180","title":"Cross-call write request batching (group commit)","file":"180-group-commit-request-batching.md","date":"2026-06-17","status":"accepted","directions":["stream-rerun-dispatch"],"outcomeClass":"accepted"},{"id":"181","title":"Single-stream long-payload hash","file":"181-single-stream-long-payload-hash.md","date":"2026-06-17","status":"rejected","directions":["long-text-stream-hashing"],"outcomeClass":"rejected_no_signal","impact":"Added a focused one-reader harness that removes exp 173's eight-stream reader-pool parallelism: one unchanged stream hashes 64 rows x 64 KB TEXT + 64 KB BLOB (~8 MB) before a queued `COUNT(*)` barrier can emit. Re-tested the 16-byte FNV fold against the exp 110 8-byte body across an order-flipped pair. Baseline medians were 2.771 / 2.777 ms; candidate medians were 2.763 / 2.792 ms (-0.3% / +0.5%), with fully overlapping ranges. Rejected: even isolated to one stream, loop unrolling is invisible on the public stream path. Native C reverted; focused harness retained.","changed":["The single-stream open candidate from exp 173 has been consumed: benchmark/experiments/single_stream_long_payload_hash.dart uses an internal one-reader runtime so one unchanged stream hashes 64 rows x 64 KB TEXT + 64 KB BLOB (~8 MB) before a queued COUNT(*) barrier can emit","Removing reader-pool parallelism did not reveal a 16-byte FNV win. Across an order-flipped pair, baseline medians were 2.771 / 2.777 ms and candidate medians were 2.763 / 2.792 ms (-0.3% / +0.5%), with overlapping ranges","The exp 110 8-byte FNV body remains the correct implementation. The exp 173 16-byte unroll is now rejected under both pooled fanout and single-stream long-payload public stream shapes"],"next":["do not retry FNV loop unrolling on the existing long-text, long-payload, or single-stream public stream workloads","if long-payload unchanged hashing becomes hot again, use a direct resqlite_query_hash microbenchmark or production profile to split SQLite value access, hashing, reader dispatch, and reply delivery before implementing another hash-loop variant","the one-reader harness is a measurement tool only; it is not evidence for a public Database.open reader-count option"]},{"id":"182","title":"Skip preupdate dependency tracking when no streams active","file":"182-skip-dep-tracking-no-streams.md","date":"2026-06-17","status":"rejected","directions":["stream-rerun-dispatch"],"outcomeClass":"rejected_no_stable_signal"},{"id":"183","title":"json_buf retention audit + high-threshold reclaim","file":"183-json-buf-retention-audit.md","date":"2026-06-17","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted","impact":"Diagnostic + reclaim. Adds `Diagnostics.readerJsonBufHighWaterBytes` (sum of per-reader `json_buf.cap`) so the bounded RSS high-water exp 174 left as a known trade-off is now directly observable. Pathological retention is real on a one-off concurrent-burst workload (8 × 8 MB `selectBytes` pins **32 MB** across the 4-reader pool for the rest of the connection's life) and on a recurring-large pattern (16 MB pinned). A high-threshold C-side `realloc` shrink — fired by the reader worker after `SendPort.send` on a `selectBytes` reply when `json_buf.cap > 1 MB` AND the just-sent result was < 256 KB — reclaims back to the 16 KB initial cap on subsequent small reads: **post-burst settle 32 MB → 64 KB** (×4 readers, summed); recurring-large **16 MB → 64 KB**. Neutral on the focused `large_bytes_transfer.dart` lanes (±2 % within run-to-run noise). The 256 KB last-len guard is what makes the policy safe under back-to-back large reads — they keep their warm capacity","changed":["Exp 174's bounded RSS high-water (~+15 MB after 200 x 651 KB selectBytes) becomes pathological under a one-off concurrent-burst shape: 8 concurrent x 8 MB selectBytes pin 32 MB of native json_buf across the 4-reader pool for the rest of the connection's life, and the recurring-large pattern (1 large per 50 small over 300 iterations) settles at 16 MB pinned. The exp 174 future-note about high-threshold reclaim is a real candidate, not a hypothetical","Adding Diagnostics.readerJsonBufHighWaterBytes (sum of per-reader json_buf.cap) makes the high-water directly observable from any benchmark or downstream user — a reusable signal for future memory-sensitive selectBytes work alongside the existing exp 174 'large bytes' release lane","A high-threshold C-side realloc shrink, fired by the reader worker after SendPort.send returns on a selectBytes reply when json_buf.cap > 1 MB AND the just-sent result was < 256 KB, reclaims pathological retention without per-call cost on warm small buffers or back-to-back large reads. Post-burst settle: 32 MB -> 64 KB (32 MB freed); recurring: 16 MB -> 64 KB. Focused large_bytes_transfer.dart neutral within noise (large +0.7%, small +2%)","The 256 KB last-len guard is the load-bearing piece of the policy: it prevents the realloc churn anti-case the exp 174 future-note explicitly named (back-to-back large reads would shrink-then-regrow if shrinks were unconditional)"],"next":["promote a release lane that asserts json_buf_total stays bounded after a representative one-off concurrent-burst workload (exp 161 pattern) so this reclaim mechanism has public regression visibility","if a future workload shows the 1 MB trigger cap is too aggressive (hot 1-MB-class reads followed by a steady 500-KB-class read paying realloc churn), the natural tuning is to raise the trigger cap to 4 MB, not to drop the last_used_len guard","the new diagnostic field is the reusable signal for any future RSS-sensitive selectBytes work; the existing measurement-system openCandidate ('memory profiling harness with per-benchmark RSS acceptance criteria') can build on top of it rather than from scratch"]},{"id":"184","title":"Writer residual re-split (post-159/180)","file":"184-writer-residual-resplit.md","date":"2026-06-17","status":"accepted","directions":["stream-rerun-dispatch"],"outcomeClass":"accepted_measurement"},{"id":"185","title":"JSON buffer reclaim release coverage","file":"185-json-buf-release-coverage.md","date":"2026-06-18","status":"accepted","directions":["result-transfer-shape","measurement-system"],"outcomeClass":"accepted_measurement"},{"id":"186","title":"Single-row large-text bind encoder","file":"186-single-row-large-text-bind-encoder.md","date":"2026-06-18","status":"accepted","directions":["parameter-encoding-and-binding"],"outcomeClass":"accepted","impact":"Revives exp 179's direct-ASCII `allocateParams` rewrite against a representative large-payload workload — the explicit revisit condition exp 179 named. Focused `single_row_large_text_bind.dart` measures **−15% to −32%** at 16 KB → 1 MB single-row INSERT text binds, reproduced across order-flipped passes; encoder isolation reproduces exp 179's −45% / −58% / −37% on the synthetic micro. Small-payload release-suite lanes (Parameterized Queries, Single Inserts, Concurrent Single Inserts) stay neutral, confirming exp 179's small-bind finding stands; the lone flagged batch-tx regression is sub-decision-threshold noise on a routing path the encoder does not touch (`allocateBatchParams`). Saves one `Uint8List` allocation + one byte-buffer copy per ASCII string param; non-ASCII strings still take the unchanged `_allocateParamsPreEncoded` fallback.","changed":["The exp 179 single-row direct-ASCII allocateParams rewrite is materially beneficial once the bound text crosses the mid-tens-of-KB range — exactly the revisit condition exp 179 named. The new focused single_row_large_text_bind.dart workload (1 KB to 1 MB sequential INSERTs) measures -15.4% / -11.1% at 16 KB, -17.3% / -18.7% at 64 KB, -32.3% / -32.1% at 256 KB, and -26.7% / -28.5% at 1 MB across two order-flipped passes","Encoder isolation reproduces exp 179's deltas exactly (-45% / -58% / -37% on the single_row_param_packing.dart micro), so the mechanism question (encoder faster vs slower) is settled separately from the workload-materiality question","Small-payload single-row binds remain at the noise floor — Parameterized Queries, Single Inserts, and Concurrent Single Inserts all neutral on the release suite. Exp 179's small-bind finding stands: the encoder is the right default for the single-row path now because we have a representative workload where it matters, not because the small case stopped being flat","The one flagged release-suite regression (Batched Write Inside Transaction 100 rows, +44% on a 0.37 ms / 18.8% CV lane) is sub-decision-threshold noise on a code path the encoder cannot mechanistically reach (allocateBatchParams, not allocateParams); the 1000-row sibling moves the opposite direction (-10%) on the same change"],"next":["use benchmark/experiments/single_row_large_text_bind.dart as the durable workload for any future single-row bind change; the 1 MB shape is the load-bearing acceptance gate","do not extend the single-row encoder to UTF-8 long payloads (extending the Unicode fallback in the same shape exp 126 did for batches) without a representative non-ASCII large single-row workload; the encoder mechanism is settled but the materiality threshold is workload-specific","exp 142 / exp 179 small-bind rejections are sharpened (not overturned) by this run: do not retry direct encoding on small single-row text shapes without new evidence that the round-trip floor has moved"]},{"id":"187","title":"Single-row UTF-8 bind encoder","file":"187-single-row-utf8-bind-encoder.md","date":"2026-06-19","status":"accepted","directions":["parameter-encoding-and-binding"],"outcomeClass":"accepted","impact":"Extends exp 186's single-row large-text encoder from ASCII-only to direct UTF-8 for non-ASCII parameter lists, reusing the wide-batch `_utf8Length` / `_writeUtf8` helpers and removing the temporary `utf8.encode()` list plus second copy. The broadened `single_row_large_text_bind.dart` CJK rows improve **~31% to ~39%** at 16 KB through 1 MB across an order-flipped pair; ASCII controls stay comparable because the exp 186 all-ASCII fast path is preserved. Adds single-row multibyte + embedded-NUL correctness coverage. Runtime code change; held in review.","changed":["Exp 186's UTF-8-heavy follow-up now has a representative workload: single_row_large_text_bind.dart emits byte-matched CJK rows beside the ASCII rows, so future single-row bind changes can test both direct-ASCII and direct-UTF-8 payloads in one focused harness.","Replacing the single-row non-ASCII _allocateParamsPreEncoded fallback with direct _utf8Length/_writeUtf8 packing removes one temporary Uint8List allocation plus one copy per non-ASCII string param. The CJK focused rows improve roughly 31-39% at 16 KB through 1 MB across the order-flipped pair.","The ASCII single-row path remains the exp 186 direct code-unit path; ASCII controls stayed comparable across the widened harness. Small unicode-1 encoder micro differences are tens of nanoseconds and not the acceptance gate."],"next":["use benchmark/experiments/single_row_large_text_bind.dart for both ASCII and CJK rows before accepting any future single-row bind encoder rewrite","the old single-row Unicode fallback is gone; future correctness changes to _utf8Length/_writeUtf8 must preserve multibyte, surrogate-pair, and embedded-NUL behavior on execute() as well as executeBatch()","if a release-suite large single-row text lane is added later, it should include a non-ASCII shape rather than only repeating exp 186's ASCII gate"]},{"id":"188","title":"Pre-178 benchmark-run declarations backfill","file":"188-prerun-declarations-backfill.md","date":"2026-06-19","status":"accepted","directions":["measurement-system"],"outcomeClass":"accepted"},{"id":"189","title":"Savepoint name compression","file":"189-savepoint-name-compression.md","date":"2026-06-20","status":"rejected","directions":["transaction-control-paths"],"outcomeClass":"rejected_below_signal","impact":"Replaced depth-specific nested transaction SQL with cached same-name savepoint strings (`SAVEPOINT s`, `RELEASE s`, `ROLLBACK TO s`) and measured it with a new focused `savepoint_name_compression.dart` harness. Best-case control rows trended faster (empty fanout ~-6% both passes; rollback fanout -17% / -13%; deep chain -7% / -8%), but the representative nested-write fanout did not reproduce: -1.3% in the baseline-first pass, then +21.6% slower in the candidate-first pass. Same-name savepoint semantics are not worth carrying for a noisy/non-reproducing write-fanout result. Runtime change reverted; focused harness retained. Future transaction-control work needs to collapse savepoint round trips, not rename/cache per-boundary SQL strings.","changed":["Savepoint naming compression (same-name cached SQL for `SAVEPOINT s`, `RELEASE s`, and `ROLLBACK TO s`) can move best-case focused control rows: empty fanout improved about 6-7%, rollback fanout improved 13-17%, and repeated deep chains improved 7-8% across the order-flipped pair.","The representative nested-write fanout did not reproduce: baseline-first measured -1.3%, then the candidate-first pass measured +21.6% slower. That is the load-bearing row because it matches the real nested transaction shape better than empty control-only fanout.","Per-savepoint string formatting, native UTF-8 allocation, caching, and naming are below the merge bar after exp 102, exp 111, and exp 189. Nested transaction headroom remains round-trip-shaped, not string-shaped."],"next":["Do not retry savepoint string caching, savepoint naming compression, or native helpers that still send one request per savepoint boundary without new evidence that string work is dominant.","Use benchmark/experiments/savepoint_name_compression.dart for quick savepoint-control probes, but treat the write-fanout row as the representative gate.","The remaining open implementation shape is multi-savepoint round-trip batching with preserved callback semantics and rollback legality."]},{"id":"190","title":"selectBytes column-name token pre-encoding","file":"190-selectbytes-col-name-preencode.md","date":"2026-06-20","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted"},{"id":"191","title":"Embedded-NUL public API audit","file":"191-embedded-nul-public-api-audit.md","date":"2026-06-21","status":"accepted","directions":["parameter-encoding-and-binding"],"outcomeClass":"accepted_correctness_guard"},{"id":"192","title":"Two-digit table itoa for selectBytes integer columns","file":"192-two-digit-itoa.md","date":"2026-06-21","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted"},{"id":"193","title":"Row.values list-view iterator","file":"193-row-values-list-view.md","date":"2026-06-22","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected_regression"},{"id":"194","title":"Integer-valued REAL selectBytes fast path","file":"194-real-integer-fastpath.md","date":"2026-06-23","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted"},{"id":"195","title":"Stmt-cache pre-encoded JSON column-name tokens","file":"195-stmt-cache-name-tokens.md","date":"2026-06-23","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted"},{"id":"196","title":"selectBytes inter-row framing batch","file":"196-selectbytes-row-framing.md","date":"2026-06-23","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected_below_signal"},{"id":"197","title":"True group commit moonshot","file":"197-true-group-commit-moonshot.md","date":"2026-06-23","status":"rejected","directions":["stream-rerun-dispatch"],"outcomeClass":"rejected_preserved_potential"},{"id":"198","title":"Direct-to-buffer integer/float JSON formatting","file":"198-direct-buf-int-float-json.md","date":"2026-06-24","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted"},{"id":"199","title":"Row-level capacity reservation in write_json_to_buf","file":"199-row-level-buf-ensure.md","date":"2026-06-25","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted"},{"id":"200","title":"Stable-Type selectBytes moonshot","file":"200-stable-type-selectbytes-moonshot.md","date":"2026-06-26","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected_semantic_mismatch"},{"id":"201","title":"Base64 quote reservation for selectBytes BLOBs","file":"201-base64-quote-reservation.md","date":"2026-06-27","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected_below_signal_bar"},{"id":"202","title":"TEXT string reservation for selectBytes","file":"202-text-json-string-reserve.md","date":"2026-06-28","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected_below_signal_bar"},{"id":"203","title":"Per-cell sqlite3_column_value reuse in write_json_to_buf","file":"203-cell-value-cache.md","date":"2026-06-28","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted"},{"id":"204","title":"UTF-8 over-reserve bind sizing","file":"204-utf8-overreserve-bind.md","date":"2026-06-29","status":"rejected","directions":["parameter-encoding-and-binding"],"outcomeClass":"rejected_preserved_potential"},{"id":"205","title":"per-cell `sqlite3_column_value` reuse in `resqlite_step_row`","file":"205-step-row-value-cache.md","date":"2026-06-29","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted"},{"id":"206","title":"selectBytes column-count cache","file":"206-selectbytes-col-count-cache.md","date":"2026-06-30","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected_below_signal_bar"},{"id":"207","title":"stmt_cache hot-SQL fast-path bypass","file":"207-stmt-cache-hot-sql-fastpath.md","date":"2026-06-30","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected_below_signal_bar"},{"id":"210","title":"reused BLOB batch workload and object-identity prototype","file":"210-reused-blob-batch-workload.md","date":"2026-07-02","status":"rejected","directions":["parameter-encoding-and-binding","measurement-system"],"outcomeClass":"rejected_preserved_measurement"},{"id":"211","title":"Persistent `queryBytes` out-parameter slots (revisits exp 108)","file":"211-persistent-query-bytes-slots.md","date":"2026-07-02","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted"},{"id":"212","title":"Lazy nested-savepoint materialization moonshot","file":"212-lazy-nested-savepoint-moonshot.md","date":"2026-07-03","status":"rejected","directions":["transaction-control-paths"],"outcomeClass":"rejected","impact":"Moonshot: tested whether nested transactions could defer SAVEPOINT creation and fuse SAVEPOINT + first write into one writer-isolate request, avoiding public API growth while challenging the eager-savepoint assumption. Rejected: empty nested bodies improved sharply (-77.9% / -74.5%), but the representative one-write nested fanout regressed in both orderings (+74.8% / +34.9%), rollback was neutral-to-slower, and the depth-5 chain slowed (+6.3% / +7.2%). Runtime prototype is preserved at `archive/exp-212`; final branch keeps only the evidence.","class":"moonshot","changed":["Lazy nested-savepoint materialization is only attractive for empty nested transaction bodies. Skipping SAVEPOINT/RELEASE for empty fanout x500 improved -77.9% / -74.5% across an order-flipped focused pair, but that is not a representative production gate.","Fusing SAVEPOINT + first execute into one writer-isolate request does not improve the meaningful nested-write shape. `savepoint_name_compression.dart` write fanout x100 regressed +74.8% in the baseline-first pair and +34.9% in the candidate-first pair; rollback fanout was neutral-to-slower and the depth=5 chain slowed in both passes.","The round-trip hypothesis remains narrower than it looked after exp 111: simply removing one nested-control message is not enough. Any future transaction-control attempt must fuse a larger savepoint scope or bring production evidence that empty/select-only nested bodies dominate."],"next":["Do not retry lazy nested savepoint begin or SAVEPOINT + first-write fusion without new workload evidence. The current focused harness already exercises the one-write nested body and rejects the shape.","If the direction reopens, the candidate must be structurally stronger: a full savepoint-scope command batch that runs begin/body/release or rollback in one request, or a profile proving deeply nested transaction control is a real hot path.","The public API is near-frozen. A public nested-batching surface would need a massive, broadly-applicable win; exp 212 provides evidence against that, not for it."]},{"id":"213","title":"Transaction body write coalescing moonshot","file":"213-tx-body-write-coalescing.md","date":"2026-07-03","status":"rejected","directions":["transaction-control-paths"],"outcomeClass":"rejected_pattern_not_encouraged","impact":"Moonshot: attacks the assumption that every awaited `tx.execute()` inside `db.transaction()` requires its own writer round-trip. Buffered concurrent (Future.wait-inside-tx) execute calls per Transaction and flushed them as a single `MultiExecuteRequest`; the writer's existing handler already tolerates `txDepth > 0` so each statement inherited the outer transaction and per-statement outcomes distributed back to individual futures. A fast path plus a `hasPendingWrites` guard on `drainForClose` held the common sequential-await pattern at pre-213 microtask cost. Focused `tx_body_write_coalescing.dart` measured **tx-burst-future-wait -26% / -31%** across order-flipped passes (ab_drift_check verdict: REPRODUCED); sequential-await, single-write, and interleaved-select lanes all below the 3% effect floor (verdict: neutral). Rejected: the pattern (`Future.wait([tx.execute × N])` specifically inside a transaction) is not one resqlite steers users toward — same-SQL bulk writes have `executeBatch`, different-SQL non-atomic bursts have exp 180's standalone coalescing, and different-SQL atomic bursts are rare. Accepting four load-bearing guards + persistent per-Transaction buffer state on the writer-path hot path for a workload we are not promoting was not worth the maintenance cost. Runtime prototype preserved at `archive/exp-213`; focused harness retained as durable gate for future transaction-body write experiments.","class":"moonshot","changed":["The per-execute round-trip floor inside `db.transaction()` is measurably not fundamental for the `Future.wait([tx.execute(...) x N])` shape: buffering N calls in one microtask and flushing as a single `MultiExecuteRequest` against the still-open transaction improved the focused `tx_body_write_coalescing.dart` `tx-burst-future-wait` lane -26.0% / -31.2% across two order-flipped passes with `ab_drift_check.dart` verdict REPRODUCED. This is the reproducible measurement, not the acceptance verdict — see below.","The rejection is about the *pattern*, not the numbers. `Future.wait([tx.execute × N])` inside a transaction has no strong idiomatic case in the resqlite public API: same-SQL bulk atomic writes belong on `executeBatch` (one `BatchRequest`, whole matrix runs in C), different-SQL non-atomic bursts are covered by exp 180's standalone coalescing (`db.execute` outside a tx), and different-SQL atomic bursts are rare enough that the maintenance cost of the runtime change is not warranted.","The buffered path required four load-bearing guards to stay neutral on common patterns: `_inFlightWrites` (fast path vs slow path arbiter), `hasPendingWrites` on `drainForClose` (empty-drain microtask hop guard), `List<Object?>.of(parameters)` at buffer time (parameter aliasing snapshot for the deferred send), and restoring `TraceliteProfile.traceAsync` on the fast path (Dart-side span parity for profile builds). Each was required by a measured regression or a correctness hazard Copilot flagged during PR review. That guard footprint sets a high maintenance floor on every future writer-path change — enough to justify rejection at a niche-pattern win, though not at a common-pattern win.","`MultiExecuteRequest` cross-experiment semantics: pre-213 the handler treated each write as its own autocommit under `txDepth == 0`; the buffered path required extending the same message type to also cover `txDepth > 0` (each statement inherits the outer transaction, dirty sets accumulate through the outermost commit). The handler already had the branch, but future changes to exp 180's coalescing pump now have to remember both semantics. Documented in the retained focused harness."],"next":["The `full savepoint-scope command batching` openCandidate remains open in the *ambitious* form only — fusing BEGIN + body + COMMIT into one writer request. Exp 213 shows the body-only variant of that vision is measurable (-26% to -31% on the burst pattern) but the remaining BEGIN/COMMIT round-trips are ~1% of tx wall in absolute terms. Do not retry the body-only variant. The full-scope variant still requires either a design that preserves callback semantics without a public API opt-in (exp 197's constraint) or a workload showing the BEGIN/COMMIT pair dominates the residual after this direction's other candidates ship — no new angle emerged from this run.","`benchmark/experiments/tx_body_write_coalescing.dart` is the durable harness for any future transaction-body write experiment. Its four lanes (tx-sequential-await, tx-burst-future-wait, tx-single-write, tx-interleaved-select) exercise the complexity/pattern trade-off explicitly: a future runner cannot claim a transaction-body write win without holding all four lanes to their exp 213 shape (the burst lane serves as the reachable-ceiling reference; the other three as neutrality guards).","Runtime prototype preserved at `archive/exp-213`. Reopen the direction if any of: (a) a production profile or downstream user report surfaces `Future.wait([tx.execute × N])`-inside-tx as a real hot path rather than a speculative shape; (b) a new design collapses the guard set from four to one (detection primitive that distinguishes burst from sequential without per-`Transaction` state, or a writer-side change that makes inside-tx multi-execute strictly cheaper without a Dart-side buffer); (c) the full savepoint-scope variant becomes tractable.","Sequential-await inside `db.transaction()` (`await tx.execute; await tx.execute`) remains bound by the per-write round-trip floor — nothing in exp 213 changes that, and users writing this common pattern paid pre-213 costs on the prototype. Future runners should not retry per-call microtask trimming (exp 170, 171 territory) without a workload that isolates that floor from the exp 213 fast-path cost."]},{"id":"214","title":"Write result direct-read prototype","file":"214-write-result-direct-read.md","date":"2026-07-04","status":"rejected","directions":["stream-rerun-dispatch","measurement-system"],"outcomeClass":"rejected_preserved_measurement"},{"id":"215","title":"Persistent `executeWrite` result-buffer slot (revisits exp 095)","file":"215-persistent-write-result-slot.md","date":"2026-07-04","status":"rejected","directions":["parameter-encoding-and-binding","measurement-system"],"outcomeClass":"rejected_below_signal"},{"id":"216","title":"Base64 loop unroll for selectBytes BLOBs","file":"216-base64-loop-unroll.md","date":"2026-07-05","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted"},{"id":"218","title":"8x base64 loop unroll for selectBytes BLOBs","file":"218-base64-8x-unroll.md","date":"2026-07-06","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected"},{"id":"219","title":"Direct JSON control-character escapes","file":"219-json-control-escape.md","date":"2026-07-07","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted"},{"id":"220","title":"Reject `fast_i64_to_str` 0..9999 direct-write fast path","file":"220-fast-i64-small-direct.md","date":"2026-07-08","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected_below_signal"},{"id":"222","title":"Reject `malloc` for large one-shot parameter arenas","file":"222-param-arena-malloc.md","date":"2026-07-11","status":"rejected","directions":["parameter-encoding-and-binding"],"outcomeClass":"rejected_below_signal"},{"id":"223","title":"Reject row-0 peel + `[{` fuse in `write_json_to_buf`","file":"223-write-json-row-peel.md","date":"2026-07-11","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected_below_signal"},{"id":"224","title":"Dynamic numeric-row batching moonshot","file":"224-numeric-row-batching-moonshot.md","date":"2026-07-12","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected_below_signal"},{"id":"225","title":"12-bit LUT for `json_write_base64`","file":"225-base64-lut12.md","date":"2026-07-12","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted"},{"id":"226","title":"Reject one-pass numeric batch packing","file":"226-one-pass-numeric-batch.md","date":"2026-07-13","status":"rejected","directions":["parameter-encoding-and-binding"],"outcomeClass":"rejected_below_signal"},{"id":"227","title":"Inline 16-byte over-copy for JSON column-name tokens","file":"227-json-token-overcopy.md","date":"2026-07-13","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted"},{"id":"228","title":"Restore canonical hashes after stream growth","file":"228-canonical-stream-hash.md","date":"2026-07-14","status":"accepted","directions":["stream-rerun-dispatch"],"outcomeClass":"accepted_correctness_and_performance"},{"id":"229","title":"SIMD (NEON) `json_write_base64` kernel — first SIMD kernel in the codebase","file":"229-simd-base64-neon.md","date":"2026-07-14","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted","impact":"Moonshot: introduces ISA-specific SIMD (`vld3q_u8` + `vqtbl4q_u8` + `vst4q_u8`) to `json_write_base64`, gated on `__aarch64__ && __ARM_NEON`, with the exp 225 scalar 12-bit-LUT encoder retained as fallback for non-ARM64 targets and for the < 48-byte tail. Four order-flipped paired passes of `select_bytes_blob_base64.dart` reproduce ~-45% median on the 4 KB payload-throughput lane (roughly 2x faster BLOB base64 encoding) and ~-18% on the 128 B lane; tiny-cell (3 B) and mixed guards stay inside the harness noise floor. Categorical implication: SIMD kernels are viable in resqlite when out-of-lined so the small-input path is unaffected, unlocking follow-ups in SSSE3 x86_64, SIMD JSON escape scan, and SIMD FNV hash.","class":"moonshot","changed":["The codebase-wide assumption that `native/resqlite.c` must be ISA-agnostic scalar C is no longer load-bearing. Exp 229 introduces the first SIMD kernel (`json_write_base64_neon_bulk`) gated on `defined(__aarch64__) && defined(__ARM_NEON)`, with the exp 225 scalar 12-bit-LUT encoder retained as fallback for non-ARM64 targets and for the < 48-byte tail on all targets.","A NEON `vld3q_u8` + `vqtbl4q_u8` base64 kernel materially moves BLOB encoding wall time past exp 225's scalar+LUT12 ceiling. Four order-flipped paired passes on `select_bytes_blob_base64.dart` reproduce ~-45% median (~2x) on the 4 KB payload-throughput lane and ~-18% median on the 128 B lane. Signals' 2026-05 note that 'future BLOB work needs a further mechanism change: SIMD `_mm_shuffle_epi8` / `vqtbl4q_u8` base64 kernels' is now consumed.","SIMD kernel placement in the same translation unit as scalar hot paths must be `noinline`, or the compiler's register allocation for the small-input path degrades. The first prototype (rounds 1-2, superseded) reproduced the 4 KB / 128 B wins but broke the 3 B tiny-cell guard at +3-9% reproduced regression because inline placement of the NEON body was affecting scalar code-gen; the `noinline` refactor collapsed the 3 B regression back into noise. This is a repeatable pattern for future SIMD kernels."],"next":["Keep `benchmark/experiments/select_bytes_blob_base64.dart` as the durable gate for future BLOB JSON encoder work. The 4 KB and 128 B lanes are the decision rows; the 3 B lanes are guards that stay on the scalar path (< 48 bytes never enters the NEON kernel).","SIMD kernels are now a viable mechanism for future work: SSSE3 (`_mm_shuffle_epi8`) base64 on x86_64 has the same shape and is the natural follow-up to widen platform coverage; SIMD JSON escape scan for `json_write_string`'s SWAR body is the signals-named TEXT-side mechanism now unlocked; a SIMD FNV hash body for `resqlite_query_hash` may help long-text stream hashing if a workload isolates it (exp 173 / 181 have the baselines).","New SIMD kernel authoring rule: place the SIMD body in its own `__attribute__((noinline))` function so the scalar hot path in the caller stays byte-identical to the pre-SIMD layo
