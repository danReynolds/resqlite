 time = hop + consume), columnar is neutral for REAL results (consume -5 to -13%, the box-on-access cost nearly cancels Float64List locality) and shows no reliable memory win (Smi integers live inline in a List<Object?>, so an Int64List column costs more per cell; RSS moved +25% to -30% inconsistently across lanes). This confirms exp 081's main-isolate-access caution generalizes to the columnar shape and completes exp 055's open assessment as a rejection.","The one real primary-metric signal: integer consume is ~2x faster on the main isolate (Int64List sequential access, no covariant-load barrier, vs pointer-chasing a List<Object?> of Smis), reproduced -48 to -52% on every integer lane in both orders. This is a narrow effect, not evidence for the whole-store rewrite."],"next":["Do not reopen the broad columnar ResultSet rewrite on the transfer or memory arguments. Exp 258 closes both: the Isolate.exit sacrifice path already handles large-result transfer, and Smi-int columns regress memory under Int64List.","Scoped open candidate: a narrow columnar path for numeric columns targeting the ~2x main-isolate integer-consume speedup, worthwhile only if a workload profile shows integer-heavy, main-isolate-bound reads dominating. It needs its own design pass for how Row dispatches columnar-vs-flat per column without slowing the text path; treat it as out-of-budget until such a workload appears.","Keep benchmark/experiments/columnar_result_transfer.dart as the mechanism gate for any future columnar attempt: tag lanes by the sacrificeSlotThreshold (32768 slots) so the transfer axis is measured against Isolate.exit, not a naive SendPort baseline."]},{"id":"259","title":"Native TEXT ASCII classification for the row decoder","file":"259-native-ascii-text-flag.md","date":"2026-08-03","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted","impact":"`decodeQuery` cannot build a Dart `String` from a TEXT cell until it knows whether the payload is pure ASCII (`String.fromCharCodes` widen) or not (`utf8.decode`), and it was answering that itself: a second `ExternalTypedData` word view plus a bounds-checked scan per cell, degrading to a byte-by-byte loop for anything under 16 bytes — which is most database text. `resqlite_step_row` already holds the pointer and length one frame earlier, where the same question is a branch-free SWAR pass over bytes still in cache. Moved it there: `text_is_ascii` reports `RESQLITE_TEXT_ASCII` (type code 6, the first value SQLite's 1-5 leaves free) and the decoder's TEXT arm splits into a widen path and a straight-to-`utf8.decode` path with no scan of its own. The stream hash is untouched — `resqlite_step_row_hash` folds the local `SQLITE_TEXT` before the switch, so the canonical digest still matches `resqlite_query_hash` (the exp 228 invariant). Focused AOT A/B, two order-flipped passes, `ab_drift_check` REPRODUCED on every primary lane: 10k x 8 short ASCII TEXT -12.3% / -10.4%, 40 B -14.3% / -10.7%, 2k x 4 400 B -22.2% / -19.4%, and the repo's canonical 6-column mixed product row (`id` INTEGER + 4 TEXT + REAL, taken verbatim from `benchmark/shared/seeder.dart`) -24.4% / -19.2%. The two neutral lanes carry the verdict: the INTEGER-only control runs byte-identical code in both arms and moves +0.2% / -2.9% (opposite signs, inside the 3% floor), ruling out the exp 254 per-worktree binary offset; and the CJK guard is -2.4% / -1.7%, confirming that scanning a non-ASCII value to the end in C costs less than the partial Dart scan it replaced. A `resqlite_test_text_is_ascii` differential test plus an every-offset multibyte `select()` round trip gate the classification, since a wrong answer is silent mojibake rather than a crash.","changed":["The Dart row decoder was paying to answer a question C already had the inputs for. `fastDecodeText` had to classify every TEXT cell as ASCII (Latin-1 widen) or not (utf8.decode) before it could build the String, costing a second ExternalTypedData word view plus a bounds-checked scan per cell — and falling back to a byte-by-byte loop for values under 16 bytes or on an unaligned pointer, which covers most real database text. `resqlite_step_row` holds the same pointer and length one frame earlier, in cache, where the answer is a branch-free SWAR pass.","Moving the classification into the native step loop (RESQLITE_TEXT_ASCII = type code 6) is worth a reproduced 10-24% on text-bearing select() reads, including 19-24% on the repo's canonical 6-column mixed product row, across two order-flipped AOT passes. The saving is per TEXT cell, so it scales with text carried per read rather than with row count; the 400 B lane gains most (-22.2% / -19.4%) because the replaced Dart scan walked ~50 words per cell, and the canonical mixed row gains as much as it does because its description column is ~85 bytes on its own.","Scanning a non-ASCII value all the way to the end in C, instead of bailing at the first high byte, costs nothing measurable: ordinary CJK text moved -2.4% / -1.7% and the worst case built to expose the trade (400 B with its one multibyte character at byte 0) moved +1.1% / -1.0%. The full-scan shape buys a single branch on the common all-ASCII path, and any value that fails the test is about to be walked again by utf8.decode at roughly ten times the per-byte cost. This is the counterpoint to exp 235's abandon-on-first-miss lesson — there the fast path was abandoned for the whole remainder; here the 'miss' path is a separate, more expensive decoder that re-reads the value regardless.","This does not reopen exp 258's columnar rewrite or exp 251's decode-bottleneck premise. Both closed on the grounds that a storage-shape change moves work between isolates rather than removing it; this removes work outright and is orthogonal to where the result is stored."],"next":["The general shape worth reapplying: any per-cell question the Dart decoder asks while the native step loop already holds the inputs one frame earlier. The decode loop's remaining Dart-side per-cell work is the ExternalTypedData view and the String copy itself; both are VM-owned, so further gains here need a Dart runtime change (a native UTF-8 String entry point, or a non-allocating Pointer view), not another resqlite-side move.","benchmark/experiments/select_rows_text_decode.dart is the durable gate for any future change to the rows-path TEXT decode arm. Keep its int8 control lane (byte-identical code in both arms, so it reads the per-binary offset directly) and its two non-ASCII guards — text8-cjk (ordinary multibyte text) and text4-long-early-nonascii (the worst case for accumulate-then-test: a long value whose only high byte is at offset 0). Run it before touching fastDecodeText, the cell type codes, or resqlite_step_row's TEXT arm.","resqlite_test_text_is_ascii is the classifier's byte-level gate, in the resqlite_test_i64_to_str class: a wrong answer is silent mojibake, not a crash, so any change to the SWAR scan must keep the differential test green.","Cell type codes 1-5 are SQLite's; 6 is now RESQLITE_TEXT_ASCII. A future native-side classification wanting its own code should take 7 and keep the decoder's switch dense."]},{"id":"260","title":"Size the result buffer from what the SQL returned last time","file":"260-result-list-presize.md","date":"2026-08-04","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted","impact":"`decodeQuery` starts every result at 256 rows' worth of `List<Object?>` slots and doubles when it overflows. Growing that list copies every live element with a store barrier into a freshly faulted array, so a 200k-slot result copies ~322k slots through ~5 MB of immediate garbage on its way up. A standalone AOT reproduction of the decode loop puts the doubling at 2318 us against 865 us pre-sized, with the loads, switch and stores together under 500 us — so buffer growth, not cell decoding, is most of what exp 251 measured as `Dart result construction` (2524 us of 5124 us worker wall on the same shape). `ReaderPool` now remembers each SQL's result size on the main isolate and stamps it onto the request; the worker consults it only when the buffer overflows, so a result that fits inside the initial allocation runs byte-identical code. Two design points carry it: the memory cannot live in the worker, because a result over `sacrificeSlotThreshold` ends the isolate that produced it and a worker-local hint dies exactly when it was worth having (that first version won 30-35% on mid-sized reads and ~1% on the largest); and the hint sizes growth rather than the initial allocation, because an early version that sized the allocation made a `LIMIT ?` statement alternating 8000/50 rows 2.8x slower on its small leg. Focused AOT A/B, two order-flipped passes, `ab_drift_check` REPRODUCED on every primary: 10k x 20 INTEGER -25.1% / -24.8%, 5k x 4 INTEGER -32.2% / -33.7%, and the repo's canonical 6-column product row x 10k -33.6% / -32.3% (3.5 ms -> 2.3 ms). Both controls return fewer rows than the initial buffer holds, so the changed path is unreachable and they move opposite signs inside the 3% floor; both mispredict guards are neutral by construction. Memory was not measured; arithmetic on the allocation path says total bytes allocated fall 14-61% everywhere (the intermediate arrays stop existing) but peak capacity is not a guaranteed improvement — 23.7% smaller on all three primary lanes, yet 22-25% larger for a result that lands just under a doubling boundary, as `mixed6-1k` does. This closes exp 059 as wrongly rejected rather than re-tested: its rejection reason was the April release suite's noise floor, its mechanism claim that `list growth is already cheap` is false, and it sized the initial allocation — carrying exp 067's small-query regression inside the same change.","changed":["Growing `decodeQuery`'s `List<Object?>` is not amortised-free, and it is the single largest Dart-side cost of a large read. A standalone AOT reproduction of the decode loop over a fixed cell buffer measures 2318 us for the doubling path against 865 us pre-sized on 10k x 20 INTEGER, with loads + switch + stores together under 500 us. That lands within 8% of exp 251's 2524 us of `Dart result construction` on the same shape, so the bucket exp 251 refused to design against is mostly buffer growth rather than cell decoding. Growth costs what it costs because a `List<Object?>` grow copies every live element with a store barrier into a freshly faulted array; a 200k-slot result copies ~322k slots through ~5 MB of transient garbage.","Exp 059 rejected this mechanism for the wrong reason and with a design defect. Its stated grounds were the April release suite's noise floor and medians taken across iterations; its mechanism claim (`list growth is already cheap`, `only ~3-4 growths`) counts growths rather than slots copied and is false; and it sized the *initial* allocation from the hint, which is precisely the change exp 067 measured as a 40-44% regression on small-query workloads the same day. A win on large reads and a regression on small ones nets to the noise it reported.","A per-isolate cache is not a durable place for anything a large read teaches. Results over `sacrificeSlotThreshold` (32768 slots) return via `Isolate.exit` and end the worker that produced them, so a hint kept in the worker's schema cache is discarded exactly when the result was large enough to need it, and otherwise describes only the executions that landed on one of four pool workers. Measured directly: the worker-local version won 30-35% on sub-threshold reads and ~1% on the 200k-slot lane. Moving the memory to `ReaderPool` and stamping it on the request took the same lane to -25%.","A size hint must be applied where a wrong answer cannot cost anything. Applied to the initial allocation, a hint saturated by a `SELECT ... LIMIT ?` statement's large leg made its 50-row leg 2.8x slower (68 -> 198 us) — zero-filling 60000 unused slots costs more than the doubling it removes. Applied at the growth step the same lane is neutral by construction, because a result that fits in the initial buffer never reaches the code. This is a stronger guarantee than a floor: it makes the whole mechanism unreachable for small results rather than merely conservative.","Per-request bookkeeping on the main isolate is measurable on a point read. The first version's two map lookups per request cost ~0.3 us, about 6% of a point query, attributed by building a variant with the pool bookkeeping removed and watching the lane return to baseline. Reading the entry once per request and never creating one for a SQL that has not exceeded the initial buffer brought it under the 3% effect floor."],"next":["`benchmark/experiments/select_rows_presize.dart` is the durable gate for any change to the result buffer's allocation or growth. Keep its two sub-initial-buffer control lanes (`mixed6-200`, `point1`) — they are inert by construction, so their delta reads the per-binary layout offset directly — and both mispredict guards, which are the only lanes that can expose a size hint's failure mode.","The remaining Dart-side per-cell work in `decodeQuery` is now genuinely the loads, the switch and the stores: ~500 us for 200k INTEGER cells, or ~2.5 ns/cell. Exp 251's decomposition should be read through claim 260.2 before anything else is designed against its `Dart result construction` figure — most of that number was growth, and it is gone.","The same question applies to every other buffer that grows by doubling on a hot path: `selectBytes`'s native `json_buf` already persists and grows geometrically, and the writer's parameter arena is sized per call. Neither has been measured for growth-copy cost the way the row buffer now has.","Anything a worker learns and wants to keep has to live on the main isolate or be re-derivable, because the sacrifice path destroys reader isolates on exactly the largest results. The schema cache itself has this shape — it is rebuilt from `sqlite3_column_name` after every sacrifice — and has never been measured."]},{"id":"261","title":"A memory guard for focused experiments, and four months of trend","file":"261-focused-memory-guard.md","date":"2026-08-04","status":"accepted","directions":["measurement-system","result-transfer-shape"],"outcomeClass":"accepted_measurement","impact":"Focused AOT A/B harnesses decide experiments now (251, 254, 258, 259, 260) and measured wall time only, so a candidate could halve latency and double memory unnoticed. `benchmark/shared/memory_probe.dart` closes that in the mode those harnesses must run in — chosen by elimination, since an AOT binary has no VM service (`Service.getInfo()` returns null, `--enable-vm-service` is rejected) and running under JIT to get one would change what exp 193 requires be measured under AOT. The load-bearing finding is which reading to gate on: on a lane crossing `sacrificeSlotThreshold`, sampled `currentRss` peak said +75% and `maxRss` said -1.7% about the same change. `maxRss` is the true high-water; a `currentRss` curve is a retention signal, and retention moves when reader isolates are sacrificed and hand pages back. Gate on `maxRss`, one process per lane. Validated: five runs per arm spread <=0.6 MB, inert control lanes identical across arms, and `--no-memory` moves wall time 1.3-2.4% (inside the floor). First use answers exp 260's unmeasured claim 260.4: peak RSS *falls* on every lane (-2.1% / -11.5% / -28.0%), refuting its arithmetic prediction that peak capacity could rise 22-25%. A sweep of eight checkpoints from v0.3.0 (which resolves, builds and runs the current harness unmodified) shows peak read-path memory FLAT within ~1 MB for three months across ~40 merged experiments including the whole transfer-shape arc, while wall time fell 25-40% — so no regression exists to fix, and the only movement is exps 259 and 260, both downward. Three findings for future runners: the guard is a tripwire for a doubling, not an instrument for 5% drift; seeding dominates the gated number (mixed6-10k sits at 89.5 MB before the measured reads, which add ~18 MB); and `select()` peaks at 95 MB reading a table holding ~1.5 MB, a ~60x ratio never decomposed.","changed":["Focused AOT harnesses can carry a memory reading, and the instrument is fixed by a hard constraint rather than chosen: an AOT binary exposes no VM service (`Service.getInfo()` returns null, `--enable-vm-service` is rejected as an unrecognized flag), so heap statistics and allocation profiles are unavailable in the only mode exp 193 permits for decode-path results. `ProcessInfo` is the whole instrument, and a `currentRss` read costs ~700 ns so it must stay outside the stopwatch.","`maxRss` and a sampled `currentRss` peak can give opposite verdicts on the same change, by 76 percentage points. Pre- vs post-exp-260 on a lane crossing `sacrificeSlotThreshold`: sampled `currentRss` peak 36.6 -> 64.0 MB (+75%), `maxRss` 65.9 -> 64.8 MB (-1.7%). `maxRss` is the true high-water and is what a guard should gate on; the `currentRss` curve is a retention signal, and retention moves when reader isolates are sacrificed and return their pages. Within one isolate the VM keeps pages after GC, so a candidate freeing its own garbage reads as no change.","Exp 260's memory claim was refuted by measurement in the favourable direction. Its arithmetic predicted peak capacity could rise 22-25% for a result landing just under a doubling boundary; measured peak RSS falls on every lane (-2.1% at 200k slots, -11.5% on the canonical product row, -28.0% on the sub-threshold integer lane). The arithmetic was correct about the buffer and wrong about the read: the buffer is a small part of what a read holds, and the doubling sequence's retained intermediate arrays are a larger one.","Peak read-path memory has been flat for three months. Eight checkpoints from v0.3.0 (2026-05-03) through exp 259 (2026-08-03) hold every lane within ~1 MB, across roughly forty merged experiments including the entire transfer-shape arc (174, 234, 236, 243, 244, 245, 246), while wall time on the same runs fell 25-40%. There is no memory regression to find, and that is now established rather than assumed.","The guard's sensitivity is bounded by that same flatness: four months of experiments moving wall time 25-40% moved peak RSS under 1%. It is a tripwire for a doubling, not an instrument for a 5% drift. It is further diluted by setup — `mixed6-10k` sits at 89.5 MB before the measured reads begin and the reads add ~18 MB — so a lane meant to gate memory should seed as little as it can."],"next":["`benchmark/shared/memory_probe.dart` is the memory lane for any focused harness. Start it after seeding and warmup, sample outside the stopwatch, run with `--lane=` so `maxRss` is per-lane clean, and read `lane_isolated` before comparing two runs' `max_rss_mb`.","Do not gate on `rss_growth_mb` or `rss_peak_mb`. They are retention signals and can report a large regression on a change that leaves the high-water untouched — claim 261.1 is the counterexample that established this.","The release-suite Memory stage is `[15/16]`, the exact stage where the sqlite_async peer segfaults, and #282's per-repeat artifact writing does not help because the crash lands inside repeat 1. Persisting each scenario as it completes, rather than each repeat, would preserve the fourteen scenarios that currently die with it — that is the reason trend data is thin, and it gates the `per-benchmark RSS acceptance criteria` candidate that has been open since 2026-05-02.","The next memory question worth a run is claim 261.4's ~60x payload-to-peak ratio on `select()`, decomposed rather than assumed. That needs allocation counters at specific sites, not process RSS, because the guard cannot resolve anything below a doubling."]}],"claims":[{"id":"016.1","source":"016","directions":["sqlite-version-and-build-config"],"text":"The tuned SQLite compile-flag set (with prepare_v3) is accepted; per-call savings are individually too small to measure but stack with isLeaf bindings.","conditions":"2025 · backfilled 2026-07","state":"live"},{"id":"044.1","source":"044","directions":["sqlite-version-and-build-config"],"text":"SQLITE_ENABLE_BATCH_ATOMIC_WRITE is a zero-risk compile flag: it activates via VFS capability detection (Android F2FS) with no effect elsewhere and no API change.","conditions":"2025 · backfilled 2026-07","state":"live"},{"id":"059.1","source":"059","directions":["result-transfer-shape"],"text":"Remembering a SQL's last row count and pre-sizing `decodeQuery`'s result buffer from it is not worth the two-field cache entry: list growth is already cheap (only ~3-4 doublings even for a 10k-row read) and the measurable improvement sits below the release-suite noise floor.","conditions":"release suite, 3 repeats vs baseline, 2 wins / 0 regressions / 61 neutral · 2026-04 · backfilled 2026-08","state":"refuted","by":["260.1"]},{"id":"067.1","source":"067","directions":["result-transfer-shape"],"text":"`decodeQuery`'s initial `List<Object?>.filled(colCount * 256, null)` must not be shrunk. Cutting it to `colCount * 4` regressed every many-small-query workload (Stream Churn +44%, Batched Write Inside Transaction +40%), because the VM's null-fill fast path makes one large pre-sized allocation cheaper per slot than a small one that then has to grow.","conditions":"release suite, 0 wins / 4 regressions / 59 neutral · 2026-04 · backfilled 2026-08","state":"live"},{"id":"075.1","source":"075","directions":["long-text-stream-hashing"],"text":"Computing the selectIfChanged result hash in C during the step loop is a large win (-39%) on the re-query path with zero measurable regression; hash code consolidates to a single C implementation.","conditions":"2025 · backfilled 2026-07","state":"live"},{"id":"090.1","source":"090","directions":["sqlite-version-and-build-config"],"text":"sqlite3mc version bumps should wait for safer point releases when the newest SQLite release is a fresh .0.","conditions":"policy · 2026-04 · backfilled 2026-07","state":"live"},{"id":"099.1","source":"099","directions":["long-text-stream-hashing","measurement-system"],"text":"Byte-stream hash-loop changes need long-text stream workloads before they are meaningfully testable.","conditions":"measurement gap · 2026-04 · backfilled 2026-07","state":"live"},{"id":"101.1","source":"101","directions":["transaction-control-paths"],"text":"Top-level transaction control had removable SQLite prepare/finalize work; cached control statements remove it.","conditions":"M1 Pro · 2026-04 · backfilled 2026-07","state":"live"},{"id":"110.1","source":"110","directions":["long-text-stream-hashing","measurement-system"],"text":"The archived 8-byte FNV byte fold is a clear win once the workload carries 4KB TEXT cells; the long-text unchanged-fanout benchmark was the blocker to seeing it.","conditions":"M1 Pro · 4KB TEXT · 2026-04 · backfilled 2026-07","state":"live"},{"id":"111.1","source":"111","directions":["transaction-control-paths","measurement-system"],"text":"Savepoint string-allocation cost is below the decision threshold even at 50 SAVEPOINTs per iteration — per-isolate-round-trip cost dominates nested transaction control.","conditions":"M1 Pro · 2026-04 · backfilled 2026-07","state":"live"},{"id":"120.1","source":"120","directions":["stream-rerun-dispatch"],"text":"Exp 119's 3,590-park signal was upstream over-dispatch from StreamEngine._flushQueue, not reader-pool admission; snapshotting availableWorkerCount once and decrementing per pop drops parking to zero. Future dispatch work needs a different counter.","conditions":"M1 Pro · 2026-05 · backfilled 2026-07","state":"live"},{"id":"125.1","source":"125","directions":["parameter-encoding-and-binding"],"text":"A guarded ASCII fast path removes per-string UTF-8 allocation in wide batch parameter packing without changing the public API or weakening Unicode fallback.","conditions":"M1 Pro · 2026-05 · backfilled 2026-07","state":"live"},{"id":"126.1","source":"126","directions":["parameter-encoding-and-binding"],"text":"Direct UTF-8 payload writing removes the same per-string allocation for non-ASCII batches (focused Unicode 10k x20 -13.5%, emoji -27.8%), with Dart-compatible surrogate handling private to the encoder.","conditions":"M1 Pro · 2026-05 · backfilled 2026-07","state":"live"},{"id":"134.1","source":"134","directions":["stream-rerun-dispatch"],"text":"Row-level dirty precision can remove the keyed-PK miss-path cost (intersection_entries 10000 -> 3; writer-burst wall 25.54 -> 12.45 ms) — rejected as shipped complexity, preserved as potential.","conditions":"M1 Pro · prototype · 2026-05 · backfilled 2026-07","state":"live"},{"id":"136.1","source":"136","directions":["stream-rerun-dispatch","measurement-system"],"text":"On A11c overlap the reader-worker port handler is the largest remaining reachable main-isolate slice (28.57% of burst+drain wall); subscriber-fanout emit is <1% and is not the optimization target.","conditions":"M1 Pro · profile · 2026-05 · backfilled 2026-07","state":"live"},{"id":"143.1","source":"143","directions":["measurement-system"],"text":"Pinned Tracelite profile runs produce decision-useful structured evidence: point queries are median dispatch-bound, merge rounds are work-bound, and allocation/RSS costs hide behind wall time alone.","conditions":"M1 Pro · profile · 2026-06 · backfilled 2026-07","state":"live"},{"id":"144.1","source":"144","directions":["sqlite-version-and-build-config"],"text":"The 3.53.0 default-FP-rounding hazard does not reach resqlite output (REAL values never go through sqlite3_column_text); the vendoring bump waits on a .2 point release per exp 090's policy.","conditions":"2026-06 · backfilled 2026-07","state":"live"},{"id":"147.1","source":"147","directions":["stream-rerun-dispatch","measurement-system"],"text":"SQLite-facing write calls are a minority of writer-side burst wall on active stream workloads (A11c 9.4%, keyed-PK 18.1%); residual writer/request wall is the largest bucket after subtracting SQLite and invalidation.","conditions":"M1 Pro · profile · 2026-06 · backfilled 2026-07","state":"live"},{"id":"169.1","source":"169","directions":["measurement-system"],"text":"The Tracelite workload-summary explanation layer emits the interpretation exp 143 had to recover manually, and validates stable insight IDs so a thin artifact fails loudly instead of looking complete.","conditions":"tooling · 2026-06 · backfilled 2026-07","state":"live"},{"id":"172.1","source":"172","directions":["long-text-stream-hashing","measurement-system"],"text":"The 8-byte FNV fold scales acceptably to mixed 32KB TEXT+BLOB long payloads (3.446 ms median beside 2.356 ms for 4KB TEXT), and the streaming suite now covers that shape.","conditions":"M1 Pro · 2026-06 · backfilled 2026-07","state":"live"},{"id":"173.1","source":"173","directions":["long-text-stream-hashing"],"text":"At 32KB cells on a pool-of-4 fleet the byte-stream fold is no longer the dominant wall component; unrolling beyond the 8-byte FNV body is below noise. Hash-loop unrolling on this shape is closed.","conditions":"M1 Pro · pool-4 · 2026-06 · backfilled 2026-07","state":"live"},{"id":"174.1","source":"174","directions":["result-transfer-shape"],"text":"selectBytes sends a Uint8List view over the reader's native json_buf and never sacrifices; the single send copy is the floor for this path.","conditions":"M1 Pro · AOT · 2026-03","state":"live"},{"id":"177.1","source":"177","directions":["measurement-system"],"text":"Phase-ordered A/B gates confound code deltas with time-correlated drift; cvPct + classifyDriftFlag encode the CV-asymmetry and order-flip sign-reversal signatures so every A/B no longer re-derives them by hand.","conditions":"methodology · 2026-06 · backfilled 2026-07","state":"live"},{"id":"178.1","source":"178","directions":["measurement-system"],"text":"A chartable experiment with no linked benchmark run and no Benchmark Run opt-out silently drops off the chart; the linker now errors, closing the gap that left ~18 experiments unmapped.","conditions":"tooling · 2026-06 · backfilled 2026-07","state":"live"},{"id":"181.1","source":"181","directions":["long-text-stream-hashing"],"text":"Removing reader-pool parallelism (one-reader runtime, 64x64KB payloads) still shows no 16-byte FNV win over the 8-byte fold; the single-stream candidate from exp 173 is consumed.","conditions":"M1 Pro · single reader · 2026-06 · backfilled 2026-07","state":"live"},{"id":"183.1","source":"183","directions":["result-transfer-shape"],"text":"selectBytes' bounded RSS high-water becomes pathological under concurrent large bursts (8 x 8MB pins 32MB for the connection's life); the 1MB-cap + 256KB last-len reclaim makes the policy safe, and readerJsonBufHighWaterBytes makes it observable.","conditions":"M1 Pro · 2026-06 · backfilled 2026-07","state":"live"},{"id":"186.1","source":"186","directions":["parameter-encoding-and-binding"],"text":"The single-row direct-ASCII allocateParams rewrite is materially beneficial once bound text crosses mid-tens-of-KB (-15% at 16KB to -32% at larger sizes); encoder isolation separates the mechanism question from workload materiality.","conditions":"M1 Pro · 2026-06 · backfilled 2026-07","state":"live"},{"id":"187.1","source":"187","directions":["parameter-encoding-and-binding"],"text":"Direct UTF-8 packing for single-row non-ASCII params removes one temp allocation plus one copy per string; CJK rows improve ~31-39% from 16KB through 1MB.","conditions":"M1 Pro · 2026-06 · backfilled 2026-07","state":"live"},{"id":"189.1","source":"189","directions":["transaction-control-paths"],"text":"Savepoint naming compression moves best-case control rows but the representative nested-write fanout does not reproduce across the order flip — rejected on the load-bearing row.","conditions":"M1 Pro · 2026-06 · backfilled 2026-07","state":"live"},{"id":"212.1","source":"212","directions":["transaction-control-paths"],"text":"Lazy nested-savepoint materialization only helps empty nested bodies; fusing SAVEPOINT + first execute regresses the meaningful nested-write shape in both pass orders.","conditions":"M1 Pro · 2026-07 · backfilled 2026-07","state":"live"},{"id":"213.1","source":"213","directions":["transaction-control-paths"],"text":"The per-execute round-trip floor inside db.transaction() is mechanically removable for Future.wait bursts, but the pattern has no idiomatic case in the public API — bulk atomic writes belong on executeBatch. Rejected on pattern, not numbers.","conditions":"M1 Pro · 2026-07 · backfilled 2026-07","state":"live"},{"id":"229.1","source":"229","directions":["result-transfer-shape"],"text":"native/resqlite.c is no longer ISA-agnostic-scalar-only: a NEON vqtbl4q_u8 base64 kernel (~2x on 4KB payloads) ships behind an __aarch64__ gate with the scalar 12-bit-LUT encoder as fallback. Keep SIMD kernels noinline so the small-input scalar path's code gen is untouched.","conditions":"M1 Pro · AOT · 2026-07 · backfilled 2026-07","state":"live"},{"id":"234.1","source":"234","directions":["parameter-encoding-and-binding"],"text":"A mutable Uint8List param is the one write value SendPort.send truly copies; wrapping params >= 256 KB in TransferableTypedData lands that one copy in external memory instead of on the GC heap (~15-20% on 256-512 KB single-row inserts).","conditions":"M1 Pro · AOT · 2026-07","state":"live"},{"id":"235.1","source":"235","directions":["result-transfer-shape"],"text":"json_write_string's SWAR escape scan re-enters the 8-byte fast skip after each dirty chunk instead of abandoning it on the first escapable byte, so a sparse escape downgrades only the chunk containing it rather than the whole tail. Realistic multi-line TEXT encodes 23% faster (256B, newline every ~80B) and the one-early-escape extreme 45%; the escape-free path is byte-identical and measures parity. Cost is +6.0% on pathological dense-escape 256B (~1/3 escapable bytes), one extra SWAR probe per all-dirty chunk.","conditions":"Apple Silicon · AOT · focused order-flipped A/B (5 BASE / 4 CAND medians) · 2026-07","state":"live"},{"id":"235.2","source":"235","directions":["result-transfer-shape"],"text":"A fast-scan's abandon-on-first-miss structure is invisible to all-safe and all-dirty test shapes and only costs on the sparse-miss middle, which is the common real distribution. The pre-235 harness held dense-escape and late-escape lanes and neither exercised it; the regression pocket appeared only once sparse-newline and sparse-early lanes existed.","conditions":"harness-design finding · generalises beyond the TEXT escaper","state":"live"},{"id":"236.1","source":"236","directions":["result-transfer-shape"],"text":"Blob result cells >= 256 KB decode straight into TransferableTypedData (native->external, one copy) and cross by ownership move; main-isolate receive boundaries materialize them back to Uint8List views. Blob-heavy reads 3-6x faster; tx.select ~6-7x.","conditions":"M1 Pro · AOT · 2026-07","state":"live"},{"id":"236.2","source":"236","directions":["result-transfer-shape"],"text":"The sacrifice decision weighs estimatedBytes - transferableBytes so TTD-wrapped cells do not force a sacrifice.","conditions":"byte-trigger era · M1 Pro · 2026-07","state":"superseded","by":["246.1"]},{"id":"237.1","source":"237","directions":["parameter-encoding-and-binding"],"text":"Exp 234's blob-transfer win does not extend to executeBatch: wrapping per-set blobs is a reproduced regression. The mechanism is many independent write round-trips parking fresh blobs on the young heap — one batch round-trip does not have it.","conditions":"M1 Pro · AOT · 2026-07 · backfilled 2026-07","state":"live"},{"id":"239.1","source":"239","directions":["stream-rerun-dispatch"],"text":"Batching only already-parked plain selects in pool-sharded envelopes (capped at four) improves 20 point reads ~-26/-33% without a new public API; sharding avoids exp 209's one-worker large-read collapse. Rejected as shipped complexity, preserved as potential.","conditions":"M1 Pro · 2026-07 · backfilled 2026-07","state":"live"},{"id":"241.1","source":"241","directions":["result-transfer-shape"],"text":"Sacrifice is a state-changing treatment (kills a worker, respawns, clears caches): it cannot be A/B'd in place inside one live pool. Send-vs-exit decomposes into distinct estimands — intrinsic transfer, pool capacity, decode — that must be measured separately.","conditions":"methodology · 2026-07","state":"live"},{"id":"242.1","source":"242","directions":["result-transfer-shape"],"text":"A TransferableTypedData wrap helps iff the payload's default SendPort destination is the GC heap; a native-backed view gains nothing — the wrap relocates the one copy and adds machinery.","conditions":"M1 Pro · AOT · 2026-07","edges":[{"type":"validates","target":"174.1"}],"state":"live"},{"id":"243.1","source":"243","directions":["parameter-encoding-and-binding"],"text":"Blob-param wrapping is identity-keyed (one wrapper per unique buffer, referenced at every position, materialized once per envelope), so caller aliasing survives the hop instead of exploding into N external copies (~27x at N=32 under per-occurrence wrapping).","conditions":"M1 Pro · AOT · 2026-07","edges":[{"type":"refines","target":"234.1"}],"state":"live"},{"id":"244.1","source":"244","directions":["result-transfer-shape"],"text":"Sacrifice opens no pool-capacity hole at the production pool size: the no-sacrifice lane had the highest parked queue-wait (~+19%), because send's copy blocks the worker longer than Isolate.exit plus an overlapped respawn. Eager respawn measured inert.","conditions":"M1 Pro · pool-4 · barrier burst · 2026-07","edges":[{"type":"refines","target":"241.1"}],"state":"live"},{"id":"245.1","source":"245","directions":["result-transfer-shape"],"text":"SendPort.send's cost tracks the mutable flat-list slot count, not payload bytes: strings and numbers are shared by reference (a 400 KB string adds ~0 us), while the values array is copied per slot.","conditions":"M1 Pro · AOT · process-isolated barrier · 2026-07","edges":[{"type":"refines","target":"241.1"}],"state":"live"},{"id":"245.2","source":"245","directions":["result-transfer-shape"],"text":"Isolate.exit is zero-copy with a ~47 us fixed premium; its sendability walk also scales with slots, just more gently than send's copy. Intrinsic crossover ~48k slots.","conditions":"M1 Pro · AOT · process-isolated barrier · 2026-07","state":"live"},{"id":"246.1","source":"246","directions":["result-transfer-shape"],"text":"The sacrifice trigger routes on mutable slot count (values.length > 32k, the all-integer equivalent of 256 KB); the byte accounting is deleted. Bytes for mutable payloads, slots for structure. Big-TEXT misroute fixed: 131->91 us, 1.00->0.00 sacrifices/select.","conditions":"M1 Pro · AOT · 2026-07","edges":[{"type":"supersedes","target":"236.2"},{"type":"dependsOn","target":"245.1"}],"state":"live","restsOn":["245.1"]},{"id":"250.1","source":"250","directions":["stream-rerun-dispatch"],"text":"Exp 233's checkpoint storm was a trigger-policy failure, not inherent to off-writer PASSIVE work: observed-reset/high-water re-arming fixes the storm and first threshold-crossing p50 improves ~53-64%. Rejected for now, mechanism preserved.","conditions":"M1 Pro · 2026-07 · backfilled 2026-07","state":"live"},{"id":"251.1","source":"251","directions":["result-transfer-shape","measurement-system"],"text":"Across five AOT process runs, a direct-handle step-only reference found no universal dominant worker-path bucket: estimated decode/result construction was 49%, 63%, 40%, and 51% of full query/decode wall for 10k x 20 INTEGER, 10k mixed, 5k x 4 INTEGER, and 5k TEXT shapes. The full worker-path proxy was typically 91%, 92%, 84%, and 94% of separately measured main-observed Database.select() latency.","conditions":"Apple M-series · arm64 macOS · Dart 3.12.2 · AOT CLI native-asset bundle · five fresh processes · 2026-08","edges":[{"type":"refines","target":"258.1"}],"state":"live"},{"id":"251.2","source":"251","directions":["result-transfer-shape","measurement-system"],"text":"The post-transfer large-read residual is shape-dependent rather than a single Dart-decode bottleneck, so it does not justify a broad ResultSet storage rewrite; a future candidate must first establish a workload-specific eligible phase against public select() wall.","conditions":"INTEGER, mixed INTEGER/TEXT, and long-TEXT result shapes · AOT · 2026-08","edges":[{"type":"dependsOn","target":"251.1"},{"type":"validates","target":"258.2"}],"state":"live","restsOn":["251.1"]},{"id":"255.1","source":"255","directions":["stream-rerun-dispatch"],"text":"A stream always resolves to an emission or an error, never silence. When a write dirties an entry mid-initial-query the comparison baseline is poisoned so the catch-up re-query is guaranteed to emit, and that emission is the stream's first. Suppressing the initial emission while leaving the baseline set to the rows it replaced is what stranded streams permanently silent.","conditions":"M1 Pro · deterministic regression test (40k-row seed) · 2026-07","edges":[{"type":"refines","target":"256.1"}],"state":"live"},{"id":"255.2","source":"255","directions":["stream-rerun-dispatch"],"text":"An intermittent test failure reproducing at ~1-in-3 is a bug, not a flake. This one was dismissed three times in one session, partly because the test's own comment asserted the shape could not flake — a false confidence marker actively redirects investigation, and reading the actual failure text ('emitted x Stream closed') would have identified the mechanism immediately.","conditions":"methodology · 2026-07","state":"live"},{"id":"255.3","source":"255","directions":["stream-rerun-dispatch"],"text":"Clearing a stream's comparison baseline must clear the row count, not the hash: selectIfChanged requires both to match, and an empty result legitimately hashes to 0, so a hash sentinel of 0 is reachable rather than impossible and would leave empty-result streams silent. The row count is nullable end to end, with null meaning 'no baseline' — which also retired a pre-existing magic -1 in the request type.","conditions":"review finding · guarded by the empty-result regression test · 2026-07","state":"live"},{"id":"256.1","source":"256","directions":["stream-rerun-dispatch"],"text":"A stream never emits rows it already knows a write superseded: when the initial query is dirtied mid-flight the comparison baseline is poisoned and only the corrected result is emitted. This costs ~0.4-1.4 ms of time-to-correct-value and removes the stale frame that emit-then-correct rendered on every raced stream; unraced streams are unaffected.","conditions":"M1 Pro · 1k/20k/60k seed race windows · 12 samples/shape · 2026-07","state":"live"},{"id":"257.1","source":"257","directions":["stream-rerun-dispatch"],"text":"A one-call native interpreter that preserves independent autocommits does not clear the writer-burst bar: homogeneous inserts improved 17.7% then only 3.6% across the order flip, while integer-only no-op updates regressed 17.7% and 13.9%.","conditions":"M1 Pro · Dart 3.12.2 · 256-call bursts · 5120 autocommits/round · 2026-07","state":"live"},{"id":"258.1","source":"258","directions":["result-transfer-shape"],"text":"Storing numeric result columns as typed arrays (Int64List/Float64List) instead of boxing into a flat List<Object?> makes worker-side result build 60-90% faster (largest on REAL: doubles always box, ~10x on 10k x 20 REAL). This win is worker wall, off the main isolate.","conditions":"M-series · AOT · worker->main SendPort A/B · two order-flipped passes · 2026-07","state":"live"},{"id":"258.2","source":"258","directions":["result-transfer-shape"],"text":"A columnar container's transfer win (73-91% cheaper hop vs the boxed flat list) does not move production's main-isolate metric: results large enough for transfer to matter (>32768 structural slots) already zero-copy via Isolate.exit, and sub-threshold results save only tens of microseconds, below the select() round-trip floor. The broad columnar rewrite is therefore rejected.","conditions":"M-series · AOT · worker->main SendPort A/B · 2026-07","edges":[{"type":"refines","target":"245.1"}],"state":"live"},{"id":"258.3","source":"258","directions":["result-transfer-shape"],"text":"The one real primary-metric signal from columnar storage is main-isolate integer consume ~2x faster (Int64List sequential access, no covariant-load barrier, vs pointer-chasing a List<Object?> of Smis), reproduced -48 to -52% on every integer lane in both orders. REAL consume is only neutral (box-on-access nearly cancels the locality gain) and columnar never regresses consume, refuting exp 081's box-on-access fear for the columnar (not binary-slab) shape.","conditions":"M-series · AOT · main-isolate full-scan as Object? · 2026-07","state":"live"},{"id":"259.1","source":"259","directions":["result-transfer-shape"],"text":"Classifying a TEXT cell as pure ASCII in resqlite_step_row (branch-free SWAR, memcpy-based unaligned loads) instead of in fastDecodeText removes one ExternalTypedData allocation and one bounds-checked Dart scan per cell, worth a reproduced -12.3% / -10.4% on 10k x 8 short-ASCII select(), -14.3% / -10.7% at 40 B, -22.2% / -19.4% at 400 B, and -24.4% / -19.2% on the repo's canonical 6-column mixed row (id INTEGER + 4 TEXT + REAL, from benchmark/shared/seeder.dart). The mixed lane's p50 is its signal; its p90 is noisy across passes and is not a tail regression.","conditions":"M1 Pro · AOT CLI bundle · cross-worktree A/B · two order-flipped passes · 31 samples/lane · 2026-08","state":"live"},{"id":"259.2","source":"259","directions":["result-transfer-shape"],"text":"The isolated per-cell mechanism is 6-15 ns, or 12-49% of fastDecodeText's wall depending on payload width (6-14 B: -12% / -34%; 20-40 B: -36% / -39%; 200 B: -49% / -48%). At 80k TEXT cells per lane that is 0.5-1.2 ms, matching the end-to-end deltas in order of magnitude.","conditions":"M1 Pro · AOT microbenchmark over malloc'd 8-aligned ASCII payloads · 2026-08","state":"live"},{"id":"259.3","source":"259","directions":["result-transfer-shape"],"text":"An accumulate-then-test SWAR scan that always walks the whole value is not a regression for non-ASCII TEXT. Ordinary CJK text measured -2.4% / -1.7%, and the shape built to expose the trade — a 400 B value with its one multibyte character at byte 0, so the native scan walks the whole payload to learn what the old Dart scan settled in its first word — measured +1.1% / -1.0%. That lane runs ~4.9 ms against ~0.7 ms for the same payload in ASCII: utf8.decode over the value dwarfs a SWAR pass over it, so the 'wasted' scan is an order of magnitude cheaper than the decode it precedes.","conditions":"M1 Pro · AOT · 10k x 8 CJK TEXT (~36 B/cell) and 2k x 4 400 B early-nonascii · two order-flipped passes · 2026-08","state":"live"},{"id":"259.4","source":"259","directions":["result-transfer-shape"],"text":"A cross-worktree focused A/B carrying a lane whose code is byte-identical in both arms reads the per-binary layout offset directly. Exp 259's INTEGER-only control moved +0.2% / -2.9% — opposite signs, inside the 3% effect floor — which is what licenses trusting the text lanes without falling back to exp 254's single-binary runtime toggle.","conditions":"methodology · 2026-08","state":"live"},{"id":"260.1","source":"260","directions":["result-transfer-shape"],"text":"Sizing `decodeQuery`'s result buffer from a main-isolate memory of what the same SQL returned before — applied at the first growth, never to the initial allocation — is worth a reproduced -25.1% / -24.8% on 10k x 20 INTEGER, -32.2% / -33.7% on 5k x 4 INTEGER, and -33.6% / -32.3% on the repo's canonical 6-column product row at 10k rows (3.5 ms -> 2.3 ms), measured end to end through the public `select()`. Both controls (200-row and point reads, which never reach the growth path) move opposite signs inside the 3% floor, and both mispredict guards are neutral.","conditions":"M1 Pro · AOT CLI bundle · cross-worktree A/B · two order-flipped passes · 31 samples/lane · 2026-08","edges":[{"type":"refutes","target":"059.1"},{"type":"dependsOn","target":"067.1"}],"state":"live","restsOn":["067.1"]},{"id":"260.2","source":"260","directions":["result-transfer-shape"],"text":"Buffer growth, not cell decoding, is most of the Dart-side cost of a large read. Reproducing the decode loop over a fixed cell buffer at 10k x 20 INTEGER: doubling from the 256-row initial allocation 2318 us, pre-sized 865 us, loads + switch with no list store 331 us, and `List.filled(200000, null)` alone 405 us. Exp 251's 2524 us for the same shape's `Dart result construction` is therefore a growth measurement more than a decode one.","conditions":"M1 Pro · AOT standalone microbenchmark · 40 reps · 2026-08","edges":[{"type":"refines","target":"251.1"}],"state":"live"},{"id":"260.3","source":"260","directions":["result-transfer-shape"],"text":"A worker-local cache cannot hold anything learned from a large result. `Isolate.exit` on a result over `sacrificeSlotThreshold` ends the worker, so a size hint kept in the per-worker schema cache won 30-35% on sub-threshold reads and ~1% on the 200k-slot lane; the same hint carried on the request from the main isolate won -25% there.","conditions":"M1 Pro · AOT · focused A/B, both hint placements against one baseline · 2026-08","state":"live"},{"id":"260.4","source":"260","directions":["result-transfer-shape"],"text":"Pre-sizing from a converged row hint lowers total bytes allocated per query by 14-61% (the doubling sequence's intermediate arrays stop existing) but does NOT uniformly lower peak buffer capacity. Doubling's overshoot is 1x-2x depending on where the result falls relative to a power-of-two boundary; a converged hint's is always 1.25x. Peak capacity is 23.7% smaller for a result that overshoots a boundary (all three primary lanes) and 22-25% LARGER for one that lands just under it (mixed6-1k, and 2048 rows x 6 columns). Arithmetic on the allocation path only — no RSS or heap sampling was taken, so a workload sensitive to peak rather than churn needs its own measurement.","conditions":"derived from the growth path, not measured · 2026-08","state":"superseded","by":["261.2"]},{"id":"261.1","source":"261","directions":["measurement-system","result-transfer-shape"],"text":"A focused-harness memory guard must gate on `ProcessInfo.maxRss` with one process per lane, not on a sampled `currentRss` peak. The two disagreed by 76 percentage points about the same change (sampled peak +75%, `maxRss` -1.7%) on a lane whose results cross `sacrificeSlotThreshold`, because sacrificed isolates return pages and make `currentRss` a retention signal rather than a high-water. Repeatability across five isolated runs per arm is <=0.6 MB, mechanically inert lanes read identical across arms, and sampling moves wall time 1.3-2.4%, inside the 3% floor.","conditions":"M1 Pro · AOT CLI bundle · one process per lane · 2026-08","state":"live"},{"id":"261.2","source":"261","directions":["measurement-system","result-transfer-shape"],"text":"Exp 260 lowers peak RSS rather than raising it: `maxRss` falls -2.1% on 10k x 20 INTEGER, -11.5% on the canonical 6-column product row at 10k rows, and -28.0% on 5k x 4 INTEGER, with the point-read control flat at -0.3%. This supersedes the arithmetic in claim 260.4, which predicted peak capacity could rise 22-25% for results landing just under a doubling boundary.","conditions":"M1 Pro · AOT · maxRss, one process per lane, 21 samples · 2026-08","edges":[{"type":"supersedes","target":"260.4"},{"type":"dependsOn","target":"261.1"}],"state":"live","restsOn":["261.1"]},{"id":"261.3","source":"261","directions":["measurement-system","result-transfer-shape"],"text":"Peak read-path memory was flat within ~1 MB from v0.3.0 (2026-05-03) to exp 259 (2026-08-03) across eight checkpoints and roughly forty merged experiments, including the whole transfer-shape arc, while wall time on the same runs fell 25-40%. The only movement in the window is exps 259 and 260, both downward. No memory regression has accumulated.","conditions":"M1 Pro · AOT · harness source held constant, rebuilt per checkpoint · maxRss, one process per lane · 2026-08","edges":[{"type":"dependsOn","target":"261.1"}],"state":"live","restsOn":["261.1"]},{"id":"261.4","source":"261","directions":["measurement-system","result-transfer-shape"],"text":"`select()` holds far more than its payload: `mixed6-10k` reads a table containing roughly 1.5 MB of data and peaks at 95 MB, and 89.5 MB of the pre-exp-260 figure is resident before the measured reads begin. The ~60x ratio has never been decomposed, and exps 008/032's lazy and facade result shapes were assessed against wall time rather than against this.","conditions":"M1 Pro · AOT · maxRss and post-warmup resident, one process per lane · 2026-08","state":"live"}]};
const PAGES = [{"id":"boundary","section":"architecture","zone":"boundary","kicker":"isolate boundary","name":"Cross-isolate transfer","summary":"Dart isolates share no mutable state. That is the language's data-race-free guarantee, and it is also resqlite's central design constraint: every query result must travel from a worker isolate to main, and every write parameter from main to the writer.","dirs":["result-transfer-shape"],"feeds":["readers","writer"],"diagram":"boundary","sections":[{"lede":true,"ps":["Dart isolates share no mutable state. That is the language's data-race-free guarantee, and it is also resqlite's central design constraint: every query result must travel from a worker isolate to main, and every write parameter from main to the writer. Nothing crosses for free — but the costs differ by orders of magnitude depending on *what* is crossing, and the entire read and write path is shaped around knowing which is which.","The rule that governs everything below: **bytes for mutable payloads, slots for structure.**"]},{"h":"What actually costs what","ps":["Since Dart 2.15, isolates spawned together live in one isolate group sharing a managed heap. A `SendPort.send` inside that group is not a serialize-and-rebuild round trip; it is a single object-graph traversal on the sending isolate that copies some things and shares others.","Immutable values — strings, numbers, canonical objects — are shared by pointer. They are never copied, at any size. A 400 KB string adds roughly nothing to a send [[245.1]]. Mutable objects are deep-copied: the flat values array underneath a result is copied slot by slot, and a `Uint8List` is copied byte for byte.","So a result's transfer cost tracks the size of its *mutable structure*, not the size of its data. Two results of identical byte weight can differ tenfold in transfer cost depending on whether those bytes live in shared strings or in copied slots. This is the single most counterintuitive fact about the boundary, and getting it wrong produced a real routing bug that shipped for months."]},{"h":"Four routes across","ps":["**Share.** Strings and numbers ride along free in either direction. Nothing to decide.","**Copy the structure.** The default. `send()` walks the result graph, copies the mutable flat values list and its wrapper, and shares every immutable leaf inside it. Cost scales with slot count — rows times columns.","**Move the bytes.** A `Uint8List` of 256 KB or more is wrapped in a `TransferableTypedData` before it crosses. This does not remove the one mandatory copy — the bytes have to leave SQLite's memory regardless — it changes *where that copy lands*: into malloc'd external memory the garbage collector never traces, rather than onto the shared heap. The send then becomes a constant-time ownership move and the receiver materializes a zero-copy view [[234.1]] [[236.1]]. Wrapping is identity-keyed, so a caller passing the same buffer into five parameter positions ships one buffer, not five [[243.1]].","**Hand over the heap.** For results whose *structure* is enormous, the worker calls `Isolate.exit` and dies: the entire result graph transfers without a copy, and the pool respawns a replacement in the background. This is not free either — the VM still walks the graph to validate sendability, which costs a fixed ~47 µs premium plus a per-slot walk. But that walk is cheaper per slot than a copy, so past roughly 48k slots the exit wins on intrinsic transfer alone [[245.2]]."]},{"h":"Why the trigger counts slots, not bytes","ps":["For most of resqlite's life the sacrifice decision keyed on estimated bytes: results over 256 KB handed off the heap, discounting any cells already wrapped for transfer [[was:236.2]]. For all-integer results that heuristic is accurate — eight bytes per cell means bytes and slots are proportional — and it went unchallenged because the common case looked right.","It was wrong for exactly the case where it mattered most. A result of four rows holding a 100 KB text column is 400 KB by weight and four slots by structure. Those strings were going to be *shared* on send, costing nothing. The byte trigger read the result as expensive, killed the reader isolate, and paid a respawn to avoid a copy that was never going to happen — on every such read.","Re-routing the trigger onto mutable slot count fixed the misroute and deleted the byte accounting entirely: that shape stopped sacrificing and got 31% faster, while every numeric and structural shape kept byte-for-byte identical routing [[246.1]]. The threshold sits at 32k slots ([[code:sacrificeSlotThreshold=32768]]) — deliberately below the ~48k intrinsic crossover [[245.2]], because at the real pool the send's copy also blocks the worker from accepting its next request, which pulls the practical crossover earlier [[244.1]]."]},{"h":"Why sacrifice survives at all","ps":["Killing a worker to return a result looks profligate, and it was repeatedly suspected of starving the pool. Measured at production pool size with a barrier burst, the opposite holds: the lane with sacrifice *disabled* queued longest, because a send's per-slot copy occupies a worker longer than an exit plus an overlapped respawn does [[244.1]]. Starting the replacement earlier changes nothing measurable — the respawn is not on the parked caller's critical path."]},{"h":"What we tried and rejected","ps":["The boundary's rules are narrow on purpose, and the rejections define their edges as sharply as the wins do.","Wrapping blobs in the *batch* path regressed. The wrap's benefit comes from many independent round-trips each parking a fresh allocation on the heap while the writer is mid-step; one batch round-trip has no such pattern to relieve [[237.1]].","Wrapping `selectBytes`' result bought nothing ([[bench:Select → JSON Bytes / Large payload (~650KB) / resqlite selectBytes() ~ 0.323 +-20%]]). Its bytes are already a view over a native buffer — there is no GC-heap destination to escape, so the wrap relocated one copy and added machinery [[242.1]].","And the question underneath all of these — is sacrifice worth keeping? — resisted answering for a long time because the obvious experiment is invalid. Alternating send and sacrifice inside one live pool measures a treatment that mutates the pool it runs in: each sacrifice clears caches and respawns workers, changing the conditions for the next sample. The answer only came from splitting the question into independent estimands and measuring each in isolation [[241.1]]. That methodological lesson generalized well beyond this subsystem."]}]},{"id":"api","section":"architecture","zone":"main","kicker":"main isolate","name":"Public API & streams","summary":"resqlite's public surface is deliberately small — `select`, `selectBytes`, `execute`, `executeBatch`, `transaction`, `stream` — and every call is exactly one message to a worker isolate. The design principle behind the whole library is visible in that sentence: the main isolate is a Flutter app's render thread with a 16 ms frame budget, so the API's job is to hand work away and get out of the way.","dirs":["stream-rerun-dispatch","long-text-stream-hashing"],"feeds":["boundary"],"diagram":"api","sections":[{"lede":true,"ps":["resqlite's public surface is deliberately small — `select`, `selectBytes`, `execute`, `executeBatch`, `transaction`, `stream` — and every call is exactly one message to a worker isolate. The design principle behind the whole library is visible in that sentence: the main isolate is a Flutter app's render thread with a 16 ms frame budget, so the API's job is to hand work away and get out of the way.","Two read shapes exist because two different consumers exist. `select` returns Dart maps for code that inspects rows. `selectBytes` returns JSON bytes encoded entirely in C, for code that forwards a response or writes a file and never needs Dart objects at all — at 5,000 rows it costs slightly more wall time than `select` but **zero** main-isolate time."]},{"h":"The result shape is a transfer decision","ps":["`select` does not return a list of maps. It returns a `ResultSet` over a single flat `List<Object?>` laid out row-major, with lightweight `Row` views created lazily on indexing. Callers get ordinary map ergonomics; the boundary gets a graph with almost no structural objects in it.","That choice was made for transfer, not ergonomics. `Isolate.exit` validates the object graph it hands over, and a 20,000-row result built from per-row maps reaches hundreds of thousands of internal objects — measured at roughly 38% of total query time. The flat list collapses that to the values array, one schema, and a wrapper. The same property later became the basis of the sacrifice trigger itself: slot count is both what `send` copies and what the exit walk visits."]},{"h":"Streams: hashing, dispatch, and elision","ps":["`stream()` turns a query into a live data source. It emits immediately, then re-emits when a write touches data the query can observe. That first emission is a guarantee rather than a timing accident: a stream resolves to a value or an error, never to silence ([[test:test/stream_test.dart#always emits its initial result@z31i]]). When a write lands while the initial query is still in flight, the rows already known to be superseded are withheld and the corrected re-query becomes the subscriber's first frame [[255.1]]. Three SQLite hooks make that possible without parsing SQL: authorizer callbacks on readers record which tables and columns a query actually read; authorizer callbacks on prepared writes record what a statement may modify; and the preupdate hook on the writer records what actually changed. Joins, views, CTEs, triggers, and cascades all work because SQLite is the one reporting.","Re-runs go through `selectIfChanged`, which compares a hash of the fresh result against the last emission and skips the decode entirely when nothing changed. That hash is computed in C inside the step loop — a −39% win over hashing in Dart, with no regression anywhere else [[075.1]]. The fold has resisted every attempt to improve it since: a wider 16-byte body is below noise at 4 KB cells, at 32 KB, and even on a single-stream 64 KB payload with pool parallelism removed to expose it [[110.1]] [[173.1]] [[181.1]]. That question is closed.","Dispatch had one real pathology and it was not where it appeared to be. A large parked-dispatcher signal looked like reader-pool starvation; it was over-dispatch upstream in the stream engine's flush queue, fixed by snapshotting worker availability once per flush and decrementing per pop [[120.1]]. After that, every measured stream workload reports zero parking.","What remains on the main isolate is worth naming precisely, because it is the next target if streams ever need more: the reader-reply port handler accounts for roughly 28% of burst wall on the heaviest overlap workload, while subscriber fan-out — the intuitive suspect — is under 1% [[136.1]]. On the writer side, SQLite-facing calls are a minority of burst wall; the residual request/response handling dominates [[147.1]].","Column-level dependency intersection is what makes wide-table streams viable: writing to a column no stream watches skips the re-query dispatch entirely, which shows up as a 3× throughput spread between disjoint and overlapping writes on a 50-stream benchmark."]},{"h":"Held in reserve","ps":["Two mechanisms work and are deliberately unshipped.","Row-level dirty precision eliminated the keyed-primary-key miss path in prototype — intersection entries dropped from 10,000 to 3 and writer-burst wall halved — but it adds per-row state to the invalidation path for a benefit only that access shape sees [[134.1]].","Off-writer checkpointing showed a 53–64% improvement in first-crossing latency once its trigger policy was fixed; the storm that killed an earlier attempt turned out to be a re-arming bug rather than anything inherent to moving the work [[250.1]].","Both are recorded with their mechanisms intact, waiting for a workload that justifies the complexity rather than for someone to rediscover them."]}]},{"id":"readers","section":"architecture","zone":"workers","kicker":"worker isolates","name":"Reader pool","summary":"Reads run on a pool of two to four persistent worker isolates, each bound to its own read-only SQLite connection against the shared WAL. The whole arrangement exists to keep a 1,000-row read at [[bench:Select → Maps / 1000 rows / resqlite select() ~ 0.","dirs":[],"feeds":["native"],"diagram":"readers","claims":["120.1","239.1","244.1","246.1","236.1","183.1","174.1"],"sections":[{"lede":true,"ps":["Reads run on a pool of two to four persistent worker isolates, each bound to its own read-only SQLite connection against the shared WAL. The whole arrangement exists to keep a 1,000-row read at [[bench:Select → Maps / 1000 rows / resqlite select() ~ 0.319 +-20%]] ms of wall time while charging the main isolate only [[bench:Select → Maps / 1000 rows / resqlite select() [main] ~ 0.051 +-30%]] ms of it — the number that actually competes with a frame. The pool exists to avoid a cost that is invisible until you look for it: spawning an isolate per query costs about 0.08 ms, which on small reads is most of the query. Keeping workers alive amortizes that to zero, and keeping the *C* state alive — connections, prepared-statement caches — means even a worker's death does not throw away the expensive parts.","Pool size is measured, not guessed: throughput plateaus at four workers, and going wider actively regresses stream-heavy workloads because each completed re-query queues another microtask ahead of pending writes."]},{"h":"Dispatch, parking, and the lifecycle","ps":["Dispatch is round-robin with busy tracking. A worker is available when it is alive, has published its command port, and has no query in flight. When every worker is busy the caller parks on a FIFO waiter, and each worker-free event wakes exactly one — not a shared future every parked dispatcher observes, which is how a wake storm starts.","The interesting part of the lifecycle is what happens when a result is large enough to sacrifice. The worker calls `Isolate.exit` with the result, and its slot goes unavailable until a replacement isolate spawns, opens its connection, and publishes a new port. Both the payload and the exit notification arrive on the same port, so FIFO ordering guarantees the result is processed before the death is — which is what makes the whole scheme race-free rather than merely usually-correct."]},{"h":"Why the respawn is affordable","ps":["The obvious worry is that sacrifice starves the pool: kill a quarter of your read capacity on every large result and queueing should get worse. It does not, and the measurement that settles it is a barrier burst — eight identical large reads released simultaneously against four workers, so four run and four park, with the pool torn down and rebuilt between bursts to keep each measurement independent.","The lane with sacrifice *disabled* had the highest parked queue-wait, roughly 19% worse [[244.1]]. The reason is mechanical: without sacrifice, the worker performs a full per-slot copy of the result before it can accept the next request, and that copy occupies the slot longer than an exit plus a respawn that overlaps with three other workers still serving. An eager-respawn variant — starting the replacement before completing the caller — measured inert, because the respawn was never on the parked caller's critical path.","Admission itself is clean. The historical parking signal that looked like pool pressure was over-dispatch upstream in the stream engine [[120.1]], and after that fix every measured workload reports zero parking."]},{"h":"Memory, and the buffer that outlives the query","ps":["`selectBytes` writes its JSON into a per-reader native buffer that persists across queries — which is what makes the result a view rather than a copy [[174.1]]. That buffer only ever grew, so a single 8 MB read left 8 MB pinned per reader for the life of the connection, and a concurrent burst could pin 32 MB across the pool permanently.","The fix is a reclaim policy with an observable signal: buffers above a 1 MB cap shrink after a query whose result was small, and `Diagnostics.readerJsonBufHighWaterBytes` exposes the aggregate so any downstream user or benchmark can see it [[183.1]]. Tuning should raise the trigger before touching the guard — the guard is what prevents thrash under alternating large and small reads.","Large blob *cells* take the boundary's wrap route rather than the copy route, which is what stopped blob-heavy reads from sacrificing a reader on every call [[236.1]], and the sacrifice trigger itself now keys on slot count so text-heavy results stop misrouting into needless respawns [[246.1]]."]},{"h":"The opportunity we are not taking","ps":["Batching parked point-reads into pool-sharded envelopes measured 26–33% on bursts of twenty small reads, and sharding across the pool avoided the one-worker collapse that killed an earlier version of the idea [[239.1]]. It is not shipped. The gain is real but the mechanism adds a second dispatch path with its own capping and fairness rules, and the public API offers no way to ask for it — the honest position is that it waits for a workload that demands it rather than being adopted because it is available."]}]},{"id":"writer","section":"architecture","zone":"workers","kicker":"worker isolate","name":"Writer · binding & batching","summary":"SQLite permits one writer at a time. Rather than fight that with locking schemes, resqlite embraces it: every write in the process routes through a single persistent writer isolate that owns the write connection, processes messages sequentially, and holds transaction state across them.","dirs":["parameter-encoding-and-binding"],"feeds":["tx","native"],"diagram":"writer","sections":[{"lede":true,"ps":["SQLite permits one writer at a time. Rather than fight that with locking schemes, resqlite embraces it: every write in the process routes through a single persistent writer isolate that owns the write connection, processes messages sequentially, and holds transaction state across them. Serialization is not a bottleneck imposed on the design — it is the design, and the optimization work happens *inside* the serial path rather than trying to escape it.","Three public shapes reach it. `execute` sends one statement. `executeBatch` sends one statement with many parameter sets and runs the entire matrix inside C. `transaction` opens an interactive session where the callback runs on main and each statement round-trips."]},{"h":"Binding without allocating","ps":["Parameter encoding is where most of the writer's measured wins live, and they share one shape: remove an intermediate Dart allocation by writing UTF-8 payloads straight into the native arena.","The batch path went first. A guarded ASCII fast path removed a per-string allocation across wide batches [[125.1]], and the follow-up extended the same treatment to non-ASCII by writing UTF-8 directly with private surrogate-pair handling — worth 13.5% on Unicode and 27.8% on emoji at 10k×20 [[126.1]]. Embedded NULs survive correctly because byte lengths are preserved through the bind rather than inferred.","The single-row path followed once a workload existed to show it mattered. Below tens of kilobytes the difference is noise; from 16 KB upward it is 15–32% for ASCII [[186.1]] and 31–39% for CJK [[187.1]]. That gap between \"the encoder is faster\" and \"the workload notices\" is worth naming — an earlier version of this change was rejected precisely because only a micro-benchmark could see it, and it was reopened when the right workload was built."]},{"h":"Blobs, aliasing, and coalescing","ps":["Large blob parameters take the boundary's wrap route: one copy into external memory, then an ownership move instead of a graph copy [[234.1]].","Wrapping is identity-keyed, and that detail is load-bearing rather than an optimization. The graph copier preserves object identity — pass the same buffer to two positions and it is copied once and aliased twice. Naive per-occurrence wrapping broke that property, duplicating one buffer into N external copies and making the wrapped path *worse* than the copy it replaced. Keying wrappers by buffer identity across the whole message envelope restores it, so a blob reused across the writes of a coalesced group crosses exactly once [[243.1]].","Concurrent standalone writes coalesce into a single envelope per round trip. That is why the identity table has to span the envelope rather than a single statement — the reuse case it exists for is precisely a caller looping `execute` with the same buffer.","Batch blobs deliberately do **not** wrap. Measured on a blob-heavy `executeBatch`, wrapping regressed: the win depends on many independent round-trips each parking a fresh allocation while the writer is mid-step, and a batch has one round trip [[237.1]]. The absence of wrapping there is a decision with evidence behind it, not an oversight."]},{"h":"Dirty tracking rides along","ps":["The writer connection installs SQLite's preupdate hook, so every insert, update, and delete records its table into a deduplicated set that returns *with the write response*. There is no separate notification channel and no polling — stream invalidation is a field on a reply the caller was already waiting for. Inside a transaction the set accumulates and returns at commit; a rollback discards it without waking anything."]}]},{"id":"tx","section":"architecture","zone":"workers","kicker":"writer subsystem","name":"Transactions","summary":"A transaction holds the writer for the duration of its body. Nesting maps onto SQLite savepoints.","dirs":["transaction-control-paths"],"feeds":["native"],"diagram":"tx","sections":[{"lede":true,"ps":["A transaction holds the writer for the duration of its body. Nesting maps onto SQLite savepoints. The callback runs on the **main** isolate, not the worker — deliberately, because shipping a closure to another isolate would require every captured object to be sendable, a constraint that is trivially violated by accident and produces confusing failures at runtime rather than helpful ones at compile time. So `tx.execute` and `tx.select` are ordinary async calls that each round-trip to the writer, and the callback stays ordinary Dart code.","Reads inside a transaction run on the *writer's* connection rather than the reader pool, because uncommitted writes are visible only to the connection that made them."]},{"h":"The floor that shapes everything","ps":["This subsystem's measured truth is humbling, and it has closed more experiments than any other area: **the per-statement isolate round trip dominates transaction control**, and almost every clever optimization dissolves against it.","Caching control statements was a genuine win — top-level transaction control had real prepare/finalize work to remove [[101.1]]. After that, the record is a sequence of well-reasoned ideas that measured below the floor:","Savepoint string allocation is below the decision threshold even at 50 savepoints per iteration, a deliberately worst-case shallow fan-out [[111.1]]. Compressing savepoint names to reuse cached SQL moved best-case control rows 6–17%, but the representative nested-write fanout — the row that actually matches production shape — failed to reproduce across the order flip [[189.1]]. Lazy savepoint materialization helped only empty transaction bodies, and fusing `SAVEPOINT` with the first execute regressed the meaningful shape in both pass orders [[212.1]].","The most instructive rejection is the last one. Buffering `Future.wait([tx.execute × N])` into a single envelope against the open transaction *worked* — it removed the round-trip floor for that shape and measured a real improvement. It was rejected anyway, on the grounds that the pattern has no idiomatic home in the API: same-SQL bulk atomic writes belong on `executeBatch`, which already runs the whole matrix in C, and different-SQL bursts are covered by standalone coalescing [[213.1]]. Optimizing a pattern the library does not want to encourage would have made that pattern faster and more attractive at once."]},{"h":"What that implies","ps":["If transaction control ever needs to get materially faster, the target is the round-trip floor itself — not the statements around it. That means something structural: a protocol that lets a bounded, statically-known sequence cross once, without inviting callers into an anti-pattern. Nothing currently justifies it; the record above exists so the next attempt starts from the floor rather than rediscovering it."]}]},{"id":"native","section":"architecture","zone":"native","kicker":"native layer","name":"SQLite · encoders · WAL","summary":"Underneath every isolate sits `native/resqlite.c` and a vendored SQLite — specifically sqlite3mc, which adds encryption — compiled through Dart's native assets build hooks.","dirs":["sqlite-version-and-build-config"],"feeds":[],"diagram":"native","claims":["229.1","250.1","110.1","183.1","016.1","044.1"],"sections":[{"lede":true,"ps":["Underneath every isolate sits `native/resqlite.c` and a vendored SQLite — specifically sqlite3mc, which adds encryption — compiled through Dart's native assets build hooks. The division of labour is the library's first principle: **C owns the state, Dart owns the orchestration.** Connections, prepared-statement caches, mutexes, and hooks live in C structs that outlive any particular Dart isolate, which is exactly why a sacrificed reader is cheap to replace."]},{"h":"What C owns","ps":["The connection pool holds one write connection and N read connections, each with its own statement cache. Connections open with `NOMUTEX`: rather than SQLite locking around every individual API call, resqlite takes one lock around a whole query. On a large result that replaces tens of thousands of lock/unlock pairs with one acquire and one release.","Row decoding is batched across the FFI boundary. `resqlite_step_row` advances the statement and fills a pre-allocated cell buffer with every column's type and value in one call, so Dart reads a typed buffer instead of making an FFI call per column. Integers and doubles come back as direct native reads; text still becomes Dart strings, which is unavoidable for a map-shaped API — and is precisely the cost `selectBytes` exists to skip by encoding JSON in C and never building Dart objects at all.","Two hooks make reactivity work without SQL parsing: the authorizer on readers records what a query read, and the preupdate hook on the writer records what a write changed. SQLite reports the truth about joins, views, CTEs, triggers, and cascades so resqlite does not have to infer it."]},{"h":"Compile-time positions","ps":["Build configuration is settled and deliberately conservative. The tuned flag set with `prepare_v3` is accepted — individually unmeasurable savings that stack [[016.1]] — as is `SQLITE_ENABLE_BATCH_ATOMIC_WRITE`, a zero-risk flag that activates through VFS capability detection on Android F2FS and does nothing elsewhere [[044.1]].","Version policy is evidence-driven rather than temperamental: track sqlite3mc point releases and never adopt a fresh `.0` [[090.1]]. When 3.53.0 shipped a default floating-point rounding change, the audit found it cannot reach resqlite's output at all, because REAL values never pass through `sqlite3_column_text` — so the proposed mitigation shim was unnecessary [[144.1]]. That is the pattern: check whether the hazard reaches *this* code path before paying for a defense."]},{"h":"Where machine code earned its place","ps":["The JSON encoders are the one area where resqlite spends real instruction-level effort, because `selectBytes` makes them the whole cost of a read.","Base64 encoding for blobs went through scalar unrolling, then a 12-bit pair lookup table, then a NEON `vqtbl4q_u8` kernel gated on
