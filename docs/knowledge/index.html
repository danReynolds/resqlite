ship at all.","A count-bounded inline array has an explicit publication boundary. `stmt_cache_lookup_entry` and `stmt_cache_clear` inspect only `[0, count)`, while `stmt_cache_insert` fully zeroes the selected slot through `stmt_cache_entry_init` before incrementing count. Under that invariant, clearing capacity at container construction is not defensive initialization; it is an eager page-fault policy. The 400-statement eviction suite and dependency-reliability tests remain green because every live and recycled slot still takes the same full initialization path.","A source-level `calloc` argument is insufficient evidence that unused capacity stays non-resident. Dead-store elimination differed by placement inside one function: the compiler removed the writer-cache clear adjacent to `calloc` and retained the identical reader-cache clear inside the connection-open loop. The durable attribution paired optimized assembly with two- and four-reader fresh-process RSS; source inspection alone would have predicted either all clears or no clears and missed the actual binary.","Dynamic dependency metadata is no longer the first-order response to exp 267's memory number. It may still shrink a populated 128-entry cache and make a future capacity raise cheaper, but it adds one or two allocations per prepare, failure-conservative reliability semantics, fragmentation and disposal ownership. After empty capacity stays virtual, that complexity needs a representative filled-cache or >128-statement trace; empty-open RSS cannot justify it."],"next":["`benchmark/experiments/stmt_cache_init.dart` is the durable gate for changes to connection-open native footprint. Keep both `rss2` and `rss4`: one fresh process per lane gives an absolute observation, while the reader-count slope discriminates a per-reader cache mechanism from the Dart process floor and writer-side work. Pair max RSS with the lane's start-to-peak growth; neither is a byte-exact allocator counter.","Inspect optimized code before attributing a large `calloc`-backed structure's resident footprint. A nested initializer can fault every page again even when the parent begins zeroed, and the compiler can eliminate one call site while retaining another. The minimum proof is the live-range invariant, a binary-level check that the write exists, and a cardinality sweep (reader count here) that scales the measured memory.","Exact-sized `read_tables` / `dep_columns` storage remains open only for populated-cache footprint. Gate it on `point1`, `rotate128` and `churn-unique` AOT pressure lanes, the 400-statement correctness suite, overflow/OOM reliability tests, and a representative workload that actually fills many entries. Empty-open RSS has been consumed and cannot support the added allocations.","Exp 267's approximate 1.6 KB entry size should not be reused in new arithmetic. The current layout is 2,136 bytes and the exact cache array is 273,408 bytes at 128 entries; remeasure `sizeof(resqlite_cached_stmt)` whenever dependency fields or cached JSON metadata change.","One existing test gap is now named: no test combines `selectBytes()` cached JSON-name tokens with more than 128 distinct SQL identities. This experiment does not add risk there because each recycled slot is still memset before use, but the next change to entry ownership or disposal should add that over-capacity token-reuse case before claiming all fields are eviction-gated."]},{"id":"269","title":"Bound the read, don't predict it","file":"269-enforced-inline-reads.md","date":"2026-08-11","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected","impact":"Moonshot: rejected after adversarial review. The prototype confirmed exp 265's latency mechanism: removing worker dispatch cut the final candidate's hot point-read lanes by 60-65%, pages by 24-38%, a contended point read by 89.5%, and eight concurrent point reads by 69.8%. Its safety premise was false, however. A query returning one INTEGER, `length(randomblob(?))`, spent 26-28 ms inside one SQLite function opcode while remaining below the row, payload, VM-step, and per-turn admission limits; the candidate blocked the calling isolate for the whole interval while current main let its 1 ms timer run. The same gap covers busy/VFS waits, callbacks, cold preparation, and native TEXT scanning. Audit also found unsafe blanket replay, a cross-database schema-cache collision, false zero-value kill switches, an assert-only transfer invariant, and an evictable abort latch. No runtime change is kept. The focused routing harness and receipts remain as mechanism evidence, and a new opaque-work probe is the early rejection gate for any successor. The transferable rule is sharper than exp 265's: SQLite progress counters can request cancellation between selected VM operations, but they are not wall-time preemption; a stopwatch checked before opaque synchronous work is admission, not a bound.","class":"moonshot","changed":["Exp 269 strengthens rather than supersedes exp 265's rejection. Row, payload-byte and VM-opcode caps still do not bound caller-isolate wall time: arbitrary work can occur inside one SQLite opcode, before the progress handler is installed, or while SQLite is waiting below the VM. The missing primitive is preemption, not a better predictor or another counter.","The small-read mechanism remains real. On the exact final candidate, two order-flipped pairs measured point reads at -60.0% to -64.9%, 20- and 64-row pages at -38.2% and -24.0%, a point read behind four busy workers at -89.5%, and eight point reads at -69.8%. Collections 1 and 2 used an earlier decode-loop implementation, so they support the mechanism but are not extra repetitions of the final runtime.","A per-event-loop-turn stopwatch can make a chain of already-cheap reads yield, but checking it before entering synchronous native work cannot limit one read. The decisive query returned one INTEGER and copied no payload while spending 26-28 ms in one built-in function opcode; current main let a 1 ms timer fire during worker execution, while the candidate blocked the timer until the read returned.","Abort-and-replay is not a generally safe fallback for arbitrary read-only SQL. READONLY prevents writes to the database file; it does not make extension functions or virtual-table callbacks free of external or connection-local effects. Routing needs a typed, non-replaying failure contract before application callbacks can participate.","The release sweep remains useful only as a collateral-damage receipt. Its one win was synthetic point-query throughput; representative chat and feed lanes stayed within the declared noise floor, so it did not satisfy exp 265's request for production incidence evidence."],"next":["Keep worker-first execution for the existing arbitrary-SQL `select()` API. Do not retry this design by adding predictors or SQLite counters: none can preempt opaque work inside one synchronous operation.","Run `benchmark/experiments/select_inline_opaque_work.dart` before happy-path routing measurements. A successor also needs cold-prepare, large-TEXT, busy-lock/VFS, slow UDF/collation/virtual-table, two-database schema, zero-cap build, transfer-threshold and greater-than-128-SQL latch-churn lanes, with worker-measured service time and caller timer lateness reported separately.","Reopen caller-isolate work only for an explicitly restricted API with a genuinely bounded execution surface, a preemptible native mechanism that can yield within one SQLite operation, or a deliberately synchronous public API backed by representative device incidence evidence.","Keep the focused routing receipt as mechanism evidence, but read collections 1 and 2 as pre-sentinel prototypes and collection 3 as the only exact-final-candidate run. The blob and scan timings are post-latch worker dispatch after warmup, not measurements of the first inline abort.","Capture a same-host release baseline from the exact parent commit and pass it explicitly to comparison. Auto-selected anchors must be treated as hypotheses until both commit ancestry and code-path reachability are checked."]},{"id":"270","title":"Answer the repeated read from memory","file":"270-read-result-cache.md","date":"2026-08-12","status":"rejected","directions":["result-transfer-shape","stream-rerun-dispatch"],"outcomeClass":"rejected","impact":"Moonshot: rejected, and the reason is not the one the numbers suggest. Exps 265 and 269 established that the isolate round trip is most of a hot point read and that running the query on the caller cannot be made safe; a cache hit runs no SQLite at all, so it collects the same headroom without the bounding problem exp 269 died on. It works: a hit costs 0.48 us against a 4.65 us dispatch, reproduced at -90.0%/-90.1% on a repeated point read, -92.1%/-91.9% at 21 columns, -90.2%/-89.6% across eight cycled parameter sets and -95.1%/-95.7% on a 20-row page, with peak RSS flat or lower. Every adversarial guard is neutral, and two of them wrote the design: describing a statement on first sight rather than second cost a reproduced +21% on a never-repeating SQL workload, and a table-to-queries invalidation index cost +16-19% on a read/write-alternating lane before per-table version stamps moved the cost off the writer entirely. What kills it is scope, not bookkeeping. resqlite's invalidation is built from its own preupdate hook, so it hears only writes made through the same `Database`; a probe that commits through a second connection to the same file gets the pre-write value back from `select()` while a fresh connection sees the new one. `stream()` has always had that boundary and documents it, `select()` has not, and the failure is silent. `PRAGMA data_version` would close it and was measured rather than assumed — 2 us p50 idle, 1 us p50 under a committing foreign writer, 10 us max — which makes a validated hit ~2 us against 4.65 us, about 2x instead of 10x, bought by putting a SQLite connection on the calling isolate, which is exp 269's rejected architecture. Incidence was measured too: 17.7% of Chat Sim's 9,006 reads would hit against 84.3% of Feed Paging's 140, a near-5x spread that makes the value workload-shaped rather than constant. The release suite cannot judge this at all — its read lanes repeat one statement with nothing writing, so `Select -> Maps` at 100 rows reads 0.040 -> 0.005 ms and that number is the benchmark measuring itself. Runtime reverted; the focused harness, the foreign-writer probe, the incidence probe and the `data_version` price are kept, and the successor named is the narrow one: serve `select()` from an active stream's own last result, where the caller has already accepted stream semantics.","class":"moonshot","changed":["We believed resqlite's write-invalidation signal was a general-purpose fact about the database, used so far only by streams. It is not: it is a fact about writes made through one `Database` object. Streams can live with that because a missed invalidation only delays a re-emit, and `stream()` documents the limitation. `select()` cannot, because it re-reads the file today and therefore observes every committed write, whoever made it. Anyone reading the stream-engine chapters or the invalidation sections of the architecture doc should read 'invalidation' as scoped to this Database's own writes, not to the file.","The round-trip headroom exp 265 priced and exp 269 confirmed is collectable without running SQLite on the caller. A cache hit measured 0.48 us against a 4.65 us dispatched point read, reproduced at -90% to -96% across four lanes and two order-flipped collections, with every adversarial guard neutral and peak RSS flat or lower. The blocker is not performance and not the bounding problem exp 269 hit; it is that the invalidation signal has the wrong scope.","The cost of a cache is paid on the write path, and that is where an invalidation design should be judged first. A table-to-queries index with column-level elision — the shape the stream engine uses — measured +16-19% on a read/write-alternating lane, because a write pays it whether or not anything is cached. Replacing it with per-table version counters checked at lookup moved the whole cost onto the reader that benefits and took the same lane to neutral.","The release suite cannot evaluate a read cache. Its read scenarios execute one statement thousands of times with nothing writing, so `Select -> Maps` at 100 rows reports 0.040 ms -> 0.005 ms and the number is the benchmark measuring itself. This is exp 267's observation (every benchmark in the repo uses under ten distinct SQL strings) on a new axis, and it generalises: any candidate keyed on statement identity needs a workload that mixes reads with writes to what they read.","A first incidence number now exists for read repetition. Across the repo's two application-shaped workloads, Chat Sim (A5) would serve 17.7% of 9,006 `select()` calls from cache and Feed Paging (A6) 84.3% of 140 — a near-5x spread between two workloads in the same repository, so the value of remembering a read is a property of how much a workload writes to what it reads, not a constant. Neither is a production trace."],"next":["Do not re-propose a `select()` cache invalidated only by resqlite's own writes. The blocker is the scope of the invalidation signal (claim 270.2), not bookkeeping, precision, or performance.","Run `benchmark/experiments/select_cache_foreign_writer.dart` before any future design that remembers a read result. It fails on the cached arm and passes on main, and no amount of care inside the cache changes that.","The narrower successor worth trying: serve `select()` from an existing `StreamEntry.lastResult` when a stream for the same (sql, parameters) is already active. It carries no new staleness contract, because the caller has already opted into stream semantics for that query, and the machinery already exists.","Judge any future invalidation design on the write path first (claim 270.4). A table-to-queries index costs the writer 16-19% on a read/write-alternating lane; version stamps checked at lookup cost it nothing measurable.","The empty dirty set is the dangerous signal, not the unknown one. DDL and virtual-table writes are indistinguishable from a no-op write at the Dart boundary, so exp 068's deferred `PRAGMA schema_version` watchdog is a prerequisite for anything that trusts an empty set to mean 'nothing changed'.","Any candidate keyed on statement identity needs a workload that mixes reads with writes to the tables they read. The release suite has none, and its read lanes will report a large fake win for such a candidate."]},{"id":"271","title":"Catch the writer before the port","file":"271-worker-completion-catch.md","date":"2026-08-14","status":"rejected","directions":["stream-rerun-dispatch"],"outcomeClass":"rejected","impact":"Moonshot: rejected. A worker-first C11-atomic mailbox proved that the main isolate can observe a completed scalar write before Dart delivers its canonical reply: a focused diagnostic caught 69.9% of eligible attempts. That mechanism did not produce value. Native-asset-aware AOT B-A-A-B measured the cheapest no-op write 84.1% and 62.7% slower, constraint errors 205.1% and 368.4% slower, and continuous write throughput 65.6% and 37.3% lower; point updates and inserts won in only one order. A 32 us tuning arm made every decision lane worse. The effective 16 ms heartbeat delivered 278/279 deadlines in A1 and 279/279 in A2, with maximum gaps of 33.609/25.729 ms; the originally emitted missed-frame field used the wrong effective period and is discarded. Tested correctness guards passed, but an earlier-batch/later-catch completion-order question remains open. Errors can never publish and therefore always burn the full poll, while current main already completes a no-op in 5.9-10.2 us. The lesson sharpens exp 184: a large residual percentage does not make active waiting cheaper than port delivery, and a catch rate is not an end-to-end value metric. Runtime reverted; exact prototype at archive/exp-271; reusable public-API writer/error/heartbeat harness retained.","class":"moonshot","changed":["Exp 184 was right that shared memory is the remaining structural way to observe writer completion without moving SQLite onto the caller, but a shared ready flag is not a wakeup primitive. The exp 271 mailbox caught 69.9% of eligible completions; end-to-end AOT still regressed no-op writes by 84.1% and 62.7% and continuous-write throughput by 65.6% and 37.3%. Catch rate is mechanism evidence, not a value metric.","A large writer-residual percentage does not imply a large absolute waiting budget. Current main completes the AOT no-op lane in 5.9-10.2 us and point updates in 16.9-31.5 us. A 24 us active poll therefore spends as much or more caller time as the port path it tries to avoid; raising it to 32 us made every target worse.","The error miss path is a first-class gate for speculative completion. Failed SQLite statements never publish a success slot, so they always consume the full poll before their canonical typed error. Constraint-error latency regressed 205.1% and 368.4% across the order pair, and the 32 us arm was worse again. Do not add predictors or error latches to rescue a spin design that already loses its cheapest success lane.","A per-event-turn token bounded each synchronous polling burst, but the candidate is not proven heartbeat-safe. Dart 3.12.2 truncated the requested 16,667 us period to 16 ms: A1/A2 delivered 278/279 and 279/279 effective deadlines, with p99/max gaps of 21.094/33.609 ms and 19.803/25.729 ms. The originally emitted missed-frame field used the wrong effective period and is discarded. Tested stream, transaction, group, slow-miss, typed-error, and close paths passed, while an earlier-batch/later-catch completion-order question remains unresolved.","The durable successor gate is now a public-API harness with sequential no-op, point-update and insert lanes plus active-stream, concurrent, transaction, slow-write, constraint-error and 16 ms heartbeat guards. Future completion-transport work must use native-asset-aware AOT in both orders; JIT samples showed material within-run warm-up drift."],"next":["Do not retry shared-memory completion with a longer spin, a larger per-turn budget, or a success/error predictor. Reopen only for a wait/notify or park/wake primitive that does not burn caller-isolate time, or representative downstream evidence of a much larger sequential-write floor.","Use benchmark/experiments/writer_completion_catch.dart for any future writer-completion transport. The load-bearing gates are both-order AOT no-op/point/insert wall, constraint-error latency and fidelity, continuous 16 ms heartbeat delivery, active streams, coalesced groups, transactions, slow misses, and close ordering.","Do not use completion catch rate as an acceptance metric. Exp 271 caught 69.9% and still lost end-to-end; compare public Future completion wall against the exact parent commit.","Treat JIT writer microbenchmarks as exploratory only. Exp 271's JIT samples improved materially within a pass despite warmup, while native-asset-aware AOT supplied the decisive result.","Keep SQLite on the writer isolate. Exp 271 avoided exp 265/269's caller-isolate SQLite hazard; its rejection is about active waiting cost, not permission to revive synchronous arbitrary SQLite work on main."]},{"id":"272","title":"Trace the SQL UTF-8 cache boundary","file":"272-sql-utf8-cache-incidence.md","date":"2026-08-15","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected","impact":"Measurement: rejected, premise refuted. Exp 267 raised the native statement, worker schema, and pool row-hint SQL-keyed caches from 32 to 128, while each isolate's cachedSqlUtf8 pointer LRU remained at 32. Raising that pointer cache can avoid repeated native UTF-8 allocation only at one-based reuse rank 33-128. Three captured Dune flow traces spanning five test lifecycles recorded 911 accesses across 25 reader/writer isolate lifetimes: 595 first-touch misses and 316 repeats, all 316 within rank 32 and none above rank 19. Replaying the exact per-isolate sequences at 128 rescued zero misses and zero SQL bytes, and the 32-entry replay matched the real hit bit on 911/911 events. Writers still saw as many as 79 unique SQL identities, proving that total diversity is not a reusable working-set measurement. The temporary tracer and SQL-bearing logs were removed; an anonymized event stream and offline analyzer remain, and no runtime candidate ships. Reopen from nonzero downstream reuse at rank 33-128; adopt only if predicted and both-order AOT wall impact reach 3% with neutral controls and bounded RSS.","class":"measurement","changed":["The 32-entry per-isolate `cachedSqlUtf8` LRU is mechanically out of alignment with exp 267's 128-entry statement, schema and row-hint caches, but cache-cap alignment is not itself product value. Three captured downstream Dune flow traces spanning five test lifecycles recorded 911 accesses across 25 isolate lifetimes; all 316 repeats had one-based reuse rank at most 32, so replay at 128 rescued zero of 595 misses and zero SQL bytes. The implementation premise is refuted for the measured flows and no runtime cap change ships.","Total or lifetime-unique SQL is the wrong incidence measure for an isolate-local LRU. The message writer used 77 unique identities and each canvas writer used 79, yet every repeated access still fell within the 32 most recently used identities. Cold migrations and feature breadth can make a database look diverse without creating the reusable 33-128 working set this candidate needs.","Claim 267.1 remains live: a genuinely cyclic working set beyond the adjacent statement-cache cap has a sharp performance cliff. For the UTF-8 pointer cache it supplies an eligible workload, not a measured per-miss saving. Shipping this separate capacity raise requires per-isolate reuse-rank incidence, measured conversion/free cost and aggregate representative impact.","The premise-refuted measurement escape applies before an implementation A/B when the trace makes the candidate mechanically inert. With zero rescued accesses, operation frequency times eligible share times per-hit saving is zero; timing a 100%-eligible synthetic cycle would not repair the missing product-value term."],"next":["Do not raise `_sqlCacheMax` from a synthetic rotate40/64/128 result or from a count of unique SQL. Reopen investigation when a longer, lower-perturbation downstream trace records SQL identity per reader/writer isolate and finds nonzero one-based reuse rank 33-128.","A reopening trace must replay independent 32- and 128-entry LRUs, report incremental misses and rescued SQL byte lengths, and combine them with call frequency and measured `toNativeUtf8` plus eviction/free cost. Bound the retained memory of 96 extra Dart string keys and native UTF-8 buffers per isolate before implementation.","If incidence appears, implement only when frequency times rescued share times measured conversion/free saving predicts at least 3% representative wall impact. Choose the smallest trace-supported cap and require at least 3% in both orders of two independent order-flipped AOT pairs; rank-at-most-32, point, unique-churn and above-cap controls must show no reproduced regression of 3% or more, with bounded RSS.","The current evidence covers short deterministic JIT Dune tests and current-process worker stderr only. Synchronous logging can change availability-based reader assignment, so reader sequences describe captured instrumented routing; the FIFO writer evidence is stronger. Hours-long dogfood, a broader downstream AOT lifecycle, or a different application can legitimately reopen the candidate."]},{"id":"273","title":"Recheck continuous profile-guided optimization","file":"273-continuous-pgo-recheck.md","date":"2026-08-16","status":"rejected","directions":["sqlite-version-and-build-config"],"outcomeClass":"rejected","impact":"Performance: rejected under a predeclared important-lane guard despite broad positive evidence. Apple Clang 21 continuous counter profiles retire exp 054's dylib-exit blocker, and a strict macOS arm64 PGO-use build improved 65 release wall/QPS lanes by a combined 5.65%, improved the 44 native/floor-filtered lanes by 7.54%, reproduced about 5.5% higher focused point QPS, left focused transaction checks neutral-to-faster, and reduced dylib size 15.04%. The decisive fixed-binary homogeneous stream adjudication regressed by at least 3% and 0.02 ms in three of five 300-trial pairs (2, 4, and 5), triggering the exact rejection rule. Pooled homogeneous p50 was only +1.53%/+0.017 ms and its bootstrap interval crossed zero, so the record does not claim a stable intrinsic slowdown; pooling cannot replace the declared adjacent-pair rule. Shipping also requires hidden LLVM controls, atomic training, cross-worktree proof, and source/compiler/target-specific profiles or fallbacks. Exact prototype/profile go to `archive/exp-273`; publication keeps only generalized stream measurement support and evidence.","changed":["Exp 054's macOS infrastructure blocker is obsolete on Apple clang 21. `-fprofile-continuous` produced mergeable counters from the Dart-loaded Resqlite dylib without relying on process-exit flushing; generation and use both needed value profiling disabled, and removing absolute source prefixes made the profile reusable across worktrees. The strict profile-use AOT build completed without stale, unprofiled, or backend warnings.","Counter-only PGO can move Resqlite's native wall materially. In a baseline-candidate-candidate-baseline AOT release comparison, batch inserts at 100/1,000/10,000 rows improved 14.6%/12.5%, 16.7%/16.8%, and 19.2%/19.3%; the 10,000 x 20 wide batch improved 12.4%/9.2%, parameterized reads improved 10.6%/10.4%, and multiple rows/selectBytes lanes moved the same direction by roughly 5-13% in both comparisons. The mechanism is real even though the product candidate is rejected.","Broad release wins do not waive a declared narrow latency guard. The preregistered homogeneous-stream kill rule was p50 regression of at least 3% and at least 0.02 ms in at least three of five adjacent 300-trial AOT pairs. Pair p50 deltas were -9.63%, +4.38% (+0.0465 ms), -15.61%, +43.37% (+0.3285 ms), and +11.69% (+0.1315 ms), so pairs 2/4/5 triggered it. The pooled delta was only +1.53% with a confidence interval spanning zero: this is a declared replicated-gate failure amid phase variance, not proof of a stable slowdown.","The measured profile is not a self-contained compiler flag. Its 522,568-byte artifact is tied to the source, Apple clang 21 compatibility contract, target, and representative training corpus; strict profile-use intentionally rejects stale or unprofiled code. Shipping it would require auditable retraining and provenance for every supported target/compiler/source change plus a defined non-PGO fallback. That lifecycle is disproportionate for a lean cross-platform library, so no profile or PGO build-hook path ships."],"next":["Do not repeat exp 054's no-profraw investigation on current Apple toolchains. For a bounded Darwin PGO experiment, start from exp 273's continuous, counter-only recipe and require strict profile-use diagnostics; the exact prototype and indexed profile live only on `archive/exp-273`.","Do not ship a checked-in PGO profile or PGO-enabled build-hook path until there is automated per-target retraining, compiler/source compatibility enforcement, artifact provenance, and an explicit fallback policy. A profile's lifecycle is part of the implementation cost.","Any PGO, LTO, compiler-flag, or code-layout revisit must run five adjacent 300-trial `stream_rerun_latency.dart` pairs and adjudicate the declared homogeneous p50 rule: both >=3% and >=0.02 ms regression in >=3/5 pairs kills the candidate. Report pooled uncertainty too, but do not replace the replicated rule with a post-hoc p95 boundary or pooled-only verdict.","A future PGO revisit needs a materially simpler lifecycle and a profile/training design that clears the same preregistered stream gate without giving back the repeated batch/read/selectBytes gains. Exp 273's pooled +1.53% with a zero-spanning confidence interval limits the claim to gate failure amid phase variance; retuning the corpus after observing that result is a new hypothesis, not a post-hoc rescue."]},{"id":"275","title":"Which read gets the next free worker","file":"275-cost-aware-read-admission.md","date":"2026-08-19","status":"rejected","directions":["stream-rerun-dispatch","result-transfer-shape"],"outcomeClass":"rejected","impact":"Moonshot: rejected on incidence, not mechanism. Exp 265 measured a point read behind four 1,000-row reads at 533-1169 us against 37-52 us inline (claim 265.2) and named that the admission half of the round-trip price; exps 265, 269 and 270 each tried to collect it by removing the worker and were rejected for unbounded caller work, unbounded opaque SQLite work, and foreign-writer staleness. `ReaderPool._dispatch` never scheduled it at all — first free worker, one FIFO park queue, and nothing in the path knowing that one parked request returns a row in 8 us and the one ahead of it ten thousand in a millisecond. The cost signal exp 239's rejection demanded (`a reliable private cost signal`) has existed since exps 260/264 built `RowSizeMemory.highWater` for buffer sizing, one line above the worker scan. Two arms, three AOT binaries, two collections of order-flipped lane-isolated pairs. Priority waiter queues alone move eight point reads queued behind eight large ones -37 to -42% with every control neutral and the starvation guard reproducibly FASTER (-3 to -9%), because serving short jobs first empties the queue sooner. Adding a last-free-worker reservation — safe without any per-request denial cap because a slot is only ever refused while another worker is busy, so a wake is always still coming — takes a point read into a saturated pool from 256-374 us to 52-65 us (-75 to -86%, against ~20 us on an idle pool), which is most of exp 265's inline win with no SQLite on the calling isolate, no staleness contract and no starvation. Both are rejected. A temporary counter over one full release-suite pass found 335,221 dispatches, 325,909 of them cheap, 312 cheap reads that parked at all, and ZERO parked behind a costly waiter — the entire population the reordering acts on, measured with the reservation ON so the zero is an upper bound. The reservation additionally costs a reproduced +47 to +63% on four concurrent large reads whenever cheap reads are recent, which is the same hidden latency-for-throughput trade exps 197, 213, 239 and 249 were each rejected for. Also corrects exp 265's `point-under-load` lane: sticky dispatch (exp 266) puts reads two through ten on an already-free worker, so summing ten reads diluted this candidate to -13%. Runtime reverted, prototype with 162 passing tests at `archive/exp-275`, harness retained. The bound to carry forward is that a four-worker pool parks a cheap read three times in a thousand across every workload the repo can run.","class":"moonshot","changed":["We believed the admission half of exp 265's round-trip price (claim 265.2) was unreachable without moving SQLite to the calling isolate, because the three experiments that attacked it — 265, 269, 270 — all did so by removing the worker. That is now false as a statement about mechanism: scheduling the wait rather than removing it collects 75-86% of a point read's latency behind a saturated pool, with no caller-isolate SQLite, no staleness contract and no starvation. A reader of exps 265/269/270 should stop treating 'the pool is busy' latency as intrinsically coupled to the transport question; it is a scheduling property and it is separable.","We also believed, without ever measuring it, that reader-pool queueing is a real cost on real workloads — the premise under exps 105, 114, 118, 120, 239 and 249 and under this one. It is not, at the pool's shipped width. One full release-suite pass measured 335,221 dispatches, 325,909 of them cheap by a 64-row classifier, 312 cheap reads that parked at all, and zero that parked behind a costly waiter. Exps 118 and 120 reported dispatcherParkedTotal at zero for stream workloads specifically; the general statement is stronger and it is what closes this experiment. Anyone reading those experiments as 'streams stopped parking the dispatcher' should read them instead as 'four workers exceed what these workloads ask for at once'.","The reservation arm's rejection is the fourth instance of one pattern, and the pattern should now be assumed rather than rediscovered. Exps 197, 213, 239 and 249 each proved a mechanism and each died because the mechanism silently spent one caller's cost on another's benefit. Exp 275's reservation buys point-read latency with a reproduced +47 to +63% on four concurrent large reads. A reader of any of those five writeups should treat 'hidden policy that reallocates cost between callers' as rejected by default, and require an explicit caller-visible mode before measuring it.","Exp 265's `point-under-load` lane is not a reusable measurement for admission work and its methodology passage should not be copied. It sums ten point reads issued after the pool is saturated, but sticky dispatch (exp 266) puts reads two through ten on a worker that has already freed, so nine of the ten measure an idle pool in every arm. That was correct for exp 265, whose candidate removed all ten from the pool, and wrong for anything that changes only who waits: measured that way this candidate read -13% instead of -75%.","Exp 239's stated reopen condition — 'a reliable private cost signal' — has been satisfiable since exps 260/264 shipped RowSizeMemory.highWater, and nobody noticed because the signal was built in a different direction for buffer sizing. It is available on the dispatch fast path, one line above the worker scan, and classifying a statement from it costs nothing measurable. Future readers of exp 239 should know the blocker it named is gone; what remains blocking is incidence, which is a different objection."],"next":["Do not reopen either arm without a workload where cheap reads actually queue behind costly ones — more than four concurrent reads of genuinely mixed cost on one Database. Claim 275.1 is the gate: a downstream trace showing a nonzero count of cheap dispatches parked behind a costly waiter. No benchmark in this repo builds that shape, and the release suite cannot, because its concurrent lanes issue one statement N times.","If it is ever reopened, reopen the priority waiter queues (candA) only. They withhold no capacity, every control is neutral, and the starvation guard came out faster. The last-free-worker reservation (candB) is closed as hidden policy regardless of incidence — it belongs behind an explicit caller-visible mode, which the near-frozen public API has no room for.","Use benchmark/experiments/reader_admission_priority.dart for any future work on WHEN a read is admitted — priority, cost classes, pool sharding, reservation, work stealing. `bulk4-mixed` is the load-bearing price lane and `bulk4-cold` the hysteresis control; `costly-latency` is the starvation gate. Time the first read only in any saturated-pool lane (claim 275.4).","Measure the queue before proposing anything that reorders it. A four-worker pool parks a cheap read three times in a thousand across every workload the repo can run (claim 275.1); the theoretical ceiling of all admission-ordering work on the measurable corpus is that number.","Exp 239's named blocker is resolved: RowSizeMemory.highWater is a reliable private per-SQL cost signal on the dispatch fast path, costing nothing measurable to read. Anything still citing 'no cost signal' as the reason a dispatch-side candidate is blocked should cite incidence instead.","The downstream trace vehicle exp 272 used is not available on this host — the sibling checkout it drove through dependency_overrides is an empty Flutter scaffold with no lib/ and no resqlite dependency. Any future incidence question that needs a real application trace has to re-establish that vehicle first."]},{"id":"278","title":"What the async prologue on a read is worth","file":"278-sync-read-prologue.md","date":"2026-08-25","status":"rejected","directions":["result-transfer-shape","stream-rerun-dispatch","measurement-system"],"outcomeClass":"rejected","impact":"Performance: rejected, and this time the ceiling is priced rather than searched for. Every `db.select()` on an open database crossed three `async` frames and an `await` on the long-resolved `_runtime` future before reaching `SendPort.send`; exp 275's census (claim 275.1) showed 99.9% of the 335,221 dispatches in a release pass never reach the parking loop `ReaderPool._dispatch` is a coroutine for. The candidate made `Database.select`, `Database.selectBytes` and the first-scan half of `_dispatch` non-async, keeping every failure path and the parking loop on their original async siblings. A new no-SQLite, no-isolate harness (`benchmark/experiments/async_prologue_price.dart`) prices what that removes at ~108 ns per call, and the full prologue including the resolved-future await at ~143 ns — against ~5.5 us for the repo's canonical point read, a hard ceiling of ~2.0% on the smallest read the suite has and ~0.05% on a 1,000-row one. Twelve alternating-order lane-isolated AOT passes over `reader_dispatch_stickiness.dart` confirm it end to end: every lane sign-flips inside a ~2% floor, primary and guard alike. The durable result is the price. Exp 171 rejected the same family in June after estimating the `_runtime` hop at 1-2 us per call and deriving 6-12% of headroom from it; that hop measures ~71 ns, so the estimate was 14-28x too large and the headroom never existed. Runtime reverted; the pricing harness is kept.","changed":["We believed that trimming Dart's async plumbing off resqlite's hot paths was a candidate whose size was unknown and whose measurement was the hard part. Exp 171 put one `await` on an already-resolved future at \"~1-2 us per call\" and derived 6-12% of headroom on a 2,000-call write burst from that estimate, then found nothing and concluded its harness was too coarse. We now believe the estimate was the error, not the harness: that hop prices at 70.7 ns and a forwarding `async` frame at 34.6 ns, so exp 171's figure was 14-28x too large and the headroom it went looking for never existed. Claim 278.1 supersedes claim 171.1 — which this run had to mint from exp 171's own changedBeliefs before it could edge to it — and the conclusion exp 171 reached survives its arithmetic being replaced.","We believed the open question about the read prologue was 'can any harness resolve it'. It is now closed by division rather than by measurement. The whole prologue on `Database.select` -> `ReaderPool.select` -> `ReaderPool._dispatch` is 142.7 ns, of which a candidate removes ~108 ns; against a 5.4 us point read that is 2.0%, against a 1,000-row read 0.05%, and the gate is 5%. No implementation of the idea reaches the gate, so the reopen conditions are a numerator change (an SDK where async frames get materially dearer) or a denominator change (a read path an order of magnitude cheaper, which means the isolate round trip is gone rather than trimmed). 'Retry on a quieter host' is explicitly not a reopen condition, and the next runner in this family should start with `async_prologue_price.dart` rather than a candidate.","`dart run tool/knowledge/impact.dart origin/main` reports nothing retired and no documented passage standing on moved ground: 171.1 appears only because this run minted it, and the supersession replaces a figure no chapter ever quoted. Nothing in `doc/arch/` needs a rewrite. What does change for a reader is exp 171's writeup itself — its Hypothesis section's \"at ~1-2 µs per hop\" arithmetic is now known to be wrong by more than an order of magnitude, and anyone reading it for the size of the opportunity should read claim 278.1 instead. `experiments/index/171.json` carries `amendedBy: 278` so the README shows the lineage; the verdict on that row is unchanged and correct.","A third belief, about instruments rather than about async: we treated guard lanes and control lanes as the same thing. They are not. `mixed6-10k` in this run has a computable ceiling of 0.004% and it read -2.9% pooled, which is what made `point1`'s pooled -3.0% legible as apparatus rather than effect. A guard lane answers 'did anything break'; a control lane whose arithmetic ceiling is near zero answers 'what can this collection resolve at all', and without the second one this run would have reported a 3% win it did not have."],"next":["`benchmark/experiments/async_prologue_price.dart` is the first thing to run for any candidate in the async-overhead-removal family (exps 145, 148, 151, 159, 171, 278). It needs no database and no isolates, runs in seconds, and answers `how many nanoseconds is one layer worth` — divide by the wall time of the operation the layer wraps and compare to the gate before writing the candidate. Two experiments have now spent a full run each discovering an answer this probe gives immediately.","Do not reopen the read-prologue candidate on a quieter host or a better harness; the ceiling is arithmetic, not measurement. The only reopen conditions are a numerator change (an SDK release where `frame3 - frame1` crosses ~300 ns) or a denominator change (a read path an order of magnitude cheaper than today's 5.4 us point read, which means the isolate round trip is gone rather than trimmed — exps 265, 269 and 271 all failed to remove it).","Give every focused A/B a lane whose arithmetic ceiling is near zero and read the collection's floor off it. `mixed6-10k` pooled -2.9% here while the candidate could move it by 0.004%, which is what made `point1`'s -3.0% legible as apparatus rather than effect. A guard lane says `nothing broke`; a control lane with a computable ceiling says `here is what this collection can resolve`, and the two are not the same instrument."]},{"id":"279","title":"Does the reader have to be a Dart isolate?","file":"279-native-thread-dispatch.md","date":"2026-08-28","status":"rejected","directions":["result-transfer-shape","stream-rerun-dispatch"],"outcomeClass":"rejected","impact":"Moonshot: rejected, and the vehicle question is now closed rather than open. Exps 265, 269, 270 and 275 each tried to collect claim 265.1's 6.3 us round trip by removing the worker, and each was rejected for a consequence of doing so — unbounded caller work, unbounded opaque SQLite work, foreign-writer staleness, zero incidence. None asked whether the worker has to be a Dart isolate: a POSIX thread keeps SQLite off the caller just as completely, and `Dart_PostCObject_DL` can deliver its completion. It is slower. A Dart isolate round trip costs 1.46 us; the same handoff to a native worker thread costs 4.28 us parked on a condvar and 3.18 us with the worker spinning on the queue and burning a core, so the primitive cannot be blamed. A native post issued from the calling thread, where nothing has to be woken, costs 0.67 us — the whole 2-3 us gap is the cross-thread wake, which the VM's same-group message path does in both directions for less. End to end a one-row `selectBytes` through the native thread is +17.3%, a 1,000-row one +1.1%, and 5,000 rows inside the noise floor: never faster at any size. Two findings outlive the rejection. A point read's entire transport is 3.22 us, about half of the 6.3 us hop, so the other half is resqlite's own per-request work on the two sides of the messages and that is where the remaining headroom lives. And the VM charges for a payload's backing rather than its size: 256 KB as a view over malloc'd memory sends in 9.01 us, the identical 256 KB as a heap `Uint8List` in 43.06 us — 4.8x, the number behind exp 174's view-send and a standing constraint on any path that would assemble bytes on the Dart heap first. Zero-copy external-typed-data handoff is the one lane where native dispatch leads (5.63 vs 9.01 us), but realizing it means handing `json_buf` over and forfeiting the reuse exp 174 found decisive, for 1.4% of a 1,000-row read. Runtime reverted; prototype at `archive/exp-279`; the isolate-only lanes are retained as `benchmark/experiments/isolate_transport_price.dart`.","class":"moonshot","changed":["We believed the isolate round trip's 6.3 us (claim 265.1) was the price of keeping SQLite off the calling isolate, and that the four rejections since — unbounded caller work (265.6), unbounded opaque SQLite work (269.2), foreign-writer staleness (exp 270), zero incidence (275.1) — were each about a consequence of removing the worker rather than about the hop itself. That framing left the hop looking collectable by anyone who solved the safety problem. We now believe it is not collectable at all by changing vehicles: a POSIX worker thread, which gives the caller identical protection, costs 4.28 us per round trip parked on a condvar and 3.18 us spinning, against 1.46 us for a Dart isolate. The Dart VM's same-group message path is the cheapest available way to get work off the calling isolate and an answer back, and a future runner should stop looking for a better one.","We believed — implicitly, because nobody had split it — that most of the 6.3 us hop was messages. It is not: a point read's whole transport, request object out and result shape back, is 3.22 us. The other half is resqlite's own per-request work on the two sides of the messages, and a perfect zero-cost transport would leave it standing. Claim 279.3 refines claim 265.1 rather than replacing it: the 6.3 us is still right as the price of the hop, but it is now decomposed, and the half worth attacking is the one nobody has measured. Anyone reading exp 265 for where to aim next should read 279.3 beside it.","We believed exp 174's view-send was right because it avoided a `Uint8List.fromList` copy. The measurement says the reason is larger than that and worth stating on its own: the VM charges for a payload's *backing*, not its size. Byte-for-byte identical 256 KB sends in 9.01 us as a view over malloc'd memory and 43.06 us as a heap `Uint8List` — 4.8x. Claim 279.4 validates claim 174.1 with the number it was reasoned from, and it now constrains anything future: a path that assembles bytes on the Dart heap before sending them pays roughly five times the transfer, and nothing downstream of the send recovers it.","`dart run tool/knowledge/impact.dart origin/main` reports nothing retired and no documented passage standing on moved ground. 265.1 is refined rather than superseded, so the figure every writeup quotes stays correct; 174.1 is validated. `doc/arch/cross-isolate-data-transfer.md` is the one passage a reader should revisit — not because anything in it is now wrong, but because §6a's send-vs-sacrifice account is where the backing-vs-size result belongs alongside exp 245's copy-per-slot rule, and a future edit should put it there."],"next":["Do not propose another transport for the read path. Exps 265, 269, 270 and 275 removed the worker four different ways and were each rejected on a consequence; exp 279 kept the worker and changed what it is, and the replacement is 2.2-2.9x more expensive. The only reopen condition is claim 279.2's numerator: an SDK or platform where a foreign thread can wake a sleeping isolate for materially less than ~2 us. Re-run the archived prototype at `archive/exp-279` against `isolate_transport_price.dart` before assuming otherwise.","The next candidate in this direction should target the half of claim 265.1 that is not transport. Claim 279.3 puts a point read's messages at 3.22 us of the 6.3 us hop, leaving ~3.1 us in per-request work that no transport change reaches: `ReaderPool._dispatch`'s row-hint lookup and stamping, request object construction, the worker's `resqliteReaderSetBusy` bracket and request-type dispatch, `_WorkerSlot`'s completion handler chain, `_record`, and `blobTransfer.materializeCells`. None of these has ever been measured individually and several are plausibly sub-microsecond, so the first step is a decomposition, not a candidate.","`benchmark/experiments/isolate_transport_price.dart` is the ruler for anything that changes what crosses the isolate boundary. It needs no database, no native code and no isolate pool, runs in seconds, and prices request shape, reply shape and bulk payload separately. Run it before proposing a message-shape change — including any revival of columnar transfer (exps 055, 081, 251, 258) — and divide by the read it wraps.","Claim 279.4 is a constraint on future design, not just a finding: a bulk payload's Dart backing decides its send cost, at 4.8x for 256 KB. Any candidate that would build a `Uint8List` on the Dart heap before sending it — a worker-side decode, a re-encode, a concatenation of chunks — pays that multiple, and the fix is always to keep the bytes native and send a view."]}],"claims":[{"id":"016.1","source":"016","directions":["sqlite-version-and-build-config"],"text":"The tuned SQLite compile-flag set (with prepare_v3) is accepted; per-call savings are individually too small to measure but stack with isLeaf bindings.","conditions":"2025 · backfilled 2026-07","state":"live"},{"id":"044.1","source":"044","directions":["sqlite-version-and-build-config"],"text":"SQLITE_ENABLE_BATCH_ATOMIC_WRITE is a zero-risk compile flag: it activates via VFS capability detection (Android F2FS) with no effect elsewhere and no API change.","conditions":"2025 · backfilled 2026-07","state":"live"},{"id":"059.1","source":"059","directions":["result-transfer-shape"],"text":"Remembering a SQL's last row count and pre-sizing `decodeQuery`'s result buffer from it is not worth the two-field cache entry: list growth is already cheap (only ~3-4 doublings even for a 10k-row read) and the measurable improvement sits below the release-suite noise floor.","conditions":"release suite, 3 repeats vs baseline, 2 wins / 0 regressions / 61 neutral · 2026-04 · backfilled 2026-08","state":"refuted","by":["260.1"]},{"id":"067.1","source":"067","directions":["result-transfer-shape"],"text":"`decodeQuery`'s initial `List<Object?>.filled(colCount * 256, null)` must not be shrunk. Cutting it to `colCount * 4` regressed every many-small-query workload (Stream Churn +44%, Batched Write Inside Transaction +40%), because the VM's null-fill fast path makes one large pre-sized allocation cheaper per slot than a small one that then has to grow.","conditions":"release suite, 0 wins / 4 regressions / 59 neutral · 2026-04 · backfilled 2026-08","state":"live"},{"id":"075.1","source":"075","directions":["long-text-stream-hashing"],"text":"Computing the selectIfChanged result hash in C during the step loop is a large win (-39%) on the re-query path with zero measurable regression; hash code consolidates to a single C implementation.","conditions":"2025 · backfilled 2026-07","state":"live"},{"id":"090.1","source":"090","directions":["sqlite-version-and-build-config"],"text":"sqlite3mc version bumps should wait for safer point releases when the newest SQLite release is a fresh .0.","conditions":"policy · 2026-04 · backfilled 2026-07","state":"live"},{"id":"099.1","source":"099","directions":["long-text-stream-hashing","measurement-system"],"text":"Byte-stream hash-loop changes need long-text stream workloads before they are meaningfully testable.","conditions":"measurement gap · 2026-04 · backfilled 2026-07","state":"live"},{"id":"101.1","source":"101","directions":["transaction-control-paths"],"text":"Top-level transaction control had removable SQLite prepare/finalize work; cached control statements remove it.","conditions":"M1 Pro · 2026-04 · backfilled 2026-07","state":"live"},{"id":"110.1","source":"110","directions":["long-text-stream-hashing","measurement-system"],"text":"The archived 8-byte FNV byte fold is a clear win once the workload carries 4KB TEXT cells; the long-text unchanged-fanout benchmark was the blocker to seeing it.","conditions":"M1 Pro · 4KB TEXT · 2026-04 · backfilled 2026-07","state":"live"},{"id":"111.1","source":"111","directions":["transaction-control-paths","measurement-system"],"text":"Savepoint string-allocation cost is below the decision threshold even at 50 SAVEPOINTs per iteration — per-isolate-round-trip cost dominates nested transaction control.","conditions":"M1 Pro · 2026-04 · backfilled 2026-07","state":"live"},{"id":"120.1","source":"120","directions":["stream-rerun-dispatch"],"text":"Exp 119's 3,590-park signal was upstream over-dispatch from StreamEngine._flushQueue, not reader-pool admission; snapshotting availableWorkerCount once and decrementing per pop drops parking to zero. Future dispatch work needs a different counter.","conditions":"M1 Pro · 2026-05 · backfilled 2026-07","state":"live"},{"id":"125.1","source":"125","directions":["parameter-encoding-and-binding"],"text":"A guarded ASCII fast path removes per-string UTF-8 allocation in wide batch parameter packing without changing the public API or weakening Unicode fallback.","conditions":"M1 Pro · 2026-05 · backfilled 2026-07","state":"live"},{"id":"126.1","source":"126","directions":["parameter-encoding-and-binding"],"text":"Direct UTF-8 payload writing removes the same per-string allocation for non-ASCII batches (focused Unicode 10k x20 -13.5%, emoji -27.8%), with Dart-compatible surrogate handling private to the encoder.","conditions":"M1 Pro · 2026-05 · backfilled 2026-07","state":"live"},{"id":"134.1","source":"134","directions":["stream-rerun-dispatch"],"text":"Row-level dirty precision can remove the keyed-PK miss-path cost (intersection_entries 10000 -> 3; writer-burst wall 25.54 -> 12.45 ms) — rejected as shipped complexity, preserved as potential.","conditions":"M1 Pro · prototype · 2026-05 · backfilled 2026-07","state":"live"},{"id":"136.1","source":"136","directions":["stream-rerun-dispatch","measurement-system"],"text":"On A11c overlap the reader-worker port handler is the largest remaining reachable main-isolate slice (28.57% of burst+drain wall); subscriber-fanout emit is <1% and is not the optimization target.","conditions":"M1 Pro · profile · 2026-05 · backfilled 2026-07","state":"live"},{"id":"143.1","source":"143","directions":["measurement-system"],"text":"Pinned Tracelite profile runs produce decision-useful structured evidence: point queries are median dispatch-bound, merge rounds are work-bound, and allocation/RSS costs hide behind wall time alone.","conditions":"M1 Pro · profile · 2026-06 · backfilled 2026-07","state":"live"},{"id":"144.1","source":"144","directions":["sqlite-version-and-build-config"],"text":"The 3.53.0 default-FP-rounding hazard does not reach resqlite output (REAL values never go through sqlite3_column_text); the vendoring bump waits on a .2 point release per exp 090's policy.","conditions":"2026-06 · backfilled 2026-07","state":"live"},{"id":"147.1","source":"147","directions":["stream-rerun-dispatch","measurement-system"],"text":"SQLite-facing write calls are a minority of writer-side burst wall on active stream workloads (A11c 9.4%, keyed-PK 18.1%); residual writer/request wall is the largest bucket after subtracting SQLite and invalidation.","conditions":"M1 Pro · profile · 2026-06 · backfilled 2026-07","state":"live"},{"id":"169.1","source":"169","directions":["measurement-system"],"text":"The Tracelite workload-summary explanation layer emits the interpretation exp 143 had to recover manually, and validates stable insight IDs so a thin artifact fails loudly instead of looking complete.","conditions":"tooling · 2026-06 · backfilled 2026-07","state":"live"},{"id":"171.1","source":"171","directions":["stream-rerun-dispatch"],"text":"The `await _runtime` microtask hop at the `Database` layer above exp 159's `Writer._request` cache is real — estimated at ~1-2 us per call, from which a theoretical upper bound of ~6-12% on a 2,000-call sequential write burst was derived — but it sits at or below the focused harness's noise floor: two order-flipped passes on `writer_pipelining.dart` produced alternating-sign deltas inside per-round variance (sequential-awaited -2.3% / +2.5%, transaction-guardrail -7.5% / +6.1%, concurrent-burst +4-5% in both passes). No runtime code was kept, and exp 159's framing stands: the sequential-write residual is the round-trip floor itself, so the next reduction has to be group-commit-shaped or transport-shaped rather than hop-shaped.","conditions":"arm64 macOS · JIT `dart run` · `benchmark/experiments/writer_pipelining.dart`, 2 order-flipped passes · write path only, no read lane measured · 2026-06 · minted retroactively by exp 278 from this entry's own changedBeliefs","state":"superseded","by":["278.1"]},{"id":"172.1","source":"172","directions":["long-text-stream-hashing","measurement-system"],"text":"The 8-byte FNV fold scales acceptably to mixed 32KB TEXT+BLOB long payloads (3.446 ms median beside 2.356 ms for 4KB TEXT), and the streaming suite now covers that shape.","conditions":"M1 Pro · 2026-06 · backfilled 2026-07","state":"live"},{"id":"173.1","source":"173","directions":["long-text-stream-hashing"],"text":"At 32KB cells on a pool-of-4 fleet the byte-stream fold is no longer the dominant wall component; unrolling beyond the 8-byte FNV body is below noise. Hash-loop unrolling on this shape is closed.","conditions":"M1 Pro · pool-4 · 2026-06 · backfilled 2026-07","state":"live"},{"id":"174.1","source":"174","directions":["result-transfer-shape"],"text":"selectBytes sends a Uint8List view over the reader's native json_buf and never sacrifices; the single send copy is the floor for this path.","conditions":"M1 Pro · AOT · 2026-03","state":"live"},{"id":"177.1","source":"177","directions":["measurement-system"],"text":"Phase-ordered A/B gates confound code deltas with time-correlated drift; cvPct + classifyDriftFlag encode the CV-asymmetry and order-flip sign-reversal signatures so every A/B no longer re-derives them by hand.","conditions":"methodology · 2026-06 · backfilled 2026-07","state":"live"},{"id":"178.1","source":"178","directions":["measurement-system"],"text":"A chartable experiment with no linked benchmark run and no Benchmark Run opt-out silently drops off the chart; the linker now errors, closing the gap that left ~18 experiments unmapped.","conditions":"tooling · 2026-06 · backfilled 2026-07","state":"live"},{"id":"181.1","source":"181","directions":["long-text-stream-hashing"],"text":"Removing reader-pool parallelism (one-reader runtime, 64x64KB payloads) still shows no 16-byte FNV win over the 8-byte fold; the single-stream candidate from exp 173 is consumed.","conditions":"M1 Pro · single reader · 2026-06 · backfilled 2026-07","state":"live"},{"id":"183.1","source":"183","directions":["result-transfer-shape"],"text":"selectBytes' bounded RSS high-water becomes pathological under concurrent large bursts (8 x 8MB pins 32MB for the connection's life); the 1MB-cap + 256KB last-len reclaim makes the policy safe, and readerJsonBufHighWaterBytes makes it observable.","conditions":"M1 Pro · 2026-06 · backfilled 2026-07","state":"live"},{"id":"186.1","source":"186","directions":["parameter-encoding-and-binding"],"text":"The single-row direct-ASCII allocateParams rewrite is materially beneficial once bound text crosses mid-tens-of-KB (-15% at 16KB to -32% at larger sizes); encoder isolation separates the mechanism question from workload materiality.","conditions":"M1 Pro · 2026-06 · backfilled 2026-07","state":"live"},{"id":"187.1","source":"187","directions":["parameter-encoding-and-binding"],"text":"Direct UTF-8 packing for single-row non-ASCII params removes one temp allocation plus one copy per string; CJK rows improve ~31-39% from 16KB through 1MB.","conditions":"M1 Pro · 2026-06 · backfilled 2026-07","state":"live"},{"id":"189.1","source":"189","directions":["transaction-control-paths"],"text":"Savepoint naming compression moves best-case control rows but the representative nested-write fanout does not reproduce across the order flip — rejected on the load-bearing row.","conditions":"M1 Pro · 2026-06 · backfilled 2026-07","state":"live"},{"id":"212.1","source":"212","directions":["transaction-control-paths"],"text":"Lazy nested-savepoint materialization only helps empty nested bodies; fusing SAVEPOINT + first execute regresses the meaningful nested-write shape in both pass orders.","conditions":"M1 Pro · 2026-07 · backfilled 2026-07","state":"live"},{"id":"213.1","source":"213","directions":["transaction-control-paths"],"text":"The per-execute round-trip floor inside db.transaction() is mechanically removable for Future.wait bursts, but the pattern has no idiomatic case in the public API — bulk atomic writes belong on executeBatch. Rejected on pattern, not numbers.","conditions":"M1 Pro · 2026-07 · backfilled 2026-07","state":"live"},{"id":"229.1","source":"229","directions":["result-transfer-shape"],"text":"native/resqlite.c is no longer ISA-agnostic-scalar-only: a NEON vqtbl4q_u8 base64 kernel (~2x on 4KB payloads) ships behind an __aarch64__ gate with the scalar 12-bit-LUT encoder as fallback. Keep SIMD kernels noinline so the small-input scalar path's code gen is untouched.","conditions":"M1 Pro · AOT · 2026-07 · backfilled 2026-07","state":"live"},{"id":"234.1","source":"234","directions":["parameter-encoding-and-binding"],"text":"A mutable Uint8List param is the one write value SendPort.send truly copies; wrapping params >= 256 KB in TransferableTypedData lands that one copy in external memory instead of on the GC heap (~15-20% on 256-512 KB single-row inserts).","conditions":"M1 Pro · AOT · 2026-07","state":"live"},{"id":"235.1","source":"235","directions":["result-transfer-shape"],"text":"json_write_string's SWAR escape scan re-enters the 8-byte fast skip after each dirty chunk instead of abandoning it on the first escapable byte, so a sparse escape downgrades only the chunk containing it rather than the whole tail. Realistic multi-line TEXT encodes 23% faster (256B, newline every ~80B) and the one-early-escape extreme 45%; the escape-free path is byte-identical and measures parity. Cost is +6.0% on pathological dense-escape 256B (~1/3 escapable bytes), one extra SWAR probe per all-dirty chunk.","conditions":"Apple Silicon · AOT · focused order-flipped A/B (5 BASE / 4 CAND medians) · 2026-07","state":"live"},{"id":"235.2","source":"235","directions":["result-transfer-shape"],"text":"A fast-scan's abandon-on-first-miss structure is invisible to all-safe and all-dirty test shapes and only costs on the sparse-miss middle, which is the common real distribution. The pre-235 harness held dense-escape and late-escape lanes and neither exercised it; the regression pocket appeared only once sparse-newline and sparse-early lanes existed.","conditions":"harness-design finding · generalises beyond the TEXT escaper","state":"live"},{"id":"236.1","source":"236","directions":["result-transfer-shape"],"text":"Blob result cells >= 256 KB decode straight into TransferableTypedData (native->external, one copy) and cross by ownership move; main-isolate receive boundaries materialize them back to Uint8List views. Blob-heavy reads 3-6x faster; tx.select ~6-7x.","conditions":"M1 Pro · AOT · 2026-07","state":"live"},{"id":"236.2","source":"236","directions":["result-transfer-shape"],"text":"The sacrifice decision weighs estimatedBytes - transferableBytes so TTD-wrapped cells do not force a sacrifice.","conditions":"byte-trigger era · M1 Pro · 2026-07","state":"superseded","by":["246.1"]},{"id":"237.1","source":"237","directions":["parameter-encoding-and-binding"],"text":"Exp 234's blob-transfer win does not extend to executeBatch: wrapping per-set blobs is a reproduced regression. The mechanism is many independent write round-trips parking fresh blobs on the young heap — one batch round-trip does not have it.","conditions":"M1 Pro · AOT · 2026-07 · backfilled 2026-07","state":"live"},{"id":"239.1","source":"239","directions":["stream-rerun-dispatch"],"text":"Batching only already-parked plain selects in pool-sharded envelopes (capped at four) improves 20 point reads ~-26/-33% without a new public API; sharding avoids exp 209's one-worker large-read collapse. Rejected as shipped complexity, preserved as potential.","conditions":"M1 Pro · 2026-07 · backfilled 2026-07","state":"live"},{"id":"241.1","source":"241","directions":["result-transfer-shape"],"text":"Sacrifice is a state-changing treatment (kills a worker, respawns, clears caches): it cannot be A/B'd in place inside one live pool. Send-vs-exit decomposes into distinct estimands — intrinsic transfer, pool capacity, decode — that must be measured separately.","conditions":"methodology · 2026-07","state":"live"},{"id":"242.1","source":"242","directions":["result-transfer-shape"],"text":"A TransferableTypedData wrap helps iff the payload's default SendPort destination is the GC heap; a native-backed view gains nothing — the wrap relocates the one copy and adds machinery.","conditions":"M1 Pro · AOT · 2026-07","edges":[{"type":"validates","target":"174.1"}],"state":"live"},{"id":"243.1","source":"243","directions":["parameter-encoding-and-binding"],"text":"Blob-param wrapping is identity-keyed (one wrapper per unique buffer, referenced at every position, materialized once per envelope), so caller aliasing survives the hop instead of exploding into N external copies (~27x at N=32 under per-occurrence wrapping).","conditions":"M1 Pro · AOT · 2026-07","edges":[{"type":"refines","target":"234.1"}],"state":"live"},{"id":"244.1","source":"244","directions":["result-transfer-shape"],"text":"Sacrifice opens no pool-capacity hole at the production pool size: the no-sacrifice lane had the highest parked queue-wait (~+19%), because send's copy blocks the worker longer than Isolate.exit plus an overlapped respawn. Eager respawn measured inert.","conditions":"M1 Pro · pool-4 · barrier burst · 2026-07","edges":[{"type":"refines","target":"241.1"}],"state":"live"},{"id":"245.1","source":"245","directions":["result-transfer-shape"],"text":"SendPort.send's cost tracks the mutable flat-list slot count, not payload bytes: strings and numbers are shared by reference (a 400 KB string adds ~0 us), while the values array is copied per slot.","conditions":"M1 Pro · AOT · process-isolated barrier · 2026-07","edges":[{"type":"refines","target":"241.1"}],"state":"live"},{"id":"245.2","source":"245","directions":["result-transfer-shape"],"text":"Isolate.exit is zero-copy with a ~47 us fixed premium; its sendability walk also scales with slots, just more gently than send's copy. Intrinsic crossover ~48k slots.","conditions":"M1 Pro · AOT · process-isolated barrier · 2026-07","state":"live"},{"id":"246.1","source":"246","directions":["result-transfer-shape"],"text":"The sacrifice trigger routes on mutable slot count (values.length > 32k, the all-integer equivalent of 256 KB); the byte accounting is deleted. Bytes for mutable payloads, slots for structure. Big-TEXT misroute fixed: 131->91 us, 1.00->0.00 sacrifices/select.","conditions":"M1 Pro · AOT · 2026-07","edges":[{"type":"supersedes","target":"236.2"},{"type":"dependsOn","target":"245.1"}],"state":"live","restsOn":["245.1"]},{"id":"250.1","source":"250","directions":["stream-rerun-dispatch"],"text":"Exp 233's checkpoint storm was a trigger-policy failure, not inherent to off-writer PASSIVE work: observed-reset/high-water re-arming fixes the storm and first threshold-crossing p50 improves ~53-64%. Rejected for now, mechanism preserved.","conditions":"M1 Pro · 2026-07 · backfilled 2026-07","state":"live"},{"id":"251.1","source":"251","directions":["result-transfer-shape","measurement-system"],"text":"Across five AOT process runs, a direct-handle step-only reference found no universal dominant worker-path bucket: estimated decode/result construction was 49%, 63%, 40%, and 51% of full query/decode wall for 10k x 20 INTEGER, 10k mixed, 5k x 4 INTEGER, and 5k TEXT shapes. The full worker-path proxy was typically 91%, 92%, 84%, and 94% of separately measured main-observed Database.select() latency.","conditions":"Apple M-series · arm64 macOS · Dart 3.12.2 · AOT CLI native-asset bundle · five fresh processes · 2026-08","edges":[{"type":"refines","target":"258.1"}],"state":"live"},{"id":"251.2","source":"251","directions":["result-transfer-shape","measurement-system"],"text":"The post-transfer large-read residual is shape-dependent rather than a single Dart-decode bottleneck, so it does not justify a broad ResultSet storage rewrite; a future candidate must first establish a workload-specific eligible phase against public select() wall.","conditions":"INTEGER, mixed INTEGER/TEXT, and long-TEXT result shapes · AOT · 2026-08","edges":[{"type":"dependsOn","target":"251.1"},{"type":"validates","target":"258.2"}],"state":"live","restsOn":["251.1"]},{"id":"255.1","source":"255","directions":["stream-rerun-dispatch"],"text":"A stream always resolves to an emission or an error, never silence. When a write dirties an entry mid-initial-query the comparison baseline is poisoned so the catch-up re-query is guaranteed to emit, and that emission is the stream's first. Suppressing the initial emission while leaving the baseline set to the rows it replaced is what stranded streams permanently silent.","conditions":"M1 Pro · deterministic regression test (40k-row seed) · 2026-07","edges":[{"type":"refines","target":"256.1"}],"state":"live"},{"id":"255.2","source":"255","directions":["stream-rerun-dispatch"],"text":"An intermittent test failure reproducing at ~1-in-3 is a bug, not a flake. This one was dismissed three times in one session, partly because the test's own comment asserted the shape could not flake — a false confidence marker actively redirects investigation, and reading the actual failure text ('emitted x Stream closed') would have identified the mechanism immediately.","conditions":"methodology · 2026-07","state":"live"},{"id":"255.3","source":"255","directions":["stream-rerun-dispatch"],"text":"Clearing a stream's comparison baseline must clear the row count, not the hash: selectIfChanged requires both to match, and an empty result legitimately hashes to 0, so a hash sentinel of 0 is reachable rather than impossible and would leave empty-result streams silent. The row count is nullable end to end, with null meaning 'no baseline' — which also retired a pre-existing magic -1 in the request type.","conditions":"review finding · guarded by the empty-result regression test · 2026-07","state":"live"},{"id":"256.1","source":"256","directions":["stream-rerun-dispatch"],"text":"A stream never emits rows it already knows a write superseded: when the initial query is dirtied mid-flight the comparison baseline is poisoned and only the corrected result is emitted. This costs ~0.4-1.4 ms of time-to-correct-value and removes the stale frame that emit-then-correct rendered on every raced stream; unraced streams are unaffected.","conditions":"M1 Pro · 1k/20k/60k seed race windows · 12 samples/shape · 2026-07","state":"live"},{"id":"257.1","source":"257","directions":["stream-rerun-dispatch"],"text":"A one-call native interpreter that preserves independent autocommits does not clear the writer-burst bar: homogeneous inserts improved 17.7% then only 3.6% across the order flip, while integer-only no-op updates regressed 17.7% and 13.9%.","conditions":"M1 Pro · Dart 3.12.2 · 256-call bursts · 5120 autocommits/round · 2026-07","state":"live"},{"id":"258.1","source":"258","directions":["result-transfer-shape"],"text":"Storing numeric result columns as typed arrays (Int64List/Float64List) instead of boxing into a flat List<Object?> makes worker-side result build 60-90% faster (largest on REAL: doubles always box, ~10x on 10k x 20 REAL). This win is worker wall, off the main isolate.","conditions":"M-series · AOT · worker->main SendPort A/B · two order-flipped passes · 2026-07","state":"live"},{"id":"258.2","source":"258","directions":["result-transfer-shape"],"text":"A columnar container's transfer win (73-91% cheaper hop vs the boxed flat list) does not move production's main-isolate metric: results large enough for transfer to matter (>32768 structural slots) already zero-copy via Isolate.exit, and sub-threshold results save only tens of microseconds, below the select() round-trip floor. The broad columnar rewrite is therefore rejected.","conditions":"M-series · AOT · worker->main SendPort A/B · 2026-07","edges":[{"type":"refines","target":"245.1"}],"state":"live"},{"id":"258.3","source":"258","directions":["result-transfer-shape"],"text":"The one real primary-metric signal from columnar storage is main-isolate integer consume ~2x faster (Int64List sequential access, no covariant-load barrier, vs pointer-chasing a List<Object?> of Smis), reproduced -48 to -52% on every integer lane in both orders. REAL consume is only neutral (box-on-access nearly cancels the locality gain) and columnar never regresses consume, refuting exp 081's box-on-access fear for the columnar (not binary-slab) shape.","conditions":"M-series · AOT · main-isolate full-scan as Object? · 2026-07","state":"live"},{"id":"259.1","source":"259","directions":["result-transfer-shape"],"text":"Classifying a TEXT cell as pure ASCII in resqlite_step_row (branch-free SWAR, memcpy-based unaligned loads) instead of in fastDecodeText removes one ExternalTypedData allocation and one bounds-checked Dart scan per cell, worth a reproduced -12.3% / -10.4% on 10k x 8 short-ASCII select(), -14.3% / -10.7% at 40 B, -22.2% / -19.4% at 400 B, and -24.4% / -19.2% on the repo's canonical 6-column mixed row (id INTEGER + 4 TEXT + REAL, from benchmark/shared/seeder.dart). The mixed lane's p50 is its signal; its p90 is noisy across passes and is not a tail regression.","conditions":"M1 Pro · AOT CLI bundle · cross-worktree A/B · two order-flipped passes · 31 samples/lane · 2026-08","state":"live"},{"id":"259.2","source":"259","directions":["result-transfer-shape"],"text":"The isolated per-cell mechanism is 6-15 ns, or 12-49% of fastDecodeText's wall depending on payload width (6-14 B: -12% / -34%; 20-40 B: -36% / -39%; 200 B: -49% / -48%). At 80k TEXT cells per lane that is 0.5-1.2 ms, matching the end-to-end deltas in order of magnitude.","conditions":"M1 Pro · AOT microbenchmark over malloc'd 8-aligned ASCII payloads · 2026-08","state":"live"},{"id":"259.3","source":"259","directions":["result-transfer-shape"],"text":"An accumulate-then-test SWAR scan that always walks the whole value is not a regression for non-ASCII TEXT. Ordinary CJK text measured -2.4% / -1.7%, and the shape built to expose the trade — a 400 B value with its one multibyte character at byte 0, so the native scan walks the whole payload to learn what the old Dart scan settled in its first word — measured +1.1% / -1.0%. That lane runs ~4.9 ms against ~0.7 ms for the same payload in ASCII: utf8.decode over the value dwarfs a SWAR pass over it, so the 'wasted' scan is an order of magnitude cheaper than the decode it precedes.","conditions":"M1 Pro · AOT · 10k x 8 CJK TEXT (~36 B/cell) and 2k x 4 400 B early-nonascii · two order-flipped passes · 2026-08","state":"live"},{"id":"259.4","source":"259","directions":["result-transfer-shape"],"text":"A cross-worktree focused A/B carrying a lane whose code is byte-identical in both arms reads the per-binary layout offset directly. Exp 259's INTEGER-only control moved +0.2% / -2.9% — opposite signs, inside the 3% effect floor — which is what licenses trusting the text lanes without falling back to exp 254's single-binary runtime toggle.","conditions":"methodology · 2026-08","state":"live"},{"id":"260.1","source":"260","directions":["result-transfer-shape"],"text":"Sizing `decodeQuery`'s result buffer from a main-isolate memory of what the same SQL returned before — applied at the first growth, never to the initial allocation — is worth a reproduced -25.1% / -24.8% on 10k x 20 INTEGER, -32.2% / -33.7% on 5k x 4 INTEGER, and -33.6% / -32.3% on the repo's canonical 6-column product row at 10k rows (3.5 ms -> 2.3 ms), measured end to end through the public `select()`. Both controls (200-row and point reads, which never reach the growth path) move opposite signs inside the 3% floor, and both mispredict guards are neutral.","conditions":"M1 Pro · AOT CLI bundle · cross-worktree A/B · two order-flipped passes · 31 samples/lane · 2026-08","edges":[{"type":"refutes","target":"059.1"},{"type":"dependsOn","target":"067.1"}],"state":"live","restsOn":["067.1"]},{"id":"260.2","source":"260","directions":["result-transfer-shape"],"text":"Buffer growth, not cell decoding, is most of the Dart-side cost of a large read. Reproducing the decode loop over a fixed cell buffer at 10k x 20 INTEGER: doubling from the 256-row initial allocation 2318 us, pre-sized 865 us, loads + switch with no list store 331 us, and `List.filled(200000, null)` alone 405 us. Exp 251's 2524 us for the same shape's `Dart result construction` is therefore a growth measurement more than a decode one.","conditions":"M1 Pro · AOT standalone microbenchmark · 40 reps · 2026-08","edges":[{"type":"refines","target":"251.1"}],"state":"live"},{"id":"260.3","source":"260","directions":["result-transfer-shape"],"text":"A worker-local cache cannot hold anything learned from a large result. `Isolate.exit` on a result over `sacrificeSlotThreshold` ends the worker, so a size hint kept in the per-worker schema cache won 30-35% on sub-threshold reads and ~1% on the 200k-slot lane; the same hint carried on the request from the main isolate won -25% there.","conditions":"M1 Pro · AOT · focused A/B, both hint placements against one baseline · 2026-08","state":"live"},{"id":"260.4","source":"260","directions":["result-transfer-shape"],"text":"Pre-sizing from a converged row hint lowers total bytes allocated per query by 14-61% (the doubling sequence's intermediate arrays stop existing) but does NOT uniformly lower peak buffer capacity. Doubling's overshoot is 1x-2x depending on where the result falls relative to a power-of-two boundary; a converged hint's is always 1.25x. Peak capacity is 23.7% smaller for a result that overshoots a boundary (all three primary lanes) and 22-25% LARGER for one that lands just under it (mixed6-1k, and 2048 rows x 6 columns). Arithmetic on the allocation path only — no RSS or heap sampling was taken, so a workload sensitive to peak rather than churn needs its own measurement.","conditions":"derived from the growth path, not measured · 2026-08","state":"superseded","by":["261.2"]},{"id":"261.1","source":"261","directions":["measurement-system","result-transfer-shape"],"text":"A focused-harness memory guard must gate on `ProcessInfo.maxRss` with one process per lane, not on a sampled `currentRss` peak. The two disagreed by 76 percentage points about the same change (sampled peak +75%, `maxRss` -1.7%) on a lane whose results cross `sacrificeSlotThreshold`, because sacrificed isolates return pages and make `currentRss` a retention signal rather than a high-water. Repeatability across five isolated runs per arm is <=0.6 MB, mechanically inert lanes read identical across arms, and sampling moves wall time 1.3-2.4%, inside the 3% floor.","conditions":"M1 Pro · AOT CLI bundle · one process per lane · 2026-08","state":"live"},{"id":"261.2","source":"261","directions":["measurement-system","result-transfer-shape"],"text":"Exp 260 lowers peak RSS rather than raising it: `maxRss` falls -2.1% on 10k x 20 INTEGER, -11.5% on the canonical 6-column product row at 10k rows, and -28.0% on 5k x 4 INTEGER, with the point-read control flat at -0.3%. This supersedes the arithmetic in claim 260.4, which predicted peak capacity could rise 22-25% for results landing just under a doubling
