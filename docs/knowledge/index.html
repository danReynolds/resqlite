lt-transfer-shape"],"outcomeClass":"rejected"},{"id":"219","title":"Direct JSON control-character escapes","file":"219-json-control-escape.md","date":"2026-07-07","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted"},{"id":"220","title":"Reject `fast_i64_to_str` 0..9999 direct-write fast path","file":"220-fast-i64-small-direct.md","date":"2026-07-08","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected"},{"id":"222","title":"Reject `malloc` for large one-shot parameter arenas","file":"222-param-arena-malloc.md","date":"2026-07-11","status":"rejected","directions":["parameter-encoding-and-binding"],"outcomeClass":"rejected"},{"id":"223","title":"Reject row-0 peel + `[{` fuse in `write_json_to_buf`","file":"223-write-json-row-peel.md","date":"2026-07-11","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected"},{"id":"224","title":"Dynamic numeric-row batching moonshot","file":"224-numeric-row-batching-moonshot.md","date":"2026-07-12","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected"},{"id":"225","title":"12-bit LUT for `json_write_base64`","file":"225-base64-lut12.md","date":"2026-07-12","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted"},{"id":"226","title":"Reject one-pass numeric batch packing","file":"226-one-pass-numeric-batch.md","date":"2026-07-13","status":"rejected","directions":["parameter-encoding-and-binding"],"outcomeClass":"rejected"},{"id":"227","title":"Inline 16-byte over-copy for JSON column-name tokens","file":"227-json-token-overcopy.md","date":"2026-07-13","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted"},{"id":"228","title":"Restore canonical hashes after stream growth","file":"228-canonical-stream-hash.md","date":"2026-07-14","status":"accepted","directions":["stream-rerun-dispatch"],"outcomeClass":"accepted"},{"id":"229","title":"SIMD (NEON) `json_write_base64` kernel — first SIMD kernel in the codebase","file":"229-simd-base64-neon.md","date":"2026-07-14","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted","impact":"Moonshot: introduces ISA-specific SIMD (`vld3q_u8` + `vqtbl4q_u8` + `vst4q_u8`) to `json_write_base64`, gated on `__aarch64__ && __ARM_NEON`, with the exp 225 scalar 12-bit-LUT encoder retained as fallback for non-ARM64 targets and for the < 48-byte tail. Four order-flipped paired passes of `select_bytes_blob_base64.dart` reproduce ~-45% median on the 4 KB payload-throughput lane (roughly 2x faster BLOB base64 encoding) and ~-18% on the 128 B lane; tiny-cell (3 B) and mixed guards stay inside the harness noise floor. Categorical implication: SIMD kernels are viable in resqlite when out-of-lined so the small-input path is unaffected, unlocking follow-ups in SSSE3 x86_64, SIMD JSON escape scan, and SIMD FNV hash.","class":"moonshot","changed":["The codebase-wide assumption that `native/resqlite.c` must be ISA-agnostic scalar C is no longer load-bearing. Exp 229 introduces the first SIMD kernel (`json_write_base64_neon_bulk`) gated on `defined(__aarch64__) && defined(__ARM_NEON)`, with the exp 225 scalar 12-bit-LUT encoder retained as fallback for non-ARM64 targets and for the < 48-byte tail on all targets.","A NEON `vld3q_u8` + `vqtbl4q_u8` base64 kernel materially moves BLOB encoding wall time past exp 225's scalar+LUT12 ceiling. Four order-flipped paired passes on `select_bytes_blob_base64.dart` reproduce ~-45% median (~2x) on the 4 KB payload-throughput lane and ~-18% median on the 128 B lane. Signals' 2026-05 note that 'future BLOB work needs a further mechanism change: SIMD `_mm_shuffle_epi8` / `vqtbl4q_u8` base64 kernels' is now consumed.","SIMD kernel placement in the same translation unit as scalar hot paths must be `noinline`, or the compiler's register allocation for the small-input path degrades. The first prototype (rounds 1-2, superseded) reproduced the 4 KB / 128 B wins but broke the 3 B tiny-cell guard at +3-9% reproduced regression because inline placement of the NEON body was affecting scalar code-gen; the `noinline` refactor collapsed the 3 B regression back into noise. This is a repeatable pattern for future SIMD kernels."],"next":["Keep `benchmark/experiments/select_bytes_blob_base64.dart` as the durable gate for future BLOB JSON encoder work. The 4 KB and 128 B lanes are the decision rows; the 3 B lanes are guards that stay on the scalar path (< 48 bytes never enters the NEON kernel).","SIMD kernels are now a viable mechanism for future work: SSSE3 (`_mm_shuffle_epi8`) base64 on x86_64 has the same shape and is the natural follow-up to widen platform coverage; SIMD JSON escape scan for `json_write_string`'s SWAR body is the signals-named TEXT-side mechanism now unlocked; a SIMD FNV hash body for `resqlite_query_hash` may help long-text stream hashing if a workload isolates it (exp 173 / 181 have the baselines).","New SIMD kernel authoring rule: place the SIMD body in its own `__attribute__((noinline))` function so the scalar hot path in the caller stays byte-identical to the pre-SIMD layout. Dispatch via a single length check in the caller (`if (len >= K) return simd_bulk(...)`); do not inline the SIMD body into the caller even under compiler pressure to do so.","Non-ARM64 targets (x86_64, 32-bit ARM, Windows) still hit the scalar 12-bit-LUT path exp 225 established. Wall time on those targets is unchanged; no non-ARM regression is possible.","Do not retry wider scalar unroll bodies (exp 218) or wider scalar LUTs (a 24-bit table is 16 MiB — signals note). The remaining scalar headroom is closed; further BLOB encoder wins require SIMD or a workload/profile that shifts what dominates."]},{"id":"230","title":"Reject AArch64 NEON JSON safe-prefix scan + copy","file":"230-neon-json-scan-copy.md","date":"2026-07-15","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected"},{"id":"231","title":"Reject AArch64 NEON integer→decimal kernel","file":"231-neon-i64-decimal.md","date":"2026-07-15","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected"},{"id":"232","title":"Reject exact quarter-step REAL JSON fast path","file":"232-dyadic-real-fastpath.md","date":"2026-07-16","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected"},{"id":"233","title":"Reject asynchronous WAL checkpoint worker","file":"233-async-checkpoint-worker.md","date":"2026-07-17","status":"rejected","directions":["stream-rerun-dispatch"],"outcomeClass":"rejected"},{"id":"234","title":"Zero-copy blob parameter transfer via TransferableTypedData","file":"234-blob-param-transfer.md","date":"2026-07-18","status":"accepted","amendedBy":["243"],"directions":["parameter-encoding-and-binding"],"outcomeClass":"accepted","impact":"A large `Uint8List` blob write param crosses the main->writer isolate hop via `SendPort.send`'s object-graph copy, which lands the payload on the shared GC heap. Exp 234 wraps blob params `>= 256 KB` in `TransferableTypedData` — one plain memcpy into malloc'd external memory, then a constant-time ownership move and a zero-copy `materialize()` view on the writer; smaller blobs and non-blob params take the unchanged direct path (the fast path returns the input list with no allocation). Answers the direction's open question — for **256 KB-512 KB single-row blob INSERTs the hop cost is a material fraction of the write, and the wrapped route is a reproduced ~15-20% end-to-end speedup** (256 KB -16.4% / -22.7%, 512 KB -10.4% / -11.8% across order-flipped passes; every 256/512 KB leg candidate-faster across ~7 passes while sub-threshold 64/128 KB controls flip sign as noise). Mechanism attribution (per-call table + per-lane `--verbose_gc` on the real path) shows both routes copy the payload exactly once on main — the win is the copy's *destination*: direct sends make every in-flight blob live GC-heap data (29 GCs / 8.6 ms pause vs 20 GCs / 1.2 ms per 300 x 256 KB inserts), and each collection safepoints the isolate group including the writer mid-step. The 256 KB floor is measured: transport is +22.7% *slower* at 64 KB (wrap bookkeeping vs the graph copy's near-free fast path) and neutral at >= 1 MB (WAL write dominates; huge payloads skip new space). Sharpens exp 005 rather than contradicting it: a raw blob has no structure to encode, so only destination and machinery costs remain. Internal knob (not public API); adds a large-blob round-trip correctness test.","changed":["The `parameter-encoding-and-binding` open question — whether any blob-heavy parameter shape is dominated by encoding rather than SQLite stepping — is answered for the single-row blob write path. A `Uint8List` blob param is copied three times before it reaches a database page: (1) main->writer via the VM object-graph copy inside `SendPort.send` (`runtime/vm/object_graph_copy.cc` — one copy, on the sender, landing on the shared GC heap; there is NO receive-side rebuild since Dart 2.15 isolate groups), (2) writer->native param arena in `allocateParams`, (3) arena->SQLite page in `sqlite3_step`. Copies (2) and (3) are irreducible; copy (1)'s cost is not the copy itself but its destination.","Wrapping large blob params in `TransferableTypedData` is a reproduced ~15-20% end-to-end win on 256 KB-512 KB single-row blob INSERTs (256 KB -16.4%/-22.7%, 512 KB -10.4%/-11.8% across order-flipped passes; every 256/512 KB leg candidate-faster across ~7 passes, sub-threshold controls flip sign as noise). Mechanism, each part measured separately in `blob_param_mechanism_proof.dart` / `blob_param_gc_split.dart`: BOTH routes copy the payload exactly once on the main isolate (send()'s synchronous wall scales linearly with size; fromList is one linear memcpy; materialize() is ~1 us flat = a view). The win is the copy's destination — direct sends park every in-flight blob on the shared GC heap where scavenges must evacuate it (29 GCs / 8.6 ms pause vs 20 GCs / 1.2 ms per 300 x 256 KB inserts on the real path) and every collection safepoints the whole isolate group including the writer mid-step; the wrapped buffer is malloc'd external memory the GC never traces. `fromList` does NOT neuter its source, so the public caller-keeps-its-blob contract holds.","The win is size-bounded and the bounds are mechanistic, not incidental. Below ~256 KB the direct graph copy takes its fast path (new-space alloc + one unchunked memmove, ~15% over a plain copy) while the wrap still pays malloc/finalizer/materialize bookkeeping — measured +23% at 64 KB transport. At >= 1 MB two things converge: SQLite's WAL write dominates the insert, and very large payloads allocate straight to old space, skipping the new-space churn that drives the mid-size win — so end-to-end goes neutral (never negative; the wrap still trims main-isolate blocking, hence a threshold floor with no ceiling). Large direct sends additionally abort onto `CopyTypedDataBaseWithSafepointChecks` (100 KB safepoint-polled chunks, ~2x a plain memcpy at >= 1 MB), a deliberate VM trade of copy throughput for isolate-group responsiveness. Exp 005's contrast is sharpened, not inverted: its Dart codec lost because encoding *structure* is slower than the VM's native walk; a raw blob has no structure, leaving only destination and machinery costs, which the wrap avoids."],"next":["The batch (`BatchRequest`) path still routes blob params through the graph copy — exp 234 covers single-row `ExecuteRequest`/`QueryRequest` and (post-review) the coalesced `MultiExecuteRequest` standalone-write pump. Open candidate: a blob-heavy `executeBatch` workload (e.g. N rows each carrying a >=256 KB blob) to test whether wrapping per-set blobs reproduces the same transfer fraction. Blocked on nothing but a bounded pass; the `blob_param_write_ab.dart` harness generalizes to batch.","The 256 KB threshold is a measured floor on an Apple M1 Pro / macOS box; the crossover between wrap-overhead and graph-copy-plus-GC cost is machine- and heap-configuration-dependent. A production profile showing a different blob-size distribution (many 64-256 KB blobs, or predominantly multi-MB) would justify re-tuning `blobParamTransferThreshold` or gating it per-arch.","The main->writer hop is now GC-invisible for large blobs, but the writer->arena copy (2) and arena->page copy (3) remain. Neither is reducible through the current Dart FFI surface (the arena must own stable native bytes for SQLITE_STATIC across the bind+step, and SQLite owns its pages), so future blob-param work should target transfer/scheduling, not copy elimination, unless a zero-copy Dart->native pin primitive ships. The Dart shared-memory multithreading proposal (dart-lang/language #333) would dissolve the isolate-hop copy entirely; it is the same watch-condition already tracked for `result-transfer-shape`."]},{"id":"235","title":"Resume SWAR escape scan after each dirty chunk in `json_write_string`","file":"235-json-escape-swar-resume.md","date":"2026-07-21","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted","impact":"Restructures the `selectBytes` TEXT-cell JSON escaper so its SWAR 8-byte fast-skip resumes after each dirty chunk instead of breaking to byte-by-byte permanently on the first escapable byte. A single early escape in an otherwise-safe value no longer forces the whole tail onto the slow path. Two order-flipped focused rounds reproduce -23.4% on the load-bearing 256B sparse-newline lane (realistic multi-line text), -31% to -44% on sparse-newline/sparse-early 1KiB and 256B lanes, with the escape-free common path provably unchanged (parity). The only cost is +6.0% on pathological dense-escape 256B text (~1/3 escapable bytes) from one extra SWAR probe per all-dirty chunk. Pure portable C — no API, platform, or allocation change; output byte-identical (dart:convert oracle).","changed":["`resqlite_json_write_string`'s SWAR escape scan is no longer all-or-nothing. Before exp 235 the SWAR 8-byte fast-skip broke to the byte-by-byte path on the first escapable byte and never returned, so one escape near the start of a long TEXT value forced the entire tail onto the one-byte-at-a-time loop. Exp 235 re-enters the SWAR skip after each dirty chunk, so a sparse escape only downgrades the single 8-byte chunk that contains it.","Sparse-escape TEXT was a real, previously-invisible headroom pocket in selectBytes. The pre-235 harness had `escaped` (dense, ~1/3 escapable) and `lateEscape` (escape at the very end) lanes; neither exercised the resume inefficiency, so the win did not appear until `sparseNewline` (a newline every ~80 bytes, realistic multi-line text) and `sparseEarly` lanes were added. Load-bearing 256B sparse-newline reproduced -23.4% across the order flip; sparse-early lanes reproduced -44%.","The escape-free common path is unchanged. Keeping baseline's tight inner `while (i + 8 <= len)` SWAR loop (one bounds check per clean chunk) means pure-safe long ASCII stays byte-identical and measures as parity; two earlier candidate structures (retry-SWAR-per-safe-byte, and a single outer `while (i < len)` with a doubled bounds check) both regressed the safe/dense-24B guards +7-9% before this structure collapsed them to noise.","The resume fix carries a bounded, pathological-only cost: dense-escape 256B text (~1/3 escapable bytes) is +6.0% from one extra SWAR probe per all-dirty chunk. That distribution is not natural text and is not in the release suite."],"next":["`benchmark/experiments/select_bytes_text_string_reserve.dart` now carries `sparseNewline` and `sparseEarly` modes at 256B and 1KiB; these are the durable gate for any future TEXT-escape-scan work. The 256B sparse-newline lane is the load-bearing decision row; dense-escape and pure-safe lanes are guards.","The signals-named SIMD JSON escape scan (exp 229 nextSignal, for the safe-prefix scan *speed*) is still open and is a distinct mechanism from this resume fix. If it is revisited, it must also resume after escapes (the reason exp 230 was rejected at its 256B cutoff was a safe-prefix-only NEON scan that did not restart), and it must clear the same sparse-newline gate, not just the pure-safe lane.","Do not reopen the dense-escape +6% unless a real workload or profile shows dense-escape TEXT (>= ~1/3 escapable bytes) is a hot path; it is a pathological guard, not a target.","General lesson for future scan/vectorise work on any per-element formatter: a fast-scan that abandons itself on the first miss silently penalises sparse-miss inputs across the whole tail. Prefer resuming the fast path after the miss region when the miss is sparse."]},{"id":"236","title":"Reader blob-cell TransferableTypedData transfer","file":"236-blob-cell-transfer.md","date":"2026-07-21","status":"accepted","amendedBy":["246"],"directions":["result-transfer-shape"],"outcomeClass":"accepted","impact":"Applies exp 234's isolate-hop mechanism to the read side, where the costs were worse: blob cells decoded native->heap, results > 256 KB then sacrificed the reader isolate on every query (Isolate.exit + ~2-5 ms respawn + statement/schema cache loss), and tx.select — which can never sacrifice — paid the full graph copy back to main. Blob cells >= 256 KB now decode straight into TransferableTypedData (one native->malloc'd-external copy, skipping the heap copy; GC never traces the payload), the sacrifice decision weighs only residual non-transferable bytes, and every main-isolate receive boundary materializes cells back to Uint8List views so the public surface is unchanged. Three order-flipped per-process passes: 1x512 KB select **-80% to -83%**, 1x1 MB -70% to -81%, 4x300 KB -67% to -82%, tx.select 1x512 KB **-84% to -87%** (~3-7x), with direct-path, text-sacrifice, and small controls flat once controls run before lifecycle-changing lanes. Threshold is a compile-time define (worker isolates hold their own globals). Also records that selectBytes was already optimal (native-backed view -> malloc'd copy destination).","changed":["The read side paid three distinct costs for large blob cells that exp 234's write-side mechanism analysis predicted and exp 236 removes: (1) decodeQuery copied every blob cell native->heap; (2) results estimated > 256 KB sacrificed the reader isolate per query — Isolate.exit is zero-copy but costs ~2-5 ms respawn plus statement-cache and schema-cache warmth, a per-query tax no benchmark lane priced (a temporary spawn counter measured baseline 270 reader spawns for 270 large-blob reads — exactly 1:1 — vs candidate 0, and interspersing other work still produced 270 spawns because blob reads outrun the ~4-worker pool's respawn capacity); (3) tx.select runs on the writer, which can never sacrifice, so large blob rows paid the full unmitigated graph copy. Decoding blob cells >= 256 KB directly into TransferableTypedData (native->malloc'd-external, one copy, GC-invisible) and weighing sacrifice on residual bytes only makes blob-dominated reads 3-6x faster (512 KB select -80% to -83% across three order-flipped passes) and tx.select ~6-7x faster (-84% to -87%).","selectBytes was already optimal and should not be touched: it sends a native-backed Uint8List view, and the VM's object-graph copy routes external typed data into a fresh malloc'd buffer — the GC-invisible destination. This retroactively explains part of exp 174's ~2x win and closes the 'should selectBytes use TransferableTypedData' question: same copy count, same destination class, wrapper overhead for nothing.","A/B lanes that change worker lifecycle contaminate later lanes: the baseline's per-query sacrifices handed its later (control) lanes freshly-respawned readers, making an identical-code-path 200 KB control read +14-20% candidate-slower until controls were reordered before any wrapped shape (then +2%, noise). Run controls before lifecycle-changing shapes."],"next":["The multi-medium-blob shape — many cells each < 256 KB summing past the sacrifice threshold (e.g. 10 x 100 KB) — still sacrifices. A per-result rule (wrap when total blob bytes dominate, even if no single cell clears the floor) is the next candidate in this lane; the blob_read_transfer_ab.dart harness generalizes.","blobCellTransferThreshold is a compile-time define because worker isolates hold their own copies of file-level globals — a main-isolate runtime toggle cannot reach the decode loop. Any future runtime-tunable read-side knob needs a message-protocol field or spawn argument instead.","The exp 234 follow-up (executeBatch blob params) remains open in parameter-encoding-and-binding; with both hop directions now wrapped, batch params are the last graph-copied large-blob surface."]},{"id":"237","title":"Batch blob parameter transfer via TransferableTypedData","file":"237-batch-blob-param-transfer.md","date":"2026-07-21","status":"rejected","directions":["parameter-encoding-and-binding"],"outcomeClass":"rejected","impact":"Tests whether exp 234's accepted single-row blob-transfer win (wrap `Uint8List` params `>= 256 KB` in `TransferableTypedData` so their main->writer hop lands in malloc'd external memory instead of the GC heap) extends to the batch (`BatchRequest`/`executeBatch`) path, the direction's standing open question. **Rejected — reproduced regression, no size shows a win.** On a blob-heavy `executeBatch` (30 rows/batch, one blob each), the 256 KB lane — the exact size where single-row INSERT won -16% to -23% — is candidate-*slower* on 8/8 order-flipped legs, +7.6% to +18.1% (median ~+9.5%); 512 KB leans slower (7/8) and 1 MB is uniformly slightly slower, WAL-dominated. The mechanism inverts: exp 234's win came from many independent write round-trips whose per-send heap churn stalls the writer *mid-`sqlite3_step`*, a cost that compounds and that moving blobs off-heap removes. `executeBatch` already collapses N writes into ONE writer round-trip inside one transaction, so there is no scavenge-vs-writer-step interleaving to reclaim — leaving only the candidate's 30x `fromList` (malloc + finalizer + external-memory accounting) and 30x `materialize()` wrap tax against a baseline whose single graph-copy of all 30 blobs is a one-time transient the writer never races. Bounds exp 234's claim: the blob-transfer win is specific to per-round-trip churn, not GC-heap blobs in the abstract. Runtime reverted (`BatchRequest` stays on the direct copy); `blob_batch_write_ab.dart` harness kept as the durable gate; prototype preserved at `archive/exp-237`.","changed":["The `parameter-encoding-and-binding` open question — does exp 234's `TransferableTypedData` blob-transfer win extend to the batch (`BatchRequest`/`executeBatch`) path carrying per-set blobs — is answered NO. On a blob-heavy `executeBatch` (30 rows/batch, one blob param each), wrapping each qualifying blob is a reproduced REGRESSION at the sizes where single-row INSERT won: 256 KB is candidate-slower on 8/8 order-flipped legs across four runs (+7.6% to +18.1%, median ~+9.5%), 512 KB leans slower (7/8 legs), and 1 MB is uniformly slightly slower (WAL-dominated). No payload size shows a win. Sub-threshold 64/128 KB same-code-path controls swing +/-100%+ in both directions, which calibrates the noise floor — the wrapped-lane regression reproduces same-direction where the controls' noise does not.","The exp 234 blob-transfer win is NOT 'large blobs on the GC heap are expensive' in the abstract; it is specific to MANY INDEPENDENT WRITE ROUND-TRIPS. The mechanism: across N single-row INSERTs, each `SendPort.send` parks a fresh blob on the young-generation heap, and a scavenge triggered while the writer is mid-`sqlite3_step` on the *previous* blob safepoints the whole isolate group including the writer — a stall that compounds over N round-trips and that moving blobs into GC-invisible malloc'd memory removes. `executeBatch` carries all N parameter sets across ONE `SendPort.send` and runs them in ONE writer round-trip inside one transaction, so there is no interleaving of scavenge-versus-writer-step to reclaim. The very cost exp 234 optimized is absent in the batch path.","With the reclaimable cost gone, wrapping a batch is pure tax: the candidate pays 30x `TransferableTypedData.fromList` (malloc + finalizer + external-memory accounting that itself pressures the GC) plus 30x `materialize()`, against a baseline whose single object-graph copy of all 30 blobs is a one-time transient the writer never races. This bounds exp 234: batching is a form of round-trip coalescing (like exp 180), and coalescing removes exactly the churn the wrap reclaims. Any transport optimization justified by per-round-trip GC/safepoint interaction should be re-checked, not assumed, once the round-trips are collapsed."],"next":["Batch blob transfer is closed under the many-mid-size-blob shape. Reopen only under: (a) a Dart runtime change that makes `TransferableTypedData` wrapping cheap enough that the per-blob tax disappears (then a small batch benefit could surface), or (b) a production workload showing a SINGLE `executeBatch` carrying one or few VERY LARGE blobs, where per-blob wrap cost amortizes over fewer sets and the batch's own WAL cost is large — a materially different shape from the 30x mid-size batch tested here. Do not retry the many-mid-size shape without new runtime evidence.","`benchmark/experiments/blob_batch_write_ab.dart` is the durable gate for any batch-blob-transfer revisit (30 rows/batch, 64 KB-1 MB, runtime-toggled threshold, order-flipped). The runtime prototype (`wrapBlobParamSets`/`unwrapBlobParamSets` + `BatchRequest`/`_handleBatch` wiring) is preserved at `archive/exp-237` for cherry-pick.","Generalizable methodology note: exp 234's own signal predicted this would 'reproduce the same transfer fraction'; it did not, because the batch changes the round-trip count, not just the blob-size total. A blob-transfer win measured on single-row writes does not transfer to a coalesced/batched path by blob-size similarity — the round-trip topology is the load-bearing variable."]},{"id":"239","title":"Transparent select overflow batching","file":"239-select-overflow-batching.md","date":"2026-07-22","status":"rejected","directions":["stream-rerun-dispatch"],"outcomeClass":"rejected","impact":"Moonshot: revisits exp 209's proven small-read request amortization without restoring its rejected public `selectAll` API. A private reader-pool prototype preserved the first four-way wave and batched only already-parked plain `select()` requests, sharded across readers in envelopes capped at four. The homogeneous mechanism reproduced: twenty point reads improved -26.2% / -33.2% and twenty roughly-ten-row reads improved -21.1% / -30.3% across the order flip; twenty 10k-row reads stayed neutral-to-faster with bounded RSS. Rejected on the load-bearing hidden-policy guard: alternating ten large + ten point reads made point-completion p95 +16.9% / +11.4% slower and total median +25.6% / +13.1% slower. Queue depth reveals waiting, not query cost; a point future sharing an indivisible envelope with large reads cannot complete independently. Runtime reverted, durable heterogeneous harness kept, prototype archived at `archive/exp-239`. Do not retry queue-depth-only hidden batching without a reliable private cost signal or independently completable member replies.","class":"moonshot","changed":["Exp 209's small-read request-amortization win does not require a public `selectAll` API to exist mechanically. Exp 239 kept ordinary `Future.wait(db.select(...))`, preserved the pool's first four-way wave, and batched only already-parked plain selects in pool-sharded envelopes capped at four. Twenty point reads improve -26.2% / -33.2% and twenty roughly-ten-row reads improve -21.1% / -30.3% across the lane-isolated order flip, clearing the preset 15% target in both orderings.","Sharding parked work across the pool avoids exp 209's one-worker large-read collapse. Twenty concurrent 10k-row reads are -21.6% then -0.3% at median, with p95 and peak RSS inside the declared guards. Aggregate sacrifice can amortize reader respawns as well as messages, so large homogeneous overflow is not itself the hidden-batching blocker.","Queue depth is not a safe private batching policy because it reveals waiting but not query cost or latency priority. On alternating ten large + ten point reads, an indivisible worker envelope makes point-completion p95 +16.9% / +11.4% slower and total median +25.6% / +13.1% slower across the order flip. Baseline can admit the next point on a different free reader; the batch holds it until every neighboring large result is ready. This load-bearing guard rejects the runtime despite the homogeneous wins.","Review found a lifecycle interaction beyond the measured performance decision: aggregate sacrifice makes the existing reader respawn-versus-close startup race reachable from several individually-sub-threshold results. Any future design that deliberately increases sacrifice frequency must first track/join or kill in-progress reader spawns during close."],"next":["Do not retry queue-depth-only transparent select batching, tune its batch width, or move its threshold around the heterogeneous guard. Hidden grouping needs either a reliable private pre-execution cost signal (without SQL parsing/public annotations) or a protocol that can complete members independently while retaining enough message amortization.","Keep `benchmark/experiments/select_overflow_batch.dart` as the durable gate for any request-coalescing revisit: both twenty-way homogeneous small-read targets must clear 15%, four-way/sequential controls must stay neutral, twenty 10k-row throughput/RSS must stay bounded, and alternating large/point completion p95 must remain inside 10% in both orderings.","If resqlite's public-API policy changes, exp 209 remains the simpler explicit batching implementation because caller choice exposes the batch-versus-parallel trade-off instead of guessing it. The transparent prototype is preserved at `archive/exp-239`; do not restore it without solving heterogeneous head-of-line blocking and the sacrifice close race."]},{"id":"240","title":"Batched i64 encode moonshot","file":"240-batched-i64-encode-moonshot.md","date":"2026-07-22","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected"},{"id":"241","title":"Re-evaluating Isolate.exit sacrifice for the flat ResultSet (rejected)","file":"241-sacrifice-reeval.md","date":"2026-07-22","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected","impact":"Large read results (`>= 256 KB` estimated) use `Isolate.exit` **sacrifice** — a zero-copy heap transfer that kills the worker (a reader respawn) to avoid the `SendPort.send` graph copy. The founding measurement (exp 082) predates Dart 2.15 isolate groups, where `SendPort.send` now **shares** immutable leaves (strings/ints) across the hop and only copies the mutable structural graph — so send's cost tracks structural slot count, not bytes. This re-evaluated two changes: retire sacrifice (send-always), or re-trigger on structural slot count instead of estimated bytes. A transport check (`native_vs_heap_send.dart`, self-contained) confirms the model: a heap `Uint8List` send blows up with size (203-272 us at 512-731 KB) while a native-backed view sends cheaply (23-44 us) — send is only expensive to the extent the payload is mutable/copyable. The sacrifice A/B (via a reverted `RESQLITE_SACRIFICE_THRESHOLD` define) shows send faster-or-level across the practical numeric range and winning **large on text** (149 vs 438 us at 1000 rows — strings share on send, sacrifice respawns for a copy it never needed); sacrifice edges ahead only above **~32k structural slots**, by a noisy ~3-4%. **Both changes rejected:** send-always would regress the high-structural-count tail where sacrifice still wins; a slot-count trigger adds accounting complexity a ~3-4% noisy margin doesn't pay for (estimated bytes already correlates with slot count). The run also documents a confound — per-process repeated sacrifice respawns accumulate and bias the sacrifice lane, so this A/B can't cleanly isolate a single sacrifice-vs-send at a fixed size. Rejected; publication-only. Reopen with a clean single-shot per-process harness, or a production profile showing results clustering in the send-favored range.","changed":["The `Isolate.exit` sacrifice policy (kill the reader to zero-copy a >=256 KB result heap instead of paying the SendPort graph copy) was re-evaluated against the Dart 2.15 isolate-group send model, where SendPort.send SHARES immutable leaves (strings/ints/canonical) and only COPIES the mutable structural graph. Confirmed transport model (`native_vs_heap_send.dart`): send cost tracks the mutable/copyable payload — a heap Uint8List send blows up with size (203-272 us at 512-731 KB) while a native-backed view sends cheaply (23-44 us). So send is cheap exactly when the result is immutable-heavy (text) or externally backed, and expensive only for large mutable structure.","Sacrifice-vs-send crossover (A/B via a reverted RESQLITE_SACRIFICE_THRESHOLD define): on a numeric lane (structure-only, slots = rows x cols) send is faster-or-level up to ~20k slots and sacrifice edges ahead only above ~32k slots by a noisy ~3-4% (2000/8000/20000/32000/48000 slots: sacrifice 76.8/238.6/976.5/1194.8/1856.3 vs send 72.3/226.3/931.9/1233.8/1932.6). On a text lane (200 B strings) send wins everywhere and large (1000 rows: 149.4 vs 438.3 us) because strings are shared on send while sacrifice pays a respawn for a copy it never needed. The crossover metric is STRUCTURAL SLOT COUNT, not bytes.","Neither candidate change survives. Retiring sacrifice (send-always) is rejected because send-always would regress the high-structural-count tail (>= ~32k slots) where sacrifice still wins. Re-triggering on structural slot count instead of estimated bytes is rejected because the crossover sits at a high slot count with a ~3-4% noisy margin and estimated bytes already correlates with slot count for structural results — the accounting complexity isn't paid for. Current 256 KB estimated-byte policy stands unchanged.","Measurement confound identified: within one process the repeated sacrifice respawns accumulate and interfere, so a per-process A/B cannot cleanly isolate a single sacrifice-vs-send at a fixed size — it biases the sacrifice lane by respawn history. This is why the send-vs-sacrifice signal has stayed muddy across exp 241's harnesses (and why the stranded `sacrifice_reeval_ab.dart`, which also lost its `debugReaderSpawnCount` counter to exp 236's cleanup, could not resolve it)."],"next":["Sacrifice retirement/retuning is REJECTED but not closed. Reopen only with a clean SINGLE-SHOT per-process sacrifice-vs-send harness (one fresh measurement per process, no respawn accumulation) that removes the confound documented here — if that still shows send winning at the high-structural tail (>= ~32k slots), send-always becomes viable. Do not re-run the per-process accumulating A/B expecting a cleaner answer; it structurally can't give one.","A production profile showing real result-size/shape distribution would settle it faster than more microbenchmarks: if results cluster in the send-favored range (text-heavy, or < ~32k structural slots) and sacrifice is firing on the 256 KB byte threshold anyway, that is direct evidence to lower or retire the threshold. The byte threshold is a proxy; the real cost driver is structural slot count of the MUTABLE graph.","General result-transfer-shape rule reinforced: send is cheap for immutable-heavy (shared leaves) and native/external-backed content, expensive only for large mutable structure. Sacrifice pays off only when the mutable structural graph is large enough that the copy exceeds a reader respawn — a narrow, high-slot-count regime, not a general large-result regime."]},{"id":"242","title":"TransferableTypedData for the selectBytes result buffer (rejected)","file":"242-selectbytes-ttd.md","date":"2026-07-22","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected","impact":"Exp 234/236 won by wrapping large heap payloads in `TransferableTypedData` to escape the `SendPort` graph copy's GC-heap destination. `selectBytes` returns a large `Uint8List` too, so this tested the same wrap on it. But `selectBytes` bytes are **not** a heap `Uint8List` — they are `result.ptr.asTypedList(length)`, a view over the reader's native `json_buf` (per-reader malloc'd C buffer), snapshotted by the one mandatory `SendPort.send` copy of the `(bytes, rowCount)` record. A/B (prototype behind `RESQLITE_SELECTBYTES_TTD`, reverted) across JSON sizes spanning the 256 KB new-space cap: TTD is **neutral-to-worse at every size** — even at 142/362 KB, ~25% slower at 731 KB (view 1391.7 vs ttd 1742.3 us) — with no GC difference (both lanes the same tiny `Scavenge(external)` stream, sub-0.2 ms pauses). Mechanism: a native-backed view has no GC-heap destination for the wrap to escape; the current path already pays exactly one copy (the snapshot send), and TTD does not remove it — it relocates that copy to a `fromList` memcpy into a fresh external buffer plus malloc/finalizer/ownership-move machinery. Same one copy, extra machinery, so it loses. The mirror image of exp 234/236: the win there came from a heap `Uint8List`'s GC-heap destination, which selectBytes' native view does not have. Rejected; publication-only (prototype reverted). Would reopen only if selectBytes' buffer ever became a heap `Uint8List` instead of a native view.","changed":["The exp 234/236 `TransferableTypedData` win does NOT generalize to the `selectBytes` result buffer, and the reason is the source representation of the bytes. Exp 234 (blob param) and exp 236 (blob cell) both start from a heap-allocated `Uint8List` whose `SendPort` graph copy lands on the shared GC heap — the wrap wins by relocating that copy to external memory. `selectBytes` bytes are `result.ptr.asTypedList(length)`: a view directly over the reader's native `json_buf` (a per-reader malloc'd C buffer reused across queries). The single mandatory `SendPort.send` copy of the `(bytes, rowCount)` record is the snapshot that protects the view from json_buf reuse — there is no separate heap-destination copy for a wrap to escape.","Measured A/B (prototype behind `RESQLITE_SELECTBYTES_TTD`, reverted): wrapping the selectBytes view in `TransferableTypedData` is neutral-to-worse at every JSON size spanning the 256 KB new-space cap — dead even at 142 KB (297.3 vs 305.3 us) and 362 KB (700.1 vs 702.0), ~25% SLOWER at 731 KB (1391.7 vs 1742.3). Both lanes showed the same steady tiny `Scavenge(external)` stream under --verbose_gc (sub-0.2 ms pauses); there was no heap-pressure difference for the wrap to relieve. The wrap does not remove the one copy; it relocates it to a `fromList` memcpy into a fresh external buffer on the reader and adds malloc + finalizer + ownership-move machinery — same copy count, extra work, so it loses at size and breaks even below it."],"next":["selectBytes result transport is closed for the TransferableTypedData idea while its bytes remain a native `json_buf` view. Reopen ONLY if the buffer's source representation changes — e.g. if selectBytes ever returns a heap `Uint8List` rather than a native view, which would restore the GC-heap destination that makes the wrap pay. Do not re-test the wrap against the current native-view path.","General rule for `result-transfer-shape`: the TransferableTypedData wrap wins iff the payload's default `SendPort` destination is the GC heap (heap `Uint8List`), and is dead weight when the payload is already a view over native/external memory. Use the source representation, not the payload size, to decide whether a wrap can help. This is the 'read cell vs read buffer' distinction: exp 236 blob cells are heap objects (wrap wins); the selectBytes buffer is a native view (wrap loses)."]},{"id":"243","title":"Shared-wrapper (table protocol) for aliased blob write params","file":"243-blob-alias-table-protocol.md","date":"2026-07-22","status":"accepted","directions":["parameter-encoding-and-binding"],"outcomeClass":"accepted","impact":"[Exp 234](234-blob-param-transfer.md) wraps each large blob write param in its own `TransferableTypedData`, but walked param positions independently — a caller handing the **same** `Uint8List` object to N positions (or reusing one buffer across a coalesced `MultiExecuteRequest` burst) got N separate `fromList` copies of one buffer, a latent regression that is strictly worse than the graph copy exp 234 replaced. Exp 243 wraps by **identity**: an identity-keyed cache shares **one** wrapper per unique backing buffer (`cache[value] ??= fromList([value])`), referenced at every occurrence; the graph copier sends it once (identity preserved), and `unwrapBlobParams` materializes each wrapper exactly once (a shared unwrap cache spans the coalesced envelope's writes, since a second `materialize()` throws). Isolated transport of one 300 KB buffer referenced N times shows the table protocol **flat and fastest at every N** (32.9/27.0/28.2/33.8/56.5 µs at N=1/2/4/8/32) where the two alternatives each fail differently: the exp 234 **baseline** scales linearly (44.4 -> 1502.7 µs, ~27x at N=32 — the regression), and a **census** shape (leave aliased buffers on the graph-copy path) is flat but slow (~180-210 µs — the large heap blob aborts onto the chunked `CopyTypedDataBaseWithSafepointChecks` slow path and re-lands on the GC heap, the exact cost exp 234 avoids). Table takes baseline's single fast external copy and census's shared-once transport with neither downside, and cuts peak external memory from N buffers to one. Neutral (identical to exp 234) for the overwhelmingly common single-reference write; helps only when a >=256 KB buffer is referenced more than once. Not applicable to reads — a read response's blob cells are distinct objects with no caller aliasing to collapse (see exp 236). Internal knob; adds shared-wrapper unit tests and aliased/coalesced round-trip integration tests.","changed":["Exp 234's per-occurrence blob-param wrapping carried a latent aliasing regression: `wrapBlobParams` called `TransferableTypedData.fromList` once per qualifying position, so a caller passing the SAME `Uint8List` object to N positions (or reusing one buffer across a coalesced `MultiExecuteRequest` burst) got N independent external copies of one buffer. That is strictly worse than the graph copy exp 234 replaced, because `SendPort.send`'s object-graph copy preserves reference identity and would have copied the shared buffer once. The regression is invisible on single-reference writes (the common case) and only bites when one buffer is referenced multiple times in a send.","The fix is the 'table protocol': wrap by identity via an identity-keyed cache (`HashMap(equals: identical, hashCode: identityHashCode)`), sharing ONE `TransferableTypedData` per unique backing buffer referenced at every occurrence. The graph copier sends the shared wrapper once (identity preserved across the hop); the writer materializes each unique wrapper exactly once (a second `materialize()` throws), so `unwrapBlobParams` dedups by wrapper identity and `_handleMultiExecute` threads one shared unwrap cache across the envelope's writes. Distinct buffers are unchanged (each still gets its own wrapper); the no-large-blob fast path still returns the input list with no allocation.","Isolated transport (one 300 KB buffer referenced N times, `alias_transfer_isolated.dart`) ranks three wrapping shapes and the table protocol dominates at every N: table 32.9/27.0/28.2/33.8/56.5 us at N=1/2/4/8/32 (flat); baseline (N TTD) 44.4/49.6/70.8/132.0/1502.7 us (linear blowup — the regression, ~27x table at N=32); census (leave aliased on the graph copy) ~180-210 us flat (one copy, but the large HEAP blob aborts onto the chunked `CopyTypedDataBaseWithSafepointChecks` slow path AND re-lands on the GC heap — the exact cost exp 234 exists to avoid). Table = baseline's single fast external copy + census's shared-once transport, with neither downside, and peak external memory drops from N buffers to 1. Table even edges baseline at N=1 (same single wrap; the gap is noise)."],"next":["The write-side blob transfer story is now complete for aliasing: single reference (exp 234), coalesced envelopes (exp 234 review pass), and multi-reference/aliased buffers (exp 243). No open aliasing sub-case remains on the write path.","Census (leave aliased buffers on the graph-copy path) would only become competitive if a future Dart VM change gave large heap typed-data a fast unchunked graph-copy path — then 'leave it on the graph copy' would stop paying the slow-path tax and could rival table without wrapper bookkeeping. Nothing in current SDK behavior points that way; revisit only if `object_graph_copy.cc`'s large-typed-data handling changes.","The table protocol is a write-envelope concern and does NOT transfer to reads: a read response's blob cells are distinct materialized objects with no caller aliasing to collapse (exp 236 handles read-cell transfer). Do not add an identity-dedup layer to the read path looking for a symmetric win — the shape that makes table pay off (one caller object referenced N times) does not exist there."]},{"id":"244","title":"Pool-burst measurement of sacrifice replacement capacity, and eager respawn (rejected)","file":"244-pool-burst-eager-respawn.md","date":"2026-07-22","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected","impact":"Experiment B of the peer-recommended estimand split after exp 241's confounded send-vs-sacrifice A/B: measure the **pool-replacement-capacity** question cleanly. Uses the pool's decode-free observable — dispatch queue-wait (`workerAssignedAt - requestEnqueuedAt`), via a benchmark-only `ReaderPool.debugDispatchTimings` collector (null in production). Decisive test: a production **4-worker** pool, **8** identical large (sacrificing) selects behind a barrier (1-4 grab workers, 5-8 park), measure the parked four's queue-wait, reset the pool between bursts (fresh-lifecycle treatment unit, unlike exp 241's mutating pool). 40 bursts x 3 reps. A CONFIRMED code asymmetry motivated an **eager-respawn** candidate: the sacrifice reply handler completes the caller (a `Completer.sync()` running the whole dispatch/emit/flush chain) BEFORE initiating the replacement spawn, opposite of the sibling non-sacrifice branch. **Two reproducible findings, both counter to hypothesis:** (1) the **send** (no-sacrifice) lane has the HIGHEST parked queue-wait — highest in all 3 reps, ~+500 us / +19% over the sacrifice lanes — because a large result's SendPort graph copy blocks the worker longer than Isolate.exit + an overlapped respawn; so at pool-4 sacrifice is neutral-to-FAVORABLE, not a capacity drain. (2) sacrifice-eager (2684 us) equals sacrifice-current (2652 us) within ~1% (< any margin) on queue-wait and makespan — eager respawn buys nothing, because at pool-4 the respawn overlaps other workers' in-flight queries and is off the parked request's critical path. **Rejected: eager respawn.** Falsifies the suspected pool-capacity penalty at the production pool size and turns exp 241's hand-wavy 'keep sacrifice' into a measured result for the pool regime. Caveat: pool-4 overlap dilutes the raw per-sacrifice respawn gap and `Database.open` clamps readerCount>=2, so the pool-1 diagnostic ceiling isn't reachable via the public API. Kept the reusable queue-wait instrument + `RESQLITE_SACRIFICE_THRESHOLD` knob; the eager prototype is reverted. Still open from the split: Experiment A (intrinsic prepared-result handoff) and the text/shared-leaf misroute guard.","class":"measurement","changed":["The pool-replacement-capacity estimand of the send-vs-sacrifice question is resolved AT THE PRODUCTION POOL SIZE (4 workers), and the answer overturns the concern that motivated exp 241/244: sacrifice does NOT deplete pool capacity — it is neutral-to-favorable. In an 8-request/4-worker barrier burst (fire 8 identical large sacrificing selects, 1-4 grab workers, 5-8 park, measure parked queue-wait = assignedAt-enqueuedAt via a decode-free ReaderPool.debugDispatchTimings hook, pool reset between bursts, 40x3 reps), the SEND (no-sacrifice) lane has the HIGHEST parked queue-wait — highest in all 3 reps, ~+500 us / +19% over the sacrifice lanes (send 3175 vs sacrifice-current 2652, sacrifice-eager 2684 us median). A large result's SendPort graph copy runs on the worker before it can take the next request and blocks the slot LONGER than Isolate.exit + an overlapped respawn. So at pool-4, sacrifice frees the slot sooner than not-sacrificing.","Eager respawn (start the post-sacrifice replacement spawn BEFORE the synchronous completion chain, instead of after) is REJECTED: sacrifice-eager (2684 us) equals sacrifice-current (2652 us) within ~1%, inside any pre-registered equivalence margin, on both queue-wait and makespan. The lifecycle asymmetry is real in code — the sacrifice branch completes a Completer.sync() (running the whole dispatch/emit/flush chain) before `unawaited(spawn(...))`, opposite of the non-sacrifice branch's `_notifyPool()`-before-complete — but at pool-4 the respawn overlaps other workers' in-flight queries and is off the parked request's critical path, so reordering it changes nothing observable. Not worth the reorder plus close/generation-safety surface.","Methodology confirmed: dispatch queue-wait (assignedAt - enqueuedAt) is the clean, decode-free observable for pool-capacity questions, and a barrier burst with the pool RESET between bursts (fresh-lifecycle treatment unit) avoids exp 241's state-changing-treatment confound. The immediate (unparked) requests measure ~0 queue-wait, confirming the barrier. This instrument (`ReaderPool.debugDispatchTimings`, null in production) is kept as reusable pool-measurement infrastructure."],"next":["Experiment A of the split is still open and is now the priority: a prepared-result, process-isolated handoff harness for the INTRINSIC transfer estimand (real ResultSet built before a Go-barrier; one fresh AOT process per observation; measure Go-sent-on-main -> raw result-handler-entered-on-main; ABBA-matched send vs Isolate.exit; record receive time as the FIRST op in the handler since the completer is synchronous). That isolates send-vs-exit transfer without pool or decode confounds. Experiment B (this run) has already removed the pool-capacity argument, so if Experiment A shows the intrinsic transfer is also a wash for typical shapes, the middle is a declared equivalence and the policy stays.","The pool-4 result dilutes the raw per-sacrifice respawn gap (parked requests wait on a busy worker's ms-scale query regardless of lane). `Database.open` clamps readerCount to a minimum of 2, so the peer's pool-size-1 diagnostic ceiling is not reachable through the public API; a benchmark-only pool-size override (or a direct ReaderPool.spawn(handle, 1) harness) would be needed to expose the raw gap. Low priority — pool-4 is the production regime and the direction there (sacrifice favorable) is unambiguous.","Standalone win independent of the transfer question, carried over from exp 241 and untouched here: the TEXT/shared-leaf misroute (sacrifice firing on a byte threshold for shared-string results that send ~2.9x cheaper). A routing guard keeping shared-leaf-dominated results on send is shippable now.","Eager respawn (and by extension the sacrifice reply-handler lifecycle) is closed unless the completion chain gets materially heavier (e.g. a future change that does more synchronous work inside `entry.emit`/`_flushQueue`), which would re-open the question of whether replacement launch should precede caller completion. Re-run this exact burst harness to check."]},{"id":"245","title":"Prepared-result handoff — intrinsic send vs Isolate.exit (measurement)","file":"245-prepared-result-handoff.md","date":"2026-07-23","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted","impact":"Experiment A of the peer's estimand split (exp 241 confound, exp 244 = the pool-capacity half): measures the INTRINSIC transfer estimand — `SendPort.send` vs `Isolate.exit` for a given result graph, with spawn/SQLite/decode/construction all outside the timed interval. Prepared-result barrier protocol: a worker builds the real production ResultSet (flat values list + RowSchema + wrapper) and holds it; main records t0 (Go sent) and t1 (received, first op in handler); handoffWall = t1-t0, both on main (one clock). ONE fresh PROCESS per observation (no heap accumulation / mode carryover — the exact confounds exp 241 suffered), ABBA blocks, empty-envelope control isolating fixed overhead. Three mechanistic facts, each isolated: (1) **Isolate.exit has a ~47 us fixed-overhead premium** over send (empty envelope 147 vs 100 us) — its sendability walk + teardown; (2) **strings/immutable leaves are SHARED on send, not copied** — a 400 KB string adds ~0 us (payload -4), a 1 MB string +18 us; send's copy cost tracks the MUTABLE flat-list SLOT COUNT (27 -> 163 -> 636 us at 20k -> 48k -> 200k slots), not payload bytes; (3) **exit is zero-copy**, so it wins once the structural copy exceeds its 47 us premium — **crossover ~48k slots** (num48k exit -22 us; num10kx20 -345 us). Resolution (with exp 244): small-to-moderate (<~48k slots) and ALL string-heavy results are send ≈ exit within the pre-registered equivalence margin (39-71 us diffs) — the middle is a declared wash, slight lean to send; large structural (>~48k slots) materially favors exit; the current sacrifice policy's intent is validated. The one real defect is the TRIGGER: sacrifice fires on BYTES, but the cost driver is mutable slot count, so a large STRING (400 KB, 1 slot, shared free) is send-favored (96 vs 167 us) yet wrongly sacrificed at 256 KB bytes — the text/shared-leaf misroute, now confirmed intrinsically. Ships no runtime change; actionable follow-up is a slot-count/shared-leaf sacrifice guard.","class":"measurement","changed":["The INTRINSIC send-vs-Isolate.exit transfer cost is now measured cleanly (prepared-result barrier: worker builds+holds the real ResultSet, main times Go-sent -> received as first op, one process per observation, ABBA, empty-envelope control). Three facts: (1) Isolate.exit has a ~47 us FIXED-overhead premium over send (empty envelope 147 vs 100 us) from its sendability walk + isolate teardown/reassignment; (2) strings/immutable leaves are SHARED on send, not copied — a 400 KB string adds ~0 us to send (payload -4), a 1 MB string +18 us; (3) send's copy cost is driven by the MUTABLE flat-list SLOT COUNT (pointer-array backing), not payload bytes — send payload rises 27 -> 163 -> 636 us across 20k -> 48k -> 200k int slots but is ~zero for a single huge string.","The send/exit CROSSOVER is ~48k structural slots (4-col numeric): send wins below (num20k send 127 vs exit 189), exit wins above (num48k 263 vs 241; num10kx20 200k-slots 736 vs 391 = -345 us). Because strings are shared free on send, string-heavy and low-slot-count results always favor send (lower fixed overhead); large mutable-structure results favor exit (zero-copy beats the growing slot-count copy). This is the intrinsic mechanism exp 241 could not isolate through its confounded pool harness, and it matches exp 241's noisy ~32k-slot crossover, now pinned at ~48k.","Send-vs-sacrifice is RESOLVED by combining this with exp 244 (pool capacity: no penalty at pool-4, sacrifice neutral-to-favorable). Small-to-moderate results (<~48k slots) and ALL string-heavy results are send-equivalent within the pre-registered equivalence margin (39-71 us diffs < +/-75-100 us) — the middle is a declared wash with a slight send lean. Large structural results (>~48k slots) materially favor exit (-203 to -345 us). The current sacrifice policy's INTENT (sacrifice large, send small) is validated; the DEFECT is only the trigger."],"next":["ACTIONABLE, and the one shippable win the whole send-vs-sacrifice arc produced: the sacrifice trigger keys on estimated BYTES, but the true intrinsic cost driver is MUTABLE STRUCTURAL SLOT COUNT (strings are shared free on send). So a large STRING (e.g. 400 KB, one slot) is send-favored (96 vs 167 us intrinsic) yet is wrongly sacrificed at the 256 KB byte threshold, AND pays a reader respawn for nothing. Follow-up experiment: route the sacrifice decision on mutable slot count instead of estimated bytes, or minimally add a shared-leaf guard that keeps string-heavy results on send. Fixes the misroute without touching the large-structural regime where exit correctly wins.","The send-vs-sacrifice DIRECTION is otherwise closed: intrinsic transfer (this run) + pool capacity (exp 244) both resolved, and both point the same way. Do NOT re-open with more through-the-pool A/Bs (exp 241's confound) or with attempts to retire sacrifice wholesale (exp 244 showed it is favorable at pool-4 for large results, this run shows it is the correct intrinsic choice above ~48k slots). Consider updating the result-transfer-shape synthesis in signals/base.json on the next curation pass to record the resolved mechanism.","Reusable measurement pattern established for any future intrinsic isolate-transfer question: prepared-result barrier (build + hold BEFORE a Go barrier), one fresh PROCESS per observation (kills heap accumulation / mode carryover), ABBA blocks, empty-envelope control to separate fixed overhead from payload cost, timestamps kept on one isolate (main) for clock comparability. This is the clean alternative to through-the-pool alternation, which is a state-changing treatment that cannot isolate transfer."]},{"id":"246","title":"Slot-count sacrifice trigger — fix the string misroute","file":"246-slot-sacrifice-guard.md","date":"2026-07-23","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted","impact":"The reader sacrifices a row result (Isolate.exit zero-copy, at the cost of a reader respawn) when its estimated BYTES exceed 256 KB. Exp 245 measured that this asks the wrong question: `SendPort.send`'s cost tracks the MUTABLE flat-list SLOT COUNT (rows x cols), not payload bytes — strings/immutable leaves are shared on send for free. So a result large in bytes but small in slots (a few rows with a big TEXT/BLOB column — base64 blobs, large JSON/text docs) is cheap to send yet gets SACRIFICED, paying a reader respawn for a copy that never happens. Exp 246 routes the decision on slot count (`raw.values.length`) instead: `_shouldSacrifice` = `values.length > sacrificeSlotThreshold` (default 32*1024 = the exact all-integer equivalent of the 256 KB byte threshold at 8 bytes/cell). End-to-end A/B: the misroute shape (4 rows x 100 KB string) stops sacrificing (1.00 -> 0.00 sacrifices/select) and runs **31% faster** (131 -> 91 us) — every such read previously killed+respawned a reader for nothing; every numeric/structural shape (band 40k, large 200k, medium 20k, small) is byte-for-byte the same routing at parity latency. Threshold is measured, not guessed: the ~48k INTRINSIC crossover (exp 245) regressed the 40k-slot band (+12%, sent something that should sacrifice) because end-to-end the send copy is on the worker's critical path (exp 244), so the crossover arrives earlier; 32k = the byte trigger's all-int equivalent restores band parity while keeping the string fix. Slot count is also free (the flat list's length, no per-cell accounting), so the change is a net **simplification**: the byte machinery it replaced — the byte threshold, `RawQueryResult.estimatedBytes`, and the decoder's per-cell `byteEstimate` — was deleted in the same change, having no readers left once routing moved to slot count. That includes exp 236's `transferableBytes` subtraction, since blob size can no longer influence the decision (exp 236's blob-cell TransferableTypedData wrapping itself is unaffected and still ships). The shippable payoff of the send-vs-sacrifice arc (exp 241 confound -> 244 pool -> 245 intrinsic -> 246 fix).","changed":["The sacrifice trigger now routes on MUTABLE SLOT COUNT (`raw.values.length`, i.e. rows x columns), not estimated bytes. Exp 245 established that send's copy cost tracks slot count while strings/immutable leaves are shared free, so the byte threshold misrouted big-string/big-blob results (few slots, many bytes) into a needless sacrifice + reader respawn. Slot routing fixes that: the misroute shape (4 rows x 100 KB string) stopped sacrificing (1.00 -> 0.00 per select) and got 31% faster (131 -> 91 us end-to-end), while every numeric/structural shape kept byte-for-byte identical routing at parity latency. Slot count is also free (the flat list's length), unlike the decoder's per-cell byte estimate.","The chosen slot threshold is 32*1024 = the exact all-integer equivalent of the legacy 256 KB byte threshold (8 bytes/cell). This is END-TO-END tuning, deliberately BELOW exp 245's ~48k INTRINSIC crossover: a first pass at 48k regressed the 40k-slot band by +12% (it sent a result that should sacrifice), because exp 244 showed the send copy sits on the worker's critical path so at the production pool sacrifice becomes favorable earlier. 32k reconciles the intrinsic transfer, the pool dynamics, and numeric parity with the old byte trigger.","This is the shippable payoff of the whole send-vs-sacrifice arc: exp 241 (confounded through-the-pool A/B) -> exp 244 (pool capacity: no penalty at pool-4, sacrifice neutral-to-favorable, eager respawn rejected) -> exp 245 (intrinsic: send cost ~ slot count, strings shared free, exit zero-copy with ~47us fixed premium, ~48k intrinsic crossover) -> exp 246 (route on slot count). The policy's INTENT (sacrifice large structural, send small/text) was always right; only the byte TRIGGER was wrong for strings."],"next":["The byte machinery is GONE, not deprecated: the byte threshold, the trigger toggle, `RawQueryResult.estimatedBytes`, the decoder's per-cell `byteEstimate`, and exp 236's `transferableBytes` subtraction were all deleted in the same change that landed slot routing, since none had a remaining reader. There is no soak-window rollback to remove later and no second notion of result size to keep in sync. Note the surviving distinction, which is deliberate: `blobCellTransferThreshold` (exp 236) is still correctly a BYTE threshold, because a `Uint8List` really is copied byte-for-byte, whereas the sacrifice decision is about result STRUCTURE. The rule going forward is: bytes for mutable payloads, slots for structure.","The send-vs-sacrifice DIRECTION is now closed end to end: mechanism understood (exp 245), pool behavior understood (exp 244), and the one real defect (byte trigger misrouting strings) fixed (exp 246). Do not reopen with more transfer A/Bs. The only remaining tuning knob is the exact slot threshold on non-M1 hardware — 32k is machine-measured; a production profile showing a different result-shape distribution or a different pool size could justify re-tuning `sacrificeSlotThreshold` (a compile-time define).","PRIORITY for this direction, and the honest framing of what is left: TRANSFER IS ONLY ~6-12% OF A LARGE SELECT. Exp 246 measured a 200k-slot select end-to-end at ~6,100 us; exp 245 measured the intrinsic transfer of that same shape at ~391 us (exit) / 736 us (send). So the whole send-vs-sacrifice arc optimized a small slice, and the other ~90% — SQLite stepping plus building the Dart object graph — has never been decomposed. Before any further result-transfer work, measure stepping vs decode separately (the exp 245 prepared-result barrier method extends to this directly). If decode dominates, the real lever is not transferring the object graph better but not BUILDING it — i.e. native/columnar encoding for large results, which `selectBytes` already demonstrates. Note the counter-evidence on record: a prior message-graph benchmark found the current ResultSet beats a binary row facade end-to-end once field access is counted, so that direction is access-pattern-specific, not a general successor to `select()`."]},{"id":"248","title":"Stable stmt-cache slots — removing the move-to-back struct swap (rejected)","file":"248-stmt-cache-stable-slots.md","date":"2026-07-25","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected"},{"id":"249","title":"Invalidation-batched stream rerun dispatch (moonshot, rejected)","file":"249-invalidation-batched-rerun.md","date":"2026-07-26","status":"rejected","directions":["stream-rerun-dispatch"],"outcomeClass":"rejected"},{"id":"250","title":"Reject reset-aware high-water checkpoint worker","file":"250-async-checkpoint-high-water.md","date":"2026-07-26","status":"rejected","directions":["stream-rerun-dispatch"],"outcomeClass":"rejected","impact":"Moonshot follow-up to exp 233: observed-reset/high-water re-arming removes the asynchronous worker's level-trigger storm and preserves the off-writer first-crossing win, improving threshold-crossing p50 by 53.0% / 63.9% across the order flip while foreground reads also improve. The load-bearing sustained lane still rejects the runtime: awaited 8 KiB write p50 regresses +152.5% / +138.1%, p95 +148.8% / +163.0%, and p99 +203.9% / +161.7%. PASSIVE checkpoints can return successfully with partial progress, and two candidate repeats strand 9,165 / 10,316 pending WAL frames; with no bounded retry, a burst ending after that partial attempt leaves the backlog in place. A below-threshold control keeps p50 neutral, locating the damage in concurrent checkpoint/WAL dynamics rather than the worker's fixed lifecycle overhead. Independent review also found that page-count drops cannot identify an equal/larger first commit in a new WAL generation, and the isolate has no failure channel, so startup/runtime death can hang open or close. The design still requires a second keyed writable connection, isolate, FFI and mutex state, generation/error/partial-progress policy, and coalesced close draining, with no representative incidence evidence that synchronous checkpoint wall is materially user-visible. Runtime reverted; prototype preserved at `archive/exp-250`. Reopen only with a real generation signal, worker-failure propagation, bounded backoff/retry for partial PASSIVE progress, and a representative trace, or with a materially simpler SQLite-native approach.","class":"moonshot","changed":["Exp 233's asynchronous checkpoint storm was a trigger-policy failure, not an unavoidable property of moving PASSIVE work off the writer. Observed-reset/high-water re-arming schedules the first 500-frame crossing, advances only on a fresh 500-frame delta, preserves one coalesced rerun for growth during an active checkpoint, and re-arms after an observed WAL page-count drop. That removes the continuously-true level trigger that previously requested work on every sustained commit.","The off-writer mechanism retains substantial local value once the storm is fixed. First threshold-crossing p50 improves 53.0% / 63.9% across the order flip, and foreground reads improve as well, confirming that inline PASSIVE ownership is a real latency ceiling when the crossing occurs.","Reset/high-water gating is not sufficient for sustained health because SQLITE_CHECKPOINT_PASSIVE is best-effort. A checkpoint may return SQLITE_OK with only partial progress; consuming that attempt without bounded retry can leave a burst with no future commit to create another high-water request. Two candidate repeats strand 9,165 / 10,316 pending frames, while sustained awaited 8 KiB writes regress +152.5% / +138.1% at p50, +148.8% / +163.0% at p95, and +203.9% / +161.7% at p99.","The below-threshold control keeps p50 neutral, so the sustained regression is not explained by merely owning a second connection/isolate or checking an idle request flag. The damage appears when checkpoint and WAL work overlap. That makes bounded partial-progress policy part of the mechanism, not an optional cleanup.","Page-count drop is only a proxy for WAL generation. If the first commit after restart lands equal to or above the prior observed count but below the next high-water, the candidate cannot identify the new generation and can leave an already-above-threshold WAL unscheduled. Strict reset semantics require an actual generation signal.","The preserved first-crossing and read wins do not repay the current lifecycle surface without incidence evidence: a second keyed writable connection, dedicated isolate and SendPort, three private FFI calls, mutex-protected request/high-water state, worker-failure propagation, error and partial-progress handling, and cross-sender close draining are all required for a behavior whose representative user frequency remains unknown. The archived isolate has no onExit/onError channel, so startup/runtime death can hang open or close and strand native state."],"next":["Do not restore `archive/exp-250` with page-count-driven high-water re-arming alone. Any revisit must carry a real WAL-generation signal, add bounded backoff/retry when PASSIVE reports partial progress, propagate worker failure, coalesce retries so they cannot recreate exp 233's storm, and prove that the WAL settles after the burst ends.","Require a representative downstream trace showing that synchronous threshold crossings are frequent and materially user-visible before paying the worker lifecycle cost. Re-run the first-crossing, sustained write p50/p95/p99, foreground-read, below-threshold control, and post-burst pending-frame gates together.","Prefer a materially simpler SQLite-native checkpoint policy if one can preserve the first-crossing benefit without a second Dart isolate and cross-sender close protocol. The measured mechanism and harness remain available at `archive/exp-250` for comparison, not restoration."]},{"id":"251","title":"SQLite step vs Dart decode (measurement)","file":"251-step-vs-decode.md","date":"2026-08-01","status":"accepted","directions":["result-transfer-shape","measurement-system"],"outcomeClass":"accepted","impact":"Accepted measurement; motivating premise refuted. A native-asset-aware AOT harness directly decomposed the production worker query/decode code path across five fresh processes and four representative shapes. The direct worker-path full proxy is typically 84-94% of separately measured main-observed select() latency, but the split changes by shape: the mixed row is result-construction-heavy (63%), the small integer row is step-heavy (60%), and the other two are roughly even. Estimated result construction is 34-58% of observed latency, so neither phase generally dominates and a broad row-storage/decode rewrite has no universal target. This bounds exp 258's synthetic no-boxing build win inside the real path; its narrow Int64List main-consumer candidate remains workload-gated. Ships the focused harness and evidence only; no runtime or public API change.","class":"measurement","changed":["Exp 245/246 showed transfer is only 6-12% of a large select and left the other ~90% labelled SQLite stepping plus Dart object-graph build. Exp 251 decomposes that residual with the real resqliteStepRow/executeQuery paths in a native-asset-aware AOT harness across five fresh processes and four representative integer, mixed, and text shapes.","The direct worker-path full proxy is typically 84-94% of separately measured main-observed select() latency, but it contains no universal dominant sub-cost: the mixed row is result-construction-heavy (63%), the small integer row is step-heavy (60%), and the two other shapes are roughly even. Estimated result construction is 34-58% of observed latency, so the residual bucket is not itself an optimization candidate and a broad decode/storage rewrite cannot cite general decode dominance.","Exp 258's 60-90% synthetic no-boxing build win is real but only applies to a shape-dependent slice of the real path. Exp 251 strengthens exp 258's rejection of the broad columnar store without closing its narrow positive result: main-isolate integer consume can still benefit from Int64List locality, but this worker-side decomposition supplies no downstream incidence for an integer-heavy main-isolate-bound workload."],"next":["Do not reopen a general ResultSet backing-store or decode rewrite from the statement that transfer leaves ~90% of select wall. First run benchmark/experiments/step_vs_decode.dart on the representative workload and name whether stepping, value materialization, transfer, or main-isolate consumption is actually eligible.","The exp 258 narrow integer-column candidate remains blocked on a downstream workload profile showing integer-heavy, main-isolate-bound full consumption. Exp 251 is a worker-side decomposition and does not satisfy that incidence gate.","Keep the AOT native-asset bundle and fresh-process protocol when using this harness. A standalone dart compile exe does not bundle resqlite's native asset and is not a valid measurement surface."]},{"id":"252","title":"Reject per-batch dirty-column dependency merge","file":"252-dirty-column-batch-merge.md","date":"2026-07-27","status":"rejected","directions":["stream-rerun-dispatch"],"outcomeClass":"rejected"},{"id":"253","title":"Reject identity-conditioned MultiExecute BLOB routing","file":"253-multiexecute-blob-routing.md","date":"2026-07-28","status":"rejected","directions":["parameter-encoding-and-binding"],"outcomeClass":"rejected"},{"id":"254","title":"TEXT decode via sqlite3_value_blob (skip NUL-termination copy)","file":"254-text-value-blob-decode.md","date":"2026-07-28","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected"},{"id":"255","title":"Stream could emit nothing when a write raced its initial query","file":"255-stream-initial-emission-race.md","date":"2026-07-28","status":"accepted","directions":["stream-rerun-dispatch"],"outcomeClass":"accepted","impact":"`db.stream()` promises to emit current results immediately, then re-emit on change. It could do neither: a stream whose initial query was still in flight when a write landed went **permanently silent**, never emitting even its first value. `StreamEngine._createStream` stored the initial result's hash as the comparison baseline and then, if the entry had been dirtied mid-flight, discarded those rows unemitted in favour of a catch-up re-query — but that re-query's `selectIfChanged` compared against the baseline taken from the very rows it replaced, found them identical, and returned 'unchanged, nothing to emit'. Initial emission suppressed as stale; replacement suppressed as unchanged; stream silent forever. The race window is the initial query's duration, so it is trivial on small tables and reliable on large ones — and opening a stream then immediately writing (seeding a list on first paint) is ordinary usage. Fix: always emit the initial result (a valid observation, and the documented contract), then re-query if dirtied; `selectIfChanged` still suppresses the follow-up when nothing changed, so no duplicate. This had been surfacing for a long time as an intermittent `write_coalescing_test` failure dismissed as a flake — at ~1-in-3 on a loaded machine — helped along by that test's own comment asserting the shape 'can't flake under load'. New regression test (40k seeded rows so the write reliably races the query) fails 0/5 without the fix and passes 6/6 with it; the old test goes 3/6 -> 8/8; 140 tests pass across the stream, write-coalescing, trigger-cascade, database and transaction suites.","changed":["A stream's initial emission was not guaranteed: if a write dirtied the entry while its initial query was in flight, `_createStream` discarded the initial rows unemitted and relied on a catch-up re-query, which then compared against the hash baseline taken from those same discarded rows and reported 'unchanged'. Both emissions suppressed each other and the stream stayed permanently silent. The fix keeps the suppression (exp 256 measured it as the better semantics) but poisons the baseline so the re-query always emits.","The failure mode of this class of bug is silence, not staleness — the hardest kind for an application to notice, and the reason it survived so long behind an intermittent test failure."],"next":["Stream emission is now guaranteed at registration; the remaining stream-rerun-dispatch work is throughput (exp 239's parked-read batching, preserved) rather than correctness.","Audit sibling paths for the same shape — any place that takes a comparison baseline from a result it then declines to emit will suppress both the original and its replacement. `selectIfChanged`'s short-circuit is only safe when the baseline came from rows the subscriber actually received.","Prefer absence over a magic value when forcing a comparison to report a change: null cannot collide with any real observation, whereas a sentinel must be a value the domain cannot produce — and hashes have no such value here, since the empty-result short-circuit makes 0 meaningful."]},{"id":"256","title":"Stale-then-correct vs suppress-stale initial stream emission","file":"256-stale-initial-emission-tradeoff.md","date":"2026-07-28","status":"accepted","directions":["stream-rerun-dispatch"],"outcomeClass":"accepted","impact":"Exp 255 guaranteed a stream always emits; this settles WHICH rows the first emission carries when a write raced the initial query. Lane A emits the known-superseded initial rows immediately and corrects via the catch-up re-query; lane B suppresses that emission, poisons the comparison baseline so the re-query is guaranteed to emit, and lets the corrected result be the stream's first. A's advantage — a faster first emission — is measured against the wrong clock: what a subscriber cares about is time-to-CORRECT-value, and the catch-up re-query runs in both lanes. Measured across race windows widened by seed size: B costs **~1.4 ms at 20k rows and ~0.4 ms at 60k** on time-to-correct (8.1 -> 9.5 and 18.5 -> 18.9 p50) and removes the stale frame **entirely** (1.00 -> 0.00 per raced stream at every size); A renders exactly one wrong frame on every raced stream, the list-jump artifact a reactive stream exists to prevent. The no-race control is identical in both lanes (13.3 ms, 2 emissions), confirming the change is scoped to the raced path. **Accepted: ship B.** It is not a return to the exp 255 bug — that was suppression WITHOUT poisoning, which let the initial emission and its replacement cancel each other; the sentinel baseline guarantees an emission and `_requery` propagates errors, so a stream always resolves to a value or an error. Would revisit only for a skeleton-UI workload that prefers stale rows to nothing, which is an opt-in public-API question rather than a default.","changed":["When a write races a stream's initial query, the stream suppresses the known-stale initial rows and emits only the corrected result. Measured cost is ~1.4 ms at 20k rows and ~0.4 ms at 60k on time-to-correct-value, because the catch-up re-query is already in flight in either design; the benefit is removing the one stale frame that emit-then-correct rendered on every raced stream.","Time-to-first-emission is the wrong metric for a reactive stream when the first emission is known to be superseded. The metric that matters is time-to-correct-value — when the subscriber can trust what it sees — and on that clock the two designs are within about a millisecond."],"next":["Stream emission semantics are settled: always resolves (exp 255), never stale (exp 256). Remaining stream-rerun-dispatch work is throughput — exp 239's parked-read batching, preserved but unshipped — not correctness.","A skeleton-UI workload that prefers stale rows to no rows would want the opposite policy. That is an opt-in public-API question (an emission-policy parameter on `stream()`), not a default to flip; it needs a real consumer
