asking before it is worth the surface area."]},{"id":"257","title":"Native independent-autocommit envelope","file":"257-native-autocommit-envelope.md","date":"2026-07-29","status":"rejected","directions":["stream-rerun-dispatch"],"outcomeClass":"rejected","impact":"Moonshot: A private native loop tried to execute homogeneous coalesced writes in one FFI call while preserving every member as an independent autocommit. The public insert gate improved 17.7% in one process order but only 3.6% in reverse, below the predeclared 10% bar, while the integer-only no-op diagnostic regressed 17.7% / 13.9%. Whole-group parameter/result materialization outweighed the removed call boundaries without removing N SQLite commits. Safety review also found reset-time commit-error, dirty-union timing, packed-BLOB memory, and binding-lifetime hazards. Runtime reverted; exact prototype and harness at archive/exp-257.","class":"moonshot","changed":["Collapsing a homogeneous MultiExecuteRequest's per-member execute loop into one private C call is not enough while every member remains an independent SQLite autocommit. The public 5,120-insert gate improved 17.7% in candidate-first order but only 3.6% in baseline-first order, missing the predeclared 10% reproduced bar.","The envelope adds a real fixed cost rather than merely failing to beat noise: an integer-only no-op UPDATE burst regressed 17.7% / 13.9% across the order flip. Whole-group allocateBatchParams packing, result-buffer materialization, and suffix repacking after errors can cost more than the scalar path's already-specialized one-row encoder and repeated FFI calls.","Preserving independent outcomes inside a native loop has hidden correctness and resource constraints. A retry must handle sqlite3_reset commit errors, deliver the dirty-dependency union before affected futures resolve, retain failed-statement side effects, clear SQLITE_STATIC bindings before freeing the arena, make the result ABI explicit, cap aggregate variable-width payloads, and guard main-isolate diagnostic latency while the writer mutex is held."],"next":["Keep exp 180's scalar per-member worker loop. Do not retry a whole-group native parameter/result arena under the current MultiExecuteRequest representation.","Reopen only if transport already supplies a bounded native-ready arena or another design removes group repacking; require at least 10% on public 100/200-member insert bursts in both process orders, neutral 2/8/32-member bursts, and BLOB peak-RSS plus diagnostics-latency guards.","Treat true group commit as the separate exp 197 semantic/API frontier. Exp 257 shows that collapsing only Dart/native orchestration while retaining N autocommits does not capture that ceiling."]},{"id":"258","title":"Columnar typed-array result store","file":"258-columnar-result-store.md","date":"2026-07-29","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected","impact":"Moonshot: challenged the assumption that the `select()` backing store must be a boxed row-major `List<Object?>`. A focused AOT A/B (`columnar_result_transfer.dart`, two order-flipped passes) gave the first real measurement of the per-column typed-array mechanism exp 055 only estimated and exp 081 tested only as a row-major binary slab. Columnar builds 60-90% faster worker-side (no double-boxing) and its transfer is 73-91% cheaper — but the large results where transfer wins most already zero-copy via the `Isolate.exit` sacrifice path (>32768 slots), and the sub-threshold `SendPort` lanes save only tens of microseconds, below the round-trip floor. `REAL` consume is neutral; memory is a wash-to-regression (Smi ints live inline, so `Int64List` costs more). The one real primary-metric signal was a ~2x main-isolate integer-consume speedup from `Int64List` locality. Rejected the whole-store rewrite; recorded a scoped narrow-columnar-integer-consume candidate. Harness + receipt kept; no lib/native change.","class":"moonshot","changed":["Exp 055 assessed per-column typed arrays (Int64List/Float64List) but never implemented them, estimating the throughput win as too small; exp 081 measured only a row-major binary slab. Exp 258 gave the first real AOT measurement of the columnar typed-array mechanism, isolating build (worker), hop (transfer), and consume (main) across a real worker->main SendPort hop with two order-flipped passes.","Columnar builds 60-90% faster worker-side (no boxing; biggest on REAL, ~10x on 10k x 20 REAL) and its transfer is 73-91% cheaper on a SendPort A/B. But the build win is worker wall (off the main isolate), and the transfer win does not reach production: results large enough for the transfer to matter (>32768 structural slots) already zero-copy via the Isolate.exit sacrifice path, and sub-threshold SendPort results save only tens of microseconds, below the exp 105 round-trip floor.","On resqlite's primary metric (main-isolate time = hop + consume), columnar is neutral for REAL results (consume -5 to -13%, the box-on-access cost nearly cancels Float64List locality) and shows no reliable memory win (Smi integers live inline in a List<Object?>, so an Int64List column costs more per cell; RSS moved +25% to -30% inconsistently across lanes). This confirms exp 081's main-isolate-access caution generalizes to the columnar shape and completes exp 055's open assessment as a rejection.","The one real primary-metric signal: integer consume is ~2x faster on the main isolate (Int64List sequential access, no covariant-load barrier, vs pointer-chasing a List<Object?> of Smis), reproduced -48 to -52% on every integer lane in both orders. This is a narrow effect, not evidence for the whole-store rewrite."],"next":["Do not reopen the broad columnar ResultSet rewrite on the transfer or memory arguments. Exp 258 closes both: the Isolate.exit sacrifice path already handles large-result transfer, and Smi-int columns regress memory under Int64List.","Scoped open candidate: a narrow columnar path for numeric columns targeting the ~2x main-isolate integer-consume speedup, worthwhile only if a workload profile shows integer-heavy, main-isolate-bound reads dominating. It needs its own design pass for how Row dispatches columnar-vs-flat per column without slowing the text path; treat it as out-of-budget until such a workload appears.","Keep benchmark/experiments/columnar_result_transfer.dart as the mechanism gate for any future columnar attempt: tag lanes by the sacrificeSlotThreshold (32768 slots) so the transfer axis is measured against Isolate.exit, not a naive SendPort baseline."]},{"id":"259","title":"Native TEXT ASCII classification for the row decoder","file":"259-native-ascii-text-flag.md","date":"2026-08-03","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted","impact":"`decodeQuery` cannot build a Dart `String` from a TEXT cell until it knows whether the payload is pure ASCII (`String.fromCharCodes` widen) or not (`utf8.decode`), and it was answering that itself: a second `ExternalTypedData` word view plus a bounds-checked scan per cell, degrading to a byte-by-byte loop for anything under 16 bytes — which is most database text. `resqlite_step_row` already holds the pointer and length one frame earlier, where the same question is a branch-free SWAR pass over bytes still in cache. Moved it there: `text_is_ascii` reports `RESQLITE_TEXT_ASCII` (type code 6, the first value SQLite's 1-5 leaves free) and the decoder's TEXT arm splits into a widen path and a straight-to-`utf8.decode` path with no scan of its own. The stream hash is untouched — `resqlite_step_row_hash` folds the local `SQLITE_TEXT` before the switch, so the canonical digest still matches `resqlite_query_hash` (the exp 228 invariant). Focused AOT A/B, two order-flipped passes, `ab_drift_check` REPRODUCED on every primary lane: 10k x 8 short ASCII TEXT -12.3% / -10.4%, 40 B -14.3% / -10.7%, 2k x 4 400 B -22.2% / -19.4%, and the repo's canonical 6-column mixed product row (`id` INTEGER + 4 TEXT + REAL, taken verbatim from `benchmark/shared/seeder.dart`) -24.4% / -19.2%. The two neutral lanes carry the verdict: the INTEGER-only control runs byte-identical code in both arms and moves +0.2% / -2.9% (opposite signs, inside the 3% floor), ruling out the exp 254 per-worktree binary offset; and the CJK guard is -2.4% / -1.7%, confirming that scanning a non-ASCII value to the end in C costs less than the partial Dart scan it replaced. A `resqlite_test_text_is_ascii` differential test plus an every-offset multibyte `select()` round trip gate the classification, since a wrong answer is silent mojibake rather than a crash.","changed":["The Dart row decoder was paying to answer a question C already had the inputs for. `fastDecodeText` had to classify every TEXT cell as ASCII (Latin-1 widen) or not (utf8.decode) before it could build the String, costing a second ExternalTypedData word view plus a bounds-checked scan per cell — and falling back to a byte-by-byte loop for values under 16 bytes or on an unaligned pointer, which covers most real database text. `resqlite_step_row` holds the same pointer and length one frame earlier, in cache, where the answer is a branch-free SWAR pass.","Moving the classification into the native step loop (RESQLITE_TEXT_ASCII = type code 6) is worth a reproduced 10-24% on text-bearing select() reads, including 19-24% on the repo's canonical 6-column mixed product row, across two order-flipped AOT passes. The saving is per TEXT cell, so it scales with text carried per read rather than with row count; the 400 B lane gains most (-22.2% / -19.4%) because the replaced Dart scan walked ~50 words per cell, and the canonical mixed row gains as much as it does because its description column is ~85 bytes on its own.","Scanning a non-ASCII value all the way to the end in C, instead of bailing at the first high byte, costs nothing measurable: ordinary CJK text moved -2.4% / -1.7% and the worst case built to expose the trade (400 B with its one multibyte character at byte 0) moved +1.1% / -1.0%. The full-scan shape buys a single branch on the common all-ASCII path, and any value that fails the test is about to be walked again by utf8.decode at roughly ten times the per-byte cost. This is the counterpoint to exp 235's abandon-on-first-miss lesson — there the fast path was abandoned for the whole remainder; here the 'miss' path is a separate, more expensive decoder that re-reads the value regardless.","This does not reopen exp 258's columnar rewrite or exp 251's decode-bottleneck premise. Both closed on the grounds that a storage-shape change moves work between isolates rather than removing it; this removes work outright and is orthogonal to where the result is stored."],"next":["The general shape worth reapplying: any per-cell question the Dart decoder asks while the native step loop already holds the inputs one frame earlier. The decode loop's remaining Dart-side per-cell work is the ExternalTypedData view and the String copy itself; both are VM-owned, so further gains here need a Dart runtime change (a native UTF-8 String entry point, or a non-allocating Pointer view), not another resqlite-side move.","benchmark/experiments/select_rows_text_decode.dart is the durable gate for any future change to the rows-path TEXT decode arm. Keep its int8 control lane (byte-identical code in both arms, so it reads the per-binary offset directly) and its two non-ASCII guards — text8-cjk (ordinary multibyte text) and text4-long-early-nonascii (the worst case for accumulate-then-test: a long value whose only high byte is at offset 0). Run it before touching fastDecodeText, the cell type codes, or resqlite_step_row's TEXT arm.","resqlite_test_text_is_ascii is the classifier's byte-level gate, in the resqlite_test_i64_to_str class: a wrong answer is silent mojibake, not a crash, so any change to the SWAR scan must keep the differential test green.","Cell type codes 1-5 are SQLite's; 6 is now RESQLITE_TEXT_ASCII. A future native-side classification wanting its own code should take 7 and keep the decoder's switch dense."]},{"id":"260","title":"Size the result buffer from what the SQL returned last time","file":"260-result-list-presize.md","date":"2026-08-04","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted","impact":"`decodeQuery` starts every result at 256 rows' worth of `List<Object?>` slots and doubles when it overflows. Growing that list copies every live element with a store barrier into a freshly faulted array, so a 200k-slot result copies ~322k slots through ~5 MB of immediate garbage on its way up. A standalone AOT reproduction of the decode loop puts the doubling at 2318 us against 865 us pre-sized, with the loads, switch and stores together under 500 us — so buffer growth, not cell decoding, is most of what exp 251 measured as `Dart result construction` (2524 us of 5124 us worker wall on the same shape). `ReaderPool` now remembers each SQL's result size on the main isolate and stamps it onto the request; the worker consults it only when the buffer overflows, so a result that fits inside the initial allocation runs byte-identical code. Two design points carry it: the memory cannot live in the worker, because a result over `sacrificeSlotThreshold` ends the isolate that produced it and a worker-local hint dies exactly when it was worth having (that first version won 30-35% on mid-sized reads and ~1% on the largest); and the hint sizes growth rather than the initial allocation, because an early version that sized the allocation made a `LIMIT ?` statement alternating 8000/50 rows 2.8x slower on its small leg. Focused AOT A/B, two order-flipped passes, `ab_drift_check` REPRODUCED on every primary: 10k x 20 INTEGER -25.1% / -24.8%, 5k x 4 INTEGER -32.2% / -33.7%, and the repo's canonical 6-column product row x 10k -33.6% / -32.3% (3.5 ms -> 2.3 ms). Both controls return fewer rows than the initial buffer holds, so the changed path is unreachable and they move opposite signs inside the 3% floor; both mispredict guards are neutral by construction. Memory was not measured; arithmetic on the allocation path says total bytes allocated fall 14-61% everywhere (the intermediate arrays stop existing) but peak capacity is not a guaranteed improvement — 23.7% smaller on all three primary lanes, yet 22-25% larger for a result that lands just under a doubling boundary, as `mixed6-1k` does. This closes exp 059 as wrongly rejected rather than re-tested: its rejection reason was the April release suite's noise floor, its mechanism claim that `list growth is already cheap` is false, and it sized the initial allocation — carrying exp 067's small-query regression inside the same change.","changed":["Growing `decodeQuery`'s `List<Object?>` is not amortised-free, and it is the single largest Dart-side cost of a large read. A standalone AOT reproduction of the decode loop over a fixed cell buffer measures 2318 us for the doubling path against 865 us pre-sized on 10k x 20 INTEGER, with loads + switch + stores together under 500 us. That lands within 8% of exp 251's 2524 us of `Dart result construction` on the same shape, so the bucket exp 251 refused to design against is mostly buffer growth rather than cell decoding. Growth costs what it costs because a `List<Object?>` grow copies every live element with a store barrier into a freshly faulted array; a 200k-slot result copies ~322k slots through ~5 MB of transient garbage.","Exp 059 rejected this mechanism for the wrong reason and with a design defect. Its stated grounds were the April release suite's noise floor and medians taken across iterations; its mechanism claim (`list growth is already cheap`, `only ~3-4 growths`) counts growths rather than slots copied and is false; and it sized the *initial* allocation from the hint, which is precisely the change exp 067 measured as a 40-44% regression on small-query workloads the same day. A win on large reads and a regression on small ones nets to the noise it reported.","A per-isolate cache is not a durable place for anything a large read teaches. Results over `sacrificeSlotThreshold` (32768 slots) return via `Isolate.exit` and end the worker that produced them, so a hint kept in the worker's schema cache is discarded exactly when the result was large enough to need it, and otherwise describes only the executions that landed on one of four pool workers. Measured directly: the worker-local version won 30-35% on sub-threshold reads and ~1% on the 200k-slot lane. Moving the memory to `ReaderPool` and stamping it on the request took the same lane to -25%.","A size hint must be applied where a wrong answer cannot cost anything. Applied to the initial allocation, a hint saturated by a `SELECT ... LIMIT ?` statement's large leg made its 50-row leg 2.8x slower (68 -> 198 us) — zero-filling 60000 unused slots costs more than the doubling it removes. Applied at the growth step the same lane is neutral by construction, because a result that fits in the initial buffer never reaches the code. This is a stronger guarantee than a floor: it makes the whole mechanism unreachable for small results rather than merely conservative.","Per-request bookkeeping on the main isolate is measurable on a point read. The first version's two map lookups per request cost ~0.3 us, about 6% of a point query, attributed by building a variant with the pool bookkeeping removed and watching the lane return to baseline. Reading the entry once per request and never creating one for a SQL that has not exceeded the initial buffer brought it under the 3% effect floor."],"next":["`benchmark/experiments/select_rows_presize.dart` is the durable gate for any change to the result buffer's allocation or growth. Keep its two sub-initial-buffer control lanes (`mixed6-200`, `point1`) — they are inert by construction, so their delta reads the per-binary layout offset directly — and both mispredict guards, which are the only lanes that can expose a size hint's failure mode.","The remaining Dart-side per-cell work in `decodeQuery` is now genuinely the loads, the switch and the stores: ~500 us for 200k INTEGER cells, or ~2.5 ns/cell. Exp 251's decomposition should be read through claim 260.2 before anything else is designed against its `Dart result construction` figure — most of that number was growth, and it is gone.","The same question applies to every other buffer that grows by doubling on a hot path: `selectBytes`'s native `json_buf` already persists and grows geometrically, and the writer's parameter arena is sized per call. Neither has been measured for growth-copy cost the way the row buffer now has.","Anything a worker learns and wants to keep has to live on the main isolate or be re-derivable, because the sacrifice path destroys reader isolates on exactly the largest results. The schema cache itself has this shape — it is rebuilt from `sqlite3_column_name` after every sacrifice — and has never been measured."]},{"id":"261","title":"A memory guard for focused experiments, and four months of trend","file":"261-focused-memory-guard.md","date":"2026-08-04","status":"accepted","directions":["measurement-system","result-transfer-shape"],"outcomeClass":"accepted","impact":"Focused AOT A/B harnesses decide experiments now (251, 254, 258, 259, 260) and measured wall time only, so a candidate could halve latency and double memory unnoticed. `benchmark/shared/memory_probe.dart` closes that in the mode those harnesses must run in — chosen by elimination, since an AOT binary has no VM service (`Service.getInfo()` returns null, `--enable-vm-service` is rejected) and running under JIT to get one would change what exp 193 requires be measured under AOT. The load-bearing finding is which reading to gate on: on a lane crossing `sacrificeSlotThreshold`, sampled `currentRss` peak said +75% and `maxRss` said -1.7% about the same change. `maxRss` is the true high-water; a `currentRss` curve is a retention signal, and retention moves when reader isolates are sacrificed and hand pages back. Gate on `maxRss`, one process per lane. Validated: five runs per arm spread <=0.6 MB, inert control lanes identical across arms, and `--no-memory` moves wall time 1.3-2.4% (inside the floor). First use answers exp 260's unmeasured claim 260.4: peak RSS *falls* on every lane (-2.1% / -11.5% / -28.0%), refuting its arithmetic prediction that peak capacity could rise 22-25%. A sweep of eight checkpoints from v0.3.0 (which resolves, builds and runs the current harness unmodified) shows peak read-path memory FLAT within ~1 MB for three months across ~40 merged experiments including the whole transfer-shape arc, while wall time fell 25-40% — so no regression exists to fix, and the only movement is exps 259 and 260, both downward. Three findings for future runners: the guard is a tripwire for a doubling, not an instrument for 5% drift; seeding dominates the gated number (mixed6-10k sits at 89.5 MB before the measured reads, which add ~18 MB); and `select()` peaks at 95 MB reading a table holding ~1.5 MB, a ~60x ratio never decomposed.","changed":["Focused AOT harnesses can carry a memory reading, and the instrument is fixed by a hard constraint rather than chosen: an AOT binary exposes no VM service (`Service.getInfo()` returns null, `--enable-vm-service` is rejected as an unrecognized flag), so heap statistics and allocation profiles are unavailable in the only mode exp 193 permits for decode-path results. `ProcessInfo` is the whole instrument, and a `currentRss` read costs ~700 ns so it must stay outside the stopwatch.","`maxRss` and a sampled `currentRss` peak can give opposite verdicts on the same change, by 76 percentage points. Pre- vs post-exp-260 on a lane crossing `sacrificeSlotThreshold`: sampled `currentRss` peak 36.6 -> 64.0 MB (+75%), `maxRss` 65.9 -> 64.8 MB (-1.7%). `maxRss` is the true high-water and is what a guard should gate on; the `currentRss` curve is a retention signal, and retention moves when reader isolates are sacrificed and return their pages. Within one isolate the VM keeps pages after GC, so a candidate freeing its own garbage reads as no change.","Exp 260's memory claim was refuted by measurement in the favourable direction. Its arithmetic predicted peak capacity could rise 22-25% for a result landing just under a doubling boundary; measured peak RSS falls on every lane (-2.1% at 200k slots, -11.5% on the canonical product row, -28.0% on the sub-threshold integer lane). The arithmetic was correct about the buffer and wrong about the read: the buffer is a small part of what a read holds, and the doubling sequence's retained intermediate arrays are a larger one.","Peak read-path memory has been flat for three months. Eight checkpoints from v0.3.0 (2026-05-03) through exp 259 (2026-08-03) hold every lane within ~1 MB, across roughly forty merged experiments including the entire transfer-shape arc (174, 234, 236, 243, 244, 245, 246), while wall time on the same runs fell 25-40%. There is no memory regression to find, and that is now established rather than assumed.","The guard's sensitivity is bounded by that same flatness: four months of experiments moving wall time 25-40% moved peak RSS under 1%. It is a tripwire for a doubling, not an instrument for a 5% drift. It is further diluted by setup — `mixed6-10k` sits at 89.5 MB before the measured reads begin and the reads add ~18 MB — so a lane meant to gate memory should seed as little as it can."],"next":["`benchmark/shared/memory_probe.dart` is the memory lane for any focused harness. Start it after seeding and warmup, sample outside the stopwatch, run with `--lane=` so `maxRss` is per-lane clean, and read `lane_isolated` before comparing two runs' `max_rss_mb`.","Do not gate on `rss_growth_mb` or `rss_peak_mb`. They are retention signals and can report a large regression on a change that leaves the high-water untouched — claim 261.1 is the counterexample that established this.","The release-suite Memory stage is `[15/16]`, the exact stage where the sqlite_async peer segfaults, and #282's per-repeat artifact writing does not help because the crash lands inside repeat 1. Persisting each scenario as it completes, rather than each repeat, would preserve the fourteen scenarios that currently die with it — that is the reason trend data is thin, and it gates the `per-benchmark RSS acceptance criteria` candidate that has been open since 2026-05-02.","The next memory question worth a run is claim 261.4's ~60x payload-to-peak ratio on `select()`, decomposed rather than assumed. That needs allocation counters at specific sites, not process RSS, because the guard cannot resolve anything below a doubling."]},{"id":"262","title":"Persist the release suite per scenario, and let memory fail a run","file":"262-release-scenario-persistence.md","date":"2026-08-05","status":"accepted","directions":["measurement-system"],"outcomeClass":"accepted","impact":"Two halves of one problem: a crash still destroyed the run, and a memory regression could not stop anything. #282 made the suite persist after each completed *repeat*, but the sqlite_async peer segfault it was written against fires at the Memory scenario — the fifteenth of sixteen, inside repeat 1 — so no repeat ever completed and nothing was ever written. Exps 260 and 261 each ran fourteen scenarios successfully and produced no artifact at all, which is the concrete reason the trend charts are sparse. `_runSuiteOnce` now reports after every scenario and the runner persists on each callback; `repeatCount` counts only repeats that finished, and the artifact gains `scenariosCompleted`/`scenarioTotal`/`partial` so a partial run self-excludes from trends the same way `gitDirty` and `--repeat=1` already do. Verified by SIGKILL during scenario 10 of 16: nine scenarios and 153 metrics survive where previously nothing did, with `repeatCount: 0` and `partial: true`. The rewrite also fixed live drift between the progress labels (`[1/15]`..`[14/15]` then `[15/16]`) by making `scenarioTotal()` the single source for both. Second half: `compareMemory` returns a `MemoryComparison` carrying wins/regressions/neutral and the regressed benchmark names alongside the table that has always rendered them, the runner prints a banner naming each, and `--fail-on-memory-regression` exits non-zero — closing the `per-benchmark RSS acceptance criteria` candidate open since 2026-05-02, where the criteria existed but the acceptance did not. Opt-in by design: a local run reports without failing, CI is where a gate belongs. Neither a missing `## Memory` section nor a missing baseline can fail a run, because a gate that fires on absent data gets disabled. Does not fix the peer crash itself, which also leaks its temp databases (~1.2 GB accumulated on the dev machine from two days of crashed runs) because the segfault skips the `finally` that removes them.","changed":["Crash-resilience has to be granular enough to reach the crash. #282 correctly identified that a segfault destroyed whole runs and correctly chose to persist partial progress, but persisted per completed *repeat* — and the peer crash it was written against fires at the Memory scenario, the fifteenth of sixteen, inside repeat 1. No repeat ever completed, so the fix never engaged. Exps 260 and 261 each ran fourteen scenarios and produced no artifact. Persisting per scenario preserves nine scenarios and 153 metrics against a SIGKILL at scenario 10, where the previous behaviour preserved nothing.","A partial run is worth keeping as long as it cannot be mistaken for a whole one. `repeatCount` now counts only repeats that finished, so a run killed inside repeat 1 reports 0 rather than 1, and `scenariosCompleted`/`scenarioTotal`/`partial` mark the shortfall — self-exclusion in the same shape as `gitDirty` and `--repeat=1`, which already drop a run from the trend charts.","The release suite's memory thresholds were never the missing piece. `generateMemoryComparison` has rendered per-benchmark bootstrap-MDE thresholds and a regression marker all along; nothing consumed the verdict. The 2026-05-02 `per-benchmark RSS acceptance criteria` candidate needed the counts split out of the markdown and a caller willing to act on them, not new statistics.","A gate must not fire on absent data. Neither a missing `## Memory` section nor a missing baseline counts as a regression, because a gate that fails a run for having no data to compare is one people turn off."],"next":["The `per-benchmark RSS acceptance criteria` candidate open since 2026-05-02 is closed by claim 262.2. What remains is a maintainer decision: whether CI's release job passes `--fail-on-memory-regression`. Nothing else in the repo turns it on.","The sqlite_async peer segfault at the Memory scenario is unfixed and is not ours (#282 established exp 229's own sha crashes today at the same stage, so only the peers changed). Per-scenario persistence contains the damage; it does not remove it, and the Memory scenario is still the one lane a crashed run cannot report.","That crash also leaks its temp databases: the segfault skips the `finally` that removes them, and ~1.2 GB had accumulated on the dev machine from two days of crashed runs. A suite that seeds into a directory it clears on startup, rather than relying on unwind, would make this self-limiting.","`scenarioTotal()` is now the single source for both the progress labels and the persisted total. Add scenarios through the `step()` helper in `_runSuiteOnce` so the two cannot drift again — they already had, the suite printing [1/15] through [14/15] and then [15/16]."]},{"id":"263","title":"The 60x memory ratio was mostly floor","file":"263-select-memory-decomposition.md","date":"2026-08-05","status":"accepted","directions":["result-transfer-shape","measurement-system"],"outcomeClass":"accepted","impact":"Exp 261 recorded a ~60x ratio between a 10k-row `select()`'s peak RSS (~95 MB) and its payload (~1.5 MB) as claim 261.4, `never decomposed`, with `List<Map<String, Object?>>` overhead named as a partial cause. Decomposed here by holding seeding constant at 20,000 rows and varying only the timed statement's LIMIT, so the slope is the per-row marginal and the intercept is everything that does not scale. The measurement configuration was itself the first finding: exp 261's 5 warmup + 21 timed reads accumulate up to 26 results of retained garbage because RSS never falls, reporting 99 MB where one read held live reports 36.1 MB. On the single-result measurement `select()` costs 396 B/row, but that raw marginal must not be divided by the payload: a one-column and a six-column read of the same table make the same btree leaves resident, so the 1-column `id` lane's 140 B/row is a per-row storage-side cost independent of how the result is represented. Differencing isolates the Dart side at 256 B/row for the five non-key columns against 134.9 B of their cell content — a 1.9x representation overhead — and against a first-principles accounting of what those columns must occupy (four OneByteStrings at a 24 B header plus rounded data ~240 B, one boxed double 16 B, five values-list slots 40 B, so ~296 B) the measurement comes in BELOW it. The Row facade contributes nothing to a retained result: the iterator creates those objects transiently and only the ResultSet is held. The floor is where the 60x lived: 14.0 MB is the bare Dart AOT process, 20.5 MB after resqlite opens and spawns its pool, 32.8 MB after seeding, and 36.1 MB with a live 10k-row result — so the result is the smallest term and the ratio divided a ~90%-fixed peak by the payload. Premise refuted; claim 261.4 closed. Two secondary findings: `selectBytes` costs MORE memory per row than `select` (676 vs 396 B/row) because JSON re-encodes every column name per row and quotes every value — it avoids Dart objects, not bytes, so it is the wrong tool for reducing memory as opposed to allocation churn; and the sacrifice path shows up as sub-linearity (396 B/row over 1k-10k vs 337 over 1k-20k) because results above sacrificeSlotThreshold end the worker and return its heap, so any memory comparison spanning that threshold measures transport as much as representation. If footprint is ever a target the numbers say it is the isolate pool, not the row shape — but exp 105 already made pool size throughput-critical, so that is a trade rather than a free win.","changed":["The ~60x payload-to-peak ratio recorded as claim 261.4 does not describe the result representation. Two corrections were needed to say what does. First, the raw 396 B/row marginal cannot be divided by the payload: a one-column and a six-column read of the same table make the same btree leaves resident, so the `id` lane's 140 B/row is a per-row storage-side cost independent of representation, and differencing the projections isolates the Dart side at 256 B/row for the five non-key columns. Second, that is 1.9x their 134.9 B of cell content, and BELOW a first-principles accounting of what they must occupy (~296 B: four OneByteStrings at a 24 B header plus rounded data, one boxed double, five values-list slots). The row representation has no headroom.","The `Row` facade costs nothing in a retained result. It is three fields and a header, but the iterator creates those objects transiently and only the `ResultSet` is held, so a per-row facade charge does not belong in an accounting of what a result occupies.","A repeated-read RSS measurement is not a measurement of a result. RSS never falls, so exp 261's 5 warmup + 21 timed reads accumulated up to 26 results of retained garbage and reported 99 MB for a 10k-row lane where one read held live reports 36.1 MB — 2.7x. Both answer real questions; only the second answers `what does a result cost`. Any future memory lane must say which it is measuring.","The floor dominates every small and medium read, and it is mostly not resqlite's row handling. 14.0 MB is a bare AOT Dart process before resqlite exists; open plus a spawned pool is 20.5 MB; seeding 20,000 rows adds ~12 MB more. A live 10,000-row result adds 3.6 MB on top — the smallest term in the stack.","`selectBytes` uses MORE memory per row than `select`: 676 B/row against 396. It removes Dart objects, which is what it has always claimed, but JSON repeats every column name on every row and quotes and escapes every value, so the encoded bytes exceed the object graph they replace. It is the right tool for allocation churn and the wrong one for footprint.","The sacrifice path distorts a memory sweep the way exp 258 showed it distorts a transfer benchmark. `select`'s marginal reads 396 B/row over 1k-10k and 337 over 1k-20k, because results above sacrificeSlotThreshold return via Isolate.exit and the worker's heap goes with it. A memory comparison spanning that threshold measures transport as much as representation."],"next":["Claim 261.4 is closed by 263.1. Do not reopen a result-shape rewrite on payload-to-peak-ratio grounds — exps 081, 251 and 258 closed storage rewrites on their own evidence, and the one piece of contrary evidence has now been removed rather than strengthened.","Difference two projections before quoting a per-row memory cost. The raw marginal includes a ~140 B/row storage-side term (claim 263.4) that a one-column read pays as fully as a six-column one; dividing it by the payload charges the storage engine's work to the row representation, which is how this experiment's own first revision overstated the overhead as 2.9x.","State which memory question a lane answers. `benchmark/experiments/select_memory_decomposition.dart` runs both: `--warmup=0 --reads=1` for the cost of one live result, the default for what a repeatedly-reading process retains. They differ by 2.7x on the same lane, so an unlabelled figure is not interpretable.","If footprint ever becomes a target, the isolate pool is the term to attack, not the row representation — 20.5 MB is resident before a row is read. Exp 105 established pool size is throughput-critical, so it is a trade; nothing here says the trade is worth making.","Keep a memory sweep on one side of `sacrificeSlotThreshold`, or tag lanes by which side they fall on. Crossing it makes the marginal sub-linear because `Isolate.exit` returns the worker's heap, which reads as a representation win and is not one.","If the ~140 B/row shared term ever needs pinning down, the discriminating test is cheap: hold row count fixed and widen the row (e.g. triple the description column). If the term tracks row width rather than row count it is the storage engine making scanned bytes resident and the question is closed; if it does not move, something else holds it."]},{"id":"264","title":"Size the initial result buffer from the SQL's high-water row count","file":"264-initial-alloc-size-memory.md","date":"2026-08-06","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted","impact":"`decodeQuery` allocated room for 256 rows on every read regardless of what the statement returns, so a one-row point read allocated and zero-filled `colCount * 256` slots to keep `colCount`. Exp 067 rejected shrinking the constant in 2026, but it shrank it unconditionally and read a true per-slot fact (a large null-filled list is cheaper *per slot*) as evidence the constant was well-tuned; exp 260 has since supplied the per-SQL row-size memory that makes the shrink conditional. Sizing the initial allocation from the largest row count a SQL has ever returned, clamped so it can only shrink below the existing default, is a reproduced 13.5% on the canonical 6-column point read and 27.1% on a 21-column one — the win scales with projection width, as the mechanism predicts. Every lane whose result outgrows the initial buffer is neutral by construction. Two guard lanes wrote the rule: `undershoot-mid` measured +40% in all four order-flipped passes against a sliding window of two, because the two executions before a large one are both small, which is what forced the statistic to be a high-water mark; the one-time cost of a statement's first jump from small to large is +1.6%. Two follow-on findings from the same run: exp 264's own change to `ReaderPool._record` lets point reads evict exp 260's growth hint from the pool's 32-entry memory, costing a measured +40-46% on a 5,000-row read once more than 32 distinct statements are in play — fixed here by preferring an eviction victim that has never returned a large result (LRU promotion was tried first and measured no improvement; the problem is capacity, not order). The first measurement pass ran on a host at 0.0% CPU idle with under 500 MB free disk and was re-run once it freed up; the narrow point read moved from -7.4% to -13.5% and the wide one held at -27.1%, with controls tightening to +/-1.7%. The re-measurement also confirms the eviction fix is inert on the hot path and returns the thrash lane to parity with pre-264.","changed":["Claim 067.1 said `decodeQuery`'s initial `List<Object?>.filled(colCount * 256, null)` must not be shrunk. That holds for the change exp 067 actually made — an unconditional cut to `colCount * 4`, which forces every result larger than four rows to double its way up — but not for the general statement, and the reasoning underneath it was wrong in an instructive way. Exp 067 attributed its regressions to a VM fast path that makes one large null-filled list cheaper *per slot* than a small one. That is true and it does not support the conclusion: a standalone AOT reproduction of the allocation shape measures 1,536 slots at 0.28 ns/slot against 12 slots at 1.8 ns/slot, so the large allocation is six times cheaper per slot and twenty times more expensive in total. What actually made exp 067 regress was growth, not allocation, and exp 260 has since supplied the thing that lets the shrink avoid growth: a per-SQL memory of how many rows each statement returns. Conditioned on that memory and clamped so it can only ever shrink, the initial allocation is worth a reproduced 7.4% on the canonical 6-column point read and 27.4% on a 21-column one.","A buffer-size hint that can *under*-predict must be a high-water mark, not a sliding window, and this is the single most transferable thing the run produced. Exp 260's growth hint takes the smaller of a SQL's last two row counts, which is right for growth because over-sizing is the expensive mistake there. Taking the *larger* of the last two by symmetry, for the initial allocation, was measured at +40% in all four order-flipped passes on a statement returning 3,300 rows behind a burst of 20-row executions: a window of two is defeated by any burst longer than two, because the two observations before the large execution are both small, so the large result is sized for 20 rows and doubles its way up — every time, not once. A high-water mark cannot repeat. What it gives up is a statement that was once large and is now permanently small, which keeps today's allocation forever.","The cost of a mispredict is a one-off +1.6%, and it is bounded by arithmetic rather than by measurement. The doubling chain's landing point depends on where it starts, so an undershoot can be favourable (`undershoot-jump`, 5,000 rows: from 25 rows the chain lands on 6,400, from 256 it lands on 8,192) or adverse (`undershoot-mid`, 3,300 rows: 6,400 against 4,096, four extra growths and 56% over-allocation). The adverse case measured 927.5 -> 942.5 us across 50 fresh processes per arm — about 15 us, inside the p10-p90 spread of either arm. Quoting only the favourable lane would have overstated the result; the pair is what brackets it.","Exp 260's argument for where a size memory lives generalises further than exp 260 needed it to, but it was not the cause of the +40%. Exp 260 put its hint on the main isolate because `Isolate.exit` on a result over `sacrificeSlotThreshold` ends the worker that produced it (claim 260.3) — an argument about *large* results, which a mark about small ones appears to escape. It does not: a high-water mark is only worth the observations feeding it, a four-worker pool hands each worker a sample, and a worker that does decode a large result is destroyed and its replacement starts over. Sampling bias and worker sacrifice are separate sufficient reasons to keep the mark on the main isolate. Worth recording that this was the run's first diagnosis of the +40% and was wrong: moving the memory to the pool fixed a real defect and left the lane at +40% in all four passes, because a window of length two is defeated by a burst longer than two wherever the window is kept. A correct fix for a real defect is not evidence that it was the defect being measured.","Peak RSS does not move, and that is the expected reading rather than a null result. Dart releases a truncated growable list's backing store, so the fixed 256-row allocation was never retained by a small result — only allocated, zero-filled and thrown away. Every lane holding one read live is flat within ~1 MB, consistent with claim 261.3. This is a transient-allocation win, in the same category exp 263 put `selectBytes` in when it separated allocation churn from footprint."],"next":["`benchmark/experiments/select_rows_presize.dart` is now the durable gate for *both* ends of the result buffer, and the lane roles invert between them: exp 260's primaries (`int20-10k`, `int4-5k`, `mixed6-10k`, `mixed6-1k`) are exp 264's controls, and exp 260's controls (`point1`, `mixed6-200`) are exp 264's primaries. Keep `undershoot-mid` — it is the only lane that can reject a sizing rule for the initial allocation, and it did.","Two order-flipped passes were not enough here, and the tell was specific: `mixed6-20` read -16.5% then -13.3% on the first two passes and +4.2% then -8.5% on the next two. A lane whose per-read cost is dominated by other allocation (80 Strings, in that lane) cannot resolve a sub-microsecond buffer effect, and two passes agreeing is not evidence that it can. When a lane's expected effect is smaller than its CV, collect four passes and report it as drift-suspected rather than as a small win.","A coarse lane must batch before it is trusted. `mixed6-200` timed one 200-row read per sample at ~50 us, where a 1 us tick is 2%, and read +11.3% / +9.8% — a reproduced, same-signed regression in a lane the candidate provably cannot reach. Batching 20 executions per sample took it to -1.4% / +2.4%. Exp 254's rule (a same-sign move in an inert lane means no lane is trustworthy) is only sound once the inert lane's resolution exceeds the effect being hunted; before that it manufactures the very signal it is meant to detect.","The remaining per-read cost in `decodeQuery` is now genuinely the loads, the switch, the stores and the String copies — claim 260.2's ~2.5 ns/cell, plus one allocation sized to the result. There is no fixed per-read overhead left in the buffer to remove, so the next thing to attack on the small-read path is the isolate round trip itself, which exps 209 and 239 have both closed on hidden-policy grounds.","The pool's row-size memory is FIFO-capped at 32 entries (`_rowHintMax`), and an evicted entry now loses a high-water mark as well as a growth hint, so a statement whose entry is evicted pays claim 264.2's first-jump cost again. Nothing measures whether a real application's statement mix thrashes that cap. The discriminating measurement is cheap — count distinct SQL strings per second in a representative trace against 32 — and it bounds the value of every per-SQL memory the decoder holds, not just this one.","A fresh worktree is not a working checkout: `benchmark/drift/*.g.dart` is gitignored and produced by `dart run build_runner build --delete-conflicting-outputs`, which CI runs before analyze and test (`.github/workflows/ci.yml`). Without it `dart analyze` reports ~77 issues and 9 `benchmark_*_test.dart` files fail to load, all of it in peer drift scaffolding — which looks exactly like a pre-existing repo breakage and is not one. Run codegen in every new experiment worktree, immediately after `dart pub get`, before treating any analyzer or test failure as a baseline condition.","The `Tests` CI job carries a genuinely flaky sqlite_async peer abort, distinct from the benchmark-suite crash. Exp 264's first CI run aborted (SIGABRT 134) inside `ConnectionLease.notifyUpdates` -> `AsyncConnection.unsafeAccess` -> `Mutex.withCriticalSection` while `benchmark_keyed_pk_subscriptions_test.dart` was running; re-running the identical commit passed, and six local repetitions of the same three peer workload tests passed. Check that main is green (it was), then re-run before investigating a diff.","The focused harnesses have no environment gate. `run_release.dart` stamps `gitDirty` and the charts drop a dirty or single-sample run, but a focused AOT harness records nothing about the host, so exp 264 collected an entire experiment at 0.0% CPU idle and only noticed when a mechanically-inert lane read +50.6%. The cheap fix is to sample idle CPU (or load average) at lane start and print it beside the medians, so a runner and a future reader can both see it; the stronger one is to refuse to run below a threshold. Until then, check `top -l 1 | grep 'CPU usage'` before trusting a focused number, and treat a same-signed move in an inert lane as a host problem before a layout one.","A wedged `run_release.dart` is a lasting resource leak, not just a lost run. The #282 peer crash leaves the parent process blocked indefinitely — six were resident on this host, aged 1 to 4 days, from exp 260, exp 262, exp 229 and version probes. They sit at 0.0% CPU so they do not show up as CPU contention, but they hold memory and file handles and inflate load average. Check for and reap them before a measurement session; exp 262's per-scenario persistence means the artifact is already on disk, so killing one loses nothing."]},{"id":"265","title":"Run a small read on the isolate that asked for it","file":"265-inline-main-isolate-select.md","date":"2026-08-08","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected","impact":"Moonshot, rejected — but it priced the number four earlier experiments argued against without measuring. Exps 258, 264 and 239 each closed a candidate against a `select() round-trip floor`; on the canonical 6-column point read that floor is 6.3 us of an 8.4 us read, so anything rejected as below it was compared against a denominator four times larger than the work it competed with. Measured by running the query on the calling isolate when the per-SQL row-count high-water mark exps 260/264 keep says it has never returned more than 64 rows: a reproduced -74.8% on that point read, -71.0% at 21 columns (flat in projection width, unlike exp 264, because what is removed is per-request), -35.7% on a 20-row page, and -94.9% for a point read issued while four 1,000-row reads hold the whole pool — admission cost, the half every prior transfer measurement in this direction held constant. The guard lane written to kill it inverted: eight concurrent point reads are 70% faster run serially inline than four-wide across the pool, because parallelism cannot recover a per-request overhead larger than the request. Rejected anyway, and for a reason none of the numbers show. Every kill condition tested whether the row-count hint was *wrong*, which is the one failure mode the abort-and-fall-back row cap already handles; none tested whether row count is the right thing to predict from. It is not, along three independent axes: one row can be a 5 MB image (`SELECT * FROM photos WHERE id = ?` keeps a permanent high-water mark of 1, and with no hop to serialise for, exp 236's blob wrap is suppressed, so it copies unchecked onto the calling isolate); `count(*)` and unindexed `ORDER BY ... LIMIT` return few rows after unbounded work that precedes the first row; and an inline read returns a `List` rather than a `Future`, so N of them drain in microtasks as one uninterruptible block instead of N interleavable slices. All nine lanes were small integers and short TEXT on a hot cache, so none could see any of it — a guard set derived from the lanes you already have tests the hypothesis you already believe. The transferable rule: a safety property must be enforced, not predicted. The row cap survives because it aborts mid-decode and is correct whether or not the hint was right; a successor needs byte and VM-step caps beside it — both available from SQLite mid-flight — plus an answer to microtask coalescing that neither provides. Harness kept as the routing gate with its three missing lanes named; prototype at `archive/exp-265`.","class":"moonshot","changed":["The `select() round-trip floor` has been the terminal argument in this direction for months and was never a measurement. Claim 258.2 rejected a columnar result store partly because its sub-threshold transfer saving was `below the round-trip floor`; exp 264 put a point read at `5-8 us, most of which is the isolate round trip`; exps 209 and 239 both went after the floor by amortising a hop across several queries. It is now priced: on the canonical 6-column point read the hop is 6.3 us of an 8.4 us read, and removing it leaves 2.1 us. So the floor was real, it was most of a small read, and it is not a floor — it is a routing decision. Everything previously rejected as `below the round-trip floor` was measured against a denominator four times larger than the work it was competing with. This survives the candidate's rejection and is the run's lasting contribution.","Rows returned cannot bound main-isolate work, and this is why the candidate was rejected rather than shipped. It fails along three independent axes, each sufficient on its own. (1) One row can be arbitrarily large: `SELECT * FROM photos WHERE id = ?` has a permanent high-water mark of 1, is admitted forever, and — because there is no hop — has exp 236's blob wrapping suppressed, so a 5 MB image is copied straight onto the calling isolate. Cost also varies per *execution* of the same statement (id=1 a thumbnail, id=2 a raw), so no per-SQL history predicts the next parameter. (2) Rows returned is not query cost: `count(*)` over a large table and an unindexed `ORDER BY ... LIMIT 10` both return few rows after unbounded work, and a result-shape signal is blind to work that happens before the first row. (3) Inline reads never yield, so N of them coalesce into one uninterruptible block rather than N interleavable ones. Any future routing policy must treat row count as an efficiency hint and never as a safety bound.","A guard set derived from the lanes you already have tests the hypothesis you already believe. Exp 265's nine lanes were all small integers and short TEXT, cheap indexed lookups, hot page cache — and every kill condition tested whether the *hint* was wrong about row count, which is the one failure mode the row cap already handled. The three real failure modes needed lanes that did not exist and that nobody would build while the happy path was reading -75%. The discriminating lanes are cheap and specific: a one-row read of a 5 MB blob, a `count(*)` over a large table, and a frame-shaped workload rather than a throughput one.","A safety property must be enforced, not predicted, and exp 265 contains one of each so the contrast is exact. The row cap predicts nothing — it aborts mid-decode and falls back, and it is correct whether or not the hint was right (+24.7% once per statement, claim 265.4). The eligibility test predicts, and every one of its failure modes is unbounded. The fix is two more enforcement points rather than a better predictor: `sqlite3_column_bytes` gives a cell's size before anything is copied into Dart (and the value is already loaded at the line where the wrap branch is skipped), and `sqlite3_progress_handler` interrupts every N VM steps. With both, the high-water hint stops being load-bearing and becomes what it is good at — avoiding wasted aborts.","The cost of the hop is not only its own latency but the queue in front of it, and no transfer-shaped analysis in this direction could see that. Exps 244/245/246 measured intrinsic transfer with a prepared-result barrier and pool capacity with a burst, both correctly, and both hold the *request* constant. A point read issued while four 1,000-row reads occupy every worker waits 533-1169 us against 37-52 us for one that never enters the queue. When the next runner asks what a scheduling change is worth, the lane has to contend for the pool; a lane that has the pool to itself measures the smaller half of the answer. This is independent of the rejection and applies to exp 266's stickiness and anything after it.","Losing the pool's parallelism costs a caller nothing at point-read sizes. Eight distinct point reads issued together run four-wide across four workers and strictly serially when the caller runs them itself, and serial is 70% faster, reproduced in both pairs of both collections. Four workers cannot make up a per-request overhead larger than the request. This bounds the pool's value precisely — it is worth having for results large enough that decode dominates dispatch, and it is a tax below that — and it holds whatever routing policy is eventually used to act on it."],"next":["`benchmark/experiments/select_inline_dispatch.dart` is kept as the gate for read *routing*, and its lane set is deliberately incomplete — that incompleteness is the finding. Keep `mixed6-1k` and `int20-10k`: both return more rows than any plausible cap, so they run byte-identical code in both arms and read a cross-worktree binary offset directly (the exp 254 trap). Keep `cap-abort` on a fresh SQL string per sample, since an abort is once-per-statement and any other construction leaves the lane inert after its first sample. Keep `point-under-load` and `concurrent8`, which measure admission rather than transfer. Then add the three lanes exp 265 lacked before trusting any successor: a one-row read returning a 5 MB blob, a `count(*)` over a large table, and a frame-shaped workload that can see microtask coalescing. The first two fail against `archive/exp-265`.","Any successor to exp 265 must enforce rather than predict. `sqlite3_column_bytes` reports a cell's size before it is copied into Dart, and the value is already loaded at the line where the blob-wrap branch is skipped, so a running byte cap is one comparison. `sqlite3_progress_handler` interrupts every N VM steps and bounds the cases where work precedes the first row. Neither addresses microtask coalescing — an inline read returns a `List`, not a `Future`, so it never yields — and that needs a per-drain time budget, which is a design question rather than a guard. A candidate that solves two of the three is not ready.","Exp 239 was rejected because queue depth cannot encode query cost; exp 265 because row count cannot either. The generalisation is worth stating once so a third experiment does not rediscover it: no signal derived from a query's *shape* or its *position in a queue* bounds its cost, because the expensive part can precede the first row and can hide inside one cell. The signals that do bound cost are the ones SQLite computes while running — VM steps, column bytes — and they are only available mid-flight, which forces an abort-and-retry structure rather than an admission test.","Stream reruns look like the obvious next application of inline routing and are not a shortcut around this rejection: `selectIfChanged` on an unchanged result is a C hash pass with no Dart decode, the cheapest thing the pool carries and so the largest relative hop, but an unchanged result is still produced by a query whose cost row count cannot predict. All three of claim 265.6's failure modes apply unchanged. If it is attempted, exp 249's rule holds — A/B across worktrees on `benchmark/experiments/stream_rerun_latency.dart`, never with an in-process toggle.","Exp 265's collections were taken on a host at 0-39% CPU idle with load average near 37, none of it the run's doing, which is the second consecutive experiment under claim 264.6's conditions. The order-flipped design and the two mechanically-inert controls carried it — controls at +0.1% and +3.2% against primaries of -35% to -95% — but exp 264's proposed fix still stands unbuilt: sample idle CPU at lane start and print it beside the medians, so a reader can see the host's state without taking the runner's word for it."]},{"id":"266","title":"Send the read back to the worker that ran the last one","file":"266-sticky-reader-dispatch.md","date":"2026-08-09","status":"accepted","directions":["result-transfer-shape","stream-rerun-dispatch"],"outcomeClass":"accepted","impact":"`ReaderPool._dispatch` advanced its scan cursor on every attempt, so back-to-back reads deliberately rotated across the whole pool even when it was idle. Reader workers are not interchangeable resources: each is an isolate with its own SQLite connection and page cache, its own entry in that connection's C statement cache, its own Dart schema cache and cell buffer, and its own OS thread. Round-robin therefore made all four workers independently pay for warm state the first one had already built — a fixed cost per (statement, worker) pair, invisible to every benchmark in the repo because they all execute one statement thousands of times, and very visible to an application that opens a screen, runs a query four or five times and moves on. Starting the scan at the slot that served the previous read instead of the next one is worth -32.2% on a statement's first four executions, -21.8% on its first eight and -13.2% on its first thirty-two, decaying to -1.6% by the eight-thousandth — the monotonic decay the experiment was gated on, and direct confirmation the mechanism is warm-up rather than anything per-read. A busy preferred slot still walks forward, so concurrency is untouched: four concurrent reads (+1.3%), eight against a four-worker pool (+0.2%) and a 60,000-slot result that ends its worker every sample (-0.4%) are all neutral and sign-flip between collections. Peak RSS falls where the win is (27.0 -> 26.0 MB, 29.5 -> 28.2 MB) because one worker now holds once what four held four times. `selectBytes` deliberately keeps the old rotation: exp 185's `JSON buffer reclaim` release guard rejected the first, fully-sticky version at 6.2 MB against a 512 KB budget, because exp 183's `json_buf` shrink is driven by a later small read arriving on the same connection, and stickiness never sends one to the three workers a large burst had grown. Three lines of dispatch change plus that opt-out, no public API change, three new dispatch tests. Twenty-four alternating-order lane-isolated AOT passes in two collections.","changed":["`dart run tool/knowledge/impact.dart origin/main` reports no recorded belief retired or transitively unsupported by this run, and that is correct: nothing here contradicts a prior claim. What it adds is a cost class the direction had no vocabulary for. Every read-path claim from exp 251 onward is a *per-read* rate — nanoseconds per cell, microseconds per request, a fraction of transfer versus decode — and each was measured on a lane that executes one statement thousands of times, which is the only way to resolve a rate. A fixed per-(statement, worker) cost is invisible in that regime by construction, and this run measures one at roughly 18 us: the prepare, schema build and page warm each of four reader isolates pays independently for a statement the first one has already run. Read alongside claim 264.1 and claim 260.1, both of which are real and both of which are per-read: they describe the cost of the ten-thousandth execution of a statement, and this describes the cost of its first.","The reader pool's round-robin was never a load-balancing decision that anyone measured; it was the obvious way to write a scan, and it has been in place since exp 011 built the persistent pool. Exp 030 optimised what a worker does once it is chosen (dedicated reader indices, no C pool mutex) and exp 105 sized the pool, but which idle worker an idle pool picks had never been an experiment. It is worth about a third of a statement's first four executions, so the general belief to carry forward is that a policy nobody has measured is not the same as a policy that has been validated — especially one whose cost is structurally invisible to the suite that would have caught it.","Peak RSS moves with warm-state duplication, in the direction that makes the mechanism legible from a second angle. `first4-newsql` reads 27.0 -> 26.1 MB and `first8-newsql` 29.6 -> 28.1 MB, while the sacrificing lane holds at 95.9 -> 96.0. Four connections each holding a prepared statement, a cached schema and warmed pages for the same SQL is four copies of state one worker now holds once. Consistent with claim 263's account of where resqlite's footprint actually sits — the pool, not the row representation — and a small argument that pool-wide duplication is a term in that floor."],"next":["`benchmark/experiments/reader_dispatch_stickiness.dart` is the durable gate for any future change to *which* worker serves a read, and its `first{4,8,32}-newsql` lanes are reusable well beyond this experiment: they are the only lanes in the repo that can see a fixed per-statement cost at all. Any future candidate whose saving is paid once per statement — statement-cache sizing, schema-cache capacity, connection setup, prepare cost — should be measured there before a steady-state lane is allowed to call it neutral.","Traffic-driven reclaim paths are now a named hazard for any future dispatch or routing change. `json_buf` is the one that exists today (exp 183's shrink needs a later small read on the *same* connection), and it was invisible to a wall-time harness — the `JSON buffer reclaim` release guard is what caught it. Before changing which worker serves which read again, enumerate the per-connection state that only shrinks when that connection is used, and run `dart test test/benchmark_sqlite_diagnostics_test.dart` early rather than at the end.","The same stickiness question is open on two paths this experiment deliberately did not touch. Stream re-queries go through `ReaderPool.select` and `selectIfChanged` and therefore already inherit it, but a stream's re-query is issued once per invalidation against a statement that stays hot, so it sits in the steady-state regime where the effect is ~0; whether a *fan-out* of many distinct stream statements behaves like `alternating-sql` (neutral) or like `first8-newsql` (a win) has not been measured and is the natural follow-up in `stream-rerun-dispatch`. `selectBytes` shares the dispatch path unchanged.","The pool now concentrates warm state on one connection by default, which changes what the per-connection caps mean. Each reader connection has its own 32-entry C statement cache, its own 32-entry Dart `schemaCache`, and `cache_size = -8192` (8 MB) of page cache. Under round-robin an application with many distinct statements thrashed all four caches identically; under stickiness it thrashes one hard and leaves three cold. That is the correct trade for the measured shape and it is untested at the tail — a workload with well over 32 hot statements might now evict where it previously did not. The cheap discriminating lane is `first8-newsql` widened to rotate more distinct statements than a connection can cache.","The reader pool's `_preferred` cursor is the second piece of main-isolate-held per-read policy, after exp 260/264's `_rowHints`. Both are cheap and both are invisible from any public surface, which is why each needed a test-only accessor (`rowSizeHintFor`, `preferredWorkerIndex`). If a third arrives it is probably worth a single small `ReaderPool` diagnostics view rather than a third bespoke getter.","Two preflight probes were run and thrown away, and their negative results are recorded as claim 266.4 precisely so the next runner does not rebuild them: the per-cell `asTypedList` view allocation in the TEXT decode arm (~1.35 ns/cell, ~1.5% of a text-heavy read) and the per-query `RowSchema` copy across the hop (under 1% of a round trip). Both looked like obvious waste from reading the code. Neither is.","A test that spawns its own `ReaderPool` must not exceed two workers, and the reason is host-dependent so a dev machine will not catch it. `Database.open` sizes the pool as `clamp(Platform.numberOfProcessors - 1, 2, 4)` and C allocates exactly that many reader connections; `resqlite_stmt_acquire_on` returns NULL for `reader_id >= db->reader_count`, which surfaces as `ResqliteQueryException: not an error` (no SQLite error was ever set) on the rows path and `resqlite_query_bytes failed with code 5` on the bytes path. Exp 266's first two dispatch tests spawned four workers, passed on a ten-core dev machine and failed on a two-core CI runner. Two is the floor of the clamp and is what every pre-existing pool test already uses; if a future test genuinely needs the real width, it has to read the clamp rather than assume it.","A dispatch-policy change in the reader pool must run the stream-rerun-dispatch Tracelite preset as a guard even when its focused lanes are clean — exp 266's focused harness had conc/sacrifice/bytes guards and still had to add this post-hoc. The preset's 'inconclusive' exit is its win gate, not the guard verdict; read the per-scenario direction."]},{"id":"267","title":"How many statements a connection can hold","file":"267-stmt-cache-capacity.md","date":"2026-08-10","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted","impact":"Three read-path caches are keyed by SQL text and capped at 32 entries — the C per-connection prepared-statement cache, the per-worker Dart `schemaCache`, and the pool's row-size memory — and none of the three numbers had ever been measured, because every benchmark in the repo uses under ten distinct SQL strings. Exp 071 and exp 073 each rejected a cache change on exactly those grounds and each closed by asking for a `64 rotating query shapes, cache at capacity` workload before any cache-sizing experiment; neither built it, and exps 207 and 248 went after the lookup path instead, so the cache's scan has been attacked twice and its size never once. Exp 266 made the gap load-bearing two days before this run: under round-robin a sequential loop over D distinct statements was partitioned across four connections, each seeing ~D/4, and sticky dispatch sends the whole cycle to one. Because these caches evict at the front and promote on hit — approximately LRU, the worst policy for a cyclic scan — the cap is a cliff and not a slope: at D <= 32 every read hits, and at D = 33 the entry each read needs is the one the previous miss evicted. Raising all three caps to 128 is a reproduced -55.5% / -55.1% / -53.3% at 40, 64 and 128 rotating statements (14.0 us per read to 6.1 us), flat across that range exactly as a cliff predicts, with every lane inside the old cap neutral in two independent order-flipped collections and peak RSS up 0.8-1.2 MB against a ~30 MB floor. The load-bearing lane is the adversarial one: `churn-unique`, which never repeats a statement so no cache of any size can help, measured a reproduced +42.1% on the first candidate and would have rejected the raise on its own. The cause was `stmt_cache_insert` compacting the array on every eviction — `(STMT_CACHE_MAX - 1) x ~1.6 KB`, so 50 KB per prepare at 32 entries and 203 KB at 128 — identified by arithmetic (39 MB/sample of extra traffic against a measured 1.53 ms) before a second measurement was taken. Reclaiming the LRU slot in place instead, which gives up no ordering the promote-by-swap had not already given up, took the same lane to a reproduced -11.9%, because the baseline was paying ~640 us of its 3688 us sample to shift 12.8 MB. Five tests push 400 distinct statements through every cache and check each statement's identity from its result (its row, its projection, its parameter arity), since a cache returning the wrong entry is silent rather than fatal; four of the five were verified to fail against a deliberately mismatched entry. The cliff moves rather than disappears, and what bounds the next raise is the fixed-size `read_tables[64]` / `dep_columns[64]` arrays that make an entry 1.6 KB when a typical statement reads one table.","changed":["The 32-entry cap shared by the three SQL-keyed read-path caches was never a measured number, and it is a cliff rather than a slope. All three evict at the front and promote on hit, which is approximately LRU, and LRU is the worst possible policy for a cyclic scan: at D <= 32 distinct rotating statements every read hits, and at D = 33 the entry each read needs is the one the previous miss just evicted, so the hit rate collapses rather than degrading. Measured, the collapse is worth about half of every read — 14.0 us per read against 6.1 us — and it is FLAT from 40 rotating statements to 128, which is the signature of a cliff and would not be produced by gradual cache pressure.","Exp 266 moved the workload that reaches the cap by a factor of four without moving the cap. Under the round-robin dispatch it replaced, a sequential loop over D distinct statements was partitioned across the four reader connections — each cache saw roughly D/4, so a 128-statement application still fit inside 32 per connection. Sticky dispatch sends the whole cycle to one worker. This is the tail risk exp 266's own signal named ('a workload with well over 32 hot statements might now evict where it previously did not') and it is real, but it is a change in exposure, not a regression exp 266 introduced: at any D the per-cache miss rate past the cap was always total.","The cost of an eviction is O(capacity) in BYTES, not O(1), and that is what actually bounded the cache size. `stmt_cache_insert` reclaimed a slot by disposing `entries[0]` and compacting the array so the new entry landed at the tail, moving `(STMT_CACHE_MAX - 1) * sizeof(resqlite_cached_stmt)` on every prepare. At ~1.6 KB per entry (exp 248's measurement of the fixed-size `read_tables[64]` + `dep_columns[64]` arrays) that is 50 KB per prepare at 32 entries and 203 KB at 128. The first candidate raised the caps alone and measured a reproduced +42.1% on the never-reused-SQL lane — a regression large enough to reject the raise outright, on a workload no cache size can help.","The compaction bought no ordering guarantee, because `stmt_cache_lookup_entry` already promotes a hit by SWAPPING it with the tail rather than shifting. Entry order was therefore only approximate before the change and is only approximate after it. Reclaiming the LRU slot in place — new entry at the front, where the next eviction takes it unless something looks it up first — took the guard lane from +42.1% to a reproduced -11.9%, because the 32-entry baseline was already paying ~640 us of its 3688 us sample to shift 12.8 MB. A per-prepare cost that scaled with capacity was the reason the capacity question looked closed, and it was never the capacity's cost.","The memory price of the raise is small and it is not where intuition puts it. Peak RSS rises 0.8-1.2 MB against a ~30 MB floor for 128 entries across the writer, four readers and the reserved reader; SQLite's own `Stmt` accounting rises 70.5 -> 103.4 KiB on the release suite's 48-distinct-statement diagnostics section. What makes even that price avoidable is the entry shape: `read_tables[64]` (512 B) and `dep_columns[64]` (1 KB) are fixed-size arrays sized for a worst case, and a typical statement reads one table and a handful of columns.","The repo already had a workload past the cliff and could not see it. `benchmark/suites/sqlite_diagnostics.dart` runs 48 distinct SELECT texts in its `Statement cache footprint` section — 50% past the old cap — but it reports memory, not time, so it recorded the consequence of total statement-cache thrash as a footprint number for months without anyone reading it as a latency signal."],"next":["`benchmark/experiments/stmt_cache_pressure.dart` is the workload exps 071 and 073 each asked for and neither built, and it is now the durable gate for any change to a SQL-keyed cache: capacity, eviction policy, lookup cost, or entry layout. Its lane roles are worth preserving as they are — `rotate8`/`rotate24` inside the cap, `rotate32` on it, `rotate{40,64,128}` past it, and `churn-unique` where no cache can help. The last of those is the only lane in the repo that can reject a cache from getting bigger, and it did exactly that once already.","The cliff moves to 128; it does not disappear. An application with more than 128 hot statements lands in the state this run found at 33, and nothing measures where a real statement mix sits. This is the same measurement exp 264's signal named (count distinct SQL strings per second in a representative trace against the cap) and it is now worth more: it bounds a 2x cliff rather than a 40% hint.","The named follow-up is the entry, not the cap. `resqlite_cached_stmt` is ~1.6 KB almost entirely because `read_tables[64]` (512 B) and `dep_columns[64]` (1 KB) are fixed-size arrays sized for a worst case that a typical statement — one table, a handful of columns — does not approach. Sizing them from what the authorizer actually captured would shrink a common entry by roughly an order of magnitude, which would make a further capacity raise nearly free, shorten the linear scan that is the remaining `churn-unique` cost, and reduce the pool footprint exp 263 identified as where resqlite's memory actually sits. It adds a malloc per prepare, which is off the hot path by construction.","The front-insert eviction was chosen because it removes an O(capacity) cost, not because its hit rate was compared against the compacting version at equal capacity. The two are indistinguishable on every lane here — below the cap neither evicts, above it a cyclic workload defeats both — so if a future run builds a non-cyclic over-capacity workload (a hot working set plus a cold tail, say), the policy comparison is still open and the harness already has the shape to host it.","A cache-sizing change needs a negative control on its tests, and it is cheap to build. Every test here passed on the first run, which proves nothing about a cache that fails silently; installing a deliberately mismatched entry took one rebuild and showed four of the five tests catch it. Any future test whose failure mode is 'plausible data from the wrong slot' should be verified this way before it is trusted.","`benchmark/suites/sqlite_diagnostics.dart`'s `Statement cache footprint` section runs 48 distinct SELECT texts and has therefore been sitting past the old cliff for months, reporting it as a footprint number rather than a latency one. Its `Stmt` KiB reading moves 70.5 -> 103.4 with this change, which is the expected direction; it is a reporting section, not a gate, so nothing fails, but a reader comparing footprints across this merge boundary should know the cause."]},{"id":"268","title":"Leave empty statement caches virtual","file":"268-stmt-cache-lazy-init.md","date":"2026-08-11","status":"accepted","directions":["result-transfer-shape","measurement-system"],"outcomeClass":"accepted","impact":"Exp 267 raised the per-connection statement cache to 128 entries and measured +0.8-1.2 MB peak RSS, attributing it to the larger fixed entry arrays. The actual 2,136-byte entry makes one cache 273,408 bytes, and optimized arm64 code revealed the more immediate cause: although `resqlite_db` is allocated with `calloc`, `stmt_cache_init` zeroed the entire array again. The compiler removed the adjacent writer clear but retained one 273,408-byte `bzero` in the reader-open loop, so a normal four-reader open eagerly touched 1,093,632 bytes before any statement used a slot. Initializing only `count = 0` is safe because lookup and cleanup inspect only entries below count and every insertion fully zeroes its slot before publishing it. Across twelve alternating-order fresh-process passes, max RSS fell 589,824 bytes at two readers and 1,056,768 bytes at four; open-growth RSS fell 540,672 and 974,848 bytes, with the candidate lower in all 48 paired observations and reader-count scaling broadly consistent with the assembly prediction. Six alternating-order AOT wall passes improved native open by 2.4% at two readers and 2.7% at four, with no candidate-slower pass above 1.6%. Full-cache and eviction controls (`point1`, `rotate128`, `churn-unique`) stayed within 0.7% in aggregate, and 23 focused tests covering empty/first-slot use, 400-statement eviction, dependency reliability and native allocation faults passed. This recovers most of exp 267's memory price with one deleted clear and no new allocation, OOM or ownership path; exact-sized dependency metadata is now justified only by a representative populated-cache footprint, not empty-open RSS.","changed":["Exp 267's measured +0.8-1.2 MB statement-cache RSS was real, but most of the four-reader price was not retained prepared statements or populated dependency metadata. `resqlite_db` comes from `calloc`, then `stmt_cache_init` wrote the complete 128-entry array again; optimized arm64 removed that redundant write for the adjacent writer cache but retained a 273,408-byte `bzero` for every reader. Four readers therefore eagerly touched 1,093,632 bytes before any cache slot became live. Removing that clear recovers 1,056,768 bytes of median max RSS, almost the whole observation that named dynamic metadata as the next target.","The native statement-cache entry is 2,136 bytes, not the approximate 1.6 KB carried from exp 248 into exp 267. `resqlite_column_dep` is 24 bytes, so `dep_columns[64]` alone occupies 1,536 bytes; one 128-entry cache is exactly 273,408 bytes (`0x42c00`). The corrected size strengthens exp 267's eviction-compaction explanation but changes the footprint follow-up: unused capacity can stay virtual without changing entry owner
