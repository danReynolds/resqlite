t quarter-step REAL JSON fast path","file":"232-dyadic-real-fastpath.md","date":"2026-07-16","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected_preserved_potential","impact":"Rejects exp 232's narrow `.25`/`.5`/`.75` selectBytes REAL specialization despite a real 78-87% all-hit mechanism win and 50-53% improvement in a synthetic 50%-eligible row. No production or representative distribution established sufficient incidence or aggregate user benefit; general fractional controls leaned 0.65-1.95% slower, while the candidate added 114 native/build-hook lines plus permanent value-lattice semantics and test surface. Runtime and quarter-only scaffolding are removed; the exact prototype is archived and a generic REAL fixture invariant is retained.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/232.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/232-dyadic-real-fastpath.md"},{"id":"233","title":"Reject asynchronous WAL checkpoint worker","file":"233-async-checkpoint-worker.md","date":"2026-07-17","status":"rejected","directions":["stream-rerun-dispatch"],"outcomeClass":"rejected_preserved_potential","impact":"Moonshot: moving the 500-frame PASSIVE checkpoint from the writer hook to a dedicated keyed connection cuts the first threshold-crossing p50 by 46-56%, but sustained 8 KiB writes become 2.7-3.4x slower at p50, 3.3-4.5x slower at p95, and 2.3-2.5x slower at p99; foreground-read p95 also regresses and the WAL grows to 12,377 frames. The level trigger remains armed while work runs asynchronously, creating repeated checkpoint contention. Runtime is removed and the prototype is preserved at `archive/exp-233`; revisit only with reset-aware or high-water re-arming plus representative incidence evidence.","link":"","class":"moonshot","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/233.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/233-async-checkpoint-worker.md"},{"id":"234","title":"Zero-copy blob parameter transfer via TransferableTypedData","file":"234-blob-param-transfer.md","date":"2026-07-18","status":"accepted","amendedBy":["243"],"directions":["parameter-encoding-and-binding"],"outcomeClass":"accepted","impact":"A large `Uint8List` blob write param crosses the main->writer isolate hop via `SendPort.send`'s object-graph copy, which lands the payload on the shared GC heap. Exp 234 wraps blob params `>= 256 KB` in `TransferableTypedData` — one plain memcpy into malloc'd external memory, then a constant-time ownership move and a zero-copy `materialize()` view on the writer; smaller blobs and non-blob params take the unchanged direct path (the fast path returns the input list with no allocation). Answers the direction's open question — for **256 KB-512 KB single-row blob INSERTs the hop cost is a material fraction of the write, and the wrapped route is a reproduced ~15-20% end-to-end speedup** (256 KB -16.4% / -22.7%, 512 KB -10.4% / -11.8% across order-flipped passes; every 256/512 KB leg candidate-faster across ~7 passes while sub-threshold 64/128 KB controls flip sign as noise). Mechanism attribution (per-call table + per-lane `--verbose_gc` on the real path) shows both routes copy the payload exactly once on main — the win is the copy's *destination*: direct sends make every in-flight blob live GC-heap data (29 GCs / 8.6 ms pause vs 20 GCs / 1.2 ms per 300 x 256 KB inserts), and each collection safepoints the isolate group including the writer mid-step. The 256 KB floor is measured: transport is +22.7% *slower* at 64 KB (wrap bookkeeping vs the graph copy's near-free fast path) and neutral at >= 1 MB (WAL write dominates; huge payloads skip new space). Sharpens exp 005 rather than contradicting it: a raw blob has no structure to encode, so only destination and machinery costs remain. Internal knob (not public API); adds a large-blob round-trip correctness test.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/234.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/234-blob-param-transfer.md"},{"id":"236","title":"Reader blob-cell TransferableTypedData transfer","file":"236-blob-cell-transfer.md","date":"2026-07-21","status":"accepted","amendedBy":["246"],"directions":["result-transfer-shape"],"outcomeClass":"accepted","impact":"Applies exp 234's isolate-hop mechanism to the read side, where the costs were worse: blob cells decoded native->heap, results > 256 KB then sacrificed the reader isolate on every query (Isolate.exit + ~2-5 ms respawn + statement/schema cache loss), and tx.select — which can never sacrifice — paid the full graph copy back to main. Blob cells >= 256 KB now decode straight into TransferableTypedData (one native->malloc'd-external copy, skipping the heap copy; GC never traces the payload), the sacrifice decision weighs only residual non-transferable bytes, and every main-isolate receive boundary materializes cells back to Uint8List views so the public surface is unchanged. Three order-flipped per-process passes: 1x512 KB select **-80% to -83%**, 1x1 MB -70% to -81%, 4x300 KB -67% to -82%, tx.select 1x512 KB **-84% to -87%** (~3-7x), with direct-path, text-sacrifice, and small controls flat once controls run before lifecycle-changing lanes. Threshold is a compile-time define (worker isolates hold their own globals). Also records that selectBytes was already optimal (native-backed view -> malloc'd copy destination).","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/236.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/236-blob-cell-transfer.md"},{"id":"237","title":"Batch blob parameter transfer via TransferableTypedData","file":"237-batch-blob-param-transfer.md","date":"2026-07-21","status":"rejected","directions":["parameter-encoding-and-binding"],"outcomeClass":"rejected_below_signal","impact":"Tests whether exp 234's accepted single-row blob-transfer win (wrap `Uint8List` params `>= 256 KB` in `TransferableTypedData` so their main->writer hop lands in malloc'd external memory instead of the GC heap) extends to the batch (`BatchRequest`/`executeBatch`) path, the direction's standing open question. **Rejected — reproduced regression, no size shows a win.** On a blob-heavy `executeBatch` (30 rows/batch, one blob each), the 256 KB lane — the exact size where single-row INSERT won -16% to -23% — is candidate-*slower* on 8/8 order-flipped legs, +7.6% to +18.1% (median ~+9.5%); 512 KB leans slower (7/8) and 1 MB is uniformly slightly slower, WAL-dominated. The mechanism inverts: exp 234's win came from many independent write round-trips whose per-send heap churn stalls the writer *mid-`sqlite3_step`*, a cost that compounds and that moving blobs off-heap removes. `executeBatch` already collapses N writes into ONE writer round-trip inside one transaction, so there is no scavenge-vs-writer-step interleaving to reclaim — leaving only the candidate's 30x `fromList` (malloc + finalizer + external-memory accounting) and 30x `materialize()` wrap tax against a baseline whose single graph-copy of all 30 blobs is a one-time transient the writer never races. Bounds exp 234's claim: the blob-transfer win is specific to per-round-trip churn, not GC-heap blobs in the abstract. Runtime reverted (`BatchRequest` stays on the direct copy); `blob_batch_write_ab.dart` harness kept as the durable gate; prototype preserved at `archive/exp-237`.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/237.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/237-batch-blob-param-transfer.md"},{"id":"239","title":"Transparent select overflow batching","file":"239-select-overflow-batching.md","date":"2026-07-22","status":"rejected","directions":["stream-rerun-dispatch"],"outcomeClass":"rejected_preserved_potential","impact":"Moonshot: revisits exp 209's proven small-read request amortization without restoring its rejected public `selectAll` API. A private reader-pool prototype preserved the first four-way wave and batched only already-parked plain `select()` requests, sharded across readers in envelopes capped at four. The homogeneous mechanism reproduced: twenty point reads improved -26.2% / -33.2% and twenty roughly-ten-row reads improved -21.1% / -30.3% across the order flip; twenty 10k-row reads stayed neutral-to-faster with bounded RSS. Rejected on the load-bearing hidden-policy guard: alternating ten large + ten point reads made point-completion p95 +16.9% / +11.4% slower and total median +25.6% / +13.1% slower. Queue depth reveals waiting, not query cost; a point future sharing an indivisible envelope with large reads cannot complete independently. Runtime reverted, durable heterogeneous harness kept, prototype archived at `archive/exp-239`. Do not retry queue-depth-only hidden batching without a reliable private cost signal or independently completable member replies.","link":"","class":"moonshot","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/239.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/239-select-overflow-batching.md"},{"id":"240","title":"Batched i64 encode moonshot","file":"240-batched-i64-encode-moonshot.md","date":"2026-07-22","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected_below_signal","impact":"Moonshot: challenged the assumption that `selectBytes` integer encoding must format one cell at a time in row-major order. Built exp 231's named reopen — array encoders that hand the formatter a batch of adjacent i64 cells — as three test-only native paths and a focused microbench. Isolated conversion, a 2-way software-pipelined scalar (`pipe2`) won -6 to -13% on mid/big magnitudes, while the NEON vector kernel over an array still lost +45 to +60% on realistic short values (setup can't amortise below ~9 digits, closing exp 231's SIMD door harder). But wiring `pipe2` into `write_json_to_buf` inverted the win: end-to-end integer-heavy `selectBytes` was uniformly +1 to +12% slower across four passes, worst on the big-ints lane the microbench won most. Rejected: integer conversion is not the encoder's bottleneck, and a pair's two i64s are fetched serially from SQLite so the cross-value pipelining premise never holds on the hot path. Runtime reverted; array encoders + microbench + full-range differential test kept as the durable gate.","link":"","class":"moonshot","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/240.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/240-batched-i64-encode-moonshot.md"},{"id":"241","title":"Re-evaluating Isolate.exit sacrifice for the flat ResultSet (rejected)","file":"241-sacrifice-reeval.md","date":"2026-07-22","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected","impact":"Large read results (`>= 256 KB` estimated) use `Isolate.exit` **sacrifice** — a zero-copy heap transfer that kills the worker (a reader respawn) to avoid the `SendPort.send` graph copy. The founding measurement (exp 082) predates Dart 2.15 isolate groups, where `SendPort.send` now **shares** immutable leaves (strings/ints) across the hop and only copies the mutable structural graph — so send's cost tracks structural slot count, not bytes. This re-evaluated two changes: retire sacrifice (send-always), or re-trigger on structural slot count instead of estimated bytes. A transport check (`native_vs_heap_send.dart`, self-contained) confirms the model: a heap `Uint8List` send blows up with size (203-272 us at 512-731 KB) while a native-backed view sends cheaply (23-44 us) — send is only expensive to the extent the payload is mutable/copyable. The sacrifice A/B (via a reverted `RESQLITE_SACRIFICE_THRESHOLD` define) shows send faster-or-level across the practical numeric range and winning **large on text** (149 vs 438 us at 1000 rows — strings share on send, sacrifice respawns for a copy it never needed); sacrifice edges ahead only above **~32k structural slots**, by a noisy ~3-4%. **Both changes rejected:** send-always would regress the high-structural-count tail where sacrifice still wins; a slot-count trigger adds accounting complexity a ~3-4% noisy margin doesn't pay for (estimated bytes already correlates with slot count). The run also documents a confound — per-process repeated sacrifice respawns accumulate and bias the sacrifice lane, so this A/B can't cleanly isolate a single sacrifice-vs-send at a fixed size. Rejected; publication-only. Reopen with a clean single-shot per-process harness, or a production profile showing results clustering in the send-favored range.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/241.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/241-sacrifice-reeval.md"},{"id":"242","title":"TransferableTypedData for the selectBytes result buffer (rejected)","file":"242-selectbytes-ttd.md","date":"2026-07-22","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected","impact":"Exp 234/236 won by wrapping large heap payloads in `TransferableTypedData` to escape the `SendPort` graph copy's GC-heap destination. `selectBytes` returns a large `Uint8List` too, so this tested the same wrap on it. But `selectBytes` bytes are **not** a heap `Uint8List` — they are `result.ptr.asTypedList(length)`, a view over the reader's native `json_buf` (per-reader malloc'd C buffer), snapshotted by the one mandatory `SendPort.send` copy of the `(bytes, rowCount)` record. A/B (prototype behind `RESQLITE_SELECTBYTES_TTD`, reverted) across JSON sizes spanning the 256 KB new-space cap: TTD is **neutral-to-worse at every size** — even at 142/362 KB, ~25% slower at 731 KB (view 1391.7 vs ttd 1742.3 us) — with no GC difference (both lanes the same tiny `Scavenge(external)` stream, sub-0.2 ms pauses). Mechanism: a native-backed view has no GC-heap destination for the wrap to escape; the current path already pays exactly one copy (the snapshot send), and TTD does not remove it — it relocates that copy to a `fromList` memcpy into a fresh external buffer plus malloc/finalizer/ownership-move machinery. Same one copy, extra machinery, so it loses. The mirror image of exp 234/236: the win there came from a heap `Uint8List`'s GC-heap destination, which selectBytes' native view does not have. Rejected; publication-only (prototype reverted). Would reopen only if selectBytes' buffer ever became a heap `Uint8List` instead of a native view.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/242.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/242-selectbytes-ttd.md"},{"id":"243","title":"Shared-wrapper (table protocol) for aliased blob write params","file":"243-blob-alias-table-protocol.md","date":"2026-07-22","status":"accepted","directions":["parameter-encoding-and-binding"],"outcomeClass":"accepted","impact":"[Exp 234](234-blob-param-transfer.md) wraps each large blob write param in its own `TransferableTypedData`, but walked param positions independently — a caller handing the **same** `Uint8List` object to N positions (or reusing one buffer across a coalesced `MultiExecuteRequest` burst) got N separate `fromList` copies of one buffer, a latent regression that is strictly worse than the graph copy exp 234 replaced. Exp 243 wraps by **identity**: an identity-keyed cache shares **one** wrapper per unique backing buffer (`cache[value] ??= fromList([value])`), referenced at every occurrence; the graph copier sends it once (identity preserved), and `unwrapBlobParams` materializes each wrapper exactly once (a shared unwrap cache spans the coalesced envelope's writes, since a second `materialize()` throws). Isolated transport of one 300 KB buffer referenced N times shows the table protocol **flat and fastest at every N** (32.9/27.0/28.2/33.8/56.5 µs at N=1/2/4/8/32) where the two alternatives each fail differently: the exp 234 **baseline** scales linearly (44.4 -> 1502.7 µs, ~27x at N=32 — the regression), and a **census** shape (leave aliased buffers on the graph-copy path) is flat but slow (~180-210 µs — the large heap blob aborts onto the chunked `CopyTypedDataBaseWithSafepointChecks` slow path and re-lands on the GC heap, the exact cost exp 234 avoids). Table takes baseline's single fast external copy and census's shared-once transport with neither downside, and cuts peak external memory from N buffers to one. Neutral (identical to exp 234) for the overwhelmingly common single-reference write; helps only when a >=256 KB buffer is referenced more than once. Not applicable to reads — a read response's blob cells are distinct objects with no caller aliasing to collapse (see exp 236). Internal knob; adds shared-wrapper unit tests and aliased/coalesced round-trip integration tests.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/243.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/243-blob-alias-table-protocol.md"},{"id":"244","title":"Pool-burst measurement of sacrifice replacement capacity, and eager respawn (rejected)","file":"244-pool-burst-eager-respawn.md","date":"2026-07-22","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected","impact":"Experiment B of the peer-recommended estimand split after exp 241's confounded send-vs-sacrifice A/B: measure the **pool-replacement-capacity** question cleanly. Uses the pool's decode-free observable — dispatch queue-wait (`workerAssignedAt - requestEnqueuedAt`), via a benchmark-only `ReaderPool.debugDispatchTimings` collector (null in production). Decisive test: a production **4-worker** pool, **8** identical large (sacrificing) selects behind a barrier (1-4 grab workers, 5-8 park), measure the parked four's queue-wait, reset the pool between bursts (fresh-lifecycle treatment unit, unlike exp 241's mutating pool). 40 bursts x 3 reps. A CONFIRMED code asymmetry motivated an **eager-respawn** candidate: the sacrifice reply handler completes the caller (a `Completer.sync()` running the whole dispatch/emit/flush chain) BEFORE initiating the replacement spawn, opposite of the sibling non-sacrifice branch. **Two reproducible findings, both counter to hypothesis:** (1) the **send** (no-sacrifice) lane has the HIGHEST parked queue-wait — highest in all 3 reps, ~+500 us / +19% over the sacrifice lanes — because a large result's SendPort graph copy blocks the worker longer than Isolate.exit + an overlapped respawn; so at pool-4 sacrifice is neutral-to-FAVORABLE, not a capacity drain. (2) sacrifice-eager (2684 us) equals sacrifice-current (2652 us) within ~1% (< any margin) on queue-wait and makespan — eager respawn buys nothing, because at pool-4 the respawn overlaps other workers' in-flight queries and is off the parked request's critical path. **Rejected: eager respawn.** Falsifies the suspected pool-capacity penalty at the production pool size and turns exp 241's hand-wavy 'keep sacrifice' into a measured result for the pool regime. Caveat: pool-4 overlap dilutes the raw per-sacrifice respawn gap and `Database.open` clamps readerCount>=2, so the pool-1 diagnostic ceiling isn't reachable via the public API. Kept the reusable queue-wait instrument + `RESQLITE_SACRIFICE_THRESHOLD` knob; the eager prototype is reverted. Still open from the split: Experiment A (intrinsic prepared-result handoff) and the text/shared-leaf misroute guard.","link":"","class":"measurement","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/244.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/244-pool-burst-eager-respawn.md"},{"id":"245","title":"Prepared-result handoff — intrinsic send vs Isolate.exit (measurement)","file":"245-prepared-result-handoff.md","date":"2026-07-23","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted","impact":"Experiment A of the peer's estimand split (exp 241 confound, exp 244 = the pool-capacity half): measures the INTRINSIC transfer estimand — `SendPort.send` vs `Isolate.exit` for a given result graph, with spawn/SQLite/decode/construction all outside the timed interval. Prepared-result barrier protocol: a worker builds the real production ResultSet (flat values list + RowSchema + wrapper) and holds it; main records t0 (Go sent) and t1 (received, first op in handler); handoffWall = t1-t0, both on main (one clock). ONE fresh PROCESS per observation (no heap accumulation / mode carryover — the exact confounds exp 241 suffered), ABBA blocks, empty-envelope control isolating fixed overhead. Three mechanistic facts, each isolated: (1) **Isolate.exit has a ~47 us fixed-overhead premium** over send (empty envelope 147 vs 100 us) — its sendability walk + teardown; (2) **strings/immutable leaves are SHARED on send, not copied** — a 400 KB string adds ~0 us (payload -4), a 1 MB string +18 us; send's copy cost tracks the MUTABLE flat-list SLOT COUNT (27 -> 163 -> 636 us at 20k -> 48k -> 200k slots), not payload bytes; (3) **exit is zero-copy**, so it wins once the structural copy exceeds its 47 us premium — **crossover ~48k slots** (num48k exit -22 us; num10kx20 -345 us). Resolution (with exp 244): small-to-moderate (<~48k slots) and ALL string-heavy results are send ≈ exit within the pre-registered equivalence margin (39-71 us diffs) — the middle is a declared wash, slight lean to send; large structural (>~48k slots) materially favors exit; the current sacrifice policy's intent is validated. The one real defect is the TRIGGER: sacrifice fires on BYTES, but the cost driver is mutable slot count, so a large STRING (400 KB, 1 slot, shared free) is send-favored (96 vs 167 us) yet wrongly sacrificed at 256 KB bytes — the text/shared-leaf misroute, now confirmed intrinsically. Ships no runtime change; actionable follow-up is a slot-count/shared-leaf sacrifice guard.","link":"","class":"measurement","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/245.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/245-prepared-result-handoff.md"},{"id":"246","title":"Slot-count sacrifice trigger — fix the string misroute","file":"246-slot-sacrifice-guard.md","date":"2026-07-23","status":"accepted","directions":["result-transfer-shape"],"outcomeClass":"accepted","impact":"The reader sacrifices a row result (Isolate.exit zero-copy, at the cost of a reader respawn) when its estimated BYTES exceed 256 KB. Exp 245 measured that this asks the wrong question: `SendPort.send`'s cost tracks the MUTABLE flat-list SLOT COUNT (rows x cols), not payload bytes — strings/immutable leaves are shared on send for free. So a result large in bytes but small in slots (a few rows with a big TEXT/BLOB column — base64 blobs, large JSON/text docs) is cheap to send yet gets SACRIFICED, paying a reader respawn for a copy that never happens. Exp 246 routes the decision on slot count (`raw.values.length`) instead: `_shouldSacrifice` = `values.length > sacrificeSlotThreshold` (default 32*1024 = the exact all-integer equivalent of the 256 KB byte threshold at 8 bytes/cell). End-to-end A/B: the misroute shape (4 rows x 100 KB string) stops sacrificing (1.00 -> 0.00 sacrifices/select) and runs **31% faster** (131 -> 91 us) — every such read previously killed+respawned a reader for nothing; every numeric/structural shape (band 40k, large 200k, medium 20k, small) is byte-for-byte the same routing at parity latency. Threshold is measured, not guessed: the ~48k INTRINSIC crossover (exp 245) regressed the 40k-slot band (+12%, sent something that should sacrifice) because end-to-end the send copy is on the worker's critical path (exp 244), so the crossover arrives earlier; 32k = the byte trigger's all-int equivalent restores band parity while keeping the string fix. Slot count is also free (the flat list's length, no per-cell accounting), so the change is a net **simplification**: the byte machinery it replaced — the byte threshold, `RawQueryResult.estimatedBytes`, and the decoder's per-cell `byteEstimate` — was deleted in the same change, having no readers left once routing moved to slot count. That includes exp 236's `transferableBytes` subtraction, since blob size can no longer influence the decision (exp 236's blob-cell TransferableTypedData wrapping itself is unaffected and still ships). The shippable payoff of the send-vs-sacrifice arc (exp 241 confound -> 244 pool -> 245 intrinsic -> 246 fix).","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/246.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/246-slot-sacrifice-guard.md"},{"id":"248","title":"Stable stmt-cache slots — removing the move-to-back struct swap (rejected)","file":"248-stmt-cache-stable-slots.md","date":"2026-07-25","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected_below_signal","impact":"The per-connection C statement cache keeps its MRU entry at `entries[count - 1]` and promotes a matched entry by swapping whole structs. `resqlite_cached_stmt` embeds exp 106's `read_tables[64]` (512 B) and `dep_columns[64]` (1 KB) arrays, so one entry is **1,632 bytes** and each promotion moves **4,896 bytes** through three full-struct copies; eviction `memmove`s ~50 KB. Exp 071 and exp 207 both examined this function but measured only the *scan*, on a single repeated SQL — a shape that structurally never pays the swap (the hot entry already sits at the tail, so the promotion branch is skipped). This tested the untouched half: carry LRU ordering in a per-entry recency stamp so slots never move, with in-place min-stamp eviction (identical policy). An isolated C measurement over the real struct layout confirms the mechanism — when the swap fires it costs **~60-65 ns/lookup** (85 vs 21 ns at cache=8, 144 vs 89 at cache=32), and single-SQL controls are flat, proving the branch is inert there. But end-to-end it is invisible: across two order-flipped passes of `stmt_cache_interleaved.dart` no lane reproduces a same-sign win, and the *control* lanes — where both sides run identical code because no swap is reachable — swing +24% / +27% / +103% / +42%. ~65 ns against a ~7-10 us `selectBytes()` round trip is **~0.7% of per-call wall**, an order of magnitude below the harness floor. **Rejected** on exp 071's own methodology (sound, zero-risk, unmeasurable); runtime reverted, prototype at `archive/exp-248`. With scan order (071), scan short-circuit (207), and now promotion cost (248) all measured and immaterial, `stmt_cache_lookup_entry` is closed. Reopen only if the round-trip floor drops ~10x, or a workload appears doing many cache lookups without a round trip per lookup.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/248.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/248-stmt-cache-stable-slots.md"},{"id":"249","title":"Invalidation-batched stream rerun dispatch (moonshot, rejected)","file":"249-invalidation-batched-rerun.md","date":"2026-07-26","status":"rejected","directions":["stream-rerun-dispatch"],"outcomeClass":"rejected_below_signal","impact":"Moonshot: reactive fan-out re-queries every stream on any write to a projected column (table/column-level invalidation), so one write dirties all M streams and dispatches M reader round-trips — of which the vast majority re-hash unchanged and suppress their emission. This challenged the assumption that each dirtied stream must re-query via its own isolate message: a single write's dirtied set is a natural batch, and since each reader worker owns one serial SQLite connection, packing the reruns into one message per worker should cut message count 25:1 for free. Added an internal `SelectIfChangedBatchRequest` + worker loop, `ReaderPool.selectBatchIfChanged`, a batched `StreamEngine._flushQueue`/`_requeryBatch` (per-entry below pool size so the common case is byte-identical), and a `lastRowCount` cost-gate (batch cheap streams, dispatch large ones individually) — the private cost signal exp 239 named as its reopen condition. **Rejected.** Two measurement methods disagreed and the clean one won: an in-process A/B toggle reported homogeneous emit latency −25.8% / −27.9% (`ab_drift_check` REPRODUCED across an order flip), but a cross-worktree comparison (two separate binaries, 3 alternated rounds, warm regime) reversed the sign — the batched path is +22% p50 / +59% p95 on homogeneous fan-out and +66% p50 / +52% p95 on heterogeneous. A batched reply is indivisible, so the one changed stream's result waits behind its ~24 cheap unchanged batch-mates' re-hashes; message-count amortization is the wrong lever for a latency-bound workload (same trade rejected by exp 148 and exp 239). The in-process toggle manufactured a false win by sharing warm JIT/isolate/pool state across both arms — the durable lesson is to A/B dispatch/scheduling changes across worktrees, never a single-process toggle. Runtime reverted; prototype at `archive/exp-249`; `stream_rerun_latency.dart` kept as the single-write fan-out emission-latency gate. Reopen only for a throughput-bound stream workload where total drain dominates and per-emission latency is provably not the binding constraint.","link":"","class":"moonshot","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/249.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/249-invalidation-batched-rerun.md"},{"id":"250","title":"Reject reset-aware high-water checkpoint worker","file":"250-async-checkpoint-high-water.md","date":"2026-07-26","status":"rejected","directions":["stream-rerun-dispatch"],"outcomeClass":"rejected_preserved_potential","impact":"Moonshot follow-up to exp 233: observed-reset/high-water re-arming removes the asynchronous worker's level-trigger storm and preserves the off-writer first-crossing win, improving threshold-crossing p50 by 53.0% / 63.9% across the order flip while foreground reads also improve. The load-bearing sustained lane still rejects the runtime: awaited 8 KiB write p50 regresses +152.5% / +138.1%, p95 +148.8% / +163.0%, and p99 +203.9% / +161.7%. PASSIVE checkpoints can return successfully with partial progress, and two candidate repeats strand 9,165 / 10,316 pending WAL frames; with no bounded retry, a burst ending after that partial attempt leaves the backlog in place. A below-threshold control keeps p50 neutral, locating the damage in concurrent checkpoint/WAL dynamics rather than the worker's fixed lifecycle overhead. Independent review also found that page-count drops cannot identify an equal/larger first commit in a new WAL generation, and the isolate has no failure channel, so startup/runtime death can hang open or close. The design still requires a second keyed writable connection, isolate, FFI and mutex state, generation/error/partial-progress policy, and coalesced close draining, with no representative incidence evidence that synchronous checkpoint wall is materially user-visible. Runtime reverted; prototype preserved at `archive/exp-250`. Reopen only with a real generation signal, worker-failure propagation, bounded backoff/retry for partial PASSIVE progress, and a representative trace, or with a materially simpler SQLite-native approach.","link":"","class":"moonshot","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/250.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/250-async-checkpoint-high-water.md"},{"id":"252","title":"Reject per-batch dirty-column dependency merge","file":"252-dirty-column-batch-merge.md","date":"2026-07-27","status":"rejected","directions":["stream-rerun-dispatch"],"outcomeClass":"rejected_below_signal","impact":"Fresh Dune evidence made repeated writer dependency merging a plausible exploit: identity sync runs every 2-5 seconds and executeBatch-updates three device columns plus two peer columns. A 64-bit pending-dependency mask safely merged each cached column only on the first actual table callback, preserving conditional triggers, FK cascades, no-row exits, and rollback/error cleanup. The mechanism is real at an extreme ceiling: 10,000 rows x 20 SET columns improves 64.5% / 60.9% across order-flipped worktrees. Rejected because the full-footprint 100-device + 100-peer product gate regresses 49.1% / 15.4% at p50 instead of improving at least 3%, and 1000+1000 is mixed at +9.1% / -2.0%. Runtime reverted; exact prototype at archive/exp-252. Reopen only for representative repeated UPDATE batches in the thousands of rows with materially wider SET lists, or a native profile proving this loop is material on a public product shape.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/252.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/252-dirty-column-batch-merge.md"},{"id":"253","title":"Reject identity-conditioned MultiExecute BLOB routing","file":"253-multiexecute-blob-routing.md","date":"2026-07-28","status":"rejected","directions":["parameter-encoding-and-binding"],"outcomeClass":"rejected_below_signal","impact":"A one-message topology was not enough to justify leaving unique large BLOBs on Dart's graph-copy path. An identity census kept repeated buffers on exp 243's shared TransferableTypedData wrapper but sent unique MultiExecute buffers direct. Rejected because that combined policy produced a classifier-reproduced 10.2% / 7.2% regression for distinct 256 KiB writes at the first production-admitted size; 512 KiB was candidate-faster but drift-suspected and cannot move the threshold post hoc. Shared/mixed/control guards also lacked stable signal. Runtime reverted; exact prototype at archive/exp-253. The result qualifies exp 237: its all-aliased fixture paid 30 pre-table wrappers, so its measured rejection stands but does not generalize to distinct identities or every one-envelope execution topology.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/253.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/253-multiexecute-blob-routing.md"},{"id":"254","title":"TEXT decode via sqlite3_value_blob (skip NUL-termination copy)","file":"254-text-value-blob-decode.md","date":"2026-07-28","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected","impact":"Tested reading reader TEXT cells with `sqlite3_value_blob` instead of `sqlite3_value_text` across all four decode/JSON/stream-hash sites (`write_json_to_buf`, `resqlite_step_row`, `resqlite_step_row_hash`, `resqlite_query_hash`). `value_text` forces `sqlite3VdbeMemNulTerminate` to append a `\\0` that none of these consumers read — they all take an explicit byte length (the exp 191 invariant) — so it looked like a per-cell malloc+copy avoidable via `value_blob`, which returns identical UTF-8 bytes on resqlite's always-UTF-8 connections. A single-binary A/B toggle (needed after a two-worktree comparison showed a ~-4.8% per-worktree offset on the byte-identical integer control) measured 6 order-flipped passes: on the clean `selectBytes` path the ~200 B long-TEXT lane moved -0.6% and short-TEXT +2.4% against a +1.2% integer control, and pushing text to 2 KB (~30 MB copied/query) still moved both paths only ~-0.7% — inside the noise band, no length scaling. `sqlite3VdbeMemGrow` reuses each result `Mem`'s `zMalloc` across the row scan, so `value_text`'s cost is an amortized memcpy below the harness floor, not a per-cell allocation. Rejected (byte-identical, zero-risk, unmeasurable); runtime reverted, focused harness kept. Reopen only if a workload prevents `Mem` buffer reuse or the per-row step/decode floor drops ~10x.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/254.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/254-text-value-blob-decode.md"},{"id":"255","title":"Stream could emit nothing when a write raced its initial query","file":"255-stream-initial-emission-race.md","date":"2026-07-28","status":"accepted","directions":["stream-rerun-dispatch"],"outcomeClass":"accepted","impact":"`db.stream()` promises to emit current results immediately, then re-emit on change. It could do neither: a stream whose initial query was still in flight when a write landed went **permanently silent**, never emitting even its first value. `StreamEngine._createStream` stored the initial result's hash as the comparison baseline and then, if the entry had been dirtied mid-flight, discarded those rows unemitted in favour of a catch-up re-query — but that re-query's `selectIfChanged` compared against the baseline taken from the very rows it replaced, found them identical, and returned 'unchanged, nothing to emit'. Initial emission suppressed as stale; replacement suppressed as unchanged; stream silent forever. The race window is the initial query's duration, so it is trivial on small tables and reliable on large ones — and opening a stream then immediately writing (seeding a list on first paint) is ordinary usage. Fix: always emit the initial result (a valid observation, and the documented contract), then re-query if dirtied; `selectIfChanged` still suppresses the follow-up when nothing changed, so no duplicate. This had been surfacing for a long time as an intermittent `write_coalescing_test` failure dismissed as a flake — at ~1-in-3 on a loaded machine — helped along by that test's own comment asserting the shape 'can't flake under load'. New regression test (40k seeded rows so the write reliably races the query) fails 0/5 without the fix and passes 6/6 with it; the old test goes 3/6 -> 8/8; 140 tests pass across the stream, write-coalescing, trigger-cascade, database and transaction suites.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/255.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/255-stream-initial-emission-race.md"},{"id":"256","title":"Stale-then-correct vs suppress-stale initial stream emission","file":"256-stale-initial-emission-tradeoff.md","date":"2026-07-28","status":"accepted","directions":["stream-rerun-dispatch"],"outcomeClass":"accepted","impact":"Exp 255 guaranteed a stream always emits; this settles WHICH rows the first emission carries when a write raced the initial query. Lane A emits the known-superseded initial rows immediately and corrects via the catch-up re-query; lane B suppresses that emission, poisons the comparison baseline so the re-query is guaranteed to emit, and lets the corrected result be the stream's first. A's advantage — a faster first emission — is measured against the wrong clock: what a subscriber cares about is time-to-CORRECT-value, and the catch-up re-query runs in both lanes. Measured across race windows widened by seed size: B costs **~1.4 ms at 20k rows and ~0.4 ms at 60k** on time-to-correct (8.1 -> 9.5 and 18.5 -> 18.9 p50) and removes the stale frame **entirely** (1.00 -> 0.00 per raced stream at every size); A renders exactly one wrong frame on every raced stream, the list-jump artifact a reactive stream exists to prevent. The no-race control is identical in both lanes (13.3 ms, 2 emissions), confirming the change is scoped to the raced path. **Accepted: ship B.** It is not a return to the exp 255 bug — that was suppression WITHOUT poisoning, which let the initial emission and its replacement cancel each other; the sentinel baseline guarantees an emission and `_requery` propagates errors, so a stream always resolves to a value or an error. Would revisit only for a skeleton-UI workload that prefers stale rows to nothing, which is an opt-in public-API question rather than a default.","link":"","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/256.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/256-stale-initial-emission-tradeoff.md"},{"id":"257","title":"Native independent-autocommit envelope","file":"257-native-autocommit-envelope.md","date":"2026-07-29","status":"rejected","directions":["stream-rerun-dispatch"],"outcomeClass":"rejected_below_signal_bar","impact":"Moonshot: A private native loop tried to execute homogeneous coalesced writes in one FFI call while preserving every member as an independent autocommit. The public insert gate improved 17.7% in one process order but only 3.6% in reverse, below the predeclared 10% bar, while the integer-only no-op diagnostic regressed 17.7% / 13.9%. Whole-group parameter/result materialization outweighed the removed call boundaries without removing N SQLite commits. Safety review also found reset-time commit-error, dirty-union timing, packed-BLOB memory, and binding-lifetime hazards. Runtime reverted; exact prototype and harness at archive/exp-257.","link":"","class":"moonshot","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/257.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/257-native-autocommit-envelope.md"},{"id":"258","title":"Columnar typed-array result store","file":"258-columnar-result-store.md","date":"2026-07-29","status":"rejected","directions":["result-transfer-shape"],"outcomeClass":"rejected_below_signal","impact":"Moonshot: challenged the assumption that the `select()` backing store must be a boxed row-major `List<Object?>`. A focused AOT A/B (`columnar_result_transfer.dart`, two order-flipped passes) gave the first real measurement of the per-column typed-array mechanism exp 055 only estimated and exp 081 tested only as a row-major binary slab. Columnar builds 60-90% faster worker-side (no double-boxing) and its transfer is 73-91% cheaper — but the large results where transfer wins most already zero-copy via the `Isolate.exit` sacrifice path (>32768 slots), and the sub-threshold `SendPort` lanes save only tens of microseconds, below the round-trip floor. `REAL` consume is neutral; memory is a wash-to-regression (Smi ints live inline, so `Int64List` costs more). The one real primary-metric signal was a ~2x main-isolate integer-consume speedup from `Int64List` locality. Rejected the whole-store rewrite; recorded a scoped narrow-columnar-integer-consume candidate. Harness + receipt kept; no lib/native change.","link":"","class":"moonshot","signalUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/signals/entries/258.json","writeupUrl":"https://github.com/danReynolds/resqlite/blob/main/experiments/258-columnar-result-store.md"}],"claims":[{"id":"016.1","source":"016","directions":["sqlite-version-and-build-config"],"text":"The tuned SQLite compile-flag set (with prepare_v3) is accepted; per-call savings are individually too small to measure but stack with isLeaf bindings.","conditions":"2025 · backfilled 2026-07","state":"live"},{"id":"044.1","source":"044","directions":["sqlite-version-and-build-config"],"text":"SQLITE_ENABLE_BATCH_ATOMIC_WRITE is a zero-risk compile flag: it activates via VFS capability detection (Android F2FS) with no effect elsewhere and no API change.","conditions":"2025 · backfilled 2026-07","state":"live"},{"id":"075.1","source":"075","directions":["long-text-stream-hashing"],"text":"Computing the selectIfChanged result hash in C during the step loop is a large win (-3
