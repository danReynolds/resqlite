name: resqlite_extension_test
publish_to: none

# Private workspace package for cross-package extension smoke tests. Keeping
# this outside the root package avoids a dependency cycle: companion packages
# depend on resqlite, so resqlite itself cannot dev-depend on them.
environment:
  sdk: ^3.10.4

resolution: workspace

dependencies:
  resqlite: ^0.5.0
  resqlite_js: ^0.1.0
  resqlite_vector: ^0.1.0

dev_dependencies:
  test: ^1.26.3
